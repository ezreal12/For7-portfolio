# 복원 서버 시스템 구조

## 이 지도를 읽는 법
- 목적과 독자
  - 독자와 목적
    - 대상 독자
      &gt; - 이 지도는 이 프로젝트에 처음 합류한 개발자가 읽습니다.
      &gt;
      &gt; - 합류 첫 주에 개념이 어느 영역에서 일어나는지 잡고, 작업할 위치를 찾는 것이 목적입니다.
  - 공개 방침
    - 소스는 비공개
      &gt; - 이 프로젝트의 서버 소스는 비공개입니다.
      &gt; - 그래서 파일 이름, 명령, 함수 이름, 경로, 주소, 비밀값은 적지 않았습니다.
      &gt;
      &gt; - 대신 구성 요소가 무엇을 받아 무엇을 내놓는지, 어디서 어떤 일이 어긋나는지를 개념, 판단 기준, 순서, 증상과 로그의 모양으로 설명합니다.
    - 클라이언트 수정
      &gt; - 실행에는 수정한 클라이언트 빌드를 썼습니다.
      &gt; - 수정 목록은 별도 문서에 있고, 이 지도는 그 내용을 다루지 않습니다.
  - 다루지 않는 기간
    - 9월
      &gt; - 9월은 이 지도가 다루지 않는 기간입니다.
- 읽는 순서
  - 처음 읽을 때
    - 경계 잡기
      &gt; - 「이 시스템은 무엇인가」로 경계를 잡습니다.
    - 낯선 말 정리
      &gt; - 「용어」를 훑어 낯선 말을 정리합니다.
  - 사고방식과 금기
    - 원칙과 약속
      &gt; - 「처음 알아야 할 일곱 가지」와 「지켜야 할 약속」, 「건드리면 안 되는 것」을 읽습니다.
  - 작업 위치
    - 시작 지점
      &gt; - 「어디서 읽기 시작하나」에서 개념과 영역의 대응을 봅니다.
  - 흐름과 증상
    - 흐름 따라가기
      &gt; - 「흐름」과 「크래시와 재시작」에서 요청과 상태가 지나는 길을 봅니다.
    - 증상 풀기
      &gt; - 증상이 있으면 「증상에서 원인으로」로 갑니다.
  - 검증
    - 테스트와 재현
      &gt; - 「테스트 지도」와 「로컬에서 재현하기」에서 확인하는 방법을 봅니다.
- 근거 표기
  - 표기 네 가지
    - 표
      &gt; - 클라이언트의 데이터 표에서 나온 값입니다.
    - 클라이언트 소스
      &gt; - 복원한 클라이언트 소스에서 읽은 값입니다.
    - 추론
      &gt; - 근거가 간접적인 값입니다.
      &gt; - 본문에서는 값 뒤에 (추론)을 붙입니다.
    - 복원 서버의 결정
      &gt; - 원본을 알 수 없어 이 서버에서 정한 값입니다.
      &gt; - 본문에서는 값 뒤에 (복원 서버의 결정)을 붙입니다.
  - 표기가 없는 값
    - 구조 설명
      &gt; - 표기가 없는 값은 구조 설명이거나 분석 기록에서 확인한 사실입니다.
    - 근거 위치
      &gt; - 근거는 분석 기록의 번호(예: E1a)와 줄 번호로 적습니다.

## 이 시스템은 무엇인가
- 하는 일
  - 역할
    - 대신하는 것
      &gt; - 서비스가 끝난 모바일 게임의 서버를 대신해, 클라이언트가 부팅부터 도시와 각종 콘텐츠까지 진행하도록 응답합니다.
    - 구현 언어
      &gt; - 서버는 Python으로 짜여 있고, 클라이언트 스크립트는 Python 2.7 계열입니다.
  - 정답지
    - 캡처
      &gt; - 2021 로그인 구간 HTTP 캡처가 4세트, 512건 있습니다(분석 기록 A, 1044행).
    - 게이트 구간
      &gt; - 게이트 구간에는 캡처가 없습니다.
  - 값의 출처
    - 거꾸로 알아낸 값
      &gt; - 서버가 돌려줄 값 대부분은 클라이언트 코드와 표에서 거꾸로 알아냈습니다.
- 게임
  - 진행 방식
    - 도시와 영웅
      &gt; - 도시를 짓고 영웅을 키우는 모바일 게임입니다.
    - 회차
      &gt; - 이야기는 7일을 되풀이하다 엔딩을 맞고 다음 회차로 이어집니다.
  - 콘텐츠
    - 붙은 기능
      &gt; - 영웅 육성, 던전류 도전 콘텐츠, 한정 이벤트가 붙어 있습니다.
- 경계
  - 복원 서버 안쪽
    - 서버 구성 요소
      &gt; - HTTP 서비스, 게이트 서버, 규칙과 상태 저장입니다.
    - 도구
      &gt; - 복원 도구와 검증 도구입니다.
    - 기기 구성
      &gt; - 접속 보조 앱과 앱 안 서버입니다.
  - 바깥
    - 외부 대상
      &gt; - 클라이언트 앱과 게임 데이터, 원 서비스의 서버입니다.
    - 원래 실시간 전투 서버
      &gt; - 원래 게임의 실시간 전투 서버는 복원하지 않았습니다.
- 사용자 입장의 흐름
  - 시작
    - 업데이트와 로그인
      &gt; - 게임을 켜면 업데이트 확인과 로그인이 HTTP로 처리됩니다.
    - 게이트 접속
      &gt; - 서버 목록이 알려 준 주소로 게이트 서버에 접속합니다.
  - 진행
    - 도시 화면
      &gt; - 도시 화면이 열리고, 기능을 쓸 때마다 RPC(이름으로 서로의 함수를 부르는 호출)가 오갑니다.
    - 저장
      &gt; - 진행 상태는 계정마다 파일에 저장되어 서버를 다시 띄워도 남습니다.
- 실행 모양
  - PC 서버
    - 운영 환경
      &gt; - Linux에서 nginx, dnsmasq, systemd와 함께 운영합니다.
  - 앱 안 서버
    - 구성
      &gt; - 기기 안의 별도 프로세스입니다.
      &gt; - PC가 필요 없습니다.
    - 깨우기
      &gt; - 접속 보조 앱의 접속 화면이 서버 상태를 확인하고 서버를 깨웁니다.
    - 따로 도는 이유
      &gt; - 게임이 죽어도 서버 프로세스는 살아 있게 하려는 설계입니다.
      &gt; - VPN 장치는 게임 프로세스가 죽을 때마다 사라지는데, 서버는 다른 프로세스라 남습니다(분석 기록 E1a, 561행).

## 용어
- 게이트 서버
  - 뜻
    - 원시 TCP 서버
      &gt; - 로그인 뒤 게임 통신을 받는 원시 TCP 서버입니다.
      &gt;
      &gt; - HTTP 서비스가 알려 준 주소로 클라이언트가 접속합니다.
- HTTP 서비스
  - 뜻
    - 웹 응답 담당
      &gt; - 설정, 업데이트 확인, 서버 목록, 로그인, 결제, 텔레메트리에 답하는 쪽입니다.
- 앱 안 서버
  - 뜻
    - 기기 안 서버
      &gt; - 기기 안에서 도는 서버 프로세스입니다.
      &gt; - 게임과 다른 프로세스에서 실행합니다.
- 접속 보조 앱
  - 뜻
    - 접속 화면의 앱
      &gt; - 클라이언트 앱과 다른, 접속 화면을 가진 앱입니다.
      &gt; - 앱 안 서버의 상태를 확인하고 VPN을 켭니다.
- 엔티티와 아바타
  - 뜻
    - 엔티티
      &gt; - 서버와 클라이언트가 함께 들고 있는 객체입니다.
      &gt; - 서버가 생성 메시지를 보내면 클라이언트가 만듭니다.
    - 아바타
      &gt; - 계정 엔티티와 아바타 엔티티가 있습니다.
      &gt; - 아바타는 접속한 계정 하나의 상태와 RPC 처리를 맡는 서버 쪽 계층의 이름이기도 합니다.
- 스냅샷과 푸시
  - 뜻
    - 스냅샷
      &gt; - 로그인 때 한꺼번에 보내는 계정 상태 묶음입니다.
      &gt; - 기능 모듈이 조각을 등록합니다.
    - 푸시
      &gt; - 서버가 먼저 클라이언트에 보내는 변경 알림입니다.
- RPC, 서버 호출, 서버발 호출
  - 뜻
    - RPC
      &gt; - 이름으로 서로의 함수를 부르는 호출입니다(양방향). 호출 이름은 클라이언트 소스에서 뽑은 목록이 기준입니다.
    - 서버 호출
      &gt; - 클라이언트가 서버에 거는 호출입니다.
      &gt; - 핸들러가 받습니다.
      &gt; - 수는 1,334개입니다(클라이언트 소스, 분석 기록 E2, 23행).
    - 서버발 호출
      &gt; - 서버가 클라이언트에 보내는 호출입니다.
      &gt; - 푸시를 포함합니다.
      &gt; - 수는 1,493개입니다(클라이언트 소스, 분석 기록 E2, 23행).
- 핸들러와 멤버
  - 뜻
    - 핸들러
      &gt; - 서버 호출 하나를 받는 함수입니다.
    - 멤버
      &gt; - 아바타에 붙는 기능 단위입니다.
      &gt; - 호출을 받아 응답과 푸시의 순서를 정하는 RPC 멤버와, 계정 상태만 바꾸는 규칙 모듈이 짝을 이룹니다.
- 기능 모듈과 규칙 모듈
  - 뜻
    - 같은 대상
      &gt; - 계정 상태를 바꾸는 파일 단위입니다.
      &gt; - 이 지도에서는 규칙 모듈이라고 부릅니다.
    - 다른 대상
      &gt; - 멤버는 호출을 받는 쪽이라 모듈 수와 세지 않습니다.
- 신뢰 전송 번호와 콜백
  - 뜻
    - 신뢰 전송
      &gt; - 일부 호출은 번호를 붙여 보내고 응답이 올 때까지 화면을 잠급니다.
    - 콜백
      &gt; - 클라이언트가 호출할 때 등록해 두는 결과 처리 함수입니다.
      &gt; - 응답이 없으면 잠금이 남습니다.
- 결과 필요 콜백
  - 뜻
    - 결과를 읽는 호출
      &gt; - 호출마다 붙은 &quot;결과 필요&quot; 표시로 판별합니다.
      &gt; - 이 호출에 빈 결과를 주면 클라이언트가 결과를 읽다가 깨집니다.
- 생존 신호와 플레이 전환
  - 뜻
    - 생존 신호
      &gt; - 클라이언트가 5초 간격으로 보내는 접속 확인입니다(에뮬레이터 로그 관찰, 분석 기록 D2, 1406행).
    - 플레이 전환
      &gt; - 로그인 단계에서 플레이 단계로 넘어갔음을 서버가 알리는 메시지입니다.
- 핸드셰이크
  - 뜻
    - 접속 초기 순서
      &gt; - 접속 직후 주고받는 초기 요청과 응답의 순서입니다.
- 스트리밍 압축과 길이 접두 프레임
  - 뜻
    - 프레임
      &gt; - 4바이트 길이로 시작하는 메시지 단위입니다.
      &gt; - 핸드셰이크 뒤에는 스트리밍 압축이 걸립니다(분석 기록 E5, 1526행).
- 프록시 프로토콜 헤더
  - 뜻
    - 원래 주소 한 줄
      &gt; - 중계가 연결 맨 앞에 붙이는 원래 주소 한 줄입니다.
- 정답지
  - 뜻
    - 판정 기준
      &gt; - 서버 응답이 맞는지 판정하는 기준 자료입니다.
      &gt; - 캡처가 있으면 캡처, 없으면 클라이언트 소스입니다.
    - 서버 로그
      &gt; - 서버 로그는 정답지가 아닙니다.
- 정적 집계
  - 뜻
    - 코드를 실행하지 않은 값
      &gt; - 코드를 실행하지 않고 파일을 읽어서 센 값입니다.
      &gt; - 테스트를 돌려서 얻은 값과 구분합니다.
- 서버 시계와 되풀이 번호
  - 뜻
    - 서버 시계
      &gt; - 한정 이벤트를 다시 열기 위한 서버 쪽 날짜입니다.
    - 되풀이 번호
      &gt; - 서비스 말기 구간을 한 바퀴 돌 때마다 하나씩 늘어나는 번호입니다.
- 서비스 말기 구간
  - 뜻
    - 원래 서비스의 마지막 시기
      &gt; - 서버 시계는 이 구간(26주, 2020-11-26 ~ 2021-05-27)을 되풀이합니다(분석 기록 E3, 161행).
- 스텁
  - 뜻
    - 클라이언트 스텁
      &gt; - 클라이언트 소스에서 복원한 호출 정의(이름과 인자)입니다.
    - 임시 응답
      &gt; - 캡처에 없는 경로에 서버가 임시로 보내는 응답도 스텁이라 부릅니다.
      &gt; - 문맥으로 구분합니다.
- 조립기와 전투 훅
  - 뜻
    - 조립기
      &gt; - 스냅샷, 갱신 푸시, 전투가 같은 방식으로 영웅 데이터를 만드는 한 곳의 코드입니다.
    - 전투 훅
      &gt; - 전투 한 판의 단계마다 기능이 끼어드는 지점입니다.
- 회차, 순찰, 정신력, 던전류
  - 뜻
    - 회차
      &gt; - 이야기를 엔딩까지 한 번 마친 한 판입니다.
    - 순찰과 정신력
      &gt; - 순찰은 도시 안 콘텐츠이고, 정신력은 도전 콘텐츠에서 쓰는 소모 자원입니다.
    - 던전류
      &gt; - 정신력을 쓰는 여러 도전 콘텐츠의 묶음입니다.
- 묶음
  - 뜻
    - 캡처 묶음
      &gt; - 캡처 요청을 호스트, 방식, 경로로 묶은 단위입니다.
      &gt; - 게임 관련 묶음은 22개입니다(분석 기록 A, 1046행).
- 로더
  - 뜻
    - 로딩 장치
      &gt; - 클라이언트의 로딩 화면이 기다리는 작업을 관리하는 장치입니다.
- 온라인 전투
  - 뜻
    - 원래 게임의 방식
      &gt; - 원래 게임에서 서버가 전투를 계산하던 방식입니다.
      &gt; - 이 서버에는 없습니다.
    - 콘텐츠 뜻
      &gt; - 원래 실시간 전투였던 콘텐츠를 가리키기도 합니다.
- 시험 계정과 시험 계정 보관본
  - 뜻
    - 시험 계정
      &gt; - 검증을 위해 만든 계정입니다.
      &gt; - 상태 조작 도구로 만들며 원본 기능이 아닙니다.
    - 보관본
      &gt; - 완성된 계정 데이터 파일입니다.
      &gt; - 이를 읽는 테스트가 있습니다.
- REA와 Evidence ID
  - 뜻
    - REA
      &gt; - 네이티브 분석, HTTP 캡처 판독, 기기 조작 도구를 제공하는 역공학 도구 모음입니다.
    - Evidence ID
      &gt; - REA가 도구 결과에 붙이는 근거 번호입니다.

## 처음 알아야 할 일곱 가지
- 클라이언트가 읽는 것이 계약이다
  - 기준
    - 계약의 기준
      &gt; - 서버 코드의 기준은 클라이언트가 읽는 필드, 타입, 순서입니다.
  - 확인 방법
    - 확인 자료
      &gt; - 복원한 클라이언트 소스와 호출 목록(RPC 목록)에서 확인합니다.
- 정답지에는 순서가 있다
  - 순서
    - 1순위
      &gt; - 2021 패킷 캡처가 가장 강한 근거입니다.
    - 2순위
      &gt; - 복원한 클라이언트 소스와 데이터 표입니다.
    - 3순위
      &gt; - 둘 다 없으면 추론으로 표시합니다.
  - 서버 로그의 위치
    - 관찰 수단
      &gt; - 서버 로그는 정답지가 아닙니다.
      &gt; - 클라이언트가 응답에 어떻게 반응했는지 보는 관찰 수단입니다.
- 서버 쪽에서 해결하는 것을 우선한다
  - 원칙
    - 클라이언트 수정
      &gt; - 클라이언트는 필요한 최소한으로만 바꿨습니다.
  - 기록
    - 수정 근거
      &gt; - 바꾼 경우는 별도 문서로 근거를 남겼습니다.
      &gt; - 이 지도는 그 내용을 다루지 않습니다.
- 호출 이름이 곧 핸들러 이름이다
  - 연결 방식
    - 선언
      &gt; - 핸들러에 선언적 표기를 붙이면 같은 이름의 호출에 연결됩니다.
  - 새 멤버
    - 등록
      &gt; - 기존 멤버에 호출을 더할 때는 따로 고칠 등록표가 없습니다.
      &gt; - 새 멤버를 만들면 멤버 목록에 넣어야 등록됩니다(분석 기록 E1c, 91행).
- 상태는 계정마다 한 덩어리다
  - 구조
    - 계정 파일
      &gt; - 계정당 JSON 하나에 하위 시스템별 사전이 들어 있습니다.
  - 전달
    - 스냅샷과 푸시
      &gt; - 로그인 때 스냅샷으로 한 번 보내고, 이후 변경은 푸시로 알립니다.
- 추론은 추론이라고 적는다
  - 이유
    - 원본 부재
      &gt; - 원본 서버가 없어서 추론한 값이 많습니다.
  - 표기
    - 코드 주석
      &gt; - 코드 주석이 근거 등급(표, 클라이언트 소스, 추론, 복원 서버의 결정)을 구분합니다.
- 서버 시계가 이벤트를 연다
  - 동작
    - 열고 닫기
      &gt; - 한정 소환과 이벤트는 서버가 알려 주는 날짜로 열리고 닫힙니다.
  - 구간
    - 되풀이 구간
      &gt; - 서비스 말기 구간을 되풀이합니다.
      &gt; - 구간은 코드 값 26주(182일)입니다.
      &gt;
      &gt; - 되풀이하는 방식은 복원 서버의 결정입니다.

## 어디서 읽기 시작하나
- 읽는 순서
  - 첫 날
    - 경계와 용어
      &gt; - 「이 시스템은 무엇인가」와 「용어」를 읽고 경계와 낯선 말을 잡습니다.
    - 원칙과 약속
      &gt; - 「처음 알아야 할 일곱 가지」와 「지켜야 할 약속」을 읽고 금기를 잡습니다.
  - 다음 단계
    - 요청 흐름
      &gt; - 「흐름」의 RPC 한 건 처리를 따라갑니다.
    - 작업 위치
      &gt; - 아래 「개념과 영역」에서 작업할 영역을 찾습니다.
- 개념과 영역
  - 연결과 웹
    - 연결 받기
      &gt; - 개념: 클라이언트의 이름 질의와 접속을 받아 나눕니다.
      &gt; - 영역: 중계와 게이트 영역. 먼저 볼 곳: 「이름 해석과 중계」.
    - 웹 응답
      &gt; - 개념: 설정, 업데이트, 서버 목록, 로그인에 답합니다.
      &gt; - 영역: HTTP 서비스 영역. 먼저 볼 곳: 「HTTP 서비스」.
  - 기능
    - RPC 처리
      &gt; - 개념: 호출 이름으로 핸들러를 찾고 응답과 푸시를 정합니다.
      &gt; - 영역: 아바타 계층. 먼저 볼 곳: 「아바타 계층」.
    - 규칙
      &gt; - 개념: 계정 상태를 바꾸고 거절 사유를 정합니다.
      &gt; - 영역: 게임 규칙 영역. 먼저 볼 곳: 「게임 규칙 모듈」.
  - 데이터
    - 저장
      &gt; - 개념: 계정 상태를 파일과 DB에 둡니다.
      &gt; - 영역: 상태 저장 영역. 먼저 볼 곳: 「상태 저장」과 「크래시와 재시작」.
    - 표
      &gt; - 개념: 클라이언트 데이터 표를 서버용 JSON으로 바꿉니다.
      &gt; - 영역: 복원 도구 영역과 표 데이터 영역.
  - 기기와 검증
    - 기기 서버
      &gt; - 개념: 기기 안에서 서버를 띄우고 접속을 연결합니다.
      &gt; - 영역: 앱 안 서버 영역. 먼저 볼 곳: 「앱 안 서버」.
    - 검증
      &gt; - 개념: 캡처 재생, 가짜 클라이언트, 시험. 영역: 검증 도구 영역과 테스트 영역. 먼저 볼 곳: 「테스트 지도」.
- 영역 위치
  - 찾는 법
    - 실제 위치
      &gt; - 영역의 실제 위치는 저장소 안에서 찾습니다.
      &gt; - 이 지도는 위치를 적지 않습니다.
    - 함께 읽을 기록
      &gt; - 분석 기록과 작업 일지는 같은 작업의 근거를 담고 있어 함께 읽습니다.

## 구성 지도
- 이름 해석과 중계
  - 하는 일
    - 입력과 출력
      &gt; - 클라이언트의 이름 질의와 웹, 게이트 접속이 들어와 HTTP 서비스나 게이트 서버로 넘어갑니다.
  - 접속을 나누는 기준
    - TLS 서버명이 있는 경우
      &gt; - TLS를 풀어 HTTP 서비스로 보냅니다.
    - 서버명이 없는 경우
      &gt; - 원시 TCP로 보고 게이트 서버로 보냅니다.
      &gt;
      &gt; - 443 포트 하나로 두 종류의 통신을 받습니다.
  - 실제 기기 주소
    - 중계 뒤에서 가려짐
      &gt; - 중계 뒤에서는 모든 접속이 같은 주소로 보입니다(분석 기록 E1a, 74행).
    - 프록시 헤더 해석
      &gt; - 중계가 붙이는 프록시 헤더 한 줄을 게이트 서버가 떼고 기기별 주소를 얻습니다.
      &gt; - 줄이 없는 접속(앱 안 서버에 직접 붙은 경우)도 받습니다(분석 기록 E1a, 70~72행).
    - 배포 순서
      &gt; - 헤더 해석 없이 중계만 바꾸면 게이트가 헤더를 프레임 길이로 읽어 연결을 끊습니다.
      &gt; - 서버 코드를 먼저 올리고 중계를 바꿉니다(분석 기록 E1a, 129행).
- HTTP 서비스
  - 맡은 일
    - 응답 대상
      &gt; - 설정, 업데이트 확인, 서버 목록, 로그인, 결제, 텔레메트리에 답합니다.
    - 부팅 흐름 시험
      &gt; - 실제 APK가 보내는 부팅 22단계 순서를 기준으로 합니다.
      &gt; - 시험은 요청 14개를 순서대로 보내 5xx가 없는지 봅니다(분석 기록 E3, 323행과 B, 1675행).
    - 시험에서 건너뛰는 단계
      &gt; - 패치 파일 다운로드와 게이트 단계는 시험에서 건너뜁니다(분석 기록 B, 1683행).
  - 캡처 응답 재현
    - 바이트 일치
      &gt; - 캡처가 있는 응답은 바이트와 Content-Type까지 같게 돌려줍니다.
      &gt; - 캡처가 없는 응답에는 이 보장이 없습니다.
    - 고정
      &gt; - 길이와 SHA-256을 테스트로 고정합니다.
  - 알 수 없는 요청
    - 임시 응답
      &gt; - 캡처에 없는 경로는 임시 응답(스텁)으로 답하고 경고 로그를 남깁니다.
      &gt;
      &gt; - 클라이언트가 잠기지 않으면서 새 요청을 발견할 수 있습니다.
  - 로그인 서명
    - 계산과 비교
      &gt; - 서명을 계산해 비교하지만 결과와 무관하게 요청을 통과시킵니다.
      &gt; - 검증 결과는 로그에만 남습니다(분석 기록 B, 587~589행).
    - 검증 호출의 결과 무시
      &gt; - 검증 호출 네 곳이 반환값을 무시합니다.
    - 실효성
      &gt; - 서명 검증은 실효성이 없는 상태입니다(알려진 함정과 한계 절 참고).
- 게이트 서버
  - 맡은 일
    - 입력과 출력
      &gt; - 길이 접두 프레임으로 감싼 protobuf 메시지를 받아 엔티티 생성 메시지, RPC 응답, 생존 신호 응답을 냅니다.
    - 선로 형식
      &gt; - 프레임은 4바이트 길이, 2바이트 RPC 인덱스, protobuf 순서입니다.
      &gt; - 핸드셰이크 뒤에는 스트리밍 압축이 걸립니다(분석 기록 E1a, 119행과 E5, 1526행).
    - 구현 방식
      &gt; - asyncio 기반 원시 TCP 서버입니다.
  - 핸드셰이크 순서
    - 4단계
      &gt; 1. 접속 요청에 접속 응답
      &gt; 2. 계정 엔티티 생성
      &gt; 3. 로그인 정보를 받으면 그 계정의 아바타 엔티티 생성
      &gt; 4. 플레이 전환 알림
      &gt;
      &gt; - 순서는 작업 기록에 정리되어 있습니다(분석 기록 E5, 1526행). 응답 값 대부분은 추론입니다(추론).
  - 접속 안정화
    - 예외 격리
      &gt; - 예외를 접속 단위로 가둡니다.
      &gt; - 핸들러 예외가 나도 접속을 끊지 않고 트레이스백을 남기며 대기 중 콜백을 풉니다(분석 기록 E1c, 54행).
    - 중복 로그인
      &gt; - 같은 계정이 다른 접속에 붙어 있으면 먼저 붙은 접속을 닫습니다.
      &gt; - 나중 로그인이 이깁니다.
      &gt;
      &gt; - 한 계정의 상태 객체를 두 접속이 동시에 쓰면 진행이 섞이기 때문입니다(분석 기록 E1a, 68행). 원본 서버의 처리를 본 근거는 없습니다(복원 서버의 결정).
    - 토큰 대조
      &gt; - 엄격, 기록만, 끔의 세 모드입니다(복원 서버의 결정).
    - 종료
      &gt; - 종료 때 서버 소켓을 닫고 접속을 먼저 끊은 뒤 최대 5초 기다립니다(분석 기록 E1a, 100행). 종료 지연을 줄였습니다.
      &gt; - 측정 수치는 「크래시와 재시작」 절을 봅니다.
  - 한계
    - 정답지 없음
      &gt; - 게이트 구간에는 정답지가 없습니다.
      &gt; - 응답의 순서와 값 대부분이 추론입니다(추론).
- 아바타 계층
  - 맡은 일
    - 입력과 출력
      &gt; - 클라이언트 RPC를 받아 응답과 서버 푸시를 냅니다.
      &gt; - 접속한 계정 하나의 상태와 RPC 처리를 맡습니다.
  - 핸들러가 모이는 방식
    - 선언
      &gt; - 핸들러에 선언적 표기를 붙입니다.
    - 수집
      &gt; - 아바타가 만들어질 때 멤버를 훑어 핸들러를 모읍니다.
    - 같은 이름
      &gt; - 같은 이름이 둘이면 훑는 순서에서 뒤에 오는 것이 이깁니다.
      &gt; - 공용 호출을 기능별로 가로채는 데 이 규칙을 일부러 씁니다.
      &gt;
      &gt; - 같은 이름의 핸들러를 실수로 만들면 조용히 덮어씁니다.
      &gt; - 현재 고유 이름은 584개이고 중복은 0입니다(정적 집계, 분석 기록 E1c, 58행).
  - 미구현 호출
    - 핸들러 없음
      &gt; - 로그만 남기고 빈 결과로 풀어서 클라이언트가 잠기지 않게 합니다(분석 기록 E1c, 52행).
    - 결과를 읽는 콜백
      &gt; - 빈 결과를 보내면 클라이언트가 결과를 읽다가 깨집니다.
      &gt; - 그래서 풀지 않고 경고만 남깁니다(분석 기록 E1c, 52행).
    - 무응답 선언
      &gt; - 의도적으로 응답하지 않는 호출은 무응답으로 이름만 선언합니다.
      &gt; - 예로 로그인 팀 질의 3종이 있습니다(분석 기록 E1c, 54행).
  - 주기 처리
    - 생존 신호와 주기
      &gt; - 생존 신호를 받을 때 각 멤버의 주기 처리를 부릅니다.
    - 시간 진행
      &gt; - 이벤트와 휴식처럼 시간에 따라 바뀌는 기능이 여기서 갱신되므로, 시간 진행이 5초 신호에 묶여 있습니다.
  - 화면 안의 시계
    - 장치
      &gt; - 일부 화면에서만 클라이언트 시각을 따로 맞춥니다.
    - 주의
      &gt; - 그 화면에서 쓰는 호출이 호출 목록에서 빠지면 시계가 풀립니다.
  - 규모
    - 핸들러
      &gt; - 584개입니다.
      &gt; - 최상위 303개와 하위 폴더 281개를 합한 값입니다(정적 집계, 분석 기록 E1c, 58행).
    - 무응답
      &gt; - 의도적 무응답은 고유 63개입니다(정적 집계, 분석 기록 E1c, 58행).
    - 멤버
      &gt; - 멤버 클래스는 108개이고 그중 46개가 하위 폴더에 있습니다(정적 집계, 분석 기록 E1c, 58행).
    - 덮는 비율
      &gt; - 약 48.5%입니다.
      &gt; - 핸들러 584와 무응답 63을 합한 647을 서버 호출 1,334로 나눈 값입니다(정적 집계, 분석 기록 E1c, 58행).
      &gt;
      &gt; - 687개는 핸들러가 없는 호출입니다.
- 게임 규칙 모듈
  - 공통 모양
    - 다섯 단계
      &gt; 1. 표(JSON)에서 규칙을 읽습니다.
      &gt; 2. 계정 상태를 바꿉니다.
      &gt; 3. 거절할 조건이면 사유를 돌려줍니다.
      &gt; 4. 클라이언트가 읽는 모양으로 바꿉니다.
      &gt; 5. 스냅샷 조각으로 내놓습니다.
  - 규칙과 전송의 분리
    - 규칙
      &gt; - 규칙은 계정 상태만 바꾸고 클라이언트에 직접 말하지 않습니다.
    - 전송
      &gt; - 응답과 푸시의 순서는 RPC 멤버가 정합니다.
  - 영웅 데이터
    - 한 곳에서 만들기
      &gt; - 스냅샷, 갱신 푸시, 전투가 같은 조립기로 영웅 데이터를 만듭니다.
    - 효과
      &gt; - 같은 영웅이 화면마다 다른 값으로 보이는 일을 막습니다.
  - 기능 영역
    - 도시와 스토리
      &gt; - 도시는 건설, 순찰, 하루 넘김을 맡습니다.
      &gt; - 스토리는 프롤로그, 7일 반복, 엔딩, 다음 회차를 맡습니다.
    - 영웅과 던전류
      &gt; - 영웅은 육성, 장비, 집, 호감도를 맡습니다.
      &gt; - 던전류는 정신력, 보상, 여러 도전 콘텐츠를 맡습니다.
    - 상점, 소환, 이벤트
      &gt; - 상점과 소환은 구매, 소환, 충전을 맡습니다.
      &gt; - 이벤트는 한정 소환과 활동을 맡습니다.
  - 이벤트 규칙
    - 규모
      &gt; - 이벤트 규칙 모듈은 38개입니다.
      &gt; - 스냅샷 조각을 가진 파일로 셌습니다(분석 기록 E1d, 24행).
    - 골격
      &gt; - 표(JSON), 계정 상태의 한 칸, 거절 판정, 와이어 사전, 스냅샷 조각으로 이루어집니다(분석 기록 E1d, 43행).
    - 자동 수집
      &gt; - 폴더에 모듈 파일을 두면 수집기가 이름순으로 가져와 스냅샷 조각을 모읍니다(분석 기록 E1d, 40행).
    - 추론
      &gt; - 보상과 조건 값 상당수가 추론입니다.
      &gt; - 원본 서버가 없습니다(추론).
- 상태 저장
  - 계정 파일
    - 계정당 JSON
      &gt; - 계정마다 JSON 파일 하나를 씁니다.
    - 저장 시점
      &gt; - 진행 상태는 요청마다 저장합니다(분석 기록 E1a, 102행).
    - 깨진 파일
      &gt; - 깨진 파일은 .broken으로 옮기고, 계정은 초기 상태로 돌아갑니다(분석 기록 E1a, 610행).
  - 스냅샷 조립
    - 조각 등록
      &gt; - 기능 모듈이 자기 조각을 등록합니다.
      &gt; - 로그인 때 서버가 조각을 모아 스냅샷을 만듭니다.
    - 덧씌우기
      &gt; - 계정 데이터가 스냅샷 위에 값을 덧씌우는 통로가 있습니다.
  - 계정 DB
    - 저장 방식
      &gt; - ID/PW 계정은 SQLite에 두고 비밀번호는 scrypt로 해시합니다(복원 서버의 결정, 분석 기록 E1a, 409~411행).
    - 잠금
      &gt; - 같은 아이디가 연속 8번 틀리면 60초 잠급니다(복원 서버의 결정, 분석 기록 E1a, 413행).
    - 실패 기록
      &gt; - 실패 기록은 메모리에만 있어 서버를 다시 띄우면 풀립니다(분석 기록 E1a, 413행).
    - 메모리 한도
      &gt; - 없는 계정 이름을 많이 넣어도 메모리가 늘지 않게, 기록이 4,096개를 넘으면 비웁니다(분석 기록 E1a, 413행).
- 표 데이터
  - 출처와 규모
    - 내보내기
      &gt; - 클라이언트 표를 복원 도구가 JSON으로 내보냅니다.
    - 서버용 JSON
      &gt; - 63개입니다.
      &gt; - 원본 표 여러 개를 묶은 것입니다.
  - 읽는 방식
    - 캐시
      &gt; - 표마다 한 번 읽어 캐시합니다.
  - 추정으로 채운 구간
    - 추정 표기
      &gt; - 추정으로 채운 표기가 따로 있습니다.
      &gt; - 문제 은행, 상점 뽑기, 보스 풀이가 예입니다.
- 서버 시계
  - 변천
    - 처음
      &gt; - 연도만 접은 시계였습니다.
    - 다음
      &gt; - 한국 벽시계를 UTC처럼 씁니다(작업 기록의 커밋 메시지).
    - 현재
      &gt; - 서비스 말기 구간을 되풀이합니다(복원 서버의 결정).
  - 구간
    - 날짜
      &gt; - 말기 구간은 26주이고 2020-11-26 ~ 2021-05-27입니다(분석 기록 E3, 161행).
    - 오래된 주석
      &gt; - 일부 주석은 30주라고 씁니다.
      &gt; - 갱신되지 않은 문구로 보입니다(추정, 분석 기록 E3, 71행).
  - 쓰임
    - 이벤트 칸
      &gt; - 되풀이 번호가 바뀌면 이벤트 모듈이 그 칸을 비웁니다(분석 기록 E1d, 49행).
    - 끝낸 진행
      &gt; - 끝낸 진행은 되돌리지 않는다는 주석이 일부 모듈에 있습니다(분석 기록 E1d, 50행).
    - 시험
      &gt; - 시험은 서버 시계를 되풀이 구간 밖 날짜로 고정합니다(분석 기록 E3, 64행).
  - 과거의 함정
    - 구간 축소
      &gt; - 표에 이상한 행이 있는 기간을 피하려고 구간을 26주로 줄였습니다(작업 기록의 커밋 메시지).
- 전투
  - 오프라인 전투
    - 계산 위치
      &gt; - 전투는 클라이언트가 계산하고 서버는 요청, 응답, 종료, 보상만 주고받습니다.
    - 이유
      &gt; - 원본의 전투 서버 규칙을 알 수 없어서 이렇게 했습니다(복원 서버의 결정).
    - 종료 보고
      &gt; - 종료 보고를 확인한 뒤 보상을 만듭니다(분석 기록 E1c, 266행).
  - 원래 실시간이던 콘텐츠
    - 돌려보내기
      &gt; - 클라이언트가 전투를 계산하도록 돌려보냅니다.
      &gt; - 서버 전투 규칙은 없습니다.
    - 자동 전투 버튼
      &gt; - 판마다 자동 전투 버튼을 눌러야 하는 콘텐츠가 있습니다.
      &gt; - 숨기는 조건은 미션 표의 한 항목뿐입니다(분석 기록 E4a, 844행).
  - 전투 훅 다섯 가지
    - 흐름
      &gt; 1. 이 전투를 맡을 기능인지 판정합니다.
      &gt; 2. 거절 조건을 봅니다.
      &gt; 3. 전투를 준비합니다.
      &gt; 4. 보상을 줍니다.
      &gt; 5. 종료 처리를 합니다.
  - 구현 정도
    - 던전류
      &gt; - 정산과 보상 지급까지 구현했습니다(분석 기록 E1c, 266행).
    - 비어 있는 것
      &gt; - 행동 전투, 구역 전투, 회차 끝 보상, 사건 보상은 비어 있습니다.
    - 밸런스 값
      &gt; - 서버만 아는 밸런스 값은 클라이언트에서 확인되지 않습니다.
- 복원 도구
  - 하는 일
    - 세 단계
      &gt; 1. 클라이언트 스크립트를 읽을 수 있는 소스로 되돌립니다.
      &gt; 2. 복원 결과를 검증합니다.
      &gt; 3. RPC 목록과 데이터 표를 뽑습니다.
  - 복원 수치
    - 복원 개수
      &gt; - 게임 스크립트 13,462개를 Python 소스로 복원했습니다.
      &gt; - 전투 스크립트를 넣은 뒤의 최종 값입니다(원본 기록의 커밋 메시지).
    - 부분 실패
      &gt; - 5개는 일부 함수만 복원됐습니다.
      &gt; - 전투 스크립트를 넣기 전의 중간 집계는 쓰지 않습니다.
  - 검증
    - 검증 도구
      &gt; - 복원이 틀리면 소스 전체가 어긋나므로 따로 검증하는 도구가 있습니다.
  - 한계
    - 정규식 추출
      &gt; - 정규식으로 뽑으므로 변수로 넘긴 호출 이름은 놓칩니다(분석 기록 E2, 23행).
    - 디컴파일
      &gt; - 디컴파일이 일부 구문을 틀리게 풀 수 있습니다.
    - 실물 입력
      &gt; - 실물 입력이 없는 환경에서는 일부 테스트가 건너뛰어집니다.
- 검증 도구
  - 캡처 재생 대조기
    - 판정
      &gt; - 2021 캡처 요청을 서버에 재생해 응답을 같음(SAME), 부분 일치, 다름(DIFF), 상태 차이(STATUS)로 판정합니다(분석 기록 E4a, 207행).
    - 세트별 결과
      &gt; - 게스트 로그인 세트는 17묶음으로 같음 12, 부분 일치 1, 다름 3, 상태 차이 1입니다.
      &gt;
      &gt; - 나머지 세트는 각 21묶음으로 같음 15~16, 부분 일치 1, 다름 3~4, 상태 차이 1입니다(분석 기록 E4a, 207행).
    - 한계
      &gt; - 서버가 캡처 응답을 그대로 돌려주게 만들었으므로 독립 검증이 아닙니다.
  - 가짜 클라이언트
    - 와이어 검사
      &gt; - 서버발 호출을 복원 스텁과 대조합니다.
      &gt; - 잘못된 키 이름을 잡은 사례가 있습니다.
  - 변환기
    - Burp에서 HAR로
      &gt; - Burp 캡처를 HAR 1.2로 바꿉니다.
      &gt; - 요청과 응답 원본 바이트를 base64 필드로 보존합니다(분석 기록 A, 109행).
- 앱 안 서버
  - 서버 프로세스
    - 실행
      &gt; - 공식 CPython 3.14 Android 배포본을 JNI로 게임과 다른 프로세스에서 실행합니다.
    - 이유
      &gt; - 게임이 죽어도 서버가 살아 있게 하려는 것입니다(분석 기록 E1a, 561행).
  - 접속 경로
    - 세 단계
      &gt; 1. 앱 안 VPN이 DNS 질의만 받는 터널을 만듭니다.
      &gt; 2. 게임의 웹과 게이트 접속을 서버의 일반 포트로 돌립니다.
      &gt; 3. 서버가 HTTP, HTTPS, 게이트를 각자의 포트에서 직접 듣습니다.
  - 소켓 복구
    - 재개방
      &gt; - accept가 실패하면 소켓이 아직 듣는 상태인지 확인하고, 아니면 닫고 다시 엽니다.
      &gt; - 실패가 이어지면 쉬는 시간을 0.05초에서 1초까지 두 배씩 늘립니다(분석 기록 E1a, 559행).
    - 원인
      &gt; - 닫힌 소켓을 붙든 채 accept 오류가 되풀이되던 일이 2026-10-13 태블릿 로그에서 확인되었습니다(분석 기록 E1a, 559행).
  - 웹 프레임워크 대체
    - 대체 패키지
      &gt; - Starlette 위에 FastAPI와 같은 모양의 대체 패키지를 얹었습니다.
      &gt; - 기기에서 pydantic-core를 쓸 수 없어서입니다(분석 기록 E1a, 20행).
    - 응답 대조
      &gt; - 응답 119건을 진짜 FastAPI와 비교해 같음 113, 알려진 차이 6, 문제 0이었습니다.
      &gt; - 커밋 메시지 기록이고 재실행하지 않았습니다(분석 기록 E1a).
  - 계정 데이터 화면
    - 백업과 불러오기
      &gt; - 백업, 불러오기, 삭제 화면을 둡니다.
      &gt; - 업데이트로 진행 상태가 사라지지 않게 하려는 장치입니다(분석 기록 E2, 589행).
    - 서버 멈춤 순서
      &gt; - 작업 전에 서버를 멈추고(최대 15초 대기), 작업이 끝나면 다시 띄웁니다.
      &gt; - 작업이 실패해도 다시 띄웁니다(분석 기록 E2, 589행).
    - 삭제 확인
      &gt; - 삭제는 되돌릴 수 없다는 확인을 거친 뒤에 합니다.
- 운영자 도구
  - 시험용 도구
    - 시험 계정
      &gt; - 시험 계정을 만들고 상태를 조작하는 도구입니다.
      &gt; - 검증용 수단이며 원본에 있던 운영 기능이 아닙니다.
    - 기록 파일
      &gt; - 시험 계정의 비밀번호는 기록 파일에만 있습니다.
      &gt; - 서버 DB에는 해시만 있어서 기록을 잃으면 비밀번호를 알 수 없습니다(분석 기록 E1a, 479행).
- 로그 여섯 종류
  - 서버 쪽
    - 서버 로그
      &gt; - 요청이 왔는지, 어떻게 답했는지 봅니다.
      &gt; - 파일로 영구 기록합니다.
    - 중계 로그
      &gt; - 중계에 접속이 도착했는지, 어느 쪽으로 보냈는지 봅니다.
    - 이름 해석 로그
      &gt; - 게임 도메인 질의가 왔는지, 서버 주소로 답했는지 봅니다.
  - 기기 쪽
    - 클라이언트 엔진 로그
      &gt; - 스크립트 예외(트레이스백)와 상태 전이 경고를 봅니다.
    - 패킷 캡처
      &gt; - 와이어에서 실제로 오간 것을 봅니다.
      &gt; - 상시 캡처입니다.
    - 기기 로그
      &gt; - 기기의 logcat, 앱 안 서버, 접속 화면 로그입니다.
      &gt; - 조각 파일 4MiB 단위이고 총량은 300MB입니다.
      &gt; - 오래된 조각부터 지웁니다.
      &gt; - 비밀값은 쓰기 전에 가립니다(분석 기록 E1a, 637행과 633행).

## 흐름
- 부팅부터 로그인까지
  - 이름과 설정
    - 도메인 질의
      &gt; - 클라이언트가 게임 도메인을 질의하고 복원 서버 주소를 받습니다.
    - 설정 요청
      &gt; - 설정, 업데이트 확인, 서버 목록을 HTTP 서비스에 요청합니다.
  - 로그인과 접속
    - 로그인 응답
      &gt; - 로그인 요청은 서명을 계산해 비교하지만 결과와 무관하게 통과시킵니다.
      &gt; - 게스트 로그인 같은 경우도 같습니다.
    - 게이트 접속
      &gt; - 서버 목록이 알려 준 주소로 게이트 서버에 접속합니다.
      &gt; - 목록 응답에 실제 게이트 주소가 있어야 합니다.
- 도시 진입
  - 접속 응답
    - 연결 시작
      &gt; - 접속 응답, 계정 엔티티, 로그인 정보 수신, 아바타 엔티티와 스냅샷 순으로 진행합니다.
  - 전환과 확인
    - 플레이 전환
      &gt; - 플레이 전환을 보냅니다.
    - 주기 응답
      &gt; - 상태 전환, 이벤트 조회, 생존 신호에 각각 응답합니다.
    - 생존 신호 주기
      &gt; - 클라이언트가 5초 간격으로 생존 신호를 보냅니다(분석 기록 D2, 1406행).
- RPC 한 건 처리
  - 찾기
    - 요청 받기
      &gt; - 클라이언트가 RPC를 보냅니다.
      &gt; - 아바타 계층이 이름으로 핸들러를 찾습니다.
  - 처리와 응답
    - 규칙 호출
      &gt; - 핸들러가 규칙 모듈을 불러 계정 상태를 바꿉니다(게임 규칙 영역).
    - 응답과 푸시
      &gt; - 응답과 필요한 푸시를 보냅니다.
      &gt; - 보내는 순서는 RPC 멤버가 정합니다.
  - 저장
    - 저장
      &gt; - 상태를 파일에 저장합니다.
      &gt; - 저장과 응답 중 어느 쪽이 먼저인지는 분석 기록에 없습니다(확인 안 됨, 「크래시와 재시작」 참고).
- 이벤트 한 건
  - 진행
    - 조건과 조회
      &gt; - 조건을 갱신하고 이벤트를 조회합니다.
    - 시작과 진행
      &gt; - 시작하고 진행시킵니다.
  - 끝
    - 완료와 종료
      &gt; - 완료하고 종료합니다.
    - 되풀이
      &gt; - 서버 시계가 한 바퀴 돌아 되풀이 번호가 바뀌면 이벤트 모듈이 칸을 비웁니다.
- 전투 한 판
  - 요청과 데이터
    - 요청
      &gt; - 클라이언트가 전투 요청을 보냅니다.
    - 데이터 응답
      &gt; - 서버가 영웅, 몬스터, 웨이브 데이터로 응답합니다.
  - 계산과 정산
    - 클라이언트 계산
      &gt; - 클라이언트가 전투를 계산합니다.
    - 종료와 보상
      &gt; - 종료와 보상 요청이 오면 서버가 정산해 보상을 지급합니다.
      &gt; - 던전류 기준입니다.
- 하루 넘김
  - 확인과 갱신
    - 상태 확인과 조건 갱신
      &gt; - 상태를 확인하고 조건을 갱신합니다.
    - 날짜 증가
      &gt; - 날짜를 올립니다.
  - 재전송과 정산
    - 도시 데이터
      &gt; - 도시 데이터를 다시 보냅니다.
    - 정산 화면
      &gt; - 일일 정산 화면을 띄웁니다.
- 엔딩과 다음 회차
  - 엔딩 처리
    - 엔딩 CG와 점수
      &gt; - 엔딩 CG를 추가하고 점수를 동기화합니다(코드 경로).
    - 스토리 플래그
      &gt; - 스토리 플래그를 갱신합니다.
  - 다음 회차
    - 결과와 입장
      &gt; - 회차 결과 화면을 보이고, 엔딩에 따른 입장을 요청합니다.
    - 회차 증가
      &gt; - 회차를 올리고 클라이언트 아바타를 갱신합니다.
    - 확인 범위
      &gt; - 정식 결말 화면은 한 번도 보지 못했습니다.
      &gt; - 이 흐름은 코드 경로입니다(분석 기록 E5, 1507행).
- 앱 안 서버 접속
  - 준비
    - 상태 확인
      &gt; - 접속 화면이 서버 상태를 확인합니다.
    - VPN
      &gt; - 앱 안 VPN이 켜집니다.
  - 연결
    - 접속 전환
      &gt; - 게임의 접속이 서버의 일반 포트로 갑니다.
    - 재시도
      &gt; - 연결이 안 되면 접속 화면이 단계적으로 다시 시도합니다.
- 규칙을 복원하는 흐름
  - 복원
    - 소스 복원
      &gt; - 클라이언트 스크립트를 읽을 수 있는 소스로 복원합니다.
    - 목록 추출
      &gt; - RPC 목록과 데이터 표를 뽑습니다.
  - 정리와 구현
    - 계약 문서
      &gt; - 클라이언트가 읽는 필드, 타입, 순서를 계약 문서로 정리합니다.
    - 구현과 시험
      &gt; - 규칙을 구현하고 테스트합니다.

## 지켜야 할 약속
- 캡처가 있는 응답은 바이트까지 같게
  - 이유
    - 업데이트 확인
      &gt; - 업데이트 확인 단계에서 멈추는 일을 막는 가장 직접적인 장치입니다.
  - 확인
    - 테스트 고정
      &gt; - 길이와 SHA-256을 테스트로 고정합니다.
      &gt; - 캡처가 없는 응답에는 이 약속이 없습니다.
- 결과를 읽는 콜백에는 반드시 결과로 답한다
  - 판별
    - 표시로 판별
      &gt; - 호출마다 붙은 &quot;결과 필요&quot; 표시로 판별합니다.
      &gt; - 결과가 필요한 호출은 18개이고 그중 17개에 핸들러가 있습니다(분석 기록 E1c, 58행).
  - 빠진 경우
    - 증상
      &gt; - 핸들러가 없는 1개가 불리면 화면 잠금이 남아 약 15초 뒤 재접속합니다(분석 기록 E5, 433행).
- 요청값을 되돌려 줘야 하는 호출이 있다
  - 이유
    - 상태 전환
      &gt; - 상태 전환 같은 호출은 요청값을 그대로 되돌려야 합니다.
  - 결과
    - 증상
      &gt; - 되돌리지 않으면 약 15초 뒤 접속이 끊깁니다(분석 기록 D2, 713행).
- 생존 신호에는 즉시 답한다
  - 주기
    - 간격
      &gt; - 클라이언트는 5초 간격으로 생존 신호를 보냅니다(분석 기록 D2, 1406행).
  - 실패
    - 증상
      &gt; - 약 30초 안에 답이 없으면 클라이언트가 스스로 로그아웃합니다(분석 기록 C, 685행과 D2, 36행).
- 계정 엔티티를 먼저 보낸다
  - 순서
    - 전이
      &gt; - 클라이언트가 계정 엔티티를 받아야 상태가 로그인 단계로 넘어갑니다.
  - 틀렸을 때
    - 경고
      &gt; - 순서가 틀리면 상태 전이 경로가 없다는 경고가 납니다.
- 클라이언트가 읽는 키는 모두 채운다
  - 결과
    - 화면 예외
      &gt; - 빠지면 화면이 열리자마자 예외가 납니다.
  - 타입
    - 타입 어긋남
      &gt; - 정수여야 할 값이 다른 타입이면 같은 증상이 납니다.
- 새 기능은 자기 스냅샷 조각을 등록한다
  - 이유
    - 화면 열림
      &gt; - 로그인 때 클라이언트가 그 값을 알아야 화면이 열립니다.
- 영웅 값은 한 조립기를 거친다
  - 이유
    - 값 일치
      &gt; - 스냅샷, 갱신, 전투가 서로 다른 영웅 값을 보지 않게 합니다.
- 서버 시계 구간 안의 표는 안전해야 한다
  - 조건
    - 이상 행
      &gt; - 표에 이상한 행이 있는 기간이 시계 구간에 들어오면 그 화면이 죽습니다.
  - 절차
    - 확인
      &gt; - 구간을 바꾸거나 표를 고칠 때마다 구간 안의 모든 행을 확인합니다.
- 같은 이름의 핸들러를 만들지 않는다
  - 결과
    - 덮어쓰기
      &gt; - 같은 이름이 둘이면 나중 것이 조용히 이깁니다.
  - 확인
    - 절차
      &gt; - 새 핸들러를 만들기 전에 같은 이름이 있는지 확인합니다.
- 쓰기 도중 끊길 파일은 임시 파일에 쓴 뒤 바꾼다
  - 근거
    - 시드 복사
      &gt; - 시드를 복사할 때 임시 파일에 쓴 뒤 교체합니다(분석 기록 E1a, 610행).
  - 한계
    - 확인 안 됨
      &gt; - 일반 계정 파일 저장이 같은 방식인지는 분석 기록에서 확인하지 못했습니다.

## 건드리면 안 되는 것
- 클라이언트 수정 범위
  - 수정 목록
    - 별도 문서
      &gt; - 클라이언트 수정 목록은 별도 문서에 있습니다.
      &gt; - 서버 작업 전에 그 목록의 항목을 먼저 확인합니다.
  - 최소 변경
    - 원칙
      &gt; - 클라이언트를 바꿀 때는 필요한 최소한만 바꿉니다.
- 게임 데이터 패키지
  - 원본 파일
    - 수정 금지
      &gt; - 게임 데이터 패키지(OBB)의 원본을 고치지 않습니다(분석 기록 E5, 1527행).
- 캡처 원본
  - 로그인 토큰
    - 저장소 제외
      &gt; - 2021 캡처에는 로그인 토큰이 들어 있어 저장소에 두지 않습니다.
      &gt; - 보고서에는 Evidence ID, 건수, 해시만 적습니다(분석 기록 E4a, 177행).
  - 캡처 응답
    - 영향
      &gt; - 캡처 응답의 길이와 해시를 고정한 테스트가 있어, 응답을 바꾸면 테스트가 깨집니다.
- 진행 상태 파일
  - 접속 중인 계정
    - 덮어쓰기
      &gt; - 접속 중인 계정의 파일을 밖에서 고쳐도, 서버가 메모리 상태로 다시 덮어씁니다(분석 기록 E1a, 450행).
  - 시험 계정 보관본
    - 레벨 변경
      &gt; - 보관본의 레벨이 바뀌면 이를 읽는 테스트도 같이 고쳐야 합니다.
- 서버 시계 구간과 표
  - 구간 변경
    - 확인
      &gt; - 구간을 바꾸면 구간 안의 모든 표 행을 확인합니다(「지켜야 할 약속」 참고).
- 로그와 비밀값
  - 가림 처리
    - 쓰기 전 가림
      &gt; - 로그에 비밀값을 쓰기 전에 가립니다.
      &gt; - 가림이 빠지면 로그에 비밀값이 보입니다(분석 기록 E1a, 633행).
- 로그인 서명 검증
  - 현재 상태
    - 실효성 없음
      &gt; - 서명 검증은 실효성이 없는 상태입니다.
      &gt; - 고치기 전에 「알려진 함정과 한계」를 먼저 봅니다.

## 기능 하나가 만들어지는 과정
- 계약과 표
  - 1. 계약 뽑기
    - 계약 정리
      &gt; - 해당 화면이 읽는 필드, 타입, 순서를 복원 소스와 표에서 뽑습니다.
      &gt;
      &gt; - 근거 등급을 붙인 계약 문서로 정리합니다.
  - 2. 표 내보내기
    - 내보내기
      &gt; - 내보내기 도구로 표를 JSON으로 만듭니다.
- 규칙과 전송
  - 3. 규칙 모듈 쓰기
    - 시험부터
      &gt; - 계정 상태만 바꾸는 규칙을 만들고, 거절 조건을 먼저 정합니다.
    - 추론 표시
      &gt; - 원본에서 알 수 없는 값은 추론이라고 주석에 적습니다.
  - 4. RPC 멤버 만들기
    - 응답 순서
      &gt; - 규칙을 불러 응답과 푸시의 순서를 정합니다.
    - 콜백 풀기
      &gt; - 결과를 읽는 콜백은 반드시 풉니다.
    - 등록
      &gt; - 새 멤버는 멤버 목록에 넣어야 핸들러가 등록됩니다(분석 기록 E1c, 91행).
  - 5. 스냅샷 조각 등록
    - 조각 내놓기
      &gt; - 로그인 때 보낼 값을 조각으로 내놓습니다.
    - 자동 수집
      &gt; - 이벤트 규칙은 모듈 폴더에 파일을 두면 자동으로 모입니다(분석 기록 E1d, 40행).
    - 영웅 값
      &gt; - 영웅 값은 공용 조립기를 씁니다.
- 검증
  - 6. 가짜 클라이언트로 대조
    - 서버발 호출
      &gt; - 서버발 호출이 복원 스텁과 맞는지 확인합니다.
    - 잡는 것
      &gt; - 키 이름과 인자 개수를 잡습니다.
  - 7. 전체 테스트
    - 구성
      &gt; - PC 구성과 기기 구성 모두에서 돌립니다.
    - 시계 고정
      &gt; - 서버 시계를 고정한 테스트인지 확인합니다(분석 기록 E3, 64행).
  - 8. 에뮬레이터 확인
    - 판정
      &gt; - 서버 로그에 오류가 없는지, 엔진 로그에 새 트레이스백이 없는지 봅니다.
      &gt; - 화면이 아니라 로그로 판정합니다(분석 기록 E2, 1931행).
    - 증거
      &gt; - 화면 증거 번호를 남깁니다.
- 기록
  - 9. 기록하기
    - 기록 갱신
      &gt; - 분석 보고서와 작업 일지를 갱신합니다.

## 크래시와 재시작
- 정상 저장
  - 저장 시점
    - 요청마다 저장
      &gt; - 진행 상태는 요청마다 저장합니다(분석 기록 E1a, 102행).
  - 접속 종료
    - 잃는 것 없음
      &gt; - 접속을 닫아도 잃는 것이 없다는 전제가 여기서 섭니다.
      &gt; - 게임은 끊긴 것을 알고 다시 접속합니다(분석 기록 E1a, 102행).
- 서버 종료
  - 종료 순서
    - 접속 먼저 닫기
      &gt; - 서버 소켓을 닫고 접속을 먼저 끊은 뒤 최대 5초 기다립니다(분석 기록 E1a, 100행).
  - 종료 시간 수치
    - 측정 없음
      &gt; - 커밋 메시지는 종료 시간이 크게 줄었다고 적지만, 측정 로그가 없어 구체적인 수치는 쓰지 않습니다(분석 기록 E1a, 102행).
- 재시작 뒤 남는 것
  - 진행 상태
    - 파일에 남음
      &gt; - 계정 파일이 남아 진행이 이어집니다.
      &gt; - 요청마다 저장한다는 전제에서 그렇습니다.
  - 로그인 실패 기록
    - 메모리
      &gt; - 잠금 기록은 메모리에만 있어 서버를 다시 띄우면 풀립니다(분석 기록 E1a, 413행).
  - 계정 찾기
    - 기준
      &gt; - 계정은 로그인 정보가 준 식별자로 찾습니다.
      &gt; - 연결마다 바뀌는 값으로 찾으면 앱을 켤 때마다 새 계정이 됩니다(분석 기록 E1a, 50행).
- 깨진 파일
  - 처리
    - 격리와 초기화
      &gt; - 깨진 계정 파일은 .broken으로 옮기고, 계정은 초기 상태로 돌아갑니다.
      &gt; - 진행이 사라집니다(분석 기록 E1a, 610행).
  - 예방
    - 임시 파일
      &gt; - 시드 복사는 임시 파일에 쓴 뒤 바꿔서, 쓰는 도중 끊겨도 반쯤 쓰인 파일이 남지 않게 합니다(분석 기록 E1a, 610행).
  - 한계
    - 확인 안 됨
      &gt; - 일반 계정 파일 저장이 같은 방식인지는 분석 기록에서 확인하지 못했습니다.
- 응답과 저장의 순서
  - 확인 안 됨
    - 순서 근거 없음
      &gt; - 응답을 먼저 보내는지, 저장을 먼저 하는지 분석 기록에 없습니다.
  - 추론
    - 크래시 창 (추론)
      &gt; - 응답을 보낸 뒤 저장 전에 끊기면 클라이언트가 본 상태와 파일 상태가 어긋날 수 있습니다(추론).
- 기기 쪽 끊김
  - 게임 종료
    - 서버 유지
      &gt; - 게임 프로세스가 죽어도 앱 안 서버 프로세스는 남습니다(분석 기록 E1a, 561행).
  - 소켓
    - 재개방
      &gt; - 듣는 소켓이 닫히면 서버가 다시 엽니다.
      &gt; - 실패가 이어지면 쉬는 시간을 0.05초에서 1초까지 두 배씩 늘립니다(분석 기록 E1a, 559행).
- 업데이트 뒤 진행
  - 기기에 있는 계정
    - 덮어쓰지 않음
      &gt; - 기기에 이미 있는 계정과 진행 상태는 덮어쓰지 않습니다.
      &gt; - 빌드가 관리하는 계정만 예외입니다(분석 기록 E1a, 604행).
  - 교체 방식
    - 바뀌지 않은 파일
      &gt; - 기기에서 건드리지 않은 파일만 새 것으로 바꾸고, 이전 파일은 옆에 남깁니다(분석 기록 E1a, 604행).

## 증상에서 원인으로
- 풀이 순서
  - 로그 읽기
    - 증상 줄
      &gt; - 클라이언트 엔진 로그에서 증상 줄(경고, 트레이스백)을 찾습니다.
    - 대응 줄
      &gt; - 서버 로그에서 같은 시각의 수신 줄과 응답 줄을 봅니다.
      &gt; - 정상이면 수신 줄 바로 뒤에 응답 줄이 이어집니다.
  - 아래로 내려가기
    - 접속이 안 올 때
      &gt; - 중계 로그, 이름 해석 로그, 패킷 캡처 순서로 내려갑니다.
    - 기기 구성일 때
      &gt; - 앱 안 서버 구성이면 기기 로그를 봅니다.
- 업데이트 확인에서 멈춘다
  - 원인 후보
    - 응답이 어긋남
      &gt; - 응답 길이와 해시가 캡처와 다르면 이 증상이 납니다.
  - 볼 곳
    - 대조 도구
      &gt; - 캡처 재생 대조기와 응답 길이, 해시 테스트를 봅니다.
    - 이름 해석과 인증서
      &gt; - 이름 해석 로그에 게임 도메인 질의가 왔고 서버 주소로 답했는지 봅니다.
      &gt; - 인증서의 대상 이름이 게임 도메인과 맞는지 봅니다.
- 서버 선택 화면에서 멈춘다
  - 원인 후보
    - 서버 목록
      &gt; - 목록이 비었거나 실제 게이트 주소가 없는 경우입니다.
  - 볼 곳
    - 응답 대조
      &gt; - 서버 로그에서 응답 본문과 알려 준 게이트 주소를 대조합니다.
- 게이트로 가는 연결이 0건이다
  - 원인 후보
    - 목록 응답
      &gt; - 서버 목록 응답에 실제 게이트 주소가 있는지 먼저 확인합니다.
    - 중계 분기
      &gt; - 그다음 중계의 접속 분기를 의심합니다.
  - 볼 곳
    - 패킷 캡처
      &gt; - 서버명 없는 TCP가 게이트로 가는지 찾습니다.
- 접속은 되는데 상태 전이 경고가 난다
  - 원인 후보
    - 엔티티 순서
      &gt; - 계정 엔티티가 늦게 나간 경우입니다.
  - 볼 곳
    - 두 로그 겹치기
      &gt; - 클라이언트 엔진 로그의 경고와 서버 로그의 전송 순서를 겹쳐서 계정 엔티티가 먼저 나갔는지 봅니다.
- 로딩이 약 16초 뒤 재접속을 반복한다
  - 원인 후보
    - 이벤트 조회 결과 미회신
      &gt; - 이벤트 조회에 결과를 주지 않은 경우입니다.
      &gt; - 서버가 확인 응답만 보내고 결과를 주지 않으면 로딩 잠금이 풀리지 않습니다(분석 기록 D2, 742행).
  - 볼 곳
    - 서버 로그
      &gt; - 확인 응답과 빈 결과가 나갔는지 봅니다.
- 약 30초 뒤 스스로 로그아웃한다
  - 원인 후보
    - 생존 신호 무응답
      &gt; - 생존 신호에 답하지 않은 경우입니다(분석 기록 C, 685행).
  - 볼 곳
    - 서버 로그
      &gt; - 수신 줄 바로 뒤에 응답 줄이 나가는지 봅니다.
- 약 15초 뒤 접속이 끊긴다
  - 원인 후보
    - 상태 전환 요청값 미회신
      &gt; - 상태 전환 요청에 답하지 않았거나 요청값을 되돌리지 않은 경우입니다(분석 기록 D2, 713행).
  - 볼 곳
    - 응답 대조
      &gt; - 서버 로그와 패킷 캡처에서 응답 키와 값을 대조합니다.
- 화면이 응답 대기 중에서 멈추고 약 15초 뒤 재접속한다
  - 원인 후보
    - 결과 콜백 미해소
      &gt; - 클라이언트가 결과를 기다리는 콜백인데 서버가 풀어 주지 않은 경우입니다(분석 기록 E5, 433행).
  - 볼 곳
    - 마지막 호출
      &gt; - 서버 로그에서 마지막으로 받은 호출이 무엇인지 봅니다.
      &gt; - 결과를 기다리는 호출이면 이 증상입니다.
- 재접속과 끊김의 구분
  - 판별 표
    - 증상별 호출
      &gt; | 증상 | 마지막 호출의 종류 | 원인 |
      &gt; |---|---|---|
      &gt; | 약 16초 뒤 재접속 | 이벤트 조회 | 결과 미회신 |
      &gt; | 약 15초 뒤 재접속 | 결과를 기다리는 콜백 | 콜백 미해소 |
      &gt; | 약 15초 뒤 끊김 | 상태 전환 요청 | 요청값 미회신 |
- 화면이 열리자마자 예외가 난다
  - 원인 후보
    - 필수 키 누락
      &gt; - 필수 키가 빠지거나 기본값 타입이 어긋난 경우입니다.
  - 볼 곳
    - 트레이스백
      &gt; - 클라이언트 엔진 로그의 트레이스백이 가리키는 위치를 복원 소스와 대조합니다.
- 화면이 로딩에서 끝나지 않는다
  - 원인 후보
    - 기다리는 응답 누락
      &gt; - 로딩 장치가 기다리는 응답 목록을 서버가 보내지 않은 경우입니다.
  - 볼 곳
    - 복원 소스
      &gt; - 로딩 장치가 기다리는 응답 목록을 복원 소스에서 찾고, 서버가 보냈는지 확인합니다.
- 특정 탭이 죽는다
  - 원인 후보
    - 표의 이상 행
      &gt; - 표에 이상한 행이 있는 경우입니다.
  - 볼 곳
    - 시계 구간
      &gt; - 그 행이 서버 시계 구간 안에 있는지 확인합니다.
- 일부 영웅에서만 기능이 거절된다
  - 원인 후보
    - 표 값 잘못 옮김
      &gt; - 영웅별 표의 값이 잘못 옮겨진 경우입니다.
  - 볼 곳
    - 대조
      &gt; - 복원 소스가 판정에 실제로 쓰는 칸과 표의 값을 대조합니다.
- 앱을 켤 때마다 새 계정이 된다
  - 원인 후보
    - 연결마다 바뀌는 식별자
      &gt; - 연결마다 바뀌는 식별자로 계정을 찾는 경우입니다.
  - 볼 곳
    - 로그인 정보 순서
      &gt; - 로그인 정보를 받은 뒤에 계정을 찾는지 봅니다.
- 태블릿에서만 로그인에 실패한다
  - 원인 후보
    - 주소 구분 실패
      &gt; - 중계 뒤에서 모든 접속이 같은 주소로 보이는 경우입니다.
  - 볼 곳
    - 프록시 헤더
      &gt; - 프록시 헤더 해석이 빠졌는지 확인합니다.
- 게임만 껐다 켜면 접속이 안 된다
  - 원인 후보
    - 듣는 소켓 닫힘
      &gt; - 기기 장치가 사라지며 소켓이 닫힌 경우입니다.
  - 볼 곳
    - 기기 로그
      &gt; - accept 실패와 소켓 재개방 기록을 찾습니다.
- 비행기 모드에서만 막힌다
  - 원인 후보
    - DNS 질의 경로
      &gt; - DNS 질의가 VPN 경로로 가지 않는 경우입니다(분석 기록 E2, 272행).
  - 볼 곳
    - VPN 경로
      &gt; - 질의가 VPN 경로를 탔는지 봅니다.
- 업데이트마다 진행 상태가 사라진다
  - 원인 후보
    - 계정 데이터 교체
      &gt; - 업데이트가 계정 데이터 파일을 새 것으로 교체하는 경우입니다.
  - 볼 곳
    - 교체 조건
      &gt; - 건드리지 않았을 때만 교체하는지, 이전 파일이 따로 남는지 봅니다(분석 기록 E1a, 604행).
- 로그에 비밀값이 보인다
  - 원인 후보
    - 가림 처리 누락
      &gt; - 쓰기 전에 가림 처리가 빠진 경우입니다.
  - 볼 곳
    - 검색
      &gt; - 같은 검색에서 일치가 0건이 되는지 다시 확인합니다.

## 테스트 지도
- 종류별 보장
  - 서버 쪽
    - 라우터 테스트
      &gt; - HTTP 응답 모양과 부팅 흐름을 봅니다.
    - 게이트 실제 소켓 테스트
      &gt; - 핸드셰이크와 엔티티 순서를 봅니다.
    - 와이어 검사
      &gt; - 서버발 호출이 복원 스텁과 맞는지 봅니다.
    - 캡처 고정
      &gt; - 정적 응답의 길이와 해시를 봅니다.
  - 데이터와 규칙
    - 원본 대조
      &gt; - 능력치 계산이 복원 소스의 계산 결과와 같은지 봅니다.
      &gt; - 옮기는 과정의 실수를 잡는 용도입니다.
    - 표 대조
      &gt; - 서버가 읽는 표가 클라이언트 표와 같은지 봅니다.
    - 이야기 봇
      &gt; - 엔진만으로 한 회차가 막히지 않는지 봅니다.
  - 기기 구성
    - 같은 응답
      &gt; - 같은 코드가 기기 구성에서도 같은 응답을 내는지 봅니다.
- 실행과 해석
  - 실행 방식
    - 수동 실행
      &gt; - CI가 없고 수동으로 돌립니다(분석 기록 사실 기록, 228행).
  - 실행 시간
    - 전체 한 번
      &gt; - 2026-10-25, Windows PC에서 약 90초(90.28초) 걸렸습니다.
  - 결과 요약
    - 통과와 실패
      &gt; - 4,003개 통과, 5개 실패, 2개 오류, 3개 건너뜀입니다.
    - 실패 5건
      &gt; - 기기 구성 소켓 테스트 3건과 정적 캡처 응답의 바이트 대조 2건입니다.
    - 오류 2건
      &gt; - 긴 매개변수 문자열 케이스입니다.
      &gt; - Windows 환경변수 길이 한도(32,767자)를 넘었습니다.
    - 건너뜀
      &gt; - 실물 입력이 없으면 건너뜁니다.
  - 줄바꿈 조건
    - 기준
      &gt; - 이 결과는 줄바꿈이 CRLF인 체크아웃 기준입니다.
    - 원인 (추론)
      &gt; - 캡처 바이트 대조 2건은 CRLF 체크아웃에서 바이트 수가 달라진 것으로 보입니다.
      &gt; - 원인은 확인하지 않았습니다(추론, 분석 기록 B, 893행).
  - 범위
    - 서버 테스트
      &gt; - 서버 쪽 테스트 묶음입니다.
      &gt; - 운영 환경인 Ubuntu에서는 다시 돌리지 않았습니다.
    - 밖
      &gt; - 실기기와 에뮬레이터 판정은 테스트 밖입니다.
      &gt; - 에뮬레이터 판정은 로그로 합니다(「로컬에서 재현하기」 참고).
- 결정성
  - 서버 시계
    - 고정
      &gt; - 테스트는 서버 시계와 벽시계를 되풀이 구간 밖 날짜로 고정합니다(분석 기록 E3, 64행).
- 새 호출을 추가할 때
  - 규칙 모듈
    - 단위 테스트
      &gt; - 거절 조건을 포함한 단위 테스트를 둡니다.
  - 서버발 호출
    - 가짜 클라이언트
      &gt; - 가짜 클라이언트로 복원 스텁과 대조합니다.
  - 시간이 관여할 때
    - 시계 고정
      &gt; - 서버 시계를 고정한 테스트로 씁니다.
- 규모와 한계
  - 서버 테스트
    - 정적 집계 없음
      &gt; - 테스트 함수 수는 이 지도에 적지 않았습니다.
      &gt; - 세는 기준을 정한 뒤 적습니다.
  - 건너뛰기
    - 낡은 사유
      &gt; - 건너뛰기 사유 중에 낡은 것이 섞여 있습니다.

## 로컬에서 재현하기
- 준비물
  - 서버
    - PC 실행 기록
      &gt; - Windows PC에서 서버 테스트 전체를 돌린 기록이 있습니다.
      &gt; - 같은 환경에서 서버 테스트를 먼저 확인합니다.
    - 운영 환경
      &gt; - 운영은 Linux 서버입니다.
      &gt; - 중계와 이름 해석 설정은 PC에서 그대로 재현되지 않습니다.
  - 클라이언트
    - 수정 빌드
      &gt; - 수정한 클라이언트 빌드를 씁니다.
      &gt; - 수정 목록은 별도 문서에 있습니다.
  - 기기
    - 에뮬레이터
      &gt; - Android 에뮬레이터가 주 검증 기기입니다.
    - 실기기
      &gt; - 휴대폰과 태블릿은 설치, 로그인, 계정 데이터 백업 확인에 씁니다.
  - 계정
    - 시험 계정
      &gt; - 상태 조작 도구로 미리 만든 시험 계정을 씁니다.
- 절차
  - 서버 기동
    - 순서
      &gt; - 서버를 먼저 띄운 뒤 에뮬레이터에서 게임을 켭니다(분석 기록 E2, 1931행).
  - 기대 로그 줄
    - 서버 로그
      &gt; - 로그인 줄, 플레이 전환 송신 줄, 생존 신호 수신 줄을 기다립니다(분석 기록 E2, 1931행).
    - 엔진 로그
      &gt; - 상태 번호가 6에서 3으로, 3에서 4로 바뀌는 줄을 기다립니다.
      &gt; - 3에서 4는 도시 화면 진입입니다(분석 기록 E2, 1931행).
  - 판정
    - 종료 코드 0
      &gt; - 송신과 생존 신호 확인, 도시 진입까지 끝났다는 뜻입니다.
    - 종료 코드 1
      &gt; - 시간 초과입니다.
  - 로그 범위
    - 시작 줄 이후만
      &gt; - 서버 로그는 스크립트 시작 시점 이후 줄만 봅니다.
      &gt; - 이전 실행의 로그에 속지 않기 위해서입니다(분석 기록 E2, 47행).
  - 창 감지
    - 응답 없음 창
      &gt; - &quot;응답 없음&quot; 창이 탭을 가로채면 게임이 종료될 수 있으므로 창을 감지하는 단계를 둡니다.
- 재현 범위
  - 재현되는 것
    - 로그인부터 도시까지
      &gt; - 에뮬레이터에서 로그인, 도시 진입, 생존 신호 지속까지 확인한 기록이 있습니다(분석 기록 E4a, 278행).
    - 서버 테스트
      &gt; - 서버 테스트 묶음 전체입니다.
  - 재현이 어려운 것
    - 중계 뒤의 주소
      &gt; - 기기별 주소 구분은 중계 설정이 있어야 확인됩니다(분석 기록 E1a, 74행).
    - 운영 중계
      &gt; - 운영 중계와 이름 해석 설정은 PC에서 재현되지 않습니다.
      &gt; - 운영 Ubuntu에서 다시 돌린 기록은 없습니다.
  - 재현하지 못하는 것
    - 정식 결말
      &gt; - 정식 결말 화면은 한 번도 보지 못했습니다(분석 기록 E5, 1507행).
    - 게이트 구간 정답지
      &gt; - 게이트 구간에는 캡처가 없어서 클라이언트 동작과 로그가 유일한 검증 수단입니다.
- 흔한 실패
  - 소켓 테스트 실패
    - 구분
      &gt; - 서버 쪽 결함인지 기기 구성 환경인지부터 구분합니다.
      &gt; - 원인은 확인하지 않았습니다.
  - 바이트 대조 실패
    - 확인
      &gt; - 줄바꿈 체크아웃 조건을 먼저 확인합니다(「실행과 해석」 참고).
  - 판정 시간 초과
    - 확인
      &gt; - 종료 코드 1이면 서버 로그와 엔진 로그를 나란히 보고 어느 줄에서 멈췄는지 찾습니다.

  - 태블릿
    - 용도
      &gt; - 로그인과 도시 화면을 확인합니다.
      &gt; - 시험용으로 복사한 계정을 씁니다.
- 에뮬레이터 자동화
  - 입력과 판정
    - 탭
      &gt; - 화면을 탭하고, 성공 판정은 서버 로그와 엔진 로그의 상태 전이로 합니다.
  - 창 감지
    - 응답 없음
      &gt; - 창을 감지하는 단계가 있습니다.
- 도구 목록
  - 복원
    - 소스 복원
      &gt; - 클라이언트 스크립트를 소스로 되돌립니다.
    - RPC 목록
      &gt; - 호출 이름과 인자를 뽑습니다.
  - 데이터
    - 표 내보내기
      &gt; - 구문 트리로 표를 JSON으로 바꿉니다.
  - 검증
    - 캡처 대조기
      &gt; - 2021 캡처를 재생해 판정합니다.
    - 변환기
      &gt; - Burp 출력을 HAR로 바꿉니다.
- REA를 쓰는 곳
  - 용도
    - 분석과 판독
      &gt; - 네이티브 라이브러리 분석, HTTP 캡처 판독, 기기 조작 도구에 씁니다.
  - 범위
    - 범위 밖
      &gt; - 게임 스크립트와 게이트 구간 pcap은 REA의 범위 밖입니다.
  - 큰 결과
    - 재사용
      &gt; - 큰 라이브러리는 분석 결과를 한 번 만들어 이어서 조회합니다.

## 작업 규칙과 문서
- 문서 체계
  - 분석 보고서
    - 형식
      &gt; - 번호를 붙이고 질문, 방법, 결론을 적습니다.
    - 정정
      &gt; - 앞 보고서를 정정할 때는 표시합니다.
  - 작업 일지
    - 내용
      &gt; - 한 일, 현재 상태, 알아 둘 것, 남은 일, 커밋을 적습니다.
- 작업 하나마다 남기는 것
  - 기록 짝
    - 분석 보고서와 일지
      &gt; - 분석 보고서와 작업 일지를 같이 남깁니다.
    - 이유
      &gt; - 나중에 근거를 따라갈 수 있게 하려는 규칙입니다.
- 시험 수단은 원본 규칙과 구분해 적는다
  - 구분
    - 시험 값
      &gt; - 능력치 배율, 시계 조정, 호감도 설정으로 확인한 것은 원본 규칙과 구분해 일지에 적습니다.
  - 이유
    - 굳지 않게
      &gt; - 검증용 값이 규칙으로 굳지 않게 하려는 것입니다.
- 증거 규칙
  - 기록 형식
    - REA 근거
      &gt; - Evidence ID와 대상 SHA-256을 함께 적습니다.
    - 그 밖의 근거
      &gt; - 파일 경로와 줄 번호로 적습니다.
- 검증 범위를 일지에 적는다
  - 범위
    - 직접 적기
      &gt; - &quot;한 바퀴까지만 확인&quot;, &quot;단위 테스트만&quot;, &quot;배율을 써서 확인&quot;처럼 범위를 직접 적습니다.
  - 이유
    - 구분
      &gt; - 자연 플레이로 확인한 것과 구분하기 위해서입니다.

## 알려진 함정과 한계
- 함정
  - 저장 순서
    - 응답 뒤 저장
      &gt; - 응답을 보낸 뒤 저장 전에 끊기면 상태가 어긋날 수 있습니다.
      &gt; - 저장 순서의 근거는 분석 기록에 없습니다(추론).
    - 깨진 계정 파일
      &gt; - 깨진 계정 파일은 .broken으로 옮겨지고 계정이 초기화됩니다(분석 기록 E1a, 610행).
  - 같은 증상, 다른 원인
    - 15초와 16초
      &gt; - 16초 재접속은 이벤트 조회 결과 미회신이고, 15초 재접속은 결과 콜백 미해소이며, 15초 끊김은 상태 전환 요청값 미회신입니다(「증상에서 원인으로」의 판별 표 참고).
  - 표의 이상 행
    - 시계 구간
      &gt; - 표에 이상한 행이 있는 기간이 서버 시계 구간에 들어오면 그 화면이 죽습니다.
  - 중계 뒤 주소
    - 같은 주소
      &gt; - 중계 뒤에서는 모든 접속이 같은 주소로 보입니다.
      &gt; - 프록시 헤더 해석이 빠지면 로그인이 실패합니다.
  - 중복 이름 핸들러
    - 조용한 덮어쓰기
      &gt; - 같은 이름의 핸들러가 둘이면 나중 것이 조용히 이깁니다.
  - 로그의 비밀값
    - 가림 누락
      &gt; - 쓰기 전에 가림 처리가 빠지면 로그에 비밀값이 남습니다.
- 한계
  - 서버만 알던 값
    - 밸런스
      &gt; - 밸런스 값은 클라이언트에 없습니다.
      &gt; - 전투 정산은 던전류만 구현했습니다.
  - 정답지 없는 구간
    - 게이트
      &gt; - 캡처가 없어서 대부분의 응답이 추론입니다.
      &gt;
      &gt; - 클라이언트 동작과 로그가 유일한 검증 수단입니다.
  - 구현 범위
    - 덮는 비율
      &gt; - 서버 호출의 약 48.5%에 핸들러나 선언된 무응답이 있습니다.
      &gt; - 기능의 48.5%라는 뜻은 아닙니다.
  - 화면으로 확인하지 못한 것
    - 정식 결말
      &gt; - 정식 결말은 하나도 보지 못했습니다(분석 기록 E5, 1507행).
  - 서명 검증
    - 실효성 없음
      &gt; - 로그인 서명은 검증을 계산하지만 결과와 무관하게 통과시킵니다.
      &gt; - 검증 효과는 없습니다(분석 기록 B, 587~589행).
  - 문서 불일치
    - 서버 시계 구간
      &gt; - 일부 문서는 30주, 코드는 26주입니다.
      &gt; - 30주는 이전 값입니다.
    - 낡은 문구
      &gt; - 갱신되지 않은 낡은 안내 문구가 일부 남아 있습니다.
  - 증거 파일
    - 스크린샷
      &gt; - 스크린샷은 저장소에 올리지 않았고 목록만 남아 있습니다.
- 앱 안 서버의 제약
  - 기기 조건
    - 조건
      &gt; - 64비트와 API 24 이상, VPN 허용이 필요합니다.
      &gt; - 다른 VPN과 함께 쓸 수 없습니다.
  - 빌드 시점
    - 빌드와 서버
      &gt; - 기기에 올린 빌드가 최신 서버 수정을 항상 담지는 않습니다.
</textarea>

            });

        S.savedFold = null;
        S.savedSib = null;
        return true;
    }

    var searchTimer = 0;
    function scheduleSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, 140);
    }

    function updateCount() {
        var q = S.query.trim();
        if (!S.searchActive) {
            countEl.textContent = "";
        } else if (S.matches.length) {
            countEl.textContent = S.active + 1 + "/" + S.matches.length;
        } else {
            countEl.textContent = T.noResult;
        }
        searchField.classList.toggle("mme-has-results", S.searchActive);
        prevBtn.disabled = nextBtn.disabled = S.matches.length < 2;
        clearBtn.style.visibility = q || S.todoOnly ? "visible" : "hidden";
    }

    async function runSearch() {
        var token = ++S.searchToken;
        var q = norm(S.query.trim());
        S.searchActive = !!q || S.todoOnly;
        if (!S.searchActive) {
            await clearSearchState();
            return;
        }
        if (!S.savedFold) {
            S.savedFold = snapshotFold();
            S.savedSib = snapshotSiblings();
        }
        var matches = [];
        walk(root, function (n) {
            if (matchesNode(n, q)) matches.push(n);
        });
        var anc = new Set();
        matches.forEach(function (n) {
            ancestors(n).forEach(function (a) {
                anc.add(a);
            });
        });
        S.matches = matches;
        S.matchSet = new Set(matches);
        S.ancSet = anc;
        var changed = false;
        matches.forEach(function (n) {
            if (revealSync(n)) changed = true;
        });
        S.active = matches.length ? 0 : -1;
        if (changed) await mm.renderData();
        if (token !== S.searchToken) return;
        paintClasses();
        updateCount();
        announce(
            matches.length ? T.resultsAnnounce(matches.length) : T.noResult
        );
        if (matches.length) gotoActive();
    }

    function panelPad() {
        if (!panelEl.classList.contains("mme-open")) return {};
        var r = panelEl.getBoundingClientRect();
        return window.innerWidth <= 640
            ? { bottom: r.height + 16 }
            : { right: r.width + 16 };
    }

    function gotoActive() {
        var n = S.matches[S.active];
        if (!n) return;
        S.focus = n;
        decorate();
        updateCount();
        mm.centerNode(n, panelPad());
    }
    function stepMatch(dir) {
        if (!S.matches.length) return;
        S.active = (S.active + dir + S.matches.length) % S.matches.length;
        gotoActive();
    }

    async function clearSearchState() {
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = false;
        var restored = restoreFold();
        updateCount();
        if (restored) await mm.renderData();
        else paintClasses();
    }
    function clearSearchUi() {
        input.value = "";
        S.query = "";
        S.todoOnly = false;
        todoItem.el.setAttribute("aria-checked", "false");
        S.searchToken++;
        clearSearchState();
        searchWrap.classList.remove("mme-open");
    }

    input.addEventListener("input", function () {
        S.query = input.value;
        scheduleSearch();
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            clearTimeout(searchTimer);
            if (
                S.searchToken &&
                S.matches.length &&
                norm(input.value.trim()) === norm(S.query.trim()) &&
                S.searchActive
            ) {
                stepMatch(e.shiftKey ? -1 : 1);
            } else {
                S.query = input.value;
                runSearch();
            }
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            stepMatch(1);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            stepMatch(-1);
        } else if (e.key === "Escape") {
            e.stopPropagation();
            clearSearchUi();
            input.blur();
            focusNode(nearestShown(S.focus));
        }
    });
    input.addEventListener("blur", function () {
        if (!input.value && window.innerWidth <= 640 && !S.todoOnly) {
            searchWrap.classList.remove("mme-open");
        }
    });

    /* ------------------------------------------------------------------ */
    /* Level menu                                                          */
    /* ------------------------------------------------------------------ */

    async function structuralChange() {
        S.savedFold = null;
        S.savedSib = null;
        S.searchToken++;
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = !!(S.query.trim() || S.todoOnly);
        await mm.renderData();
        await mm.fit();
        if (S.searchActive) runSearch();
        else updateCount();
    }
    function setLevel(level) {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, n.state.depth >= level + 1 ? 1 : 0);
        });
        structuralChange();
    }
    function expandAll() {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, 0);
        });
        groups.forEach(function (g, p) {
            setSiblingsExpanded(p, true);
        });
        structuralChange();
    }

    var todoItem = {
        label: T.todoOnly,
        checkbox: true,
        run: function (b) {
            S.todoOnly = !S.todoOnly;
            b.setAttribute("aria-checked", S.todoOnly ? "true" : "false");
            runSearch();
        }
    };
    var levelItems = [1, 2, 3, 4].map(function (n) {
        return {
            label: T.levelItem(n),
            run: function () {
                setLevel(n);
            }
        };
    });
    levelItems.push({ label: T.expandAll, run: expandAll });
    if (cfg.hasTasks) {
        levelItems.push("-");
        levelItems.push(todoItem);
    }
    var levelDd = dropdown("layers", T.level, levelItems);

    var exportDd = dropdown("download", T.exportLabel, [
        {
            label: T.exportPng,
            run: function () {
                exportAs("png");
            }
        },
        {
            label: T.exportJpg,
            run: function () {
                exportAs("jpg");
            }
        },
        {
            label: T.exportSvg,
            run: function () {
                exportAs("svg");
            }
        },
        "-",
        {
            label: T.copyMd,
            run: function () {
                exportAs("copy");
            }
        }
    ]);
    function exportAs(kind) {
        var api = window.mmExport;
        if (api && api[kind]) api[kind]();
    }

    barEl.appendChild(searchWrap);
    barEl.appendChild(levelDd.el);
    barEl.appendChild(exportDd.el);
    // Menu is built before todoItem exists only if tasks are absent.
    if (!cfg.hasTasks) todoItem.el = h("span");

    /* Export hooks: strip transient visual state while an image is rendered. */
    window.mmeBeforeExport = function () {
        svgEl.classList.add("mme-exporting");
        cardEl.classList.remove("mme-show");
    };
    window.mmeAfterExport = function () {
        svgEl.classList.remove("mme-exporting");
    };

    /* ------------------------------------------------------------------ */
    /* Hover                                                               */
    /* ------------------------------------------------------------------ */

    function pathOf(n) {
        var s = new Set([n]);
        ancestors(n).forEach(function (a) {
            s.add(a);
        });
        if (!isFolded(n)) {
            (n.children || []).forEach(function (c) {
                s.add(c);
            });
        }
        return s;
    }

    function cardHtml(n) {
        var p = n.payload || {};
        var parts = [];
        function list(items, extra) {
            var li = items
                .slice(0, 5)
                .map(function (c) {
                    return "<li>" + esc(textOf(c)) + "</li>";
                })
                .join("");
            var more =
                items.length > 5
                    ? "<li>…" + esc(T.moreItems(items.length - 5)) + "</li>"
                    : "";
            return "<ul>" + li + more + "</ul>" + (extra || "");
        }
        if (p.less) return "";
        if (p.more) {
            var g = groups.get(parentOf.get(n));
            return (
                '<div class="mme-card-title">' +
                esc(textOf(n)) +
                "</div>" +
                list(g ? g.hidden : [])
            );
        }
        var needTitle = !!p.detail || isFolded(n);
        if (needTitle)
            parts.push(
                '<div class="mme-card-title">' + esc(textOf(n)) + "</div>"
            );
        if (p.detail)
            parts.push('<div class="mme-card-detail">' + p.detail + "</div>");
        if (isFolded(n)) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.childCount(realKids(n).length) + " · " + T.folded) +
                    "</div>" +
                    list(realKids(n))
            );
        }
        if (p.tasks) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.done + " " + p.tasks.done + "/" + p.tasks.total) +
                    "</div>"
            );
        }
        if (!parts.length) return "";
        if (p.detail)
            parts.push('<span class="mme-hint">' + esc(T.hint) + "</span>");
        return parts.join("");
    }

    function positionCard(n) {
        var g = gMap.get(n);
        if (!g) return;
        var fo = g.querySelector("foreignObject") || g;
        var r = fo.getBoundingClientRect();
        cardEl.style.left = "0px";
        cardEl.style.top = "0px";
        var cw = cardEl.offsetWidth;
        var ch = cardEl.offsetHeight;
        var left = Math.min(Math.max(8, r.left), window.innerWidth - cw - 8);
        var top = r.bottom + 8;
        if (top + ch > window.innerHeight - 8)
            top = Math.max(8, r.top - ch - 8);
        cardEl.style.left = left + "px";
        cardEl.style.top = top + "px";
    }
    function showCard(n) {
        var html = cardHtml(n);
        if (!html) {
            hideCard();
            return;
        }
        cardEl.innerHTML = html;
        var preview = cardEl.querySelector(".mme-card-detail");
        if (preview && preview.scrollHeight > preview.clientHeight + 1) {
            preview.classList.add("mme-clipped");
        }
        positionCard(n);
        cardEl.classList.add("mme-show");
    }
    function hideCard() {
        cardEl.classList.remove("mme-show");
    }
    var cardTimer = 0;
    function startHover(n, immediate) {
        S.hover = n;
        S.pathSet = pathOf(n);
        paintClasses();
        clearTimeout(cardTimer);
        cardTimer = setTimeout(
            function () {
                // The panel already shows the selected node's details.
                if (S.hover === n && S.selected !== n) showCard(n);
            },
            immediate ? 60 : 220
        );
    }
    function endHover() {
        S.hover = null;
        S.pathSet = null;
        clearTimeout(cardTimer);
        hideCard();
        paintClasses();
    }
    var noHover =
        window.matchMedia && window.matchMedia("(hover: none)").matches;
    svgEl.addEventListener("mouseover", function (e) {
        if (noHover || e.buttons) return;
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n === S.hover) return;
        if (!n || !n.state) endHover();
        else startHover(n, false);
    });
    svgEl.addEventListener("mouseleave", endHover);
    svgEl.addEventListener("mousedown", hideCard);
    svgEl.addEventListener("focusin", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n && n.state) {
            S.focus = n;
            startHover(n, true);
        }
    });
    svgEl.addEventListener("focusout", endHover);
    mm.zoom.on("start.mme", hideCard);

    /* ------------------------------------------------------------------ */
    /* Selection panel                                                     */
    /* ------------------------------------------------------------------ */

    function collectLinks(n) {
        var out = [];
        var seen = {};
        [n.content, n.payload && n.payload.detail].forEach(function (html) {
            if (!html) return;
            parseHtml(html)
                .querySelectorAll("a[href]")
                .forEach(function (a) {
                    var href = a.getAttribute("href");
                    if (!href || seen[href]) return;
                    seen[href] = 1;
                    out.push({
                        href: href,
                        text: (a.textContent || href).trim()
                    });
                });
        });
        return out;
    }

    function labelButton(n, extraHtml) {
        var b = h("button", { type: "button" });
        b.appendChild(h("span", { text: textOf(n) }));
        if (extraHtml) b.appendChild(h("small", { text: extraHtml }));
        b.addEventListener("click", function () {
            selectNode(n, { center: true });
        });
        return b;
    }

    function renderPanel(n) {
        var p = n.payload || {};
        panelEl.textContent = "";
        var chain = ancestors(n).reverse();
        var crumbs = h("ol", { class: "mme-crumbs", "aria-label": "path" });
        chain.forEach(function (a) {
            var li = h("li");
            li.appendChild(labelButton(a));
            crumbs.appendChild(li);
        });
        var closeBtn = iconButton("close", T.close, "", function () {
            deselect(true);
        });
        panelEl.appendChild(
            h("div", { class: "mme-panel-head" }, [crumbs, closeBtn])
        );

        var body = h("div", { class: "mme-panel-body" });
        body.appendChild(
            h("div", { class: "mme-panel-title", html: titleHtml(n) })
        );

        if (p.tasks) {
            var pct = Math.round((p.tasks.done / p.tasks.total) * 100);
            body.appendChild(h("h3", { text: T.progress }));
            body.appendChild(
                h("div", { class: "mme-progress-line" }, [
                    h("i", { style: "--p:" + pct + "%" }),
                    h("span", { text: p.tasks.done + "/" + p.tasks.total })
                ])
            );
        }
        if (p.detail) {
            body.appendChild(h("h3", { text: T.detail }));
            body.appendChild(h("div", { class: "mme-detail", html: p.detail }));
        }
        if (hasKids(n)) {
            var kids = realKids(n);
            body.appendChild(
                h("h3", { text: T.children + " (" + kids.length + ")" })
            );
            var ul = h("ul", { class: "mme-list" });
            kids.forEach(function (c) {
                var li = h("li");
                var extra =
                    hasKids(c) && c.payload && c.payload.count
                        ? "+" + c.payload.count
                        : "";
                li.appendChild(labelButton(c, extra));
                ul.appendChild(li);
            });
            body.appendChild(ul);
        }
        var links = collectLinks(n);
        if (links.length) {
            body.appendChild(h("h3", { text: T.links }));
            var lul = h("ul", { class: "mme-list" });
            links.forEach(function (l) {
                lul.appendChild(
                    h("li", null, [
                        h("a", {
                            href: l.href,
                            target: "_blank",
                            rel: "noopener noreferrer",
                            text: l.text
                        })
                    ])
                );
            });
            body.appendChild(lul);
        }

        var actions = h("div", { class: "mme-actions" });
        if (hasKids(n)) {
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: isFolded(n) ? T.expand : T.collapse,
                    onclick: function () {
                        mm.toggleNode(n, false).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: T.expandBelow,
                    onclick: function () {
                        walk(n, function (x) {
                            if (hasKids(x)) setFold(x, 0);
                        });
                        mm.renderData(n).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
        }
        actions.appendChild(
            h("button", {
                type: "button",
                class: "mme-btn",
                text: T.copyText,
                onclick: function () {
                    copyText(textOf(n));
                }
            })
        );
        body.appendChild(actions);
        panelEl.appendChild(body);
        panelEl.setAttribute("aria-label", T.panelLabel + ": " + textOf(n));
    }

    function copyText(text) {
        var done = function () {
            window.mmeToast(T.copied);
        };
        var fail = function () {
            window.mmeToast(T.copyFailed);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fail);
        } else fail();
    }

    async function reveal(n) {
        if (revealSync(n)) await mm.renderData();
    }

    // Expands/collapses the hidden siblings of a long child list. The clicked
    // button is swapped for its counterpart, so focus is handed over explicitly.
    async function toggleSiblings(p, keyboard) {
        var g = groups.get(p);
        if (!g) return;
        var expanding = !g.expanded;
        setSiblingsExpanded(p, expanding);
        await mm.renderData(p);
        var target = expanding ? g.hidden[0] : g.more;
        if (keyboard) await focusNode(target);
        else {
            S.focus = target;
            decorate();
        }
        announce(textOf(expanding ? g.less : g.more));
    }

    async function selectNode(n, opts) {
        opts = opts || {};
        if (isSentinel(n)) {
            await toggleSiblings(parentOf.get(n), opts.keyboard);
            return;
        }
        await reveal(n);
        S.selected = n;
        S.focus = n;
        // The panel shows the details now; a lingering hover card would repeat them.
        clearTimeout(cardTimer);
        hideCard();
        renderPanel(n);
        panelEl.classList.add("mme-open");
        doc.body.classList.add("mme-panel-open");
        await mm.setHighlight(n);
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
        if (opts.keyboard) panelEl.focus({ preventScroll: true });
        announce(T.panelLabel + ": " + textOf(n));
    }

    function deselect(refocus) {
        var had = S.selected;
        S.selected = null;
        panelEl.classList.remove("mme-open");
        doc.body.classList.remove("mme-panel-open");
        mm.setHighlight(null);
        if (refocus && had) focusNode(had);
    }

    /* ------------------------------------------------------------------ */
    /* Lightbox                                                            */
    /* ------------------------------------------------------------------ */

    function openLightbox(img) {
        var cap = "";
        var fig = img.closest && img.closest("figure");
        if (fig && fig.querySelector("figcaption"))
            cap = fig.querySelector("figcaption").textContent;
        else cap = img.getAttribute("alt") || "";
        lightbox.textContent = "";
        lightbox.appendChild(
            h("img", { src: img.currentSrc || img.src, alt: cap })
        );
        if (cap) lightbox.appendChild(h("p", { text: cap }));
        lightbox.classList.add("mme-open");
        lightbox.setAttribute("tabindex", "-1");
        lightbox.focus();
    }
    function closeLightbox() {
        lightbox.classList.remove("mme-open");
    }
    lightbox.addEventListener("click", closeLightbox);
    doc.addEventListener("click", function (e) {
        var img = e.target;
        if (img && img.tagName === "IMG" && panelEl.contains(img))
            openLightbox(img);
    });

    /* ------------------------------------------------------------------ */
    /* Pointer interaction on the map                                      */
    /* ------------------------------------------------------------------ */

    var downPos = null;
    svgEl.addEventListener("pointerdown", function (e) {
        downPos = { x: e.clientX, y: e.clientY };
    });
    var coarse =
        window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

    function nearestCircle(x, y, radius) {
        var best = null;
        var bestD = radius;
        svgEl.querySelectorAll("g.markmap-node > circle").forEach(function (c) {
            var r = c.getBoundingClientRect();
            var dx = r.left + r.width / 2 - x;
            var dy = r.top + r.height / 2 - y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d <= bestD) {
                best = c;
                bestD = d;
            }
        });
        return best;
    }

    svgEl.addEventListener("click", function (e) {
        var t = e.target;
        if (
            downPos &&
            Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5
        )
            return;
        if (t.closest && t.closest("a")) return;
        if (t.tagName === "IMG") {
            openLightbox(t);
            return;
        }
        if (t.tagName === "circle") return; // markmap toggles on its own handler
        var c = nearestCircle(e.clientX, e.clientY, coarse ? 22 : 10);
        if (c && c.__data__) {
            mm.toggleNode(c.__data__, e.ctrlKey || e.metaKey);
            return;
        }
        var g = t.closest && t.closest("g.markmap-node");
        if (g && g.__data__ && t.closest("foreignObject")) {
            selectNode(g.__data__, {}); // sibling-group buttons toggle instead
        } else if (!g && S.selected) {
            deselect(false);
        }
    });

    /* ------------------------------------------------------------------ */
    /* Keyboard tree navigation                                            */
    /* ------------------------------------------------------------------ */

    function visibleList() {
        var out = [];
        (function rec(n) {
            out.push(n);
            if (!isFolded(n)) (n.children || []).forEach(rec);
        })(root);
        return out;
    }

    async function focusNode(n) {
        if (!n) return;
        if (!isShown(n)) await reveal(n);
        S.focus = n;
        decorate();
        var g = gMap.get(n);
        if (g) g.focus({ preventScroll: true });
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
    }

    svgEl.addEventListener("keydown", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (!n || !n.state || e.altKey || e.ctrlKey || e.metaKey) return;
        var list = visibleList();
        var i = list.indexOf(n);
        var handled = true;
        switch (e.key) {
            case "ArrowDown":
                focusNode(list[Math.min(list.length - 1, i + 1)]);
                break;
            case "ArrowUp":
                focusNode(list[Math.max(0, i - 1)]);
                break;
            case "Home":
                focusNode(list[0]);
                break;
            case "End":
                focusNode(list[list.length - 1]);
                break;
            case "ArrowRight":
                if (hasKids(n) && isFolded(n)) mm.toggleNode(n, false);
                else if (hasKids(n)) focusNode(n.children[0]);
                break;
            case "ArrowLeft":
                if (hasKids(n) && !isFolded(n)) mm.toggleNode(n, false);
                else if (parentOf.get(n)) focusNode(parentOf.get(n));
                break;
            case "Enter":
                selectNode(n, { keyboard: true });
                break;
            case " ":
                if (isSentinel(n)) toggleSiblings(parentOf.get(n), true);
                else if (hasKids(n)) mm.toggleNode(n, e.shiftKey);
                break;
            default:
                handled = false;
        }
        if (handled) e.preventDefault();
    });

    /* ------------------------------------------------------------------ */
    /* Global shortcuts                                                    */
    /* ------------------------------------------------------------------ */

    function typing(el) {
        return (
            el &&
            (el.tagName === "INPUT" ||
                el.tagName === "TEXTAREA" ||
                el.isContentEditable)
        );
    }
    doc.addEventListener("keydown", function (e) {
        if (
            (e.key === "/" && !typing(e.target) && !e.ctrlKey && !e.metaKey) ||
            ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")
        ) {
            e.preventDefault();
            searchWrap.classList.add("mme-open");
            input.focus();
            input.select();
            return;
        }
        if (e.key !== "Escape") return;
        if (lightbox.classList.contains("mme-open")) {
            closeLightbox();
        } else if (
            openMenus.some(function (m) {
                return m.menu.classList.contains("mme-open");
            })
        ) {
            closeMenus();
        } else if (S.searchActive || input.value) {
            clearSearchUi();
        } else if (S.selected) {
            deselect(true);
        } else {
            endHover();
        }
    });

    /* ------------------------------------------------------------------ */
    /* Toolbar localisation (markmap-toolbar)                              */
    /* ------------------------------------------------------------------ */

    function enhanceZoomBar() {
        var bar = doc.querySelector(".mm-toolbar");
        if (!bar) return false;
        bar.classList.add("mme-ui", "mme-zoombar");
        bar.querySelectorAll(".mm-toolbar-item").forEach(function (item) {
            var title = item.getAttribute("title") || "";
            var local = T.zoomTitles[title] || title;
            item.setAttribute("title", local);
            item.setAttribute("role", "button");
            item.setAttribute("aria-label", local);
            item.setAttribute("tabindex", "0");
            item.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    item.click();
                }
            });
        });
        return true;
    }
    var zoomTries = 0;
    (function waitZoomBar() {
        if (enhanceZoomBar() || ++zoomTries > 40) return;
        setTimeout(waitZoomBar, 100);
    })();

    /* ------------------------------------------------------------------ */
    /* Boot                                                                */
    /* ------------------------------------------------------------------ */

    // Small screens: start with the first levels only so text stays readable.
    if (window.innerWidth <= 640 && cfg.mobileLevel) {
        walk(root, function (n) {
            if (!hasKids(n)) return;
            setFold(n, n.state.depth >= cfg.mobileLevel + 1 ? 1 : 0);
        });
    }

    updateCount();
    mm.renderData();
})();
</script>
  
</body>
</html>
