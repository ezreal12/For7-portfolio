# 복원 서버 시스템 구조

## 이 지도를 읽는 법
- 이 지도의 목적: 설계를 이해하는 것
  &gt; - 이 프로젝트의 서버 소스는 비공개라서 파일 이름, 명령, 함수 이름은 적지 않았습니다.
  &gt; - 대신 구성 요소가 무엇을 받아 무엇을 내놓는지, 어디서 어떤 일이 어긋나는지를 개념과 판단 기준으로 설명합니다.
  &gt; - 실제 작업은 이 개념에 대응하는 비공개 저장소의 모듈에서 합니다.
  &gt; - 실행에는 수정한 클라이언트 빌드를 썼고, 수정 내용은 이 지도에서 다루지 않습니다.
- 읽는 순서
  &gt; 1. 「이 시스템은 무엇인가」로 경계를 잡는다.
  &gt; 2. 「용어」를 훑어 낯선 말을 정리한다.
  &gt; 3. 「처음 알아야 할 일곱 가지」와 「지켜야 할 약속」으로 사고방식과 금기를 잡는다.
  &gt; 4. 「흐름」에서 요청이 지나는 길을 따라간다.
  &gt; 5. 증상이 있으면 「증상에서 원인으로」로 간다.
  &gt; 6. 마지막에 「알려진 함정과 한계」로 이 지도가 보여 주지 못하는 곳을 확인한다.
- 근거 표기를 읽는 법
  &gt; | 표기 | 뜻 |
  &gt; |---|---|
  &gt; | 표 | 클라이언트의 데이터 표에서 나온 값 |
  &gt; | 클라이언트 소스 | 복원한 클라이언트 소스에서 읽은 값 |
  &gt; | 추론 | 근거가 간접적인 값 |
  &gt; | 복원 서버의 결정 | 원본을 알 수 없어 이 서버에서 정한 값 |
  &gt;
  &gt; 본문에서는 값 옆에 이 표기를 붙입니다. 표기가 없는 값은 구조 설명입니다.

## 이 시스템은 무엇인가
- 하는 일
  &gt; - 서비스가 끝난 모바일 게임의 서버를 대신해, 클라이언트가 부팅부터 도시와 각종 콘텐츠까지 진행하도록 응답합니다.
  &gt; - 서버는 Python으로 짜여 있고 클라이언트 스크립트는 Python 2.7 계열입니다.
  &gt; - 원본 서버의 소스가 없고 정답으로 쓸 캡처가 로그인 구간 HTTP뿐입니다.
  &gt; - 그래서 서버가 돌려줄 값은 대부분 클라이언트 코드와 표에서 거꾸로 알아냈습니다.
- 게임은 이런 것
  &gt; - 도시를 짓고 영웅을 키우는 모바일 게임입니다.
  &gt; - 이야기는 7일을 되풀이하다 엔딩을 맞고 다음 회차로 이어집니다.
  &gt; - 영웅 육성, 던전류 도전 콘텐츠, 한정 이벤트가 붙어 있습니다.
- 경계
  &gt; | 안 | 밖 |
  &gt; |---|---|
  &gt; | 복원 서버(HTTP 서비스, 게이트 서버, 규칙, 상태 저장) | 클라이언트 앱과 게임 데이터 |
  &gt; | 복원 도구와 검증 도구 | 원 서비스의 서버 |
  &gt; | 접속 보조 앱과 앱 안 서버 | 온라인 전투 서버(없음) |
- 사용자 입장의 흐름
  &gt; 1. 게임을 켜면 업데이트 확인과 로그인이 HTTP로 처리된다.
  &gt; 2. 서버 목록이 알려 준 주소로 게이트 서버에 접속한다.
  &gt; 3. 도시 화면이 열리고 기능을 쓸 때마다 RPC(이름으로 서로의 함수를 부르는 호출)가 오간다.
  &gt; 4. 진행 상태는 계정마다 파일에 저장되어 서버를 다시 띄워도 남는다.
- 실행 모양 두 가지
  &gt; | 모양 | 설명 |
  &gt; |---|---|
  &gt; | PC 서버 | Linux에서 nginx, dnsmasq, systemd와 함께 운영 |
  &gt; | 앱 안 서버 | 기기 안의 별도 프로세스, PC가 필요 없음. 접속 보조 앱의 접속 화면이 서버를 깨우고 상태를 확인함 |

## 용어
- 게이트 서버
  &gt; - 로그인 뒤 게임 통신을 받는 원시 TCP 서버입니다.
  &gt; - HTTP 서비스가 알려 준 주소로 클라이언트가 접속합니다.
- 엔티티와 아바타
  &gt; - 엔티티는 서버와 클라이언트가 함께 들고 있는 객체이고, 서버가 생성 메시지를 보내면 클라이언트가 만듭니다.
  &gt; - 계정 엔티티와 아바타 엔티티가 있습니다. 아바타는 접속한 계정 하나의 상태와 RPC 처리를 맡는 서버 쪽 계층의 이름이기도 합니다.
- 스냅샷과 푸시
  &gt; - 스냅샷은 로그인 때 한꺼번에 보내는 계정 상태 묶음이고 기능 모듈이 조각을 등록합니다.
  &gt; - 푸시는 서버가 먼저 클라이언트에 보내는 변경 알림입니다.
- RPC, 서버 호출, 서버발 호출
  &gt; - RPC는 이름으로 서로의 함수를 부르는 호출이고, 호출 이름은 클라이언트 소스에서 뽑은 목록이 기준입니다.
  &gt; - 서버 호출은 클라이언트가 서버에 거는 호출로, 핸들러가 받습니다.
  &gt; - 서버발 호출은 서버가 클라이언트에 보내는 호출(푸시 포함)입니다.
- 핸들러와 멤버
  &gt; - 핸들러는 서버 호출 하나를 받는 함수입니다.
  &gt; - 멤버는 아바타에 붙는 기능 단위입니다. 호출을 받아 응답과 푸시의 순서를 정하는 쪽(RPC 멤버)과 계정 상태만 바꾸는 규칙 모듈이 짝을 이룹니다.
- 신뢰 전송 번호와 콜백
  &gt; - 일부 호출은 번호를 붙여 보내고 응답이 올 때까지 화면을 잠급니다.
  &gt; - 콜백은 클라이언트가 호출할 때 등록해 두는 결과 처리 함수입니다.
  &gt; - 응답이 없으면 잠금이 남습니다.
- 생존 신호와 플레이 전환
  &gt; - 생존 신호는 클라이언트가 5초마다 보내는 접속 확인입니다.
  &gt; - 플레이 전환은 로그인 단계에서 플레이 단계로 넘어갔음을 서버가 알리는 메시지입니다.
- 정답지
  &gt; - 서버 응답이 맞는지 판정하는 기준 자료입니다.
  &gt; - 캡처가 있으면 캡처, 없으면 클라이언트 소스입니다. 서버 로그는 정답지가 아닙니다.
- 서버 시계와 되풀이 번호
  &gt; - 서버 시계는 한정 이벤트를 다시 열기 위한 서버 쪽 날짜입니다.
  &gt; - 되풀이 번호는 서비스 말기 구간을 한 바퀴 돌 때마다 하나씩 늘어나는 번호이고, 이벤트 모듈이 이 번호가 바뀌면 자기 상태를 비웁니다.
- 스텁
  &gt; - 클라이언트 스텁은 클라이언트 소스에서 복원한 호출 정의(이름과 인자)입니다.
  &gt; - 서버가 캡처에 없는 경로에 임시로 보내는 응답도 스텁이라고 부르는데, 문맥으로 구분합니다.
- 조립기와 전투 훅
  &gt; - 조립기는 스냅샷, 갱신 푸시, 전투가 같은 방식으로 영웅 데이터를 만들게 하는 한 곳의 코드입니다.
  &gt; - 전투 훅은 전투 한 판의 단계마다 기능이 끼어드는 지점입니다.
- 회차, 순찰, 정신력, 던전류
  &gt; - 회차는 이야기를 엔딩까지 한 번 마친 한 판입니다.
  &gt; - 순찰은 도시 안 콘텐츠의 하나이고, 정신력은 도전 콘텐츠에서 쓰는 소모 자원입니다.
  &gt; - 던전류는 정신력을 쓰는 여러 도전 콘텐츠의 묶음입니다.
- 정적 집계
  &gt; - 코드를 실행하지 않고 파일을 읽어서 센 값입니다.
  &gt; - 테스트를 돌려서 얻은 값과 구분합니다.
- 시험 계정과 운영자 도구
  &gt; - 검증을 위한 계정과 상태 조작 도구입니다.
  &gt; - 원본 운영 기능이 아닙니다.
- REA와 Evidence ID
  &gt; - REA는 네이티브 분석, HTTP 캡처 판독, 기기 조작 도구를 제공하는 역공학 도구 모음입니다.
  &gt; - Evidence ID는 REA가 도구 결과에 붙이는 근거 번호입니다.

## 처음 알아야 할 일곱 가지
- 클라이언트가 읽는 것이 계약이다
  &gt; - 서버 코드의 기준은 문서가 아니라 클라이언트가 읽는 필드, 타입, 순서입니다.
  &gt; - 복원한 클라이언트 소스와 RPC 목록에서 확인합니다.
- 정답지에는 순서가 있다
  &gt; 1. 2021 패킷 캡처가 가장 강한 근거다.
  &gt; 2. 그다음이 복원한 클라이언트 소스와 표다.
  &gt; 3. 둘 다 없으면 추론으로 표시한다.
  &gt;
  &gt; 서버 로그는 정답지가 아니라 클라이언트가 응답에 어떻게 반응했는지 보는 관찰 수단입니다.
- 서버 쪽에서 해결하는 것을 우선한다
  &gt; - 클라이언트는 필요한 최소한으로만 바꿨습니다.
  &gt; - 바꾼 경우는 별도 문서로 근거를 남기고, 이 지도는 그 내용을 다루지 않습니다.
- 호출 이름이 곧 핸들러 이름이다
  &gt; - 핸들러에 선언적 표기를 붙이면 같은 이름의 호출에 연결됩니다.
  &gt; - 기존 멤버에 호출을 더할 때는 따로 고칠 등록표가 없고, 새 멤버를 만들면 멤버 목록에 등록합니다.
- 상태는 계정마다 한 덩어리다
  &gt; - 계정당 JSON 하나에 하위 시스템별 사전이 들어 있습니다.
  &gt; - 로그인 때 스냅샷으로 한 번 보내고 이후 변경은 푸시로 알립니다.
- 추론은 추론이라고 적는다
  &gt; - 원본 서버가 없어서 추론한 값이 많습니다.
  &gt; - 코드 주석이 근거 등급(표, 클라이언트 소스, 추론, 복원 서버의 결정)을 구분합니다.
- 서버 시계가 이벤트를 연다
  &gt; - 한정 소환과 이벤트는 서버가 알려 주는 날짜로 열리고 닫힙니다.
  &gt; - 서비스 말기 구간을 되풀이하며, 구간은 코드에서 26주(182일)입니다. 복원 서버의 결정.

## 구성 지도
- 이름 해석과 중계
  - 하는 일
    &gt; | 입력 | 출력 |
    &gt; |---|---|
    &gt; | 클라이언트의 DNS 질의, 웹·게이트 접속 | HTTP 서비스나 게이트 서버로 전달된 접속 |
  - 접속을 나누는 기준
    &gt; 1. TLS 서버명이 있으면 TLS를 풀어 HTTP 서비스로 보낸다.
    &gt; 2. 서버명이 없으면 원시 TCP로 보고 게이트 서버로 보낸다.
    &gt;
    &gt; 443 포트 하나로 두 종류 통신을 받는 방식입니다.
  - 실제 기기 주소 보존
    &gt; - 중계 뒤에서는 모든 접속이 같은 주소로 보입니다.
    &gt; - 중계가 붙이는 프록시 프로토콜 헤더를 게이트 서버가 해석해야 기기별 주소를 알 수 있습니다.
- HTTP 서비스
  - 맡은 일
    &gt; - 설정, 업데이트 확인, 서버 목록, 로그인, 결제, 텔레메트리에 답합니다.
    &gt; - 부팅 흐름을 22단계로 재현하고, 따로 HTTP API 40여 개를 다룹니다.
    &gt; - 캡처를 정리한 게임 관련 22묶음과는 다른 집계입니다.
    &gt; - 테스트에서는 패치 다운로드와 게이트 두 단계가 건너뛰어집니다.
  - 캡처 응답 재현
    &gt; - 캡처된 응답을 바이트와 Content-Type까지 같게 돌려줍니다.
    &gt; - 길이와 SHA-256을 테스트로 묶어 두었습니다.
  - 알 수 없는 요청
    &gt; - 캡처에 없는 경로는 임시 응답(스텁)으로 답하고 경고 로그를 남깁니다.
    &gt; - 클라이언트가 잠기지 않으면서 새 요청을 발견할 수 있습니다.
  - 로그인 서명
    &gt; - 클라이언트가 로그인 요청에 붙이는 서명을 서버가 검증합니다.
    &gt; - 게스트 로그인 같은 일부는 불일치해도 경고만 남기고 통과시킵니다. 복원 서버의 결정.
- 게이트 서버
  - 맡은 일
    &gt; | 입력 | 출력 |
    &gt; |---|---|
    &gt; | 길이 접두 프레임으로 감싼 protobuf 메시지 | 엔티티 생성 메시지, RPC 응답, 생존 신호 응답 |
    &gt;
    &gt; 핸드셰이크 뒤에는 스트리밍 압축이 걸립니다. 위 표는 압축을 푼 뒤의 메시지이고, 압축 이외의 선로 처리는 이 지도에서 다루지 않습니다. asyncio 기반 원시 TCP 서버입니다.
  - 핸드셰이크 순서
    &gt; 1. 접속 요청에 접속 응답
    &gt; 2. 계정 엔티티 생성
    &gt; 3. 로그인 정보를 받으면 그 계정의 아바타 엔티티 생성
    &gt; 4. 플레이 전환 알림
  - 접속 안정화
    &gt; - 예외를 접속 단위로 가둡니다.
    &gt; - 중복 로그인을 정리합니다.
    &gt; - 토큰 대조는 엄격, 기록만, 끔의 세 모드입니다. 복원 서버의 결정.
    &gt; - 종료 때 접속을 먼저 닫아서 종료가 90초에서 1초로 줄었습니다.
  - 한계
    &gt; - 게이트 구간에는 정답지가 없습니다.
    &gt; - 응답의 순서와 값 대부분이 추론입니다.
- 아바타 계층
  - 맡은 일
    &gt; | 입력 | 출력 |
    &gt; |---|---|
    &gt; | 클라이언트 RPC | 응답과 서버 푸시 |
    &gt;
    &gt; 접속한 계정 하나의 상태와 RPC 처리를 맡습니다.
  - 핸들러가 모이는 방식
    &gt; 1. 핸들러에 선언적 표기를 붙인다.
    &gt; 2. 아바타가 만들어질 때 멤버를 훑어 모은다.
    &gt; 3. 같은 이름이 둘이면 훑는 순서에서 뒤에 오는 것이 이긴다.
    &gt;
    &gt; 공용 호출을 기능별로 가로채는 데 이 규칙을 일부러 씁니다. 반대로 같은 이름의 핸들러를 실수로 만들면 조용히 덮어씁니다.
  - 미구현 호출
    &gt; - 핸들러가 없으면 로그만 남기고 빈 결과로 풀어서 클라이언트가 잠기지 않게 합니다.
    &gt; - 결과를 읽는 콜백은 풀지 않고 경고합니다. 빈 결과를 주면 클라이언트가 결과를 읽다가 깨지기 때문입니다.
    &gt; - 의도적으로 응답하지 않는 호출은 무응답으로 선언합니다.
  - 주기 처리
    &gt; - 생존 신호를 받을 때 각 멤버의 주기 처리를 부릅니다.
    &gt; - 시간에 따라 바뀌는 기능(이벤트, 휴식 등)이 여기서 갱신되므로 시간 진행이 5초 신호에 묶여 있습니다.
  - 화면 안의 시계
    &gt; - 일부 화면에서만 클라이언트 시각을 따로 맞추는 장치가 있습니다.
    &gt; - 그 화면에서 쓰는 호출이 호출 목록에서 빠지면 시계가 풀려 버립니다.
  - 규모
    &gt; | 항목 | 값 |
    &gt; |---|---|
    &gt; | 핸들러 | 584개 |
    &gt; | 의도적 무응답 | 63개 |
    &gt; | RPC 목록의 서버 호출(클라이언트가 서버에 거는 호출) | 1,334개 |
    &gt; | 덮는 비율 | 약 48.5%(정적 집계) |
- 게임 규칙 모듈
  - 공통 모양
    &gt; 1. 표(JSON)에서 규칙을 읽는다.
    &gt; 2. 계정 상태를 바꾼다.
    &gt; 3. 거절할 조건이면 사유를 돌려준다.
    &gt; 4. 클라이언트가 읽는 모양으로 변환한다.
    &gt; 5. 스냅샷 조각으로 내놓는다.
    &gt;
    &gt; 기능 모듈은 약 85개, 이벤트 규칙 모듈은 38종입니다.
  - 규칙과 전송의 분리
    &gt; - 규칙은 계정 상태만 바꾸고 클라이언트에 직접 말하지 않습니다.
    &gt; - 응답과 푸시의 순서는 RPC 멤버가 정합니다.
  - 영웅 데이터는 한 곳에서
    &gt; - 스냅샷, 갱신 푸시, 전투가 같은 조립기로 영웅 데이터를 만듭니다.
    &gt; - 같은 영웅이 화면마다 다른 값으로 보이는 일을 막습니다.
  - 기능 영역
    &gt; | 영역 | 내용 |
    &gt; |---|---|
    &gt; | 도시 | 건설, 순찰, 하루 넘김 |
    &gt; | 스토리 | 프롤로그, 7일 반복, 엔딩, 다음 회차 |
    &gt; | 영웅 | 육성, 장비, 집, 호감도 |
    &gt; | 던전류 | 정신력, 보상, 여러 도전 콘텐츠 |
    &gt; | 상점, 소환 | 구매, 소환, 충전 |
    &gt; | 이벤트 | 한정 소환과 활동 |
  - 이벤트 규칙
    &gt; - 이벤트 규칙 모듈 38종이 같은 골격을 따릅니다.
    &gt; - 원본 서버가 없어서 보상과 조건 값 상당수가 추론입니다.
    &gt; - 복원한 이벤트 약 33묶음(모듈과는 세는 단위가 다름) 중 약 28묶음은 화면으로 확인하지 못했습니다.
- 상태 저장
  - 계정 파일
    &gt; - 계정당 JSON이고 임시 파일에 쓴 뒤 교체합니다.
    &gt; - 깨진 파일은 따로 옮겨 둡니다.
  - 스냅샷 조립
    &gt; - 기능 모듈이 자기 조각을 등록하고 로그인 때 서버가 조각을 모아 스냅샷을 만듭니다.
    &gt; - 계정 데이터가 스냅샷 위에 값을 덧씌우는 통로도 있습니다.
  - 계정 DB
    &gt; - ID/PW 계정은 SQLite에 두고 비밀번호는 scrypt로 해시합니다. 복원 서버의 결정.
    &gt; - 8회 실패하면 60초 동안 잠급니다. 복원 서버의 결정.
- 표 데이터
  - 출처와 규모
    &gt; - 클라이언트 표를 복원 도구가 JSON으로 내보냅니다.
    &gt; - 서버용 JSON은 63개이고 원본 표 여러 개를 묶은 것입니다.
  - 읽는 방식
    &gt; - 표마다 한 번 읽어 캐시합니다.
    &gt; - 내보낼 때는 표를 실행하지 않고 구문 트리로만 읽습니다.
  - 추정으로 채운 구간
    &gt; - 원본이 아니라 추정으로 채운 표기가 따로 있습니다.
    &gt; - 문제 은행, 상점 뽑기, 보스 풀이 예입니다.
- 서버 시계
  - 변천
    &gt; | 단계 | 방식 |
    &gt; |---|---|
    &gt; | 처음 | 연도만 접은 시계 |
    &gt; | 다음 | 한국 벽시계를 UTC처럼 사용 |
    &gt; | 현재 | 서비스 말기 구간을 되풀이(복원 서버의 결정) |
  - 쓰임과 주의
    &gt; - 이벤트가 되풀이 번호로 자기 상태를 비웁니다.
    &gt; - 되풀이 구간은 코드에서 26주이고 일부 문서의 30주는 이전 값입니다.
  - 과거의 함정
    &gt; - 표에 이상한 행이 있는 기간을 피하려고 구간을 줄인 적이 있습니다.
    &gt; - 표의 모든 행이 서버 시계 구간 안에서 안전한지 확인해야 합니다.
- 전투
  - 오프라인 전투
    &gt; - 전투는 클라이언트가 계산하고 서버는 요청, 응답, 종료, 보상만 주고받습니다.
    &gt; - 원본의 전투 서버 규칙을 알 수 없어서 이렇게 했습니다.
  - 온라인 전투가 필요한 콘텐츠
    &gt; - 클라이언트가 직접 전투하게 돌려보냅니다.
    &gt; - 클라이언트를 더 수정하지 않아도 되는 대신 판마다 자동 전투 버튼을 눌러야 하는 콘텐츠가 있습니다.
  - 전투 훅 다섯 가지
    &gt; 1. 이 전투를 맡을 기능인지 판정
    &gt; 2. 거절 조건
    &gt; 3. 전투 준비
    &gt; 4. 보상
    &gt; 5. 종료 처리
  - 구현 정도
    &gt; - 던전류는 정산과 보상 지급까지 구현했습니다.
    &gt; - 행동 전투와 구역 전투의 보상, 회차 끝 보상, 사건 보상은 비어 있습니다.
    &gt; - 서버만 아는 밸런스 값은 클라이언트에서 확인되지 않습니다.
- 복원 도구
  - 하는 일
    &gt; 1. 클라이언트 스크립트를 읽을 수 있는 소스로 되돌린다.
    &gt; 2. 복원 결과를 검증한다.
    &gt; 3. RPC 목록과 데이터 표를 뽑는다.
    &gt;
    &gt; 클라이언트 스크립트 4,369개 중 4,365개가 소스로 복원됐습니다.
  - 검증
    &gt; - 복원이 틀리면 복원 소스 전체가 어긋나기 때문에 따로 검증하는 도구가 있습니다.
    &gt; - 검증을 거친 소스에서 RPC 목록과 표를 추출합니다.
  - 한계
    &gt; - 정규식이라 변수로 넘긴 호출 이름은 놓칩니다.
    &gt; - 디컴파일이 일부 구문을 틀리게 풀 수 있습니다.
    &gt; - 실물 입력이 없는 환경에서는 일부 테스트가 건너뛰어집니다.
- 검증 도구
  - 캡처 재생 대조기
    &gt; - 2021 캡처 요청을 서버에 재생해 응답을 같음, 일부 일치, 다름, 상태 차이로 판정합니다.
    &gt; - 캡처 세트마다 17~21묶음을 재생해 같음 12~16, 일부 일치 1, 다름 3~4, 상태 차이 1이었습니다.
    &gt; - 서버가 캡처 응답을 그대로 돌려주게 만들었으므로 독립 검증은 아닙니다.
  - 가짜 클라이언트
    &gt; - 서버발 호출(서버가 클라이언트에 보내는 모든 호출)을 복원한 스텁과 대조합니다.
    &gt; - 잘못된 키 이름을 잡아낸 사례가 있습니다.
  - 변환기
    &gt; - Burp 캡처를 HAR 1.2로 바꿉니다.
    &gt; - 게스트 로그인 세트의 본문 96건 SHA-256이 원본과 일치했습니다.
- 앱 안 서버
  - 서버 프로세스
    &gt; - 공식 CPython 3.14 Android 배포본을 JNI로 게임과 다른 프로세스에서 실행합니다.
    &gt; - 게임이 죽어도 서버가 살아 있게 하려는 것입니다.
  - 접속 경로
    &gt; 1. 앱 안 VPN이 DNS 질의만 받는 터널을 만든다.
    &gt; 2. 게임의 웹·게이트 접속을 서버의 일반 포트로 돌린다.
    &gt; 3. 서버가 HTTP, HTTPS, 게이트를 각자의 포트에서 직접 듣는다.
  - 기기용 웹 프레임워크
    &gt; - Starlette 위에 FastAPI와 같은 모양의 대체 패키지를 얹었습니다.
    &gt; - PC에서 같은 테스트를 진짜 FastAPI와 대체 패키지 양쪽으로 돌려 응답 119건을 비교했습니다.
  - 소켓 복구
    &gt; - VPN 장치가 사라지면 안드로이드가 듣는 소켓을 닫습니다.
    &gt; - 서버가 닫힌 소켓을 다시 열고 접속 화면이 단계적으로 재시도합니다.
  - 계정 데이터 화면
    &gt; - 업데이트로 진행 상태가 사라지지 않게 백업, 불러오기, 삭제 화면을 두었습니다.
- 운영자 도구
  &gt; - 시험용 계정과 상태 조작 도구입니다.
  &gt; - 원본 운영 기능이 아니라 시험 수단입니다.
- 로그 여섯 종류
  &gt; | 로그 | 무엇을 보나 |
  &gt; |---|---|
  &gt; | 서버 로그 | 요청이 왔는지, 어떻게 답했는지. 파일로 영구 기록 |
  &gt; | 중계 로그(nginx) | 중계에 접속이 도착했는지, 어느 쪽으로 보냈는지 |
  &gt; | 이름 해석 로그(dnsmasq) | 게임 도메인 질의가 왔는지, 복원 서버 주소로 답했는지 |
  &gt; | 클라이언트 엔진 로그 | 스크립트 예외(트레이스백), 상태 전이 경고 |
  &gt; | 패킷 캡처 | 와이어에서 실제로 오간 것. 상시 캡처 |
  &gt; | 기기 로그 | 기기의 logcat, 앱 안 서버와 접속 화면. 조각 파일, 총량 300MB, 비밀값 가리기 |

## 흐름
- 부팅부터 로그인까지
  &gt; 1. 클라이언트가 게임 도메인을 질의하고 복원 서버 주소를 받는다.
  &gt; 2. 설정, 업데이트 확인, 서버 목록을 HTTP 서비스에 요청한다.
  &gt; 3. 로그인 요청에 서명 검증을 거쳐 응답한다(게스트 로그인 같은 일부는 불일치해도 경고만).
  &gt; 4. 서버 목록이 알려 준 주소로 게이트 서버에 접속한다. 목록 응답에 실제 게이트 주소가 들어 있어야 합니다.
- 도시 진입
  &gt; 1. 접속 응답
  &gt; 2. 계정 엔티티
  &gt; 3. 로그인 정보 수신
  &gt; 4. 아바타 엔티티와 스냅샷
  &gt; 5. 플레이 전환
  &gt; 6. 상태 전환, 이벤트 조회, 생존 신호에 각각 응답
  &gt; 7. 클라이언트가 5초 간격으로 생존 신호를 보낸다.
- RPC 한 건 처리
  &gt; 1. 클라이언트가 RPC를 보낸다.
  &gt; 2. 아바타 계층이 이름으로 핸들러를 찾는다.
  &gt; 3. 핸들러가 규칙 모듈을 불러 계정 상태를 바꾼다.
  &gt; 4. 응답과 필요한 푸시를 보낸다.
  &gt; 5. 상태를 파일에 저장한다.
- 이벤트 한 건
  &gt; 1. 조건 갱신
  &gt; 2. 이벤트 조회
  &gt; 3. 시작
  &gt; 4. 진행
  &gt; 5. 완료와 종료
  &gt;
  &gt; 서버 시계가 한 바퀴 돌아 되풀이 번호가 바뀌면 이벤트 모듈이 자기 상태를 비웁니다.
- 전투 한 판
  &gt; 1. 클라이언트가 전투 요청을 보낸다.
  &gt; 2. 서버가 전투 데이터(영웅, 몬스터, 웨이브)로 응답한다.
  &gt; 3. 클라이언트가 전투를 계산한다.
  &gt; 4. 종료와 보상 요청이 온다.
  &gt; 5. 서버가 정산해 보상을 지급한다(던전류 기준).
- 하루 넘김
  &gt; 1. 상태 확인
  &gt; 2. 조건 갱신
  &gt; 3. 날짜 증가
  &gt; 4. 도시 데이터 재전송
  &gt; 5. 일일 정산 화면
- 엔딩과 다음 회차
  &gt; 1. 엔딩 CG를 추가한다.
  &gt; 2. 점수를 동기화한다.
  &gt; 3. 스토리 플래그를 갱신한다.
  &gt; 4. 회차 결과 화면
  &gt; 5. 엔딩에 따른 입장 요청
  &gt; 6. 회차 증가와 클라이언트 아바타 갱신
- 앱 안 서버 접속
  &gt; 1. 접속 화면이 서버 상태를 확인한다.
  &gt; 2. 앱 안 VPN이 켜진다.
  &gt; 3. 게임의 접속이 서버의 일반 포트로 간다.
  &gt; 4. 연결이 안 되면 접속 화면이 단계적으로 다시 시도한다.
- 규칙을 복원하는 흐름
  &gt; 1. 클라이언트 스크립트를 읽을 수 있는 소스로 복원한다.
  &gt; 2. RPC 목록과 데이터 표를 추출한다.
  &gt; 3. 클라이언트가 읽는 필드, 타입, 순서를 계약 문서로 정리한다.
  &gt; 4. 규칙을 구현하고 테스트한다.

## 지켜야 할 약속
- 캡처가 있는 응답은 바이트까지 같게
  &gt; - 길이와 해시를 테스트로 고정합니다.
  &gt; - 업데이트 확인 단계에서 멈추는 일을 막는 가장 직접적인 장치입니다.
- 결과를 읽는 콜백에는 반드시 결과로 답한다
  &gt; - 어떤 호출이 해당하는지는 RPC 목록의 호출마다 붙은 &quot;결과 필요&quot; 표시로 판별합니다. 18개 중 17개에 핸들러가 있습니다.
  &gt; - 핸들러가 없는 1개는 아직 구현하지 않았고, 그 호출이 일어나면 화면 잠금이 남아 약 15초 뒤 재접속합니다.
- 요청값을 되돌려 줘야 하는 호출이 있다
  &gt; - 상태 전환 같은 호출은 요청값을 그대로 되돌려야 합니다.
  &gt; - 그렇지 않으면 약 15초 뒤 접속이 끊깁니다.
- 생존 신호에는 즉시 답한다
  &gt; - 약 30초 안에 답이 없으면 클라이언트가 스스로 로그아웃합니다.
- 계정 엔티티를 먼저 보낸다
  &gt; - 클라이언트가 계정 엔티티를 받아야 상태가 로그인 단계로 넘어갑니다.
  &gt; - 순서가 틀리면 상태 전이 경로가 없다는 경고가 납니다.
- 클라이언트가 읽는 키는 모두 채운다
  &gt; - 빠지면 화면이 열리자마자 예외가 납니다.
  &gt; - 정수여야 할 값이 다른 타입이어도 같은 증상이 납니다.
- 새 기능은 자기 스냅샷 조각을 등록한다
  &gt; - 로그인 때 클라이언트가 그 값을 알아야 화면이 열립니다.
- 영웅 값은 한 조립기를 거친다
  &gt; - 스냅샷, 갱신, 전투가 서로 다른 값을 보지 않게 합니다.
- 서버 시계 구간 안의 표는 안전해야 한다
  &gt; - 표에 이상한 행이 있는 기간이 시계 구간에 들어오면 그 화면이 죽습니다.
  &gt; - 구간을 바꾸거나 표를 고칠 때마다 구간 안의 모든 행을 확인합니다.
- 같은 이름의 핸들러를 만들지 않는다
  &gt; - 같은 이름이 둘이면 나중 것이 조용히 이깁니다.
  &gt; - 새 핸들러를 만들기 전에 같은 이름이 있는지 확인합니다.
- 상태 파일은 통째로 교체한다
  &gt; - 임시 파일에 쓴 뒤 교체해서 쓰다가 끊겨도 반쯤 쓰인 파일이 남지 않게 합니다.

## 기능 하나가 만들어지는 과정
- 1. 클라이언트에서 계약을 뽑는다
  &gt; - 해당 화면이 읽는 필드, 타입, 순서를 복원 소스와 표에서 뽑습니다.
  &gt; - 근거 등급을 붙인 계약 문서로 정리합니다.
- 2. 표를 내보낸다
  &gt; - 내보내기 도구로 표를 JSON으로 만듭니다.
  &gt; - 다시 실행해 바이트가 같은지 확인합니다.
- 3. 규칙 모듈을 테스트부터 쓴다
  &gt; - 계정 상태만 바꾸는 규칙을 만들고 거절 조건을 먼저 정합니다.
  &gt; - 원본에서 알 수 없는 값은 추론이라고 주석에 적습니다.
- 4. RPC 멤버를 만든다
  &gt; - 규칙을 불러 응답과 푸시의 순서를 정합니다.
  &gt; - 결과를 읽는 콜백은 반드시 풀어 줍니다.
- 5. 스냅샷 조각을 등록한다
  &gt; - 로그인 때 보낼 값을 조각으로 내놓습니다.
  &gt; - 영웅 값은 공용 조립기를 씁니다.
- 6. 가짜 클라이언트로 대조한다
  &gt; - 서버발 호출이 복원 스텁과 맞는지 확인합니다.
  &gt; - 키 이름과 인자 개수를 잡습니다.
- 7. 전체 테스트를 돌린다
  &gt; - PC 구성과 기기 구성 모두에서 돌립니다.
  &gt; - 서버 시계를 고정한 테스트인지 확인합니다.
- 8. 에뮬레이터를 한 바퀴 돈다
  &gt; - 서버 로그에 오류가 없는지, 클라이언트 엔진 로그에 새 트레이스백이 없는지 확인합니다.
  &gt; - 화면 증거 번호를 남깁니다.
- 9. 기록한다
  &gt; - 분석 보고서와 작업 일지를 갱신합니다.
  &gt; - 이벤트 모듈도 같은 순서를 따르고, 5단계의 스냅샷 조각은 폴더에 모듈 파일만 두면 자동으로 모입니다.

## 증상에서 원인으로
- 풀이 순서
  &gt; 1. 클라이언트 엔진 로그에서 증상 줄(경고, 트레이스백)을 찾는다.
  &gt; 2. 서버 로그에서 같은 시각의 수신 줄과 응답 줄을 본다. 정상이면 수신 줄 바로 뒤에 응답 줄이 이어진다.
  &gt; 3. 접속 자체가 안 오면 중계 로그와 이름 해석 로그, 패킷 캡처로 내려간다.
  &gt; 4. 앱 안 서버 구성이면 기기 로그를 본다.
- 업데이트 확인에서 멈춘다
  &gt; | 의심 | 볼 곳 |
  &gt; |---|---|
  &gt; | 응답이 어긋남 | 캡처 재생 대조기, 응답 길이·해시 테스트 |
  &gt; | 이름 해석 | 이름 해석 로그에 게임 도메인 질의가 오고 복원 서버 주소로 답했는지 |
  &gt; | 인증서 | 인증서의 대상 이름이 게임 도메인과 맞는지 |
- 서버 선택 화면에서 멈춘다
  &gt; - 서버 목록 응답을 의심합니다. 목록이 비었거나 실제 게이트 주소가 없는 경우입니다.
  &gt; - 서버 로그에서 응답 본문과 알려 준 게이트 주소를 대조합니다.
- 게이트로 가는 연결이 0건이다
  &gt; - 먼저 서버 목록 응답에 실제 게이트 주소가 들어 있는지 확인합니다(바로 위 항목).
  &gt; - 그다음 중계의 접속 분기를 의심합니다. 패킷 캡처에서 서버명 없는 TCP가 게이트로 가는지 찾습니다.
- 접속은 되는데 상태 전이 경고가 난다
  &gt; - 엔티티 순서가 틀린 경우입니다.
  &gt; - 클라이언트 엔진 로그의 경고와 서버 로그의 전송 순서를 겹쳐서 계정 엔티티가 먼저 나갔는지 확인합니다.
- 로딩이 약 16초 뒤 재접속을 반복한다
  &gt; - 이벤트 조회에 답하지 않는 경우입니다.
  &gt; - 서버 로그에서 확인 응답과 빈 결과가 나갔는지 확인합니다.
- 약 30초 뒤 스스로 로그아웃한다
  &gt; - 생존 신호에 답하지 않는 경우입니다.
  &gt; - 서버 로그에서 수신 줄 바로 뒤에 응답 줄이 나가는지 확인합니다.
- 약 15초 뒤 접속이 끊긴다
  &gt; - 상태 전환 요청에 답하지 않았거나 요청값을 되돌리지 않은 경우입니다.
  &gt; - 서버 로그와 패킷 캡처에서 응답 키와 값을 대조합니다.
- 화면이 &quot;응답 대기 중&quot;에서 멈추고 약 15초 뒤 재접속한다
  &gt; - 클라이언트가 결과를 요구하는 콜백인데 서버가 풀어 주지 않은 경우입니다.
  &gt; - RPC 목록의 &quot;결과 필요&quot; 표시와 서버 응답을 대조합니다.
  &gt; - 16초 재접속, 15초 끊김, 이 항목은 비슷해 보이지만 원인이 다릅니다. 서버 로그에서 마지막으로 받은 호출이 이벤트 조회인지, 상태 전환인지, 결과를 요구하는 콜백인지가 가르는 단서가 됩니다.
- 화면이 열리자마자 예외가 난다
  &gt; - 필수 키 누락이나 기본값 타입이 어긋난 경우입니다.
  &gt; - 클라이언트 엔진 로그의 트레이스백이 가리키는 위치를 복원 소스와 대조합니다.
- 화면이 로딩에서 끝나지 않는다
  &gt; - 서버가 보내야 끝나는 초기화 작업이 숨어 있는 경우입니다.
  &gt; - 로더가 기다리는 작업 목록을 복원 소스에서 찾아 서버가 보냈는지 확인합니다.
- 특정 탭이 죽는다
  &gt; - 표에 이상한 행이 있는 경우입니다.
  &gt; - 그 행이 서버 시계 구간 안에 있는지 확인합니다.
- 일부 영웅에서만 기능이 거절된다
  &gt; - 영웅별 표의 값이 잘못 옮겨진 경우입니다.
  &gt; - 복원 소스가 판정에 실제로 쓰는 칸과 표의 값을 대조합니다.
- 앱을 켤 때마다 새 계정이 된다
  &gt; - 연결마다 바뀌는 식별자로 계정을 찾는 경우입니다.
  &gt; - 로그인 정보를 받은 뒤에 계정을 찾는지 확인합니다.
- 태블릿에서만 로그인에 실패한다
  &gt; - 중계 뒤에서 모든 접속이 같은 주소로 보이는 경우입니다.
  &gt; - 프록시 프로토콜 해석이 빠졌는지 확인합니다.
- 게임만 껐다 켜면 접속이 안 된다
  &gt; - 듣는 소켓이 닫힌 경우입니다.
  &gt; - 기기 로그에서 accept 실패와 소켓 재개방 기록을 찾습니다.
- 비행기 모드에서만 막힌다
  &gt; | 의심 | 볼 곳 |
  &gt; |---|---|
  &gt; | DNS 질의 | VPN 경로 |
  &gt; | 요청 줄의 절대 주소 | 서버의 절대 주소 처리 |
- 업데이트마다 진행 상태가 사라진다
  &gt; - 업데이트가 계정 데이터 파일을 새 것으로 교체하는 경우입니다.
  &gt; - 건드리지 않았을 때만 교체하는지, 이전 파일이 따로 남는지 확인합니다.
- 로그에 비밀값이 보인다
  &gt; - 쓰기 전에 가림 처리가 빠진 경우입니다.
  &gt; - 같은 검색에서 일치가 0건이 되는지 다시 확인합니다.

## 테스트 지도
- 종류별로 무엇을 보장하나
  &gt; | 종류 | 보장하는 것 |
  &gt; |---|---|
  &gt; | 라우터 테스트 | HTTP 응답 모양과 부팅 흐름 |
  &gt; | 게이트 실제 소켓 테스트 | 핸드셰이크와 엔티티 순서 |
  &gt; | 와이어 검사 | 서버발 호출이 복원 스텁과 맞음 |
  &gt; | 캡처 고정 | 정적 응답의 길이와 해시 |
  &gt; | 원본 대조 | 능력치 계산이 복원 소스의 계산 결과와 같음(옮기는 과정의 실수를 잡는 용도) |
  &gt; | 표 대조 | 서버가 읽는 표가 클라이언트 표와 같음 |
  &gt; | 기기 구성 | 같은 코드가 기기 구성에서도 같은 응답을 냄 |
  &gt; | 이야기 봇 | 엔진만으로 한 회차가 막히지 않음 |
- 새 호출을 추가할 때
  &gt; - 규칙 모듈에는 거절 조건을 포함한 단위 테스트를 둡니다.
  &gt; - 서버발 호출은 가짜 클라이언트로 복원 스텁과 대조합니다.
  &gt; - 시간이 관여하면 서버 시계를 고정한 테스트로 씁니다.
- 결정성
  &gt; - 테스트가 서버 시계를 고정합니다(87개 파일).
  &gt; - 난수는 시드를 주입합니다(44개 파일).
- 규모와 한계
  &gt; | 항목 | 값 |
  &gt; |---|---|
  &gt; | 서버 테스트 함수 | 약 3,200개(정적 집계) |
  &gt; | 2026-10-25 재실행(Windows PC) | 4,005 통과, 3 실패, 2 오류, 3 건너뜀, 96초 |
  &gt; | 실패와 오류 | 실패 3은 기기 구성의 소켓 테스트, 오류 2는 Windows 환경변수 길이 한도 때문 |
  &gt; | 건너뛰는 곳 | 실물 입력이 없으면 건너뜀(낡은 사유 포함) |
  &gt; | CI | 없음, 수동 실행 |
  &gt;
  &gt; 통과 수가 함수 수보다 큰 것은 매개변수화한 테스트가 사례마다 한 건으로 세어지기 때문으로 보입니다. 운영 환경인 Ubuntu에서는 다시 돌리지 않았습니다.
- 시험 계정 보관본
  &gt; - 완성된 계정 데이터를 읽는 테스트가 32개 파일입니다.
  &gt; - 보관본의 레벨이 바뀌면 테스트도 같이 고쳐야 합니다.

## 환경과 도구
- 서버 환경
  &gt; | 항목 | 내용 |
  &gt; |---|---|
  &gt; | OS | Ubuntu Linux 24.04 |
  &gt; | 실행 | systemd 서비스(서버, DNS, 캡처, 로그 수집) |
  &gt; | 중계 | nginx(stream과 http) |
  &gt; | DNS | dnsmasq |
- 검증 기기
  &gt; | 기기 | 용도 |
  &gt; |---|---|
  &gt; | Android 에뮬레이터 | 주 검증, 자동화 |
  &gt; | 휴대폰 | 설치, 도시 진입, 계정 데이터 백업과 복원 확인 |
  &gt; | 태블릿 | 로그인, 도시 화면, 순찰 1회, 던전 1판(시험용으로 복사한 계정) |
- 에뮬레이터 자동화
  &gt; - adb로 화면을 탭하고 성공 판정은 화면이 아니라 서버 로그와 엔진 로그의 상태 전이로 합니다.
  &gt; - &quot;응답 없음&quot; 창이 탭을 가로채 게임이 종료될 수 있어 창을 감지하는 단계가 있습니다.
- 도구 목록
  &gt; | 도구 | 하는 일 |
  &gt; |---|---|
  &gt; | 소스 복원 | 클라이언트 스크립트를 읽을 수 있는 소스로 되돌림 |
  &gt; | RPC 목록 | 호출 이름과 인자 추출 |
  &gt; | 표 내보내기 | 구문 트리로 표를 JSON으로 |
  &gt; | 캡처 대조기 | 2021 캡처 재생과 판정 |
  &gt; | 변환기 | Burp에서 HAR로 |
- REA를 쓰는 곳
  &gt; - 네이티브 라이브러리 분석, HTTP 캡처 판독, 기기 조작 도구에 씁니다.
  &gt; - 게임 스크립트와 게이트 구간 pcap은 REA의 범위 밖입니다.
  &gt; - 큰 라이브러리는 분석 결과를 한 번 만들어 이어서 조회합니다.

## 작업 규칙과 문서
- 문서 체계
  &gt; | 종류 | 내용 |
  &gt; |---|---|
  &gt; | 분석 보고서 | 번호를 붙이고 질문, 방법, 결론을 적습니다. 앞 보고서를 정정할 때는 표시합니다 |
  &gt; | 작업 일지 | 한 일, 현재 상태, 알아 둘 것, 남은 일, 커밋 |
- 작업 하나마다 남기는 것
  &gt; - 분석 보고서와 작업 일지를 같이 남깁니다.
  &gt; - 나중에 근거를 따라갈 수 있게 하려는 규칙입니다.
- 시험 수단은 원본 규칙과 구분해 적는다
  &gt; - 능력치 배율, 시계 조정, 호감도 설정으로 확인한 것은 원본 규칙이 아니라고 일지에 적습니다.
  &gt; - 그래야 검증용 값이 규칙으로 굳지 않습니다.
- 증거 규칙
  &gt; - REA 근거는 Evidence ID와 대상 SHA-256을 함께 적습니다.
  &gt; - 그 밖의 근거는 파일 경로와 줄 번호로 적습니다.
- 검증 범위를 일지에 적는다
  &gt; - &quot;한 바퀴까지만 확인&quot;, &quot;단위 테스트만&quot;, &quot;배율을 써서 확인&quot;처럼 범위를 직접 적습니다.
  &gt; - 자연 플레이로 확인한 것과 구분하기 위해서입니다.

## 알려진 함정과 한계
- 서버만 알던 값
  &gt; - 밸런스 값은 클라이언트에 없습니다.
  &gt; - 전투 정산은 던전류만 구현했고 나머지는 비어 있습니다(「전투 &gt; 구현 정도」).
- 게이트 구간의 정답지
  &gt; - 캡처가 없어서 대부분의 응답이 추론입니다.
  &gt; - 클라이언트 동작과 로그가 유일한 검증 수단입니다.
- 구현 범위
  &gt; - 서버 호출의 약 48.5%에 핸들러나 선언된 무응답이 있습니다.
  &gt; - 기능의 48.5%라는 뜻은 아닙니다.
- 화면으로 확인하지 못한 것
  &gt; - 정식 결말은 하나도 보지 못했습니다.
  &gt; - 복원한 이벤트 약 33묶음 중 약 28묶음은 화면을 못 봤습니다.
- 문서 불일치
  &gt; - 서버 시계 구간이 문서는 30주(이전 값), 코드는 26주입니다.
  &gt; - 일지 사이에 숫자와 상태 문장이 어긋나는 곳이 있습니다.
  &gt; - 갱신되지 않은 낡은 안내 문구가 남아 있습니다.
- 증거 파일
  &gt; - 스크린샷은 저장소에 올리지 않았고 목록만 남아 있습니다.
  &gt; - 일지의 화면 확인은 목록으로만 추적됩니다.
- 앱 안 서버
  &gt; - 64비트와 API 24 이상, VPN 허용이 필요하고 다른 VPN과 함께 쓸 수 없습니다.
  &gt; - 기기에 올린 빌드가 최신 서버 수정을 항상 담지는 않습니다.

                h("h1", { text: cfg.header.title, title: cfg.header.title })
            );
        if (cfg.header.description)
            head.appendChild(h("p", { text: cfg.header.description }));
        if (cfg.header.meta)
            head.appendChild(
                h("p", { class: "mme-meta", text: cfg.header.meta })
            );
        doc.body.appendChild(head);
    }

    /* ------------------------------------------------------------------ */
    /* Dropdown helper                                                     */
    /* ------------------------------------------------------------------ */

    var openMenus = [];
    function closeMenus(except) {
        openMenus.forEach(function (m) {
            if (m.menu !== except) m.close();
        });
    }
    function dropdown(icon, label, items) {
        var wrap = h("div", { class: "mme-dropdown" });
        var menu = h("div", {
            class: "mme-menu",
            role: "menu",
            "aria-label": label
        });
        var btn = h("button", {
            type: "button",
            class: "mme-btn",
            "aria-haspopup": "menu",
            "aria-expanded": "false",
            "aria-label": label,
            title: label,
            html:
                ICONS[icon] +
                '<span class="mme-btn-label">' +
                esc(label) +
                "</span>"
        });
        var entry = {
            menu: menu,
            close: function () {
                menu.classList.remove("mme-open");
                btn.setAttribute("aria-expanded", "false");
            }
        };
        openMenus.push(entry);
        items.forEach(function (it) {
            if (it === "-")
                return menu.appendChild(h("hr", { role: "separator" }));
            var b = h("button", {
                type: "button",
                role: it.checkbox ? "menuitemcheckbox" : "menuitem",
                text: it.label,
                "aria-checked": it.checkbox ? "false" : null,
                tabindex: "-1"
            });
            b.addEventListener("click", function () {
                entry.close();
                it.run(b);
            });
            it.el = b;
            menu.appendChild(b);
        });
        function open() {
            closeMenus(menu);
            menu.classList.add("mme-open");
            btn.setAttribute("aria-expanded", "true");
        }
        btn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (menu.classList.contains("mme-open")) entry.close();
            else open();
        });
        btn.addEventListener("keydown", function (e) {
            if (e.key === "ArrowDown") {
                e.preventDefault();
                open();
                var first = menu.querySelector("button");
                if (first) first.focus();
            }
        });
        menu.addEventListener("keydown", function (e) {
            var btns = Array.prototype.slice.call(
                menu.querySelectorAll("button")
            );
            var i = btns.indexOf(doc.activeElement);
            if (e.key === "ArrowDown") {
                e.preventDefault();
                btns[(i + 1) % btns.length].focus();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                btns[(i - 1 + btns.length) % btns.length].focus();
            } else if (e.key === "Escape") {
                e.stopPropagation();
                entry.close();
                btn.focus();
            }
        });
        wrap.appendChild(btn);
        wrap.appendChild(menu);
        return { el: wrap, items: items };
    }
    doc.addEventListener("click", function () {
        closeMenus();
    });

    /* ------------------------------------------------------------------ */
    /* Search                                                              */
    /* ------------------------------------------------------------------ */

    var input = h("input", {
        type: "search",
        id: "mme-search-input",
        name: "mme-search",
        placeholder: T.placeholder,
        "aria-label": T.search,
        autocomplete: "off",
        spellcheck: "false"
    });
    var countEl = h("span", {
        class: "mme-search-count",
        "aria-hidden": "true"
    });
    var prevBtn = iconButton("up", T.prev, "mme-step", function () {
        stepMatch(-1);
    });
    var nextBtn = iconButton("down", T.next, "mme-step", function () {
        stepMatch(1);
    });
    var clearBtn = iconButton("close", T.clear, "", function () {
        clearSearchUi();
        input.focus();
    });
    var searchField = h("div", { class: "mme-search-field" }, [
        h("span", {
            class: "mme-search-ico",
            html: ICONS.search,
            "aria-hidden": "true"
        }),
        input,
        countEl,
        prevBtn,
        nextBtn,
        clearBtn
    ]);
    var searchToggle = iconButton(
        "search",
        T.search,
        "mme-search-toggle",
        function () {
            searchWrap.classList.add("mme-open");
            input.focus();
        }
    );
    var searchWrap = h("div", { class: "mme-search", role: "search" }, [
        searchToggle,
        searchField
    ]);
    // inline icon inside the field should not look like a button
    searchField.firstChild.style.cssText =
        "display:inline-flex;width:16px;height:16px;color:#57606a";
    searchField.firstChild.firstChild.style.cssText =
        "width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round";

    function matchesNode(n, q) {
        if (isSentinel(n)) return false;
        if (S.todoOnly && !(n.payload && n.payload.task === "todo"))
            return false;
        if (!q) return true;
        return (
            norm(textOf(n)).indexOf(q) !== -1 ||
            norm(detailText(n)).indexOf(q) !== -1
        );
    }

    function snapshotFold() {
        var m = new Map();
        walk(root, function (n) {
            if (hasKids(n)) m.set(n, (n.payload && n.payload.fold) || 0);
        });
        return m;
    }
    function snapshotSiblings() {
        var m = new Map();
        groups.forEach(function (g, p) {
            m.set(p, g.expanded);
        });
        return m;
    }
    function restoreFold() {
        if (!S.savedFold) return false;
        S.savedFold.forEach(function (v, n) {
            setFold(n, v);
        });
        if (S.savedSib) {
            S.savedSib.forEach(function (expanded, p) {
                setSiblingsExpanded(p, expanded);
            });
        }
        S.savedFold = null;
        S.savedSib = null;
        return true;
    }

    var searchTimer = 0;
    function scheduleSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, 140);
    }

    function updateCount() {
        var q = S.query.trim();
        if (!S.searchActive) {
            countEl.textContent = "";
        } else if (S.matches.length) {
            countEl.textContent = S.active + 1 + "/" + S.matches.length;
        } else {
            countEl.textContent = T.noResult;
        }
        searchField.classList.toggle("mme-has-results", S.searchActive);
        prevBtn.disabled = nextBtn.disabled = S.matches.length < 2;
        clearBtn.style.visibility = q || S.todoOnly ? "visible" : "hidden";
    }

    async function runSearch() {
        var token = ++S.searchToken;
        var q = norm(S.query.trim());
        S.searchActive = !!q || S.todoOnly;
        if (!S.searchActive) {
            await clearSearchState();
            return;
        }
        if (!S.savedFold) {
            S.savedFold = snapshotFold();
            S.savedSib = snapshotSiblings();
        }
        var matches = [];
        walk(root, function (n) {
            if (matchesNode(n, q)) matches.push(n);
        });
        var anc = new Set();
        matches.forEach(function (n) {
            ancestors(n).forEach(function (a) {
                anc.add(a);
            });
        });
        S.matches = matches;
        S.matchSet = new Set(matches);
        S.ancSet = anc;
        var changed = false;
        matches.forEach(function (n) {
            if (revealSync(n)) changed = true;
        });
        S.active = matches.length ? 0 : -1;
        if (changed) await mm.renderData();
        if (token !== S.searchToken) return;
        paintClasses();
        updateCount();
        announce(
            matches.length ? T.resultsAnnounce(matches.length) : T.noResult
        );
        if (matches.length) gotoActive();
    }

    function panelPad() {
        if (!panelEl.classList.contains("mme-open")) return {};
        var r = panelEl.getBoundingClientRect();
        return window.innerWidth <= 640
            ? { bottom: r.height + 16 }
            : { right: r.width + 16 };
    }

    function gotoActive() {
        var n = S.matches[S.active];
        if (!n) return;
        S.focus = n;
        decorate();
        updateCount();
        mm.centerNode(n, panelPad());
    }
    function stepMatch(dir) {
        if (!S.matches.length) return;
        S.active = (S.active + dir + S.matches.length) % S.matches.length;
        gotoActive();
    }

    async function clearSearchState() {
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = false;
        var restored = restoreFold();
        updateCount();
        if (restored) await mm.renderData();
        else paintClasses();
    }
    function clearSearchUi() {
        input.value = "";
        S.query = "";
        S.todoOnly = false;
        todoItem.el.setAttribute("aria-checked", "false");
        S.searchToken++;
        clearSearchState();
        searchWrap.classList.remove("mme-open");
    }

    input.addEventListener("input", function () {
        S.query = input.value;
        scheduleSearch();
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            clearTimeout(searchTimer);
            if (
                S.searchToken &&
                S.matches.length &&
                norm(input.value.trim()) === norm(S.query.trim()) &&
                S.searchActive
            ) {
                stepMatch(e.shiftKey ? -1 : 1);
            } else {
                S.query = input.value;
                runSearch();
            }
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            stepMatch(1);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            stepMatch(-1);
        } else if (e.key === "Escape") {
            e.stopPropagation();
            clearSearchUi();
            input.blur();
            focusNode(nearestShown(S.focus));
        }
    });
    input.addEventListener("blur", function () {
        if (!input.value && window.innerWidth <= 640 && !S.todoOnly) {
            searchWrap.classList.remove("mme-open");
        }
    });

    /* ------------------------------------------------------------------ */
    /* Level menu                                                          */
    /* ------------------------------------------------------------------ */

    async function structuralChange() {
        S.savedFold = null;
        S.savedSib = null;
        S.searchToken++;
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = !!(S.query.trim() || S.todoOnly);
        await mm.renderData();
        await mm.fit();
        if (S.searchActive) runSearch();
        else updateCount();
    }
    function setLevel(level) {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, n.state.depth >= level + 1 ? 1 : 0);
        });
        structuralChange();
    }
    function expandAll() {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, 0);
        });
        groups.forEach(function (g, p) {
            setSiblingsExpanded(p, true);
        });
        structuralChange();
    }

    var todoItem = {
        label: T.todoOnly,
        checkbox: true,
        run: function (b) {
            S.todoOnly = !S.todoOnly;
            b.setAttribute("aria-checked", S.todoOnly ? "true" : "false");
            runSearch();
        }
    };
    var levelItems = [1, 2, 3, 4].map(function (n) {
        return {
            label: T.levelItem(n),
            run: function () {
                setLevel(n);
            }
        };
    });
    levelItems.push({ label: T.expandAll, run: expandAll });
    if (cfg.hasTasks) {
        levelItems.push("-");
        levelItems.push(todoItem);
    }
    var levelDd = dropdown("layers", T.level, levelItems);

    var exportDd = dropdown("download", T.exportLabel, [
        {
            label: T.exportPng,
            run: function () {
                exportAs("png");
            }
        },
        {
            label: T.exportJpg,
            run: function () {
                exportAs("jpg");
            }
        },
        {
            label: T.exportSvg,
            run: function () {
                exportAs("svg");
            }
        },
        "-",
        {
            label: T.copyMd,
            run: function () {
                exportAs("copy");
            }
        }
    ]);
    function exportAs(kind) {
        var api = window.mmExport;
        if (api && api[kind]) api[kind]();
    }

    barEl.appendChild(searchWrap);
    barEl.appendChild(levelDd.el);
    barEl.appendChild(exportDd.el);
    // Menu is built before todoItem exists only if tasks are absent.
    if (!cfg.hasTasks) todoItem.el = h("span");

    /* Export hooks: strip transient visual state while an image is rendered. */
    window.mmeBeforeExport = function () {
        svgEl.classList.add("mme-exporting");
        cardEl.classList.remove("mme-show");
    };
    window.mmeAfterExport = function () {
        svgEl.classList.remove("mme-exporting");
    };

    /* ------------------------------------------------------------------ */
    /* Hover                                                               */
    /* ------------------------------------------------------------------ */

    function pathOf(n) {
        var s = new Set([n]);
        ancestors(n).forEach(function (a) {
            s.add(a);
        });
        if (!isFolded(n)) {
            (n.children || []).forEach(function (c) {
                s.add(c);
            });
        }
        return s;
    }

    function cardHtml(n) {
        var p = n.payload || {};
        var parts = [];
        function list(items, extra) {
            var li = items
                .slice(0, 5)
                .map(function (c) {
                    return "<li>" + esc(textOf(c)) + "</li>";
                })
                .join("");
            var more =
                items.length > 5
                    ? "<li>…" + esc(T.moreItems(items.length - 5)) + "</li>"
                    : "";
            return "<ul>" + li + more + "</ul>" + (extra || "");
        }
        if (p.less) return "";
        if (p.more) {
            var g = groups.get(parentOf.get(n));
            return (
                '<div class="mme-card-title">' +
                esc(textOf(n)) +
                "</div>" +
                list(g ? g.hidden : [])
            );
        }
        var needTitle = !!p.detail || isFolded(n);
        if (needTitle)
            parts.push(
                '<div class="mme-card-title">' + esc(textOf(n)) + "</div>"
            );
        if (p.detail)
            parts.push('<div class="mme-card-detail">' + p.detail + "</div>");
        if (isFolded(n)) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.childCount(realKids(n).length) + " · " + T.folded) +
                    "</div>" +
                    list(realKids(n))
            );
        }
        if (p.tasks) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.done + " " + p.tasks.done + "/" + p.tasks.total) +
                    "</div>"
            );
        }
        if (!parts.length) return "";
        if (p.detail)
            parts.push('<span class="mme-hint">' + esc(T.hint) + "</span>");
        return parts.join("");
    }

    function positionCard(n) {
        var g = gMap.get(n);
        if (!g) return;
        var fo = g.querySelector("foreignObject") || g;
        var r = fo.getBoundingClientRect();
        cardEl.style.left = "0px";
        cardEl.style.top = "0px";
        var cw = cardEl.offsetWidth;
        var ch = cardEl.offsetHeight;
        var left = Math.min(Math.max(8, r.left), window.innerWidth - cw - 8);
        var top = r.bottom + 8;
        if (top + ch > window.innerHeight - 8)
            top = Math.max(8, r.top - ch - 8);
        cardEl.style.left = left + "px";
        cardEl.style.top = top + "px";
    }
    function showCard(n) {
        var html = cardHtml(n);
        if (!html) {
            hideCard();
            return;
        }
        cardEl.innerHTML = html;
        var preview = cardEl.querySelector(".mme-card-detail");
        if (preview && preview.scrollHeight > preview.clientHeight + 1) {
            preview.classList.add("mme-clipped");
        }
        positionCard(n);
        cardEl.classList.add("mme-show");
    }
    function hideCard() {
        cardEl.classList.remove("mme-show");
    }
    var cardTimer = 0;
    function startHover(n, immediate) {
        S.hover = n;
        S.pathSet = pathOf(n);
        paintClasses();
        clearTimeout(cardTimer);
        cardTimer = setTimeout(
            function () {
                // The panel already shows the selected node's details.
                if (S.hover === n && S.selected !== n) showCard(n);
            },
            immediate ? 60 : 220
        );
    }
    function endHover() {
        S.hover = null;
        S.pathSet = null;
        clearTimeout(cardTimer);
        hideCard();
        paintClasses();
    }
    var noHover =
        window.matchMedia && window.matchMedia("(hover: none)").matches;
    svgEl.addEventListener("mouseover", function (e) {
        if (noHover || e.buttons) return;
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n === S.hover) return;
        if (!n || !n.state) endHover();
        else startHover(n, false);
    });
    svgEl.addEventListener("mouseleave", endHover);
    svgEl.addEventListener("mousedown", hideCard);
    svgEl.addEventListener("focusin", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n && n.state) {
            S.focus = n;
            startHover(n, true);
        }
    });
    svgEl.addEventListener("focusout", endHover);
    mm.zoom.on("start.mme", hideCard);

    /* ------------------------------------------------------------------ */
    /* Selection panel                                                     */
    /* ------------------------------------------------------------------ */

    function collectLinks(n) {
        var out = [];
        var seen = {};
        [n.content, n.payload && n.payload.detail].forEach(function (html) {
            if (!html) return;
            parseHtml(html)
                .querySelectorAll("a[href]")
                .forEach(function (a) {
                    var href = a.getAttribute("href");
                    if (!href || seen[href]) return;
                    seen[href] = 1;
                    out.push({
                        href: href,
                        text: (a.textContent || href).trim()
                    });
                });
        });
        return out;
    }

    function labelButton(n, extraHtml) {
        var b = h("button", { type: "button" });
        b.appendChild(h("span", { text: textOf(n) }));
        if (extraHtml) b.appendChild(h("small", { text: extraHtml }));
        b.addEventListener("click", function () {
            selectNode(n, { center: true });
        });
        return b;
    }

    function renderPanel(n) {
        var p = n.payload || {};
        panelEl.textContent = "";
        var chain = ancestors(n).reverse();
        var crumbs = h("ol", { class: "mme-crumbs", "aria-label": "path" });
        chain.forEach(function (a) {
            var li = h("li");
            li.appendChild(labelButton(a));
            crumbs.appendChild(li);
        });
        var closeBtn = iconButton("close", T.close, "", function () {
            deselect(true);
        });
        panelEl.appendChild(
            h("div", { class: "mme-panel-head" }, [crumbs, closeBtn])
        );

        var body = h("div", { class: "mme-panel-body" });
        body.appendChild(
            h("div", { class: "mme-panel-title", html: titleHtml(n) })
        );

        if (p.tasks) {
            var pct = Math.round((p.tasks.done / p.tasks.total) * 100);
            body.appendChild(h("h3", { text: T.progress }));
            body.appendChild(
                h("div", { class: "mme-progress-line" }, [
                    h("i", { style: "--p:" + pct + "%" }),
                    h("span", { text: p.tasks.done + "/" + p.tasks.total })
                ])
            );
        }
        if (p.detail) {
            body.appendChild(h("h3", { text: T.detail }));
            body.appendChild(h("div", { class: "mme-detail", html: p.detail }));
        }
        if (hasKids(n)) {
            var kids = realKids(n);
            body.appendChild(
                h("h3", { text: T.children + " (" + kids.length + ")" })
            );
            var ul = h("ul", { class: "mme-list" });
            kids.forEach(function (c) {
                var li = h("li");
                var extra =
                    hasKids(c) && c.payload && c.payload.count
                        ? "+" + c.payload.count
                        : "";
                li.appendChild(labelButton(c, extra));
                ul.appendChild(li);
            });
            body.appendChild(ul);
        }
        var links = collectLinks(n);
        if (links.length) {
            body.appendChild(h("h3", { text: T.links }));
            var lul = h("ul", { class: "mme-list" });
            links.forEach(function (l) {
                lul.appendChild(
                    h("li", null, [
                        h("a", {
                            href: l.href,
                            target: "_blank",
                            rel: "noopener noreferrer",
                            text: l.text
                        })
                    ])
                );
            });
            body.appendChild(lul);
        }

        var actions = h("div", { class: "mme-actions" });
        if (hasKids(n)) {
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: isFolded(n) ? T.expand : T.collapse,
                    onclick: function () {
                        mm.toggleNode(n, false).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: T.expandBelow,
                    onclick: function () {
                        walk(n, function (x) {
                            if (hasKids(x)) setFold(x, 0);
                        });
                        mm.renderData(n).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
        }
        actions.appendChild(
            h("button", {
                type: "button",
                class: "mme-btn",
                text: T.copyText,
                onclick: function () {
                    copyText(textOf(n));
                }
            })
        );
        body.appendChild(actions);
        panelEl.appendChild(body);
        panelEl.setAttribute("aria-label", T.panelLabel + ": " + textOf(n));
    }

    function copyText(text) {
        var done = function () {
            window.mmeToast(T.copied);
        };
        var fail = function () {
            window.mmeToast(T.copyFailed);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fail);
        } else fail();
    }

    async function reveal(n) {
        if (revealSync(n)) await mm.renderData();
    }

    // Expands/collapses the hidden siblings of a long child list. The clicked
    // button is swapped for its counterpart, so focus is handed over explicitly.
    async function toggleSiblings(p, keyboard) {
        var g = groups.get(p);
        if (!g) return;
        var expanding = !g.expanded;
        setSiblingsExpanded(p, expanding);
        await mm.renderData(p);
        var target = expanding ? g.hidden[0] : g.more;
        if (keyboard) await focusNode(target);
        else {
            S.focus = target;
            decorate();
        }
        announce(textOf(expanding ? g.less : g.more));
    }

    async function selectNode(n, opts) {
        opts = opts || {};
        if (isSentinel(n)) {
            await toggleSiblings(parentOf.get(n), opts.keyboard);
            return;
        }
        await reveal(n);
        S.selected = n;
        S.focus = n;
        // The panel shows the details now; a lingering hover card would repeat them.
        clearTimeout(cardTimer);
        hideCard();
        renderPanel(n);
        panelEl.classList.add("mme-open");
        doc.body.classList.add("mme-panel-open");
        await mm.setHighlight(n);
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
        if (opts.keyboard) panelEl.focus({ preventScroll: true });
        announce(T.panelLabel + ": " + textOf(n));
    }

    function deselect(refocus) {
        var had = S.selected;
        S.selected = null;
        panelEl.classList.remove("mme-open");
        doc.body.classList.remove("mme-panel-open");
        mm.setHighlight(null);
        if (refocus && had) focusNode(had);
    }

    /* ------------------------------------------------------------------ */
    /* Lightbox                                                            */
    /* ------------------------------------------------------------------ */

    function openLightbox(img) {
        var cap = "";
        var fig = img.closest && img.closest("figure");
        if (fig && fig.querySelector("figcaption"))
            cap = fig.querySelector("figcaption").textContent;
        else cap = img.getAttribute("alt") || "";
        lightbox.textContent = "";
        lightbox.appendChild(
            h("img", { src: img.currentSrc || img.src, alt: cap })
        );
        if (cap) lightbox.appendChild(h("p", { text: cap }));
        lightbox.classList.add("mme-open");
        lightbox.setAttribute("tabindex", "-1");
        lightbox.focus();
    }
    function closeLightbox() {
        lightbox.classList.remove("mme-open");
    }
    lightbox.addEventListener("click", closeLightbox);
    doc.addEventListener("click", function (e) {
        var img = e.target;
        if (img && img.tagName === "IMG" && panelEl.contains(img))
            openLightbox(img);
    });

    /* ------------------------------------------------------------------ */
    /* Pointer interaction on the map                                      */
    /* ------------------------------------------------------------------ */

    var downPos = null;
    svgEl.addEventListener("pointerdown", function (e) {
        downPos = { x: e.clientX, y: e.clientY };
    });
    var coarse =
        window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

    function nearestCircle(x, y, radius) {
        var best = null;
        var bestD = radius;
        svgEl.querySelectorAll("g.markmap-node > circle").forEach(function (c) {
            var r = c.getBoundingClientRect();
            var dx = r.left + r.width / 2 - x;
            var dy = r.top + r.height / 2 - y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d <= bestD) {
                best = c;
                bestD = d;
            }
        });
        return best;
    }

    svgEl.addEventListener("click", function (e) {
        var t = e.target;
        if (
            downPos &&
            Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5
        )
            return;
        if (t.closest && t.closest("a")) return;
        if (t.tagName === "IMG") {
            openLightbox(t);
            return;
        }
        if (t.tagName === "circle") return; // markmap toggles on its own handler
        var c = nearestCircle(e.clientX, e.clientY, coarse ? 22 : 10);
        if (c && c.__data__) {
            mm.toggleNode(c.__data__, e.ctrlKey || e.metaKey);
            return;
        }
        var g = t.closest && t.closest("g.markmap-node");
        if (g && g.__data__ && t.closest("foreignObject")) {
            selectNode(g.__data__, {}); // sibling-group buttons toggle instead
        } else if (!g && S.selected) {
            deselect(false);
        }
    });

    /* ------------------------------------------------------------------ */
    /* Keyboard tree navigation                                            */
    /* ------------------------------------------------------------------ */

    function visibleList() {
        var out = [];
        (function rec(n) {
            out.push(n);
            if (!isFolded(n)) (n.children || []).forEach(rec);
        })(root);
        return out;
    }

    async function focusNode(n) {
        if (!n) return;
        if (!isShown(n)) await reveal(n);
        S.focus = n;
        decorate();
        var g = gMap.get(n);
        if (g) g.focus({ preventScroll: true });
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
    }

    svgEl.addEventListener("keydown", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (!n || !n.state || e.altKey || e.ctrlKey || e.metaKey) return;
        var list = visibleList();
        var i = list.indexOf(n);
        var handled = true;
        switch (e.key) {
            case "ArrowDown":
                focusNode(list[Math.min(list.length - 1, i + 1)]);
                break;
            case "ArrowUp":
                focusNode(list[Math.max(0, i - 1)]);
                break;
            case "Home":
                focusNode(list[0]);
                break;
            case "End":
                focusNode(list[list.length - 1]);
                break;
            case "ArrowRight":
                if (hasKids(n) && isFolded(n)) mm.toggleNode(n, false);
                else if (hasKids(n)) focusNode(n.children[0]);
                break;
            case "ArrowLeft":
                if (hasKids(n) && !isFolded(n)) mm.toggleNode(n, false);
                else if (parentOf.get(n)) focusNode(parentOf.get(n));
                break;
            case "Enter":
                selectNode(n, { keyboard: true });
                break;
            case " ":
                if (isSentinel(n)) toggleSiblings(parentOf.get(n), true);
                else if (hasKids(n)) mm.toggleNode(n, e.shiftKey);
                break;
            default:
                handled = false;
        }
        if (handled) e.preventDefault();
    });

    /* ------------------------------------------------------------------ */
    /* Global shortcuts                                                    */
    /* ------------------------------------------------------------------ */

    function typing(el) {
        return (
            el &&
            (el.tagName === "INPUT" ||
                el.tagName === "TEXTAREA" ||
                el.isContentEditable)
        );
    }
    doc.addEventListener("keydown", function (e) {
        if (
            (e.key === "/" && !typing(e.target) && !e.ctrlKey && !e.metaKey) ||
            ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")
        ) {
            e.preventDefault();
            searchWrap.classList.add("mme-open");
            input.focus();
            input.select();
            return;
        }
        if (e.key !== "Escape") return;
        if (lightbox.classList.contains("mme-open")) {
            closeLightbox();
        } else if (
            openMenus.some(function (m) {
                return m.menu.classList.contains("mme-open");
            })
        ) {
            closeMenus();
        } else if (S.searchActive || input.value) {
            clearSearchUi();
        } else if (S.selected) {
            deselect(true);
        } else {
            endHover();
        }
    });

    /* ------------------------------------------------------------------ */
    /* Toolbar localisation (markmap-toolbar)                              */
    /* ------------------------------------------------------------------ */

    function enhanceZoomBar() {
        var bar = doc.querySelector(".mm-toolbar");
        if (!bar) return false;
        bar.classList.add("mme-ui", "mme-zoombar");
        bar.querySelectorAll(".mm-toolbar-item").forEach(function (item) {
            var title = item.getAttribute("title") || "";
            var local = T.zoomTitles[title] || title;
            item.setAttribute("title", local);
            item.setAttribute("role", "button");
            item.setAttribute("aria-label", local);
            item.setAttribute("tabindex", "0");
            item.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    item.click();
                }
            });
        });
        return true;
    }
    var zoomTries = 0;
    (function waitZoomBar() {
        if (enhanceZoomBar() || ++zoomTries > 40) return;
        setTimeout(waitZoomBar, 100);
    })();

    /* ------------------------------------------------------------------ */
    /* Boot                                                                */
    /* ------------------------------------------------------------------ */

    // Small screens: start with the first levels only so text stays readable.
    if (window.innerWidth <= 640 && cfg.mobileLevel) {
        walk(root, function (n) {
            if (!hasKids(n)) return;
            setFold(n, n.state.depth >= cfg.mobileLevel + 1 ? 1 : 0);
        });
    }

    updateCount();
    mm.renderData();
})();
</script>
  
</body>
</html>
