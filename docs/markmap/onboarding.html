# 영원한 7일의 도시 서버 복원 동작 원리

## 이 시스템은 무엇인가
- 목적
  &gt; **내용**: 서비스가 종료된 모바일 게임의 서버를 다시 만든다
  &gt; **목표**: 원본 클라이언트가 부팅부터 도시 화면과 각종 콘텐츠까지 진행한다
- 시스템 경계
  &gt; | 안 | 밖 |
  &gt; |---|---|
  &gt; | 복원 서버 (HTTP 서비스, 게이트 서버, 게임 규칙) | 원본 클라이언트 앱과 게임 데이터 |
  &gt; | 복원 도구와 검증 도구 | 원 서비스의 서버 (소스·데이터가 없음) |
  &gt; | 접속 보조 앱과 앱 안 서버 | 온라인 전투 서버 (복원하지 않음) |
- 주요 사용 흐름
  &gt; 1. 클라이언트가 복원 서버에 접속해 업데이트 확인과 로그인을 마친다
  &gt; 2. 게이트 서버가 계정과 아바타를 만들어 도시 화면으로 보낸다
  &gt; 3. 플레이어가 기능을 쓸 때마다 RPC가 오가고, 서버 규칙이 계정 상태를 바꾼다
  &gt; 4. 상태는 계정마다 파일로 저장되어 서버를 다시 띄워도 남는다
- 작업 방식 한눈에
  &gt; - **정답지**: 2021 HTTP 캡처와 복원한 클라이언트 소스
  &gt; - **개발자**: 1인
  &gt; - **기록**: 번호 붙은 분석 보고서, 일자별 작업 일지, 학습 기록

## 구성 요소 지도
- 이름 해석과 중계
  &gt; **역할**: 게임 도메인을 복원 서버로 돌리고 접속을 종류별로 나눈다
  &gt; **입력**: 클라이언트의 DNS 질의, 80/443 접속
  &gt; **출력**: HTTP 서비스 또는 게이트 서버로 전달된 접속
  &gt; **연결**: 클라이언트, HTTP 서비스, 게이트 서버
- HTTP 서비스
  &gt; **역할**: 설정, 업데이트 확인, 로그인, 결제, 텔레메트리 응답
  &gt; **입력**: 클라이언트의 HTTP 요청
  &gt; **출력**: 2021 캡처와 같은 응답, 또는 게임 규칙으로 만든 응답
  &gt; **연결**: 중계, 계정 저장소
- 게이트 서버
  &gt; **역할**: 로그인 이후 게임 통신을 받는 원시 TCP 서버
  &gt; **입력**: 길이 접두 프레임으로 감싼 protobuf 메시지
  &gt; **출력**: 엔티티 생성 메시지, RPC 응답, 생존 신호 응답
  &gt; **연결**: 아바타 계층, 계정 저장소
- 아바타 계층
  &gt; **역할**: 접속한 계정 하나의 상태와 RPC 처리를 맡는다
  &gt; **입력**: 클라이언트 RPC
  &gt; **출력**: 응답과 서버 푸시
  &gt; **연결**: RPC 핸들러, 게임 규칙, 상태 저장
- RPC 핸들러
  &gt; **역할**: 기능별 호출을 받아 규칙을 부르고 응답을 만든다
  &gt; **입력**: 호출 이름과 인자
  &gt; **출력**: 응답 값, 상태 변경
  &gt; **연결**: 아바타 계층, 게임 규칙
- 게임 규칙 모듈
  &gt; **역할**: 도시, 영웅 육성, 장비, 던전류, 이벤트 같은 기능별 규칙
  &gt; **입력**: 계정 상태, 표 데이터, 서버 시계
  &gt; **출력**: 바뀐 계정 상태, 스냅샷 조각
  &gt; **연결**: 표 데이터, 상태 저장
- 표 데이터
  &gt; **역할**: 클라이언트에서 뽑은 게임 표를 JSON으로 보관
  &gt; **입력**: 복원 도구의 내보내기 결과
  &gt; **출력**: 규칙 모듈이 읽는 표
- 상태 저장
  &gt; **역할**: 계정당 JSON 파일로 진행 상태를 저장
  &gt; **연결**: 아바타 계층, 운영자 도구
- 복원 도구 파이프라인
  &gt; **역할**: 클라이언트 스크립트에서 소스, RPC 목록, 표를 만든다
  &gt; **입력**: 클라이언트 리소스
  &gt; **출력**: 복원 소스, RPC 목록, 표 JSON
  &gt; **연결**: 표 데이터, 테스트
- 검증 도구
  &gt; **역할**: 캡처와 서버 응답을 대조하고, 서버가 보내는 호출을 클라이언트 스텁과 대조
  &gt; **연결**: 테스트, 에뮬레이터 자동화
- 접속 보조 앱과 앱 안 서버
  &gt; **역할**: 기기만으로 실행하는 단독 구성
  &gt; **입력**: 앱 안 VPN이 돌려준 접속
  &gt; **출력**: 서버 응답
  &gt; **연결**: 게이트 서버 로직 재사용
- 운영자 도구
  &gt; **역할**: 시험용 계정 관리, 재화 지급, 레벨 변경
  &gt; **참고**: 원본 운영 기능이 아니라 시험 수단이다
- 로그 수집
  &gt; **역할**: 서버 로그, 패킷, 클라이언트 엔진 로그, 기기 로그를 모은다

## 흐름
- 부팅과 로그인
  &gt; 1. 클라이언트가 설정, 업데이트 확인, 서버 목록을 HTTP 서비스에 요청한다
  &gt; 2. 로그인 응답을 받는다
  &gt; 3. 서버 목록이 알려 준 게이트 주소로 TCP 접속한다
  &gt; 4. 게이트 서버가 접속 응답과 계정 엔티티를 보낸다
  &gt; 5. 클라이언트가 로그인 정보를 보내면, 그 계정의 아바타를 만들어 스냅샷과 함께 보낸다
- 도시 진입과 유지
  &gt; 1. 클라이언트가 플레이 전환을 요청한다
  &gt; 2. 서버가 이벤트 큐와 상태 전환에 응답한다
  &gt; 3. 클라이언트가 5초 간격으로 생존 신호를 보낸다
  &gt; 4. 응답이 없으면 클라이언트가 일정 시간 뒤 접속을 끊는다
- 기능 호출
  &gt; 1. 클라이언트가 RPC를 보낸다
  &gt; 2. 아바타 계층이 이름으로 핸들러를 찾는다
  &gt; 3. 핸들러가 규칙 모듈을 불러 계정 상태를 바꾼다
  &gt; 4. 응답과 필요한 푸시를 보낸다
  &gt; 5. 상태를 파일에 저장한다
- 규칙 복원
  &gt; 1. 클라이언트 스크립트를 복호화한다
  &gt; 2. 바이트코드를 재작성해 소스로 되살린다
  &gt; 3. 소스에서 RPC 목록과 표를 뽑는다
  &gt; 4. 클라이언트가 읽는 필드, 타입, 순서를 계약 문서로 정리한다
  &gt; 5. 규칙을 구현하고 테스트와 에뮬레이터로 확인한다
- 증거 게이트
  &gt; 1. 서버 응답 변경 전에 패킷 근거를 찾는다
  &gt; 2. 없으면 클라이언트 소스에서 근거를 찾는다
  &gt; 3. 클라이언트를 바꾸는 경우 별도 정당화를 문서로 남긴다
  &gt; 4. 회귀 테스트를 1개 이상 추가한다

## 핵심 개념과 용어
- 게이트 서버
  &gt; **뜻**: 로그인 이후의 게임 통신을 받는 원시 TCP 서버
  &gt; **관계**: HTTP 서비스가 알려 준 주소로 접속한다
- 엔티티
  &gt; **뜻**: 서버와 클라이언트가 함께 들고 있는 객체. 계정과 아바타가 있다
  &gt; **관계**: 서버가 생성 메시지를 보내면 클라이언트가 만든다
- 스냅샷
  &gt; **뜻**: 로그인 때 보내는 계정 상태 묶음
  &gt; **관계**: 기능 모듈마다 조각을 등록하고, 영웅 데이터는 전투와 같은 조립기를 쓴다
- RPC 목록
  &gt; **뜻**: 클라이언트 소스에서 뽑은 호출 이름 목록. 서버 호출 1,334개, 클라이언트 스텁 1,493개
  &gt; **관계**: 구현 범위의 기준이고, 테스트가 서버 호출을 이 목록과 대조한다
- 근거 등급
  &gt; **뜻**: 규칙마다 표, 소스, 추론, 복원 서버의 결정 중 어디서 왔는지 표기
  &gt; **관계**: 원본 서버가 없어서 추론이 많다
- 서버 시계
  &gt; **뜻**: 한국 벽시계를 기준으로 하고, 서비스 말기 구간을 되풀이해 한정 이벤트를 다시 연다
  &gt; **관계**: 이벤트 모듈이 되풀이 번호로 상태를 비운다
- 증거 등급 Tier 1·2·3
  &gt; **뜻**: 패킷 근거, 클라이언트 소스 근거, 클라이언트 변경의 정당화

## 구성 요소별 동작 원리
- 중계
  - 서버명 유무로 분기
    &gt; **하는 일**: 같은 443 포트로 오는 TLS 접속과 원시 TCP 접속을 나눈다
    &gt; **방식**:
    &gt; 1. TLS 서버명이 있으면 TLS를 풀어 HTTP 서비스로 보낸다
    &gt; 2. 서버명이 없으면 게이트 서버로 보낸다
    &gt; **이렇게 한 효과**: 한 주소로 두 종류 통신을 받는다
  - 실제 기기 주소 보존
    &gt; **하는 일**: 중계 뒤에서도 접속한 기기의 실제 주소를 게이트 서버가 본다
    &gt; **방식**: 중계가 앞에 붙이는 프록시 프로토콜 헤더를 해석한다
- HTTP 서비스
  - 캡처 응답 재현
    &gt; **하는 일**: 캡처된 응답을 바이트와 Content-Type까지 같게 돌려준다
    &gt; **이렇게 한 효과**: 응답이 어긋나 업데이트 단계에서 멈추는 문제를 막는다
  - 알 수 없는 요청 처리
    &gt; **하는 일**: 캡처에 없는 경로는 스텁으로 답하고 경고 로그를 남긴다
- 게이트 서버
  - 로그인 후 아바타 생성
    &gt; **하는 일**: 접속 직후가 아니라 로그인 정보를 받은 뒤 계정별 아바타를 만든다
    &gt; **이유**: 기기 식별자가 접속마다 바뀐다
  - 접속 안정화
    &gt; **하는 일**: 예외를 접속 단위로 가두고, 중복 로그인을 정리하고, 토큰을 대조한다
    &gt; **방식**: 토큰 대조는 엄격, 기록만, 끔 세 가지 모드
  - 빠른 종료
    &gt; **하는 일**: 종료할 때 접속을 먼저 닫는다
    &gt; **이렇게 한 효과**: 접속이 있을 때 종료가 90초 걸리던 것이 1초로 줄었다
- 아바타 계층
  - 핸들러 자동 등록
    &gt; **하는 일**: 표시가 붙은 핸들러를 모아 호출 이름과 연결한다
    &gt; **방식**:
    &gt; 1. 핸들러에 RPC 표시를 붙인다
    &gt; 2. 아바타가 만들어질 때 멤버를 훑어 모은다
    &gt; 3. 같은 이름이 둘이면 나중 것이 이긴다
  - 미구현 호출 처리
    &gt; **하는 일**: 핸들러가 없으면 로그만 남기고 빈 결과로 풀어 클라이언트가 잠기지 않게 한다
    &gt; **예외**: 결과 값을 읽는 콜백은 풀지 않고 경고한다
  - 전투 호출 분기
    &gt; **하는 일**: 전투 서버가 없는 콘텐츠는 클라이언트가 스스로 전투하게 돌려보낸다
- 게임 규칙
  - 기능 모듈의 공통 모양
    &gt; **하는 일**: 표 → 규칙 → 계정 상태 → 거절 판정 → 와이어 변환 → 스냅샷 조각
    &gt; **이렇게 한 효과**: 새 기능을 같은 틀로 추가한다
  - 영웅 데이터 조립 한 곳
    &gt; **하는 일**: 스냅샷, 갱신 푸시, 전투가 같은 영웅 값을 쓴다
  - 이벤트 규칙 모듈 묶음
    &gt; **하는 일**: 이벤트 38종이 같은 골격을 따른다
    &gt; **참고**: 대부분 원본 서버가 없어 추론한 값이다
  - 서버 시계 되풀이
    &gt; **하는 일**: 서비스 말기 구간을 되풀이해 한정 소환과 이벤트를 다시 연다
- 상태 저장
  - 안전한 파일 교체
    &gt; **하는 일**: 임시 파일에 쓰고 교체하며, 깨진 파일은 따로 옮긴다
    &gt; **이렇게 한 효과**: 쓰는 도중 종료돼도 기존 상태가 남는다
- 복원 도구
  - 옵코드 표 유도
    &gt; **하는 일**: 게임에 든 표준 라이브러리를 Python 2.7 컴파일 결과와 명령 단위로 비교해 옵코드 표를 맞춘다
    &gt; **방식**: 100곳은 비교로 유도하고 나머지는 관용구로 정한다
  - 표 내보내기
    &gt; **하는 일**: 표를 실행하지 않고 구문 트리로만 읽어 JSON으로 내보낸다
    &gt; **참고**: 원본이 아니라 추정으로 채운 구간은 표기가 따로 있다
  - 소스 복원 규모
    &gt; **하는 일**: 소스 4,369개를 되살렸고, 전투 스크립트를 포함하면 13,462개
- 검증 도구
  - 캡처 대조
    &gt; **하는 일**: 2021 캡처 요청을 서버에 재생하고 응답을 같음, 다름, 상태 차이로 판정한다
  - 와이어 검사
    &gt; **하는 일**: 가짜 클라이언트가 서버가 보낸 모든 호출을 클라이언트 스텁과 대조한다
    &gt; **이렇게 한 효과**: 잘못된 키 이름 같은 오류를 테스트에서 잡는다
- 앱 안 서버
  - 서버를 별도 프로세스로
    &gt; **하는 일**: 기기 안에서 서버를 게임과 다른 프로세스로 실행한다
  - 앱 안 VPN
    &gt; **하는 일**: 80/443 접속을 서버의 비특권 포트로 돌려준다
  - 대체 FastAPI 패키지
    &gt; **하는 일**: 기기에서 빌드하기 어려운 의존성을 피해 Starlette 위에 같은 모양을 제공한다
    &gt; **검증**: 같은 테스트를 진짜 FastAPI와 대체 패키지에서 모두 돌린다
  - 소켓 복구
    &gt; **하는 일**: 안드로이드가 닫은 듣는 소켓을 서버가 다시 연다

## 개발 환경과 작업 규칙
- 개발 환경
  &gt; - **서버**: Linux 24.04, systemd, nginx, dnsmasq
  &gt; - **검증 기기**: 루팅된 안드로이드 에뮬레이터, 실기기 태블릿
- 문서 체계
  &gt; | 종류 | 내용 |
  &gt; |---|---|
  &gt; | 분석 보고서 | 번호가 붙고, 질문과 방법과 결론이 있다 |
  &gt; | 작업 일지 | 날짜별로 받은 요청, 진행, 상태, 커밋을 적는다 |
  &gt; | 학습 기록 | 같은 실수 2회, 1시간 이상 걸린 버그를 적고, 3회 반복되면 규칙으로 올린다 |
- 규칙 진화
  &gt; **내용**: 교훈이 15개에서 40개로 늘었고, 반복된 실수가 규칙으로 승격되었다
  &gt; **예**: 프로세스 패턴 매칭 함정, 에뮬레이터 자동화 규칙
- 명령 실행 규칙
  &gt; - **무한 대기 방지**: 모든 명령에 시간 제한
  &gt; - **근거 ID 검증**: 도구를 부르지 않은 ID는 증거가 아님

## 설계 원칙과 제약
- 응답은 원본 그대로
  &gt; **내용**: 2021 캡처가 정답지이며 추측으로 다시 만들지 않는다
- 클라이언트는 건드리지 않는다
  &gt; **내용**: 서버가 주는 값만 바꾸는 것이 원칙이고, 예외는 정당화 문서를 남긴다
- 추론은 추론이라고 적는다
  &gt; **내용**: 규칙마다 근거 등급을 표기한다
- 오프라인 전투 허용
  &gt; **내용**: 온라인 전투 서버가 없어 클라이언트 계산에 맡긴다

## 한계와 알려진 문제
- 원본 서버 규칙 부재
  &gt; **내용**: 서버 쪽 규칙 다수는 추론이다
- RPC 구현 범위
  &gt; **내용**: 정적 집계로 서버 호출의 약 48.5%에 핸들러가 있다
- 게이트 구간의 정답지 없음
  &gt; **내용**: 2021 캡처가 HTTP 로그인 구간에 한정된다
- 문서 갱신 지연
  &gt; **내용**: 서버 시계 구간 같은 값이 문서마다 다르다
- CI 없음
  &gt; **내용**: 테스트는 수동으로 실행한다

    }

        var p = n.payload;
        return !!(p && (p.more || p.less));
    }

            return !isSentinel(c);
        });
    }
    function walk(n, fn) {
        fn(n);
        allKids(n).forEach(function (c) {
            walk(c, fn);
        });
    }

    /* ------------------------------------------------------------------ */
    /* Tree index                                                          */
    /* ------------------------------------------------------------------ */

    var parentOf = new Map();
    var sibIndex = new Map();

        allKids(n).forEach(function (c, i) {
            sibIndex.set(c, i);
            index(c, n);
        });
    })(root, null);

    // Sibling groups: a parent with many children shows the first few plus a
    // "more" button that is a leaf sibling (not a parent of the hidden ones).

    (function collapseGroups(n) {
        var kids = n.children || [];
        var mi = kids.findIndex(function (c) {
            return c.payload && c.payload.more;
        });
        var li = kids.findIndex(function (c) {
            return c.payload && c.payload.less;
        });
        if (mi !== -1 && li !== -1) {
            groups.set(n, {
                visible: kids.slice(0, mi),
                more: kids[mi],
                hidden: kids.slice(mi + 1, li),
                less: kids[li],
                expanded: false
            });
            n.__all = kids.slice();
            n.children = kids.slice(0, mi + 1);
        }
        allKids(n).forEach(collapseGroups);
    })(root);

    function setSiblingsExpanded(p, expanded) {
        var g = groups.get(p);
        if (!g || g.expanded === expanded) return false;
        g.expanded = expanded;
        p.children = expanded
            ? g.visible.concat(g.hidden, [g.less])
            : g.visible.concat([g.more]);
        return true;
    }
    function inView(x) {
        var p = parentOf.get(x);
        return !p || p.children.indexOf(x) !== -1;
    }

    function ancestors(n) {
        var out = [];
        for (var p = parentOf.get(n); p; p = parentOf.get(p)) out.push(p);
        return out;
    }
    function hasKids(n) {
        return allKids(n).length > 0;
    }
    function isFolded(n) {
        return hasKids(n) && !!(n.payload && n.payload.fold);
    }
    function setFold(n, v) {
        n.payload = Object.assign({}, n.payload, { fold: v });
    }
    function isShown(n) {
        return (
            ancestors(n).every(function (a) {
                return !isFolded(a);
            }) && ancestors(n).concat([n]).every(inView)
        );
    }
    // Closest node that is currently on screen: the node itself, a hidden
    // sibling's "more" button, or the nearest visible ancestor.
    function nearestShown(n) {
        for (var x = n; x; x = parentOf.get(x)) {
            if (isShown(x)) return x;
            var p = parentOf.get(x);
            var g = p && groups.get(p);
            if (g && !g.expanded && isShown(g.more)) return g.more;
        }
        return root;

    // Makes `n` visible: unfolds its ancestors and expands any sibling group
    // that hides it or one of its ancestors. Returns whether anything changed.

            .reverse()
            .concat([n])
            .forEach(function (x) {
                var p = parentOf.get(x);
                if (p && groups.has(p) && !inView(x)) {
                    setSiblingsExpanded(p, true);
                    changed = true;
                }
            });
        ancestors(n).forEach(function (a) {
            if (isFolded(a)) {
                setFold(a, 0);
                changed = true;
            }
        });
        return changed;

    var textCache = new Map();
    function parseHtml(html) {
        return new DOMParser().parseFromString(html, "text/html").body;
    }
    var BADGES = ".mme-count,.mme-progress,.mme-info,.mme-more,.mme-less";
    function textOf(n) {
        if (textCache.has(n)) return textCache.get(n);
        var p = n.payload || {};
        var t;
        if (p.more) {
            t = T.moreItems(p.count || 0);
        } else if (p.less) {
            t = T.lessItems(p.count || 0);
        } else {
            var body = parseHtml(n.content || "");
            body.querySelectorAll(BADGES + ",.mme-task").forEach(function (e) {
                e.remove();
            });
            t = (body.textContent || "").replace(/\s+/g, " ").trim();
            if (!t) {
                var img = body.querySelector("img");
                t = (img && img.getAttribute("alt")) || (img ? T.images : "");
            }
        }
        textCache.set(n, t);
        return t;
    }
    function detailText(n) {
        var d = n.payload && n.payload.detail;
        return d
            ? (parseHtml(d).textContent || "").replace(/\s+/g, " ").trim()
            : "";
    }
    function titleHtml(n) {
        if (isSentinel(n)) return esc(textOf(n));
        var body = parseHtml(n.content || "");
        body.querySelectorAll(BADGES).forEach(function (e) {
            e.remove();
        });
        return body.innerHTML.trim();
    }
    function labelOf(n) {
        var p = n.payload || {};
        var parts = [textOf(n)];
        if (p.task) parts.push(p.task === "done" ? T.done : T.todo);
        if (p.tasks)
            parts.push(T.done + " " + p.tasks.done + "/" + p.tasks.total);
        if (p.detail) parts.push(T.hasDetail);
        if (hasKids(n)) {
            parts.push(T.childCount(realKids(n).length));
            if (isFolded(n)) parts.push(T.folded);
        }
        return parts.join(", ");

    function norm(s) {

            .normalize("NFC")
            .toLowerCase();

    /* State                                                               */

    /* Options: color, line width, motion                                  */
    /* ------------------------------------------------------------------ */

        var parent = gMap.get(pre[0]).parentNode;
        var current = Array.prototype.filter.call(
            parent.children,
            function (c) {
                return c.classList && c.classList.contains("markmap-node");
            }

            current.length === pre.length &&
            current.every(function (g, i) {
                return g === gMap.get(pre[i]);
            });
        if (same) return;
        var active = doc.activeElement;
        pre.forEach(function (n) {
            parent.appendChild(gMap.get(n));
        });
        if (active && active !== doc.activeElement && svgEl.contains(active)) {
            active.focus({ preventScroll: true });
        }

                !!S.pathSet &&
                    S.pathSet.has(d.target) &&
                    S.pathSet.has(d.source)

    var origRender = mm.renderData.bind(mm);

    /* Dropdown helper                                                     */

    var openMenus = [];
    function closeMenus(except) {

    function dropdown(icon, label, items) {

                type: "button",
                role: it.checkbox ? "menuitemcheckbox" : "menuitem",
                text: it.label,
                "aria-checked": it.checkbox ? "false" : null,
                tabindex: "-1"

                entry.close();

            });
            it.el = b;
            menu.appendChild(b);

            closeMenus(menu);

        }
        btn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (menu.classList.contains("mme-open")) entry.close();
            else open();
        });
        btn.addEventListener("keydown", function (e) {
            if (e.key === "ArrowDown") {
                e.preventDefault();
                open();
                var first = menu.querySelector("button");
                if (first) first.focus();
            }
        });
        menu.addEventListener("keydown", function (e) {
            var btns = Array.prototype.slice.call(
                menu.querySelectorAll("button")
            );
            var i = btns.indexOf(doc.activeElement);
            if (e.key === "ArrowDown") {
                e.preventDefault();
                btns[(i + 1) % btns.length].focus();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                btns[(i - 1 + btns.length) % btns.length].focus();
            } else if (e.key === "Escape") {
                e.stopPropagation();
                entry.close();
                btn.focus();
            }
        });
        wrap.appendChild(btn);
        wrap.appendChild(menu);
        return { el: wrap, items: items };
    }
    doc.addEventListener("click", function () {
        closeMenus();
    });

    /* ------------------------------------------------------------------ */
    /* Search                                                              */
    /* ------------------------------------------------------------------ */

    var input = h("input", {
        type: "search",
        id: "mme-search-input",
        name: "mme-search",
        placeholder: T.placeholder,
        "aria-label": T.search,
        autocomplete: "off",
        spellcheck: "false"
    });
    var countEl = h("span", {
        class: "mme-search-count",
        "aria-hidden": "true"
    });
    var prevBtn = iconButton("up", T.prev, "mme-step", function () {
        stepMatch(-1);
    });
    var nextBtn = iconButton("down", T.next, "mme-step", function () {
        stepMatch(1);
    });
    var clearBtn = iconButton("close", T.clear, "", function () {
        clearSearchUi();
        input.focus();
    });
    var searchField = h("div", { class: "mme-search-field" }, [
        h("span", {
            class: "mme-search-ico",
            html: ICONS.search,
            "aria-hidden": "true"
        }),
        input,
        countEl,
        prevBtn,
        nextBtn,
        clearBtn
    ]);
    var searchToggle = iconButton(
        "search",
        T.search,
        "mme-search-toggle",
        function () {
            searchWrap.classList.add("mme-open");
            input.focus();
        }
    );
    var searchWrap = h("div", { class: "mme-search", role: "search" }, [
        searchToggle,
        searchField
    ]);
    // inline icon inside the field should not look like a button
    searchField.firstChild.style.cssText =
        "display:inline-flex;width:16px;height:16px;color:#57606a";
    searchField.firstChild.firstChild.style.cssText =
        "width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round";

    function matchesNode(n, q) {
        if (isSentinel(n)) return false;
        if (S.todoOnly && !(n.payload && n.payload.task === "todo"))
            return false;
        if (!q) return true;
        return (
            norm(textOf(n)).indexOf(q) !== -1 ||
            norm(detailText(n)).indexOf(q) !== -1
        );
    }

    function snapshotFold() {
        var m = new Map();
        walk(root, function (n) {
            if (hasKids(n)) m.set(n, (n.payload && n.payload.fold) || 0);
        });
        return m;
    }
    function snapshotSiblings() {
        var m = new Map();
        groups.forEach(function (g, p) {
            m.set(p, g.expanded);
        });
        return m;
    }
    function restoreFold() {
        if (!S.savedFold) return false;
        S.savedFold.forEach(function (v, n) {
            setFold(n, v);
        });
        if (S.savedSib) {
            S.savedSib.forEach(function (expanded, p) {
                setSiblingsExpanded(p, expanded);
            });
        }
        S.savedFold = null;
        S.savedSib = null;
        return true;
    }

    var searchTimer = 0;
    function scheduleSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, 140);
    }

    function updateCount() {
        var q = S.query.trim();
        if (!S.searchActive) {
            countEl.textContent = "";
        } else if (S.matches.length) {
            countEl.textContent = S.active + 1 + "/" + S.matches.length;
        } else {
            countEl.textContent = T.noResult;
        }
        searchField.classList.toggle("mme-has-results", S.searchActive);
        prevBtn.disabled = nextBtn.disabled = S.matches.length < 2;
        clearBtn.style.visibility = q || S.todoOnly ? "visible" : "hidden";
    }

    async function runSearch() {
        var token = ++S.searchToken;
        var q = norm(S.query.trim());
        S.searchActive = !!q || S.todoOnly;
        if (!S.searchActive) {
            await clearSearchState();
            return;
        }
        if (!S.savedFold) {
            S.savedFold = snapshotFold();
            S.savedSib = snapshotSiblings();
        }
        var matches = [];
        walk(root, function (n) {
            if (matchesNode(n, q)) matches.push(n);
        });
        var anc = new Set();
        matches.forEach(function (n) {
            ancestors(n).forEach(function (a) {
                anc.add(a);
            });
        });
        S.matches = matches;
        S.matchSet = new Set(matches);
        S.ancSet = anc;
        var changed = false;
        matches.forEach(function (n) {
            if (revealSync(n)) changed = true;
        });
        S.active = matches.length ? 0 : -1;
        if (changed) await mm.renderData();
        if (token !== S.searchToken) return;
        paintClasses();
        updateCount();
        announce(
            matches.length ? T.resultsAnnounce(matches.length) : T.noResult
        );
        if (matches.length) gotoActive();
    }

    function panelPad() {
        if (!panelEl.classList.contains("mme-open")) return {};
        var r = panelEl.getBoundingClientRect();
        return window.innerWidth <= 640
            ? { bottom: r.height + 16 }
            : { right: r.width + 16 };
    }

    function gotoActive() {
        var n = S.matches[S.active];
        if (!n) return;
        S.focus = n;
        decorate();
        updateCount();
        mm.centerNode(n, panelPad());
    }
    function stepMatch(dir) {
        if (!S.matches.length) return;
        S.active = (S.active + dir + S.matches.length) % S.matches.length;
        gotoActive();
    }

    async function clearSearchState() {
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = false;
        var restored = restoreFold();
        updateCount();
        if (restored) await mm.renderData();
        else paintClasses();
    }
    function clearSearchUi() {
        input.value = "";
        S.query = "";
        S.todoOnly = false;
        todoItem.el.setAttribute("aria-checked", "false");
        S.searchToken++;
        clearSearchState();
        searchWrap.classList.remove("mme-open");
    }

    input.addEventListener("input", function () {
        S.query = input.value;
        scheduleSearch();
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            clearTimeout(searchTimer);
            if (
                S.searchToken &&
                S.matches.length &&
                norm(input.value.trim()) === norm(S.query.trim()) &&
                S.searchActive
            ) {
                stepMatch(e.shiftKey ? -1 : 1);
            } else {
                S.query = input.value;
                runSearch();
            }
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            stepMatch(1);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            stepMatch(-1);
        } else if (e.key === "Escape") {
            e.stopPropagation();
            clearSearchUi();
            input.blur();
            focusNode(nearestShown(S.focus));
        }
    });
    input.addEventListener("blur", function () {
        if (!input.value && window.innerWidth <= 640 && !S.todoOnly) {
            searchWrap.classList.remove("mme-open");
        }
    });

    /* ------------------------------------------------------------------ */
    /* Level menu                                                          */
    /* ------------------------------------------------------------------ */

    async function structuralChange() {
        S.savedFold = null;
        S.savedSib = null;
        S.searchToken++;
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = !!(S.query.trim() || S.todoOnly);
        await mm.renderData();
        await mm.fit();
        if (S.searchActive) runSearch();
        else updateCount();
    }
    function setLevel(level) {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, n.state.depth >= level + 1 ? 1 : 0);
        });
        structuralChange();
    }
    function expandAll() {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, 0);
        });
        groups.forEach(function (g, p) {
            setSiblingsExpanded(p, true);
        });
        structuralChange();
    }

    var todoItem = {
        label: T.todoOnly,
        checkbox: true,
        run: function (b) {
            S.todoOnly = !S.todoOnly;
            b.setAttribute("aria-checked", S.todoOnly ? "true" : "false");
            runSearch();
        }
    };
    var levelItems = [1, 2, 3, 4].map(function (n) {
        return {
            label: T.levelItem(n),
            run: function () {
                setLevel(n);
            }
        };
    });
    levelItems.push({ label: T.expandAll, run: expandAll });
    if (cfg.hasTasks) {
        levelItems.push("-");
        levelItems.push(todoItem);
    }
    var levelDd = dropdown("layers", T.level, levelItems);

    var exportDd = dropdown("download", T.exportLabel, [
        {
            label: T.exportPng,
            run: function () {
                exportAs("png");
            }
        },
        {
            label: T.exportJpg,
            run: function () {
                exportAs("jpg");
            }
        },
        {
            label: T.exportSvg,
            run: function () {
                exportAs("svg");
            }
        },
        "-",
        {
            label: T.copyMd,
            run: function () {
                exportAs("copy");
            }
        }
    ]);
    function exportAs(kind) {
        var api = window.mmExport;
        if (api && api[kind]) api[kind]();
    }

    barEl.appendChild(searchWrap);
    barEl.appendChild(levelDd.el);
    barEl.appendChild(exportDd.el);
    // Menu is built before todoItem exists only if tasks are absent.
    if (!cfg.hasTasks) todoItem.el = h("span");

    /* Export hooks: strip transient visual state while an image is rendered. */
    window.mmeBeforeExport = function () {
        svgEl.classList.add("mme-exporting");
        cardEl.classList.remove("mme-show");
    };
    window.mmeAfterExport = function () {
        svgEl.classList.remove("mme-exporting");
    };

    /* ------------------------------------------------------------------ */
    /* Hover                                                               */
    /* ------------------------------------------------------------------ */

    function pathOf(n) {
        var s = new Set([n]);
        ancestors(n).forEach(function (a) {
            s.add(a);
        });
        if (!isFolded(n)) {
            (n.children || []).forEach(function (c) {
                s.add(c);
            });
        }
        return s;
    }

    function cardHtml(n) {
        var p = n.payload || {};
        var parts = [];
        function list(items, extra) {
            var li = items
                .slice(0, 5)
                .map(function (c) {
                    return "<li>" + esc(textOf(c)) + "</li>";
                })
                .join("");
            var more =
                items.length > 5
                    ? "<li>…" + esc(T.moreItems(items.length - 5)) + "</li>"
                    : "";
            return "<ul>" + li + more + "</ul>" + (extra || "");
        }
        if (p.less) return "";
        if (p.more) {
            var g = groups.get(parentOf.get(n));
            return (
                '<div class="mme-card-title">' +
                esc(textOf(n)) +
                "</div>" +
                list(g ? g.hidden : [])
            );
        }
        var needTitle = !!p.detail || isFolded(n);
        if (needTitle)
            parts.push(
                '<div class="mme-card-title">' + esc(textOf(n)) + "</div>"
            );
        if (p.detail)
            parts.push('<div class="mme-card-detail">' + p.detail + "</div>");
        if (isFolded(n)) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.childCount(realKids(n).length) + " · " + T.folded) +
                    "</div>" +
                    list(realKids(n))
            );
        }
        if (p.tasks) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.done + " " + p.tasks.done + "/" + p.tasks.total) +
                    "</div>"
            );
        }
        if (!parts.length) return "";
        if (p.detail)
            parts.push('<span class="mme-hint">' + esc(T.hint) + "</span>");
        return parts.join("");
    }

    function positionCard(n) {
        var g = gMap.get(n);
        if (!g) return;
        var fo = g.querySelector("foreignObject") || g;
        var r = fo.getBoundingClientRect();
        cardEl.style.left = "0px";
        cardEl.style.top = "0px";
        var cw = cardEl.offsetWidth;
        var ch = cardEl.offsetHeight;
        var left = Math.min(Math.max(8, r.left), window.innerWidth - cw - 8);
        var top = r.bottom + 8;
        if (top + ch > window.innerHeight - 8)
            top = Math.max(8, r.top - ch - 8);
        cardEl.style.left = left + "px";
        cardEl.style.top = top + "px";
    }
    function showCard(n) {
        var html = cardHtml(n);
        if (!html) {
            hideCard();
            return;
        }
        cardEl.innerHTML = html;
        var preview = cardEl.querySelector(".mme-card-detail");
        if (preview && preview.scrollHeight > preview.clientHeight + 1) {
            preview.classList.add("mme-clipped");
        }
        positionCard(n);
        cardEl.classList.add("mme-show");
    }
    function hideCard() {
        cardEl.classList.remove("mme-show");
    }
    var cardTimer = 0;
    function startHover(n, immediate) {
        S.hover = n;
        S.pathSet = pathOf(n);
        paintClasses();
        clearTimeout(cardTimer);
        cardTimer = setTimeout(
            function () {
                // The panel already shows the selected node's details.
                if (S.hover === n && S.selected !== n) showCard(n);
            },
            immediate ? 60 : 220
        );
    }
    function endHover() {
        S.hover = null;
        S.pathSet = null;
        clearTimeout(cardTimer);
        hideCard();
        paintClasses();
    }
    var noHover =
        window.matchMedia && window.matchMedia("(hover: none)").matches;
    svgEl.addEventListener("mouseover", function (e) {
        if (noHover || e.buttons) return;
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n === S.hover) return;
        if (!n || !n.state) endHover();
        else startHover(n, false);
    });
    svgEl.addEventListener("mouseleave", endHover);
    svgEl.addEventListener("mousedown", hideCard);
    svgEl.addEventListener("focusin", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n && n.state) {
            S.focus = n;
            startHover(n, true);
        }
    });
    svgEl.addEventListener("focusout", endHover);
    mm.zoom.on("start.mme", hideCard);

    /* ------------------------------------------------------------------ */
    /* Selection panel                                                     */
    /* ------------------------------------------------------------------ */

    function collectLinks(n) {
        var out = [];
        var seen = {};
        [n.content, n.payload && n.payload.detail].forEach(function (html) {
            if (!html) return;
            parseHtml(html)
                .querySelectorAll("a[href]")
                .forEach(function (a) {
                    var href = a.getAttribute("href");
                    if (!href || seen[href]) return;
                    seen[href] = 1;
                    out.push({
                        href: href,
                        text: (a.textContent || href).trim()
                    });
                });
        });
        return out;
    }

    function labelButton(n, extraHtml) {
        var b = h("button", { type: "button" });
        b.appendChild(h("span", { text: textOf(n) }));
        if (extraHtml) b.appendChild(h("small", { text: extraHtml }));
        b.addEventListener("click", function () {
            selectNode(n, { center: true });
        });
        return b;
    }

    function renderPanel(n) {
        var p = n.payload || {};
        panelEl.textContent = "";
        var chain = ancestors(n).reverse();
        var crumbs = h("ol", { class: "mme-crumbs", "aria-label": "path" });
        chain.forEach(function (a) {
            var li = h("li");
            li.appendChild(labelButton(a));
            crumbs.appendChild(li);
        });
        var closeBtn = iconButton("close", T.close, "", function () {
            deselect(true);
        });
        panelEl.appendChild(
            h("div", { class: "mme-panel-head" }, [crumbs, closeBtn])
        );

        var body = h("div", { class: "mme-panel-body" });
        body.appendChild(
            h("div", { class: "mme-panel-title", html: titleHtml(n) })
        );

        if (p.tasks) {
            var pct = Math.round((p.tasks.done / p.tasks.total) * 100);
            body.appendChild(h("h3", { text: T.progress }));
            body.appendChild(
                h("div", { class: "mme-progress-line" }, [
                    h("i", { style: "--p:" + pct + "%" }),
                    h("span", { text: p.tasks.done + "/" + p.tasks.total })
                ])
            );
        }
        if (p.detail) {
            body.appendChild(h("h3", { text: T.detail }));
            body.appendChild(h("div", { class: "mme-detail", html: p.detail }));
        }
        if (hasKids(n)) {
            var kids = realKids(n);
            body.appendChild(
                h("h3", { text: T.children + " (" + kids.length + ")" })
            );
            var ul = h("ul", { class: "mme-list" });
            kids.forEach(function (c) {
                var li = h("li");
                var extra =
                    hasKids(c) && c.payload && c.payload.count
                        ? "+" + c.payload.count
                        : "";
                li.appendChild(labelButton(c, extra));
                ul.appendChild(li);
            });
            body.appendChild(ul);
        }
        var links = collectLinks(n);
        if (links.length) {
            body.appendChild(h("h3", { text: T.links }));
            var lul = h("ul", { class: "mme-list" });
            links.forEach(function (l) {
                lul.appendChild(
                    h("li", null, [
                        h("a", {
                            href: l.href,
                            target: "_blank",
                            rel: "noopener noreferrer",
                            text: l.text
                        })
                    ])
                );
            });
            body.appendChild(lul);
        }

        var actions = h("div", { class: "mme-actions" });
        if (hasKids(n)) {
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: isFolded(n) ? T.expand : T.collapse,
                    onclick: function () {
                        mm.toggleNode(n, false).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: T.expandBelow,
                    onclick: function () {
                        walk(n, function (x) {
                            if (hasKids(x)) setFold(x, 0);
                        });
                        mm.renderData(n).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
        }
        actions.appendChild(
            h("button", {
                type: "button",
                class: "mme-btn",
                text: T.copyText,
                onclick: function () {
                    copyText(textOf(n));
                }
            })
        );
        body.appendChild(actions);
        panelEl.appendChild(body);
        panelEl.setAttribute("aria-label", T.panelLabel + ": " + textOf(n));
    }

    function copyText(text) {
        var done = function () {
            window.mmeToast(T.copied);
        };
        var fail = function () {
            window.mmeToast(T.copyFailed);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fail);
        } else fail();
    }

    async function reveal(n) {
        if (revealSync(n)) await mm.renderData();
    }

    // Expands/collapses the hidden siblings of a long child list. The clicked
    // button is swapped for its counterpart, so focus is handed over explicitly.
    async function toggleSiblings(p, keyboard) {
        var g = groups.get(p);
        if (!g) return;
        var expanding = !g.expanded;
        setSiblingsExpanded(p, expanding);
        await mm.renderData(p);
        var target = expanding ? g.hidden[0] : g.more;
        if (keyboard) await focusNode(target);
        else {
            S.focus = target;
            decorate();
        }
        announce(textOf(expanding ? g.less : g.more));
    }

    async function selectNode(n, opts) {
        opts = opts || {};
        if (isSentinel(n)) {
            await toggleSiblings(parentOf.get(n), opts.keyboard);
            return;
        }
        await reveal(n);
        S.selected = n;
        S.focus = n;
        // The panel shows the details now; a lingering hover card would repeat them.
        clearTimeout(cardTimer);
        hideCard();
        renderPanel(n);
        panelEl.classList.add("mme-open");
        doc.body.classList.add("mme-panel-open");
        await mm.setHighlight(n);
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
        if (opts.keyboard) panelEl.focus({ preventScroll: true });
        announce(T.panelLabel + ": " + textOf(n));
    }

    function deselect(refocus) {
        var had = S.selected;
        S.selected = null;
        panelEl.classList.remove("mme-open");
        doc.body.classList.remove("mme-panel-open");
        mm.setHighlight(null);
        if (refocus && had) focusNode(had);
    }

    /* ------------------------------------------------------------------ */
    /* Lightbox                                                            */
    /* ------------------------------------------------------------------ */

    function openLightbox(img) {
        var cap = "";
        var fig = img.closest && img.closest("figure");
        if (fig && fig.querySelector("figcaption"))
            cap = fig.querySelector("figcaption").textContent;
        else cap = img.getAttribute("alt") || "";
        lightbox.textContent = "";
        lightbox.appendChild(
            h("img", { src: img.currentSrc || img.src, alt: cap })
        );
        if (cap) lightbox.appendChild(h("p", { text: cap }));
        lightbox.classList.add("mme-open");
        lightbox.setAttribute("tabindex", "-1");
        lightbox.focus();
    }
    function closeLightbox() {
        lightbox.classList.remove("mme-open");
    }
    lightbox.addEventListener("click", closeLightbox);
    doc.addEventListener("click", function (e) {
        var img = e.target;
        if (img && img.tagName === "IMG" && panelEl.contains(img))
            openLightbox(img);
    });

    /* ------------------------------------------------------------------ */
    /* Pointer interaction on the map                                      */
    /* ------------------------------------------------------------------ */

    var downPos = null;
    svgEl.addEventListener("pointerdown", function (e) {
        downPos = { x: e.clientX, y: e.clientY };
    });
    var coarse =
        window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

    function nearestCircle(x, y, radius) {
        var best = null;
        var bestD = radius;
        svgEl.querySelectorAll("g.markmap-node > circle").forEach(function (c) {
            var r = c.getBoundingClientRect();
            var dx = r.left + r.width / 2 - x;
            var dy = r.top + r.height / 2 - y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d <= bestD) {
                best = c;
                bestD = d;
            }
        });
        return best;
    }

    svgEl.addEventListener("click", function (e) {
        var t = e.target;
        if (
            downPos &&
            Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5
        )
            return;
        if (t.closest && t.closest("a")) return;
        if (t.tagName === "IMG") {
            openLightbox(t);
            return;
        }
        if (t.tagName === "circle") return; // markmap toggles on its own handler
        var c = nearestCircle(e.clientX, e.clientY, coarse ? 22 : 10);
        if (c && c.__data__) {
            mm.toggleNode(c.__data__, e.ctrlKey || e.metaKey);
            return;
        }
        var g = t.closest && t.closest("g.markmap-node");
        if (g && g.__data__ && t.closest("foreignObject")) {
            selectNode(g.__data__, {}); // sibling-group buttons toggle instead
        } else if (!g && S.selected) {
            deselect(false);
        }
    });

    /* ------------------------------------------------------------------ */
    /* Keyboard tree navigation                                            */
    /* ------------------------------------------------------------------ */

    function visibleList() {
        var out = [];
        (function rec(n) {
            out.push(n);
            if (!isFolded(n)) (n.children || []).forEach(rec);
        })(root);
        return out;
    }

    async function focusNode(n) {
        if (!n) return;
        if (!isShown(n)) await reveal(n);
        S.focus = n;
        decorate();
        var g = gMap.get(n);
        if (g) g.focus({ preventScroll: true });
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
    }

    svgEl.addEventListener("keydown", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (!n || !n.state || e.altKey || e.ctrlKey || e.metaKey) return;
        var list = visibleList();
        var i = list.indexOf(n);
        var handled = true;
        switch (e.key) {
            case "ArrowDown":
                focusNode(list[Math.min(list.length - 1, i + 1)]);
                break;
            case "ArrowUp":
                focusNode(list[Math.max(0, i - 1)]);
                break;
            case "Home":
                focusNode(list[0]);
                break;
            case "End":
                focusNode(list[list.length - 1]);
                break;
            case "ArrowRight":
                if (hasKids(n) && isFolded(n)) mm.toggleNode(n, false);
                else if (hasKids(n)) focusNode(n.children[0]);
                break;
            case "ArrowLeft":
                if (hasKids(n) && !isFolded(n)) mm.toggleNode(n, false);
                else if (parentOf.get(n)) focusNode(parentOf.get(n));
                break;
            case "Enter":
                selectNode(n, { keyboard: true });
                break;
            case " ":
                if (isSentinel(n)) toggleSiblings(parentOf.get(n), true);
                else if (hasKids(n)) mm.toggleNode(n, e.shiftKey);
                break;
            default:
                handled = false;
        }
        if (handled) e.preventDefault();
    });

    /* ------------------------------------------------------------------ */
    /* Global shortcuts                                                    */
    /* ------------------------------------------------------------------ */

    function typing(el) {
        return (
            el &&
            (el.tagName === "INPUT" ||
                el.tagName === "TEXTAREA" ||
                el.isContentEditable)
        );
    }
    doc.addEventListener("keydown", function (e) {
        if (
            (e.key === "/" && !typing(e.target) && !e.ctrlKey && !e.metaKey) ||
            ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")
        ) {
            e.preventDefault();
            searchWrap.classList.add("mme-open");
            input.focus();
            input.select();
            return;
        }
        if (e.key !== "Escape") return;
        if (lightbox.classList.contains("mme-open")) {
            closeLightbox();
        } else if (
            openMenus.some(function (m) {
                return m.menu.classList.contains("mme-open");
            })
        ) {
            closeMenus();
        } else if (S.searchActive || input.value) {
            clearSearchUi();
        } else if (S.selected) {
            deselect(true);
        } else {
            endHover();
        }
    });

    /* ------------------------------------------------------------------ */
    /* Toolbar localisation (markmap-toolbar)                              */
    /* ------------------------------------------------------------------ */

    function enhanceZoomBar() {
        var bar = doc.querySelector(".mm-toolbar");
        if (!bar) return false;
        bar.classList.add("mme-ui", "mme-zoombar");
        bar.querySelectorAll(".mm-toolbar-item").forEach(function (item) {
            var title = item.getAttribute("title") || "";
            var local = T.zoomTitles[title] || title;
            item.setAttribute("title", local);
            item.setAttribute("role", "button");
            item.setAttribute("aria-label", local);
            item.setAttribute("tabindex", "0");
            item.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    item.click();
                }
            });
        });
        return true;
    }
    var zoomTries = 0;
    (function waitZoomBar() {
        if (enhanceZoomBar() || ++zoomTries > 40) return;
        setTimeout(waitZoomBar, 100);
    })();

    /* ------------------------------------------------------------------ */
    /* Boot                                                                */
    /* ------------------------------------------------------------------ */

    // Small screens: start with the first levels only so text stays readable.
    if (window.innerWidth <= 640 && cfg.mobileLevel) {
        walk(root, function (n) {
            if (!hasKids(n)) return;
            setFold(n, n.state.depth >= cfg.mobileLevel + 1 ? 1 : 0);
        });
    }

    updateCount();
    mm.renderData();
})();
</script>
  
</body>
</html>
