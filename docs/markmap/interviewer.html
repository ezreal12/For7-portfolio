  &gt; - 남은 것은 클라이언트 앱, 2021년 HTTP 캡처, 당시 기기 백업입니다.
  &gt; - 결과물은 부팅부터 도시 진입과 그 뒤 콘텐츠까지 진행시키는 복원 서버입니다.
- 되는 것: 로그인과 도시 진입은 실기기까지 확인
  &gt; | 구간 | 확인한 곳 |
  &gt; |---|---|
  &gt; | 업데이트 확인, 로그인(HTTP) | 에뮬레이터, 휴대폰, 태블릿 |
  &gt; | 게이트 접속, 도시 진입 | 에뮬레이터, 휴대폰, 태블릿 |
  &gt; | 프롤로그, 7일 반복, 3회차 진입 | 에뮬레이터 |
  &gt; | 영웅 육성, 던전류 | 에뮬레이터(능력치 배율을 올려서 전투), 태블릿은 던전 1판(패배)까지 |
  &gt; | PC 없이 단독 실행 | 에뮬레이터, 휴대폰, 태블릿에서 설치와 실행 |
  &gt;
  &gt; 태블릿의 도시와 던전 확인은 시험용으로 만든 계정 상태를 복사해 쓴 것입니다.
- 안 되는 것: 정식 결말, 이벤트 대부분, 호출의 절반
  &gt; - 정식 결말은 화면으로 한 번도 보지 못했습니다.
  &gt; - 복원한 이벤트 약 33묶음 중 약 28묶음은 화면을 못 봤습니다.
  &gt; - 서버 호출 1,334개 중 647개(약 48.5%)에만 핸들러나 의도적 무응답이 있습니다.
  &gt; - 영상과 스크린샷은 이 저장소에 없습니다.
- 작업량: 작업일 13일에 커밋 230개
  &gt; - 5월 21~23일, 9월 22~29일, 10월 12~25일에 모여 있습니다.
  &gt; - 분석 보고서는 80여 편입니다.
- 범위: 1인 프로젝트
  &gt; | 만든 것 | 가져다 쓴 것 |
  &gt; |---|---|
  &gt; | 서버, 복원 도구, 검증 도구, 테스트, 분석 문서 | REA 같은 외부 도구, 오픈소스 라이브러리, 클라이언트 앱, 보존된 자료 |
  &gt;
  &gt; 소스 코드와 게임 데이터는 올리지 않았습니다.

## 출발점: 서버 소스는 없고 앱과 캡처만 남았다
- 남아 있던 것
  - 클라이언트 앱과 리소스
    &gt; - 서버가 어떤 호출을 어떤 모양으로 기대하는지 읽어 낼 가장 큰 원천입니다.
    &gt; - 호출 코드뿐 아니라 데이터 표와 계산 코드도 들어 있습니다.
  - 2021년 HTTP 캡처
    &gt; - Burp 캡처 4세트, 합계 512건입니다.
    &gt; - 로그인 구간 응답의 정답지로 씁니다.
  - 2021년 디바이스 백업
    &gt; - 보존된 게임 파일 묶음입니다.
    &gt; - 서버 소스는 들어 있지 않습니다.
- 없는 것
  - 서버 소스
    &gt; - 어떤 백업에도 없습니다.
    &gt; - 서버 쪽 규칙은 모두 클라이언트에서 거꾸로 알아내야 합니다.
  - 게임 플레이 구간의 캡처
    &gt; - 캡처는 HTTP 로그인 구간뿐입니다.
    &gt; - 게이트와 게임 구간의 서버 응답에는 정답지가 없습니다.
- 원본 서버 구조(추정)
  &gt; 1. 클라이언트가 로드 밸런서를 거쳐 게이트 서버에 접속한다.
  &gt; 2. 게이트가 게임 서버(Python과 C++)로 넘긴다.
  &gt; 3. 게임 서버가 DB를 쓴다.
  &gt;
  &gt; 문자열과 패킷에서 끌어낸 추정이고 직접 관찰한 것은 아닙니다.
- 풀어야 할 세 가지 문제와 이 지도의 대응
  &gt; | 층 | 질문 | 이 지도에서 |
  &gt; |---|---|---|
  &gt; | 응답 | 원본 서버의 응답을 어떻게 알아낼 것인가 | 「응답 문제」 |
  &gt; | 연결 | 클라이언트를 우리 서버에 어떻게 붙일 것인가 | 「연결 문제」 |
  &gt; | 규칙 | 서버만 알던 규칙을 클라이언트의 표와 코드에서 어떻게 다시 세울 것인가 | 「규칙 문제」 |

## 응답 문제: 정답지가 있으면 원본 그대로, 없으면 클라이언트에서 거꾸로
- 정답지에는 순서가 있다
  &gt; 1. 2021 패킷 캡처
  &gt; 2. 복원한 클라이언트 소스와 데이터 표
  &gt; 3. 둘로 확인되지 않은 값은 코드 주석에 추론 또는 복원 서버의 결정으로 구분
  &gt;
  &gt; HTTP 구간은 캡처와 소스를 함께, 게이트 구간은 정답지가 없어서 소스만 근거로 합니다. 서버 로그는 정답지가 아니라 클라이언트가 응답에 어떻게 반응했는지 보는 관찰 수단입니다.
- 캡처가 있는 응답은 원본 바이트 그대로
  &gt; - 캡처에 있는 응답은 바이트와 Content-Type까지 같게 돌려줍니다.
  &gt; - 5월 실기기에서 업데이트 확인 응답의 호스트를 IP로 바꿨더니 클라이언트가 업데이트 확인에서 멈췄습니다.
  &gt; - 이 일이 원칙의 출발점입니다.
- 캡처가 없는 게이트 구간은 로그의 증상으로 맞춘다
  &gt; - 상태 전이 경고, 약 16초 재접속, 약 30초 로그아웃, 약 15초 끊김이라는 네 증상이 서버가 답해야 할 네 가지를 알려 줬습니다.
  &gt; - 자세한 과정은 「막혔던 일」의 도시 진입 한 건에 있습니다.
- 확인 수단과 그 한계
  - 캡처 재생 대조기
    &gt; - 2021 캡처의 요청을 서버에 재생해 응답을 같음, 다름, 상태 차이로 판정합니다.
    &gt; - 캡처 세트마다 엔드포인트 17~21묶음을 재생해 같음 12~16, 일부 일치 1, 다름 3~4, 상태 차이 1이었습니다.
    &gt; - 다름은 토큰, 접수 번호, 호출자 주소 같은 요청별 응답과 캡처 안에서도 순서가 흔들리는 응답 두 가지입니다.
    &gt; - 서버가 캡처 응답을 그대로 돌려주도록 만들었으므로 이 일치는 독립 검증이 아닙니다.
  - 응답 길이와 해시 고정
    &gt; - 정적 응답의 길이와 SHA-256을 테스트로 고정했습니다.
    &gt; - 업데이트 확인에서 멈추는 일을 막는 가장 직접적인 장치입니다.
  - 변환기 정합성
    &gt; - Burp 캡처를 HAR 1.2로 바꾸는 변환기를 만들었습니다.
    &gt; - 게스트 로그인 세트 106건 중 응답 본문이 있는 96건의 SHA-256이 원본과 일치했습니다.
  - 능력치 대조
    &gt; - 복원한 클라이언트 소스의 계산 코드를 python2.7로 따로 실행한 값과 서버 계산을 비교했습니다.
    &gt; - 무작위 계정 상태 40개(영웅 160건, 고유 94종)와 장비 492개에서 오차 1e-9 이내로 일치했습니다.
    &gt; - 서버의 계산이 이 코드를 옮긴 것이라 독립 검증은 아니고, 옮기는 과정의 실수를 잡는 용도입니다.
  - 서버 호출을 복원한 스텁과 대조하는 테스트
    &gt; - 서버가 클라이언트에 보내는 모든 호출을 복원한 스텁과 대조합니다.
    &gt; - 테스트 파일 100여 개가 씁니다.
    &gt; - 잘못된 키 이름을 잡아낸 사례가 기록되어 있습니다.
  - 엔진만으로 한 회차를 걸어 보는 테스트
    &gt; - 화면 없이 게임 엔진만으로 한 회차를 진행해 막히는 조건을 짚습니다.
    &gt; - 1초 안에 끝납니다.
- 시험 수단과 원본 규칙을 구분한다
  &gt; - 능력치 배율, 시계 조정, 호감도 설정 같은 시험 수단으로 확인한 것은 원본 규칙이 아니라고 일지에 구분해 적습니다.
  &gt; - 검증용 값이 서버 규칙으로 오해되지 않게 하려는 것입니다.
- 테스트 규모와 재실행 결과
  &gt; | 항목 | 값 |
  &gt; |---|---|
  &gt; | 서버 테스트 함수 | 약 3,200개(정적 집계, 도구·기기 구성 테스트 제외) |
  &gt; | 2026-10-25 재실행(Windows) | 4,005 통과, 3 실패, 2 오류, 3 건너뜀, 96초 |
  &gt; | 실패 3 | 기기 구성의 소켓 테스트 |
  &gt; | 오류 2 | Windows 환경변수 길이 한도를 넘는 매개변수 |
  &gt;
  &gt; 운영 환경인 Ubuntu에서는 다시 돌리지 않았습니다. 통과 수가 함수 수보다 큰 것은 매개변수화한 테스트가 사례마다 한 건으로 세어지기 때문으로 보입니다.
- 에뮬레이터와 실기기 확인 방식
  &gt; - adb로 화면을 조작하고 서버 로그와 클라이언트 엔진 로그의 상태 전이로 성공을 판정합니다.
  &gt; - 화면 증거 번호를 남깁니다.
  &gt; - 스크린샷 파일은 저장소에 올리지 않았습니다.

## 연결 문제: 클라이언트를 복원 서버에 붙이기
- 이름 해석과 중계
  &gt; - 게임 도메인을 복원 서버로 돌립니다.
  &gt; - 같은 443 포트로 오는 TLS 서버명이 있는 접속은 HTTP 서비스로, 없는 접속은 게이트 서버로 나눕니다.
  &gt; - 서버명 없는 TCP가 HTTPS 서버로 가던 설정은 5월에 고쳤습니다.
- HTTP 서비스
  &gt; - 설정, 업데이트 확인, 로그인, 결제, 텔레메트리에 답합니다.
  &gt; - 부팅 흐름을 22단계로 재현합니다. 테스트에서는 패치 다운로드와 게이트 두 단계가 건너뛰어집니다.
  &gt; - 캡처에 있는 응답은 그대로, 없는 경로는 스텁과 경고 로그로 답합니다.
  &gt; - 로그인 서명은 검증하되 게스트 로그인 같은 일부는 불일치해도 경고만 남기고 통과시킵니다.
- 게이트 서버
  - 프레이밍과 압축
    &gt; - 길이 접두 프레임 안에 protobuf 메시지가 들어 있고, 핸드셰이크 뒤에는 스트리밍 압축이 걸립니다.
    &gt; - 이 지도는 압축 이외의 선로 처리를 다루지 않습니다.
  - 접속 안정화
    &gt; - 예외를 접속 단위로 가둡니다.
    &gt; - 중복 로그인을 정리합니다.
    &gt; - 토큰 대조는 엄격, 기록만, 끔의 세 모드가 있습니다.
    &gt; - 종료 때 접속을 먼저 닫아서 90초 걸리던 종료가 1초가 됐습니다.
  - 실제 기기 주소
    &gt; - 중계 뒤에서는 모든 접속이 같은 주소로 보입니다.
    &gt; - 중계가 붙이는 프록시 프로토콜 헤더를 게이트가 해석해서 실제 기기 주소를 봅니다.
- 앱 안 서버: PC 없이 기기만으로 실행
  - 만든 이유와 제약
    &gt; - 기기에는 nginx가 없고 일부 의존성은 빌드할 수 없어서 PC 구성과 달라졌습니다.
    &gt; - 64비트와 API 24 이상, VPN 허용이 필요하고 다른 VPN과 함께 쓸 수 없습니다.
  - 구성
    &gt; | 부분 | 방식 |
    &gt; |---|---|
    &gt; | 서버 | 공식 CPython 3.14 Android 배포본을 JNI로 게임과 다른 프로세스에서 실행 |
    &gt; | 접속 | 앱 안 VPN이 DNS 질의만 받는 터널을 만들고 접속을 서버의 일반 포트로 돌림 |
    &gt; | 웹 프레임워크 | Starlette 위의 FastAPI 대체 패키지 |
    &gt; | 로그 | 조각 파일, 총량 300MB 제한, 반복 줄이기, 비밀값 가리기 |
  - 같은 코드를 두 구성에서 검증
    &gt; - PC에서 진짜 FastAPI와 기기 구성(CPython 3.14와 대체 패키지) 두 가지로 전체 테스트를 돌렸습니다.
    &gt; - 응답 119건을 비교해 같음 113, 알려진 차이 6(자동 문서 화면 주소 계열), 문제 0이었습니다.
    &gt; - 비교는 PC에서 한 것이고 커밋 메시지 기록입니다.
  - 비행기 모드에서만 막히던 일
    &gt; 1. DNS 질의가 가지 않았다.
    &gt; 2. 요청 줄의 절대 주소를 서버가 처리하지 못했다.
    &gt;
    &gt; VPN 경로를 추가하고 절대 주소 처리를 넣어 풀었습니다.
  - 계정 데이터 보존
    &gt; - 업데이트마다 계정 데이터가 초기화되는 문제가 있었습니다.
    &gt; - 건드리지 않았을 때만 새 묶음으로 교체하고 이전 파일은 따로 남기는 방식으로 풀었습니다.

## 규칙 문제: 클라이언트 스크립트에서 서버 규칙을 다시 세우기
- 스크립트를 읽을 수 있는 형태로 되돌리기
  &gt; - 서버가 지켜야 할 호출 이름, 인자 키, 데이터 표는 클라이언트 스크립트 안에 있습니다.
  &gt; - REA는 게임 스크립트를 다루지 못해서 이 연구에서 만든 도구로 읽었습니다.
  &gt; - 클라이언트 스크립트 4,369개 중 4,365개가 소스로 복원됐고 4개는 실패했습니다.
  &gt; - 복원이 틀리면 그 위의 서버 규칙이 모두 어긋나기 때문에 따로 검증하는 도구를 붙였습니다.
- RPC 목록 추출
  &gt; | 항목 | 값 |
  &gt; |---|---|
  &gt; | 서버 호출 | 1,334개 |
  &gt; | 한계 | 이름이나 인자를 변수로 넘기는 호출은 놓침 |
- 데이터 표 내보내기
  &gt; - 표를 실행하지 않고 구문 트리로만 읽어 JSON으로 냅니다.
  &gt; - 서버용 JSON은 63개이고 원본 표 여러 개를 묶은 것입니다.
  &gt; - 원본이 아니라 추정으로 채운 구간은 따로 표시합니다.
- 아바타 계층과 RPC 핸들러
  &gt; - 핸들러에 표시를 붙이면 이름이 곧 호출 이름입니다.
  &gt; - 핸들러가 584개, 의도적 무응답으로 선언한 호출이 63개입니다.
  &gt; - 핸들러가 없는 호출은 로그만 남기고 빈 결과로 풀어서 클라이언트가 잠기지 않게 합니다.
  &gt; - 결과를 읽는 콜백은 풀지 않고 경고합니다.
- 게임 규칙 모듈
  &gt; - 규칙은 표, 계정 상태, 거절 판정, 클라이언트용 변환, 스냅샷 조각의 순서로 같은 모양을 따릅니다.
  &gt; - 기능 모듈이 약 85개, 이벤트 규칙 모듈이 38종입니다.
  &gt; - 스냅샷, 갱신 푸시, 전투는 같은 조립기로 영웅 데이터를 만듭니다.
- 상태 저장
  &gt; - 계정당 JSON 하나입니다.
  &gt; - 임시 파일에 쓴 뒤 교체하고, 깨진 파일은 따로 옮겨 둡니다.
- 서버 시계: 서비스 말기를 되풀이해 한정 이벤트를 다시 연다
  &gt; | 단계 | 방식 |
  &gt; |---|---|
  &gt; | 처음 | 연도만 접은 시계 |
  &gt; | 다음 | 한국 벽시계를 UTC처럼 사용 |
  &gt; | 현재 | 서비스 말기 구간(코드에서 26주, 182일)을 되풀이 |
- 계정
  &gt; - ID/PW 가입에 scrypt 해시를 씁니다.
  &gt; - 8회 실패하면 60초 동안 잠급니다.
- 전투: 클라이언트가 계산하고 서버는 요청과 보상만
  &gt; - 서버는 요청, 응답, 종료, 보상만 주고받습니다.
  &gt; - 던전류는 정산과 보상 지급까지 구현했습니다.
  &gt; - 행동과 구역 전투 보상, 회차 끝 보상, 사건 보상은 비어 있습니다.
  &gt; - 온라인 전투가 필요한 콘텐츠는 클라이언트가 직접 전투하게 돌려보냅니다. 클라이언트를 더 수정하지 않아도 되는 대신 판마다 자동 전투 버튼을 눌러야 하는 콘텐츠가 있습니다.

## 알아낸 것
- 서버가 지켜야 할 약속은 클라이언트에 이미 있었다
  &gt; - 호출 이름 1,334개와 인자 키가 스크립트에 있습니다.
  &gt; - 서버용 데이터 표 63개가 클라이언트 표에서 나옵니다.
  &gt; - 서버 코드의 기준은 문서가 아니라 클라이언트가 읽는 필드, 타입, 순서입니다.
- 게이트 구간의 서버 응답은 시간 제한으로 드러난다
  &gt; | 답하지 않으면 | 증상 |
  &gt; |---|---|
  &gt; | 계정 엔티티를 먼저 안 보냄 | 상태 전이 경로 없음 경고 |
  &gt; | 이벤트 조회에 안 답함 | 약 16초 뒤 재접속 반복 |
  &gt; | 생존 신호에 안 답함 | 약 30초 뒤 스스로 로그아웃 |
  &gt; | 상태 전환 요청에 요청값을 안 되돌림 | 약 15초 뒤 접속 끊김 |
- 결과를 읽는 콜백은 빈 결과로 풀면 안 된다
  &gt; - 결과 값을 읽는 콜백은 18개이고 그중 17개에 핸들러를 만들었습니다.
  &gt; - 빈 결과로 풀면 클라이언트가 결과를 읽다가 깨집니다.
- 이벤트는 서버가 알려 주는 날짜로 열리고 닫힌다
  &gt; - 서비스 말기 구간을 되풀이하는 서버 시계를 만들어 한정 이벤트를 다시 열었습니다.
  &gt; - 표의 이상한 행이 시계 구간 안에 있으면 그 탭이 죽습니다.

## 막혔던 일
- 도시 진입 한 건 (5월 말에 가장 마지막으로 푼 문제)
  - 서버가 답해야 하는 순서
    &gt; 1. 접속 응답
    &gt; 2. 계정 엔티티
    &gt; 3. 로그인 정보 수신
    &gt; 4. 아바타 엔티티와 스냅샷
    &gt; 5. 플레이 전환과 각종 요청에 응답
  - 증상과 원인
    &gt; | 증상 | 원인 | 고침 |
    &gt; |---|---|---|
    &gt; | 상태 전이 경로 없음 경고 | 계정 엔티티를 보내지 않음 | 계정 엔티티를 먼저 보냄 |
    &gt; | 로딩 약 16초 뒤 재접속 반복 | 이벤트 조회에 답하지 않음 | 확인 응답과 빈 결과 |
    &gt; | 약 30초 뒤 스스로 로그아웃 | 생존 신호에 답하지 않음 | 받는 즉시 응답 |
    &gt; | 약 15초 뒤 접속 끊김 | 상태 전환 요청에 답하지 않음 | 응답에 요청값을 되돌림(디스어셈블로 확인) |
  - 반증된 가설
    &gt; - 접속 응답이 상태 전이를 일으킨다고 가정했습니다.
    &gt; - 로그의 전이 경로 정의를 보고 반증했습니다.
- 로그인 원인의 오진
  &gt; 1. 가설: 게이트 서버가 없어서 로그인이 안 된다.
  &gt; 2. 확인: 전 포트 캡처에서 연결 28개가 모두 TLS였고 게이트 접속은 0건이었다.
  &gt; 3. 확정된 원인: 서버 목록 응답이 13바이트 스텁이었다.
  &gt; 4. 그 뒤에 드러난 두 번째 막힘: 서버명 없는 TCP가 HTTPS 서버로 가던 중계 설정.
- 기준선이 무너져 있던 날 (10월 12일)
  &gt; - 서버 응답, 호스트 설정, DNS, 인증서, 패킷 캡처 설정에서 원본과 어긋난 곳이 여덟 군데 나왔습니다.
  &gt; - 응답을 2021 원본으로 되돌리고 DNS, 인증서, 캡처를 다시 구성했습니다.
  &gt; - 응답 길이와 해시 고정 테스트, 캡처 재생 대조기를 추가했습니다.
- 게임만 종료하면 서버에 붙지 못함
  &gt; 1. 증상: 게임 프로세스만 종료하고 다시 켜면 접속이 안 된다.
  &gt; 2. 원인: VPN 장치가 사라지며 안드로이드가 서버의 듣는 소켓을 닫았고 accept가 초당 약 4천 번 EINVAL로 실패했다.
  &gt; 3. 고침: 서버가 소켓을 다시 열고 접속 화면이 단계적으로 재시도한다.
  &gt; 4. 놓친 이유: 이전 테스트는 항상 두 프로세스를 함께 종료했다.
- 프롤로그가 빈 맵으로 멈춤
  &gt; - 튜토리얼 전투 화면이 비어 있었고 클라이언트 로그의 트레이스백이 단서였습니다.
  &gt; - 서버가 보낸 전투 데이터에 필요한 키가 없었습니다.
  &gt; - 영웅별 스킬과 능력치를 표에서 채워 고쳤습니다.
- 앱을 켤 때마다 새 계정이 됨
  &gt; - 진행 상태를 연결마다 바뀌는 기기 식별자로 찾고 있었습니다.
  &gt; - 원본 순서대로 로그인 정보를 받은 뒤에 계정을 찾도록 바꿨습니다.
- 태블릿만 로그인 실패
  &gt; - 중계 뒤에서 모든 접속이 같은 주소로 보여 에뮬레이터용 주소를 받았습니다.
  &gt; - 프록시 프로토콜을 해석해 고쳤고, 테스트 7건을 먼저 썼습니다.
- 상점 아이템 탭이 열리지 않음
  &gt; - 표의 한 행에 이상한 값이 있었고 그 행이 서버 시계 구간 안에 있었습니다.
  &gt; - 시계 구간에서 그 행의 기간을 빼고 가드 테스트를 추가했습니다.
- 공지 창이 비어 보임
  &gt; - 본문에 들어간 `[` 한 글자가 클라이언트 서식 태그의 시작 문자였습니다.
  &gt; - 본문에서 빼서 고쳤습니다.
- 로그에 평문 비밀번호
  &gt; - 게임 로그인 SDK가 logcat에 찍던 테스트 계정 비밀번호가 앱 안 로그에 12군데 저장되고 있었습니다.
  &gt; - 쓰기 전에 가리게 바꾸고 재검색에서 일치 0건을 확인했습니다.

## REA는 어디에 썼나
- REA란: 역공학 도구 모음(6.4.0)
  &gt; - Ghidra를 기본 분석기로 쓰는 네이티브 분석, HTTP 캡처 판독, 기기 조작 도구를 제공합니다.
  &gt; - 결과마다 Evidence ID가 붙습니다.
  &gt; - REA를 넣은 것은 92번째 커밋이어서 5월의 첫 도시 진입은 REA 없이 이뤄졌습니다.
- 서버 응답을 바꿀 때 근거 형식으로 썼다
  &gt; - 10월 12일에 응답을 2021 캡처 원본으로 되돌릴 때 근거 보고서가 REA가 판독한 캡처 4세트의 Evidence ID와 건수, 해시를 인용했습니다.
  &gt; - 이후 응답을 바꾸는 작업도 같은 형식으로 근거를 적었습니다.
  &gt; - 게이트 구간의 응답 값은 대부분 클라이언트 스크립트에서 나왔습니다.
- 네이티브 라이브러리 분석
  &gt; | 항목 | 값 |
  &gt; |---|---|
  &gt; | 대상 | 39MB ARM64 라이브러리, 심볼 없음 |
  &gt; | 프로시저 | 77,279개 |
  &gt; | 문자열 | 52,708개 |
  &gt; | 첫 분석 | 13분 58초(호스트 RAM 13GB, 분석 프로세스 최대 3.0GB, 에뮬레이터 동시 실행) |
  &gt; | 분석 결과를 연 뒤 | 첫 개요 조회 734.9초, 이후 조회 0.0~0.8초 |
  &gt;
  &gt; 매번 새로 분석하면 14분을 치르기 때문에 분석 결과를 한 번 만들어 이어서 조회합니다.
- HTTP 캡처 판독
  - 흐름
    &gt; 1. Burp 캡처를 HAR 1.2로 변환한다(변환기는 이 연구에서 만들었다).
    &gt; 2. REA가 캡처를 판독해 증거 JSON을 낸다.
    &gt; 3. 요청을 호스트, 메서드, 경로로 묶어 문서와 서버 코드에 대조한다.
  - 결과
    &gt; - 4세트 512건을 호스트 30개, 요청 44묶음으로 정리했습니다.
    &gt; - 게임 관련 22묶음은 연구 초기에 정리한 API 문서에 경로가 모두 나와 있었고, 문서가 캡처와 어긋나지 않는지 확인하는 용도였습니다.
  - 정합성
    &gt; - 게스트 로그인 세트 106건 중 응답 본문이 있는 96건을 확인했습니다.
    &gt; - REA가 계산한 SHA-256이 원본 캡처에서 계산한 값과 모두 같았습니다.
- 기기 조작 도구 검증
  &gt; - 파일 넣기, 가져오기, 앱 설치, 삭제, 실행 도구를 에뮬레이터에서 실제로 호출했습니다.
  &gt; - 확인한 뒤 시험 파일을 지웠습니다.
- REA가 다루지 못한 것
  &gt; | 대상 | 이유 |
  &gt; |---|---|
  &gt; | 게임 스크립트(NeoX) | REA의 대상이 아님 |
  &gt; | 게이트 구간 pcap | 범위 밖 |
  &gt; | ARM64 섹션 레이아웃 | 해당 기능이 x86-64 전용 |
  &gt;
  &gt; 이 빈자리를 공개된 도구와 이 연구에서 만든 도구가 채웠습니다.
- 증거 표기 규칙
  &gt; - REA 근거는 Evidence ID와 대상 SHA-256을 함께 적습니다.
  &gt; - 스크립트와 pcap 같은 REA 밖 근거는 파일 경로와 줄 번호로 적습니다.
  &gt; - 캡처에 로그인 토큰이 있어서 REA의 결과 파일은 저장소에 올리지 않았습니다.

## 한계와 아직 모르는 것
- 서버만 알던 값
  &gt; - 밸런스 값과 전투 정산은 클라이언트에 없습니다.
  &gt; - 던전류 정산은 구현했지만, 서버만 아는 밸런스 값은 클라이언트에서 확인되지 않습니다.
- 게이트 구간의 정답지 없음
  &gt; - 캡처가 없어서 응답의 순서와 값 대부분이 클라이언트 소스에서 거꾸로 세운 추론입니다.
  &gt; - 이 구간의 검증은 클라이언트 동작과 로그에 의존합니다.
- 구현하지 못한 범위
  &gt; - 서버 호출의 약 48.5%만 처리하고, 기능의 48.5%가 동작한다는 뜻은 아닙니다.
  &gt; - 행동과 구역 전투 보상, 회차 끝 보상, 사건 보상은 비어 있습니다.
  &gt; - 전투 서버가 없어서 온라인 전투가 필요한 콘텐츠 일부는 부분 지원입니다.
- 화면으로 확인하지 못한 것
  &gt; - 정식 결말은 하나도 보지 못했습니다.
  &gt; - 복원한 이벤트 약 33묶음 중 약 28묶음은 화면을 못 봤습니다.
  &gt; - 이벤트 규칙 모듈은 38종입니다. 이 수와 33묶음은 세는 단위가 다릅니다.
- 앱 안 서버의 제약

        if (isSentinel(n)) return "#8c959f";
        var path = String(n.state.path || "").split(".");
        if (path.length < 2) return "#24292f";
        var base = branchScale(path.slice(0, 2).join("."));
        if (path.length < 3) return base;
        var c = d3.hsl(base);
        c.l = Math.min(
            0.62,
            Math.max(0.32, c.l + (((sibIndex.get(n) || 0) % 3) - 1) * 0.09)
        );
        return String(c);
    }
    function lineWidthOf(n) {
        if (isSentinel(n)) return 1.5;
        var d = n.state.depth;
        return d === 1 ? 5 : Math.max(1.5, 4 - (d - 2) * 0.7);
    }
    var reduceMotion =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var motionMs = reduceMotion ? 0 : 350;
    // No animation while the first layout settles (hidden siblings are removed
    // right after markmap's own first render).
    mm.setOptions({
        color: colorOf,
        lineWidth: lineWidthOf,
        duration: 0
    });

    /* ------------------------------------------------------------------ */
    /* Fit handling                                                        */
    /* ------------------------------------------------------------------ */

    var origFit = mm.fit.bind(mm);
    mm.fit = function () {
        S.userMoved = false;
        return origFit.apply(null, arguments);
    };
    var fitTimer = 0;
    function fitSoon(delay) {
        if (S.userMoved) return;
        clearTimeout(fitTimer);
        fitTimer = setTimeout(
            function () {
                if (!S.userMoved) origFit();
            },
            delay == null ? 200 : delay
        );
    }
    mm.zoom.on("zoom.mme", function (ev) {
        if (ev && ev.sourceEvent) S.userMoved = true;
    });
    svgEl.addEventListener(
        "wheel",
        function () {
            S.userMoved = true;
        },
        { passive: true }
    );
    window.addEventListener("resize", function () {
        fitSoon(250);
    });
    window.addEventListener("orientationchange", function () {
        fitSoon(350);
    });
    window.addEventListener("load", function () {
        fitSoon(250);
    });
    if (doc.fonts && doc.fonts.ready) {
        doc.fonts.ready.then(function () {
            fitSoon(250);
        });
    }
    svgEl.addEventListener(
        "load",
        function (e) {
            if (e.target && e.target.tagName === "IMG") fitSoon(350);
        },
        true
    );

    /* ------------------------------------------------------------------ */
    /* Decoration (ARIA + state classes), re-applied after every render    */
    /* ------------------------------------------------------------------ */

    svgEl.setAttribute("role", "tree");
    // markmap wraps every node in one plain <g>; without this the browser does
    // not expose the nodes as tree items of the tree above.
    mm.g.attr("role", "none");
    svgEl.setAttribute("aria-label", cfg.title || T.treeLabel);

    // markmap appends nodes children-first; assistive tech reads flat tree
    // items in DOM order, so keep the DOM in tree (pre-order) order.
    function orderDom() {
        var pre = visibleList().filter(function (n) {
            return gMap.has(n);
        });
        if (!pre.length) return;
        var parent = gMap.get(pre[0]).parentNode;
        var current = Array.prototype.filter.call(
            parent.children,
            function (c) {
                return c.classList && c.classList.contains("markmap-node");
            }
        );
        var same =
            current.length === pre.length &&
            current.every(function (g, i) {
                return g === gMap.get(pre[i]);
            });
        if (same) return;
        var active = doc.activeElement;
        pre.forEach(function (n) {
            parent.appendChild(gMap.get(n));
        });
        if (active && active !== doc.activeElement && svgEl.contains(active)) {
            active.focus({ preventScroll: true });
        }
    }

    function decorate() {
        gMap.clear();
        if (!S.focus || !isShown(S.focus))
            S.focus = nearestShown(S.focus || root);
        svgEl.querySelectorAll("g.markmap-node").forEach(function (g) {
            var n = g.__data__;
            if (!n || !n.state) return;
            gMap.set(n, g);
            var p = parentOf.get(n);
            g.setAttribute("role", "treeitem");
            g.setAttribute("aria-level", n.state.depth);
            g.setAttribute("aria-setsize", p ? p.children.length : 1);
            g.setAttribute(
                "aria-posinset",
                (p ? p.children.indexOf(n) : 0) + 1
            );
            if (hasKids(n))
                g.setAttribute("aria-expanded", isFolded(n) ? "false" : "true");
            else g.removeAttribute("aria-expanded");
            g.setAttribute(
                "aria-selected",
                n === S.selected ? "true" : "false"
            );
            g.setAttribute("aria-label", labelOf(n));
            g.setAttribute("tabindex", n === S.focus ? "0" : "-1");
            Array.prototype.forEach.call(g.children, function (c) {
                c.setAttribute("aria-hidden", "true");
            });
            g.querySelectorAll("a, img").forEach(function (e) {
                e.setAttribute("tabindex", "-1");
            });
            g.querySelectorAll("img.mme-img").forEach(function (img) {
                img.setAttribute("draggable", "false");
            });
        });
        orderDom();
        paintClasses();
    }

    function paintClasses() {
        var searching = S.searchActive && S.matchSet.size > 0;
        svgEl.classList.toggle("mme-searching", searching);
        svgEl.classList.toggle("mme-focusing", !!S.pathSet && !searching);
        var activeNode = S.matches[S.active];
        gMap.forEach(function (g, n) {
            g.classList.toggle("mme-sentinel", isSentinel(n));
            g.classList.toggle("mme-match", S.matchSet.has(n));
            g.classList.toggle("mme-active", activeNode === n);
            g.classList.toggle("mme-anc", S.ancSet.has(n));
            g.classList.toggle("mme-on-path", !!S.pathSet && S.pathSet.has(n));
        });
        svgEl.querySelectorAll("path.markmap-link").forEach(function (p) {
            var d = p.__data__;
            if (!d) return;
            p.classList.toggle("mme-sentinel-link", isSentinel(d.target));
            p.classList.toggle(
                "mme-anc",
                S.ancSet.has(d.target) || S.matchSet.has(d.target)
            );
            p.classList.toggle(
                "mme-on-path",
                !!S.pathSet &&
                    S.pathSet.has(d.target) &&
                    S.pathSet.has(d.source)
            );
        });
    }

    var firstRender = true;
    var origRender = mm.renderData.bind(mm);
    mm.renderData = function (t) {
        return origRender(t).then(function () {
            decorate();
            if (firstRender) {
                firstRender = false;
                fitSoon(60);
                setTimeout(function () {
                    mm.setOptions({ duration: motionMs });
                }, 400);
            }
        });
    };

    /* ------------------------------------------------------------------ */
    /* Chrome: skeleton                                                    */
    /* ------------------------------------------------------------------ */

    var live = h("div", {
        class: "mme-ui mme-sr",
        "aria-live": "polite",
        role: "status"
    });
    var toastEl = h("div", { class: "mme-ui mme-toast", role: "status" });
    var cardEl = h("div", {
        class: "mme-ui mme-card",
        role: "tooltip",
        "aria-hidden": "true"
    });
    var lightbox = h("div", {
        class: "mme-ui mme-lightbox",
        role: "dialog",
        "aria-modal": "true",
        "aria-label": T.images
    });
    var panelEl = h("aside", {
        class: "mme-ui mme-panel",
        "aria-label": T.panelLabel,
        tabindex: "-1"
    });
    var barEl = h("div", { class: "mme-ui mme-bar" });
    doc.body.appendChild(live);
    doc.body.appendChild(toastEl);
    doc.body.appendChild(cardEl);
    doc.body.appendChild(lightbox);
    doc.body.appendChild(panelEl);
    doc.body.appendChild(barEl);

    function announce(msg) {
        live.textContent = "";
        setTimeout(function () {
            live.textContent = msg;
        }, 30);
    }
    var toastTimer = 0;
    window.mmeToast = function (msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("mme-show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
            toastEl.classList.remove("mme-show");
        }, 1800);
    };

    // Header from front matter
    if (cfg.header && (cfg.header.title || cfg.header.description)) {
        var head = h("header", { class: "mme-ui mme-head" });
        if (cfg.header.title)
            head.appendChild(
                h("h1", { text: cfg.header.title, title: cfg.header.title })
            );
        if (cfg.header.description)
            head.appendChild(h("p", { text: cfg.header.description }));
        if (cfg.header.meta)
            head.appendChild(
                h("p", { class: "mme-meta", text: cfg.header.meta })
            );
        doc.body.appendChild(head);
    }

    /* ------------------------------------------------------------------ */
    /* Dropdown helper                                                     */
    /* ------------------------------------------------------------------ */

    var openMenus = [];
    function closeMenus(except) {
        openMenus.forEach(function (m) {
            if (m.menu !== except) m.close();
        });
    }
    function dropdown(icon, label, items) {
        var wrap = h("div", { class: "mme-dropdown" });
        var menu = h("div", {
            class: "mme-menu",
            role: "menu",
            "aria-label": label
        });
        var btn = h("button", {
            type: "button",
            class: "mme-btn",
            "aria-haspopup": "menu",
            "aria-expanded": "false",
            "aria-label": label,
            title: label,
            html:
                ICONS[icon] +
                '<span class="mme-btn-label">' +
                esc(label) +
                "</span>"
        });
        var entry = {
            menu: menu,
            close: function () {
                menu.classList.remove("mme-open");
                btn.setAttribute("aria-expanded", "false");
            }
        };
        openMenus.push(entry);
        items.forEach(function (it) {
            if (it === "-")
                return menu.appendChild(h("hr", { role: "separator" }));
            var b = h("button", {
                type: "button",
                role: it.checkbox ? "menuitemcheckbox" : "menuitem",
                text: it.label,
                "aria-checked": it.checkbox ? "false" : null,
                tabindex: "-1"
            });
            b.addEventListener("click", function () {
                entry.close();
                it.run(b);
            });
            it.el = b;
            menu.appendChild(b);
        });
        function open() {
            closeMenus(menu);
            menu.classList.add("mme-open");
            btn.setAttribute("aria-expanded", "true");
        }
        btn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (menu.classList.contains("mme-open")) entry.close();
            else open();
        });
        btn.addEventListener("keydown", function (e) {
            if (e.key === "ArrowDown") {
                e.preventDefault();
                open();
                var first = menu.querySelector("button");
                if (first) first.focus();
            }
        });
        menu.addEventListener("keydown", function (e) {
            var btns = Array.prototype.slice.call(
                menu.querySelectorAll("button")
            );
            var i = btns.indexOf(doc.activeElement);
            if (e.key === "ArrowDown") {
                e.preventDefault();
                btns[(i + 1) % btns.length].focus();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                btns[(i - 1 + btns.length) % btns.length].focus();
            } else if (e.key === "Escape") {
                e.stopPropagation();
                entry.close();
                btn.focus();
            }
        });
        wrap.appendChild(btn);
        wrap.appendChild(menu);
        return { el: wrap, items: items };
    }
    doc.addEventListener("click", function () {
        closeMenus();
    });

    /* ------------------------------------------------------------------ */
    /* Search                                                              */
    /* ------------------------------------------------------------------ */

    var input = h("input", {
        type: "search",
        id: "mme-search-input",
        name: "mme-search",
        placeholder: T.placeholder,
        "aria-label": T.search,
        autocomplete: "off",
        spellcheck: "false"
    });
    var countEl = h("span", {
        class: "mme-search-count",
        "aria-hidden": "true"
    });
    var prevBtn = iconButton("up", T.prev, "mme-step", function () {
        stepMatch(-1);
    });
    var nextBtn = iconButton("down", T.next, "mme-step", function () {
        stepMatch(1);
    });
    var clearBtn = iconButton("close", T.clear, "", function () {
        clearSearchUi();
        input.focus();
    });
    var searchField = h("div", { class: "mme-search-field" }, [
        h("span", {
            class: "mme-search-ico",
            html: ICONS.search,
            "aria-hidden": "true"
        }),
        input,
        countEl,
        prevBtn,
        nextBtn,
        clearBtn
    ]);
    var searchToggle = iconButton(
        "search",
        T.search,
        "mme-search-toggle",
        function () {
            searchWrap.classList.add("mme-open");
            input.focus();
        }
    );
    var searchWrap = h("div", { class: "mme-search", role: "search" }, [
        searchToggle,
        searchField
    ]);
    // inline icon inside the field should not look like a button
    searchField.firstChild.style.cssText =
        "display:inline-flex;width:16px;height:16px;color:#57606a";
    searchField.firstChild.firstChild.style.cssText =
        "width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round";

    function matchesNode(n, q) {
        if (isSentinel(n)) return false;
        if (S.todoOnly && !(n.payload && n.payload.task === "todo"))
            return false;
        if (!q) return true;
        return (
            norm(textOf(n)).indexOf(q) !== -1 ||
            norm(detailText(n)).indexOf(q) !== -1
        );
    }

    function snapshotFold() {
        var m = new Map();
        walk(root, function (n) {
            if (hasKids(n)) m.set(n, (n.payload && n.payload.fold) || 0);
        });
        return m;
    }
    function snapshotSiblings() {
        var m = new Map();
        groups.forEach(function (g, p) {
            m.set(p, g.expanded);
        });
        return m;
    }
    function restoreFold() {
        if (!S.savedFold) return false;
        S.savedFold.forEach(function (v, n) {
            setFold(n, v);
        });
        if (S.savedSib) {
            S.savedSib.forEach(function (expanded, p) {
                setSiblingsExpanded(p, expanded);
            });
        }
        S.savedFold = null;
        S.savedSib = null;
        return true;
    }

    var searchTimer = 0;
    function scheduleSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, 140);
    }

    function updateCount() {
        var q = S.query.trim();
        if (!S.searchActive) {
            countEl.textContent = "";
        } else if (S.matches.length) {
            countEl.textContent = S.active + 1 + "/" + S.matches.length;
        } else {
            countEl.textContent = T.noResult;
        }
        searchField.classList.toggle("mme-has-results", S.searchActive);
        prevBtn.disabled = nextBtn.disabled = S.matches.length < 2;
        clearBtn.style.visibility = q || S.todoOnly ? "visible" : "hidden";
    }

    async function runSearch() {
        var token = ++S.searchToken;
        var q = norm(S.query.trim());
        S.searchActive = !!q || S.todoOnly;
        if (!S.searchActive) {
            await clearSearchState();
            return;
        }
        if (!S.savedFold) {
            S.savedFold = snapshotFold();
            S.savedSib = snapshotSiblings();
        }
        var matches = [];
        walk(root, function (n) {
            if (matchesNode(n, q)) matches.push(n);
        });
        var anc = new Set();
        matches.forEach(function (n) {
            ancestors(n).forEach(function (a) {
                anc.add(a);
            });
        });
        S.matches = matches;
        S.matchSet = new Set(matches);
        S.ancSet = anc;
        var changed = false;
        matches.forEach(function (n) {
            if (revealSync(n)) changed = true;
        });
        S.active = matches.length ? 0 : -1;
        if (changed) await mm.renderData();
        if (token !== S.searchToken) return;
        paintClasses();
        updateCount();
        announce(
            matches.length ? T.resultsAnnounce(matches.length) : T.noResult
        );
        if (matches.length) gotoActive();
    }

    function panelPad() {
        if (!panelEl.classList.contains("mme-open")) return {};
        var r = panelEl.getBoundingClientRect();
        return window.innerWidth <= 640
            ? { bottom: r.height + 16 }
            : { right: r.width + 16 };
    }

    function gotoActive() {
        var n = S.matches[S.active];
        if (!n) return;
        S.focus = n;
        decorate();
        updateCount();
        mm.centerNode(n, panelPad());
    }
    function stepMatch(dir) {
        if (!S.matches.length) return;
        S.active = (S.active + dir + S.matches.length) % S.matches.length;
        gotoActive();
    }

    async function clearSearchState() {
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = false;
        var restored = restoreFold();
        updateCount();
        if (restored) await mm.renderData();
        else paintClasses();
    }
    function clearSearchUi() {
        input.value = "";
        S.query = "";
        S.todoOnly = false;
        todoItem.el.setAttribute("aria-checked", "false");
        S.searchToken++;
        clearSearchState();
        searchWrap.classList.remove("mme-open");
    }

    input.addEventListener("input", function () {
        S.query = input.value;
        scheduleSearch();
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            clearTimeout(searchTimer);
            if (
                S.searchToken &&
                S.matches.length &&
                norm(input.value.trim()) === norm(S.query.trim()) &&
                S.searchActive
            ) {
                stepMatch(e.shiftKey ? -1 : 1);
            } else {
                S.query = input.value;
                runSearch();
            }
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            stepMatch(1);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            stepMatch(-1);
        } else if (e.key === "Escape") {
            e.stopPropagation();
            clearSearchUi();
            input.blur();
            focusNode(nearestShown(S.focus));
        }
    });
    input.addEventListener("blur", function () {
        if (!input.value && window.innerWidth <= 640 && !S.todoOnly) {
            searchWrap.classList.remove("mme-open");
        }
    });

    /* ------------------------------------------------------------------ */
    /* Level menu                                                          */
    /* ------------------------------------------------------------------ */

    async function structuralChange() {
        S.savedFold = null;
        S.savedSib = null;
        S.searchToken++;
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = !!(S.query.trim() || S.todoOnly);
        await mm.renderData();
        await mm.fit();
        if (S.searchActive) runSearch();
        else updateCount();
    }
    function setLevel(level) {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, n.state.depth >= level + 1 ? 1 : 0);
        });
        structuralChange();
    }
    function expandAll() {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, 0);
        });
        groups.forEach(function (g, p) {
            setSiblingsExpanded(p, true);
        });
        structuralChange();
    }

    var todoItem = {
        label: T.todoOnly,
        checkbox: true,
        run: function (b) {
            S.todoOnly = !S.todoOnly;
            b.setAttribute("aria-checked", S.todoOnly ? "true" : "false");
            runSearch();
        }
    };
    var levelItems = [1, 2, 3, 4].map(function (n) {
        return {
            label: T.levelItem(n),
            run: function () {
                setLevel(n);
            }
        };
    });
    levelItems.push({ label: T.expandAll, run: expandAll });
    if (cfg.hasTasks) {
        levelItems.push("-");
        levelItems.push(todoItem);
    }
    var levelDd = dropdown("layers", T.level, levelItems);

    var exportDd = dropdown("download", T.exportLabel, [
        {
            label: T.exportPng,
            run: function () {
                exportAs("png");
            }
        },
        {
            label: T.exportJpg,
            run: function () {
                exportAs("jpg");
            }
        },
        {
            label: T.exportSvg,
            run: function () {
                exportAs("svg");
            }
        },
        "-",
        {
            label: T.copyMd,
            run: function () {
                exportAs("copy");
            }
        }
    ]);
    function exportAs(kind) {
        var api = window.mmExport;
        if (api && api[kind]) api[kind]();
    }

    barEl.appendChild(searchWrap);
    barEl.appendChild(levelDd.el);
    barEl.appendChild(exportDd.el);
    // Menu is built before todoItem exists only if tasks are absent.
    if (!cfg.hasTasks) todoItem.el = h("span");

    /* Export hooks: strip transient visual state while an image is rendered. */
    window.mmeBeforeExport = function () {
        svgEl.classList.add("mme-exporting");
        cardEl.classList.remove("mme-show");
    };
    window.mmeAfterExport = function () {
        svgEl.classList.remove("mme-exporting");
    };

    /* ------------------------------------------------------------------ */
    /* Hover                                                               */
    /* ------------------------------------------------------------------ */

    function pathOf(n) {
        var s = new Set([n]);
        ancestors(n).forEach(function (a) {
            s.add(a);
        });
        if (!isFolded(n)) {
            (n.children || []).forEach(function (c) {
                s.add(c);
            });
        }
        return s;
    }

    function cardHtml(n) {
        var p = n.payload || {};
        var parts = [];
        function list(items, extra) {
            var li = items
                .slice(0, 5)
                .map(function (c) {
                    return "<li>" + esc(textOf(c)) + "</li>";
                })
                .join("");
            var more =
                items.length > 5
                    ? "<li>…" + esc(T.moreItems(items.length - 5)) + "</li>"
                    : "";
            return "<ul>" + li + more + "</ul>" + (extra || "");
        }
        if (p.less) return "";
        if (p.more) {
            var g = groups.get(parentOf.get(n));
            return (
                '<div class="mme-card-title">' +
                esc(textOf(n)) +
                "</div>" +
                list(g ? g.hidden : [])
            );
        }
        var needTitle = !!p.detail || isFolded(n);
        if (needTitle)
            parts.push(
                '<div class="mme-card-title">' + esc(textOf(n)) + "</div>"
            );
        if (p.detail)
            parts.push('<div class="mme-card-detail">' + p.detail + "</div>");
        if (isFolded(n)) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.childCount(realKids(n).length) + " · " + T.folded) +
                    "</div>" +
                    list(realKids(n))
            );
        }
        if (p.tasks) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.done + " " + p.tasks.done + "/" + p.tasks.total) +
                    "</div>"
            );
        }
        if (!parts.length) return "";
        if (p.detail)
            parts.push('<span class="mme-hint">' + esc(T.hint) + "</span>");
        return parts.join("");
    }

    function positionCard(n) {
        var g = gMap.get(n);
        if (!g) return;
        var fo = g.querySelector("foreignObject") || g;
        var r = fo.getBoundingClientRect();
        cardEl.style.left = "0px";
        cardEl.style.top = "0px";
        var cw = cardEl.offsetWidth;
        var ch = cardEl.offsetHeight;
        var left = Math.min(Math.max(8, r.left), window.innerWidth - cw - 8);
        var top = r.bottom + 8;
        if (top + ch > window.innerHeight - 8)
            top = Math.max(8, r.top - ch - 8);
        cardEl.style.left = left + "px";
        cardEl.style.top = top + "px";
    }
    function showCard(n) {
        var html = cardHtml(n);
        if (!html) {
            hideCard();
            return;
        }
        cardEl.innerHTML = html;
        var preview = cardEl.querySelector(".mme-card-detail");
        if (preview && preview.scrollHeight > preview.clientHeight + 1) {
            preview.classList.add("mme-clipped");
        }
        positionCard(n);
        cardEl.classList.add("mme-show");
    }
    function hideCard() {
        cardEl.classList.remove("mme-show");
    }
    var cardTimer = 0;
    function startHover(n, immediate) {
        S.hover = n;
        S.pathSet = pathOf(n);
        paintClasses();
        clearTimeout(cardTimer);
        cardTimer = setTimeout(
            function () {
                // The panel already shows the selected node's details.
                if (S.hover === n && S.selected !== n) showCard(n);
            },
            immediate ? 60 : 220
        );
    }
    function endHover() {
        S.hover = null;
        S.pathSet = null;
        clearTimeout(cardTimer);
        hideCard();
        paintClasses();
    }
    var noHover =
        window.matchMedia && window.matchMedia("(hover: none)").matches;
    svgEl.addEventListener("mouseover", function (e) {
        if (noHover || e.buttons) return;
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n === S.hover) return;
        if (!n || !n.state) endHover();
        else startHover(n, false);
    });
    svgEl.addEventListener("mouseleave", endHover);
    svgEl.addEventListener("mousedown", hideCard);
    svgEl.addEventListener("focusin", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n && n.state) {
            S.focus = n;
            startHover(n, true);
        }
    });
    svgEl.addEventListener("focusout", endHover);
    mm.zoom.on("start.mme", hideCard);

    /* ------------------------------------------------------------------ */
    /* Selection panel                                                     */
    /* ------------------------------------------------------------------ */

    function collectLinks(n) {
        var out = [];
        var seen = {};
        [n.content, n.payload && n.payload.detail].forEach(function (html) {
            if (!html) return;
            parseHtml(html)
                .querySelectorAll("a[href]")
                .forEach(function (a) {
                    var href = a.getAttribute("href");
                    if (!href || seen[href]) return;
                    seen[href] = 1;
                    out.push({
                        href: href,
                        text: (a.textContent || href).trim()
                    });
                });
        });
        return out;
    }

    function labelButton(n, extraHtml) {
        var b = h("button", { type: "button" });
        b.appendChild(h("span", { text: textOf(n) }));
        if (extraHtml) b.appendChild(h("small", { text: extraHtml }));
        b.addEventListener("click", function () {
            selectNode(n, { center: true });
        });
        return b;
    }

    function renderPanel(n) {
        var p = n.payload || {};
        panelEl.textContent = "";
        var chain = ancestors(n).reverse();
        var crumbs = h("ol", { class: "mme-crumbs", "aria-label": "path" });
        chain.forEach(function (a) {
            var li = h("li");
            li.appendChild(labelButton(a));
            crumbs.appendChild(li);
        });
        var closeBtn = iconButton("close", T.close, "", function () {
            deselect(true);
        });
        panelEl.appendChild(
            h("div", { class: "mme-panel-head" }, [crumbs, closeBtn])
        );

        var body = h("div", { class: "mme-panel-body" });
        body.appendChild(
            h("div", { class: "mme-panel-title", html: titleHtml(n) })
        );

        if (p.tasks) {
            var pct = Math.round((p.tasks.done / p.tasks.total) * 100);
            body.appendChild(h("h3", { text: T.progress }));
            body.appendChild(
                h("div", { class: "mme-progress-line" }, [
                    h("i", { style: "--p:" + pct + "%" }),
                    h("span", { text: p.tasks.done + "/" + p.tasks.total })
                ])
            );
        }
        if (p.detail) {
            body.appendChild(h("h3", { text: T.detail }));
            body.appendChild(h("div", { class: "mme-detail", html: p.detail }));
        }
        if (hasKids(n)) {
            var kids = realKids(n);
            body.appendChild(
                h("h3", { text: T.children + " (" + kids.length + ")" })
            );
            var ul = h("ul", { class: "mme-list" });
            kids.forEach(function (c) {
                var li = h("li");
                var extra =
                    hasKids(c) && c.payload && c.payload.count
                        ? "+" + c.payload.count
                        : "";
                li.appendChild(labelButton(c, extra));
                ul.appendChild(li);
            });
            body.appendChild(ul);
        }
        var links = collectLinks(n);
        if (links.length) {
            body.appendChild(h("h3", { text: T.links }));
            var lul = h("ul", { class: "mme-list" });
            links.forEach(function (l) {
                lul.appendChild(
                    h("li", null, [
                        h("a", {
                            href: l.href,
                            target: "_blank",
                            rel: "noopener noreferrer",
                            text: l.text
                        })
                    ])
                );
            });
            body.appendChild(lul);
        }

        var actions = h("div", { class: "mme-actions" });
        if (hasKids(n)) {
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: isFolded(n) ? T.expand : T.collapse,
                    onclick: function () {
                        mm.toggleNode(n, false).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: T.expandBelow,
                    onclick: function () {
                        walk(n, function (x) {
                            if (hasKids(x)) setFold(x, 0);
                        });
                        mm.renderData(n).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
        }
        actions.appendChild(
            h("button", {
                type: "button",
                class: "mme-btn",
                text: T.copyText,
                onclick: function () {
                    copyText(textOf(n));
                }
            })
        );
        body.appendChild(actions);
        panelEl.appendChild(body);
        panelEl.setAttribute("aria-label", T.panelLabel + ": " + textOf(n));
    }

    function copyText(text) {
        var done = function () {
            window.mmeToast(T.copied);
        };
        var fail = function () {
            window.mmeToast(T.copyFailed);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fail);
        } else fail();
    }

    async function reveal(n) {
        if (revealSync(n)) await mm.renderData();
    }

    // Expands/collapses the hidden siblings of a long child list. The clicked
    // button is swapped for its counterpart, so focus is handed over explicitly.
    async function toggleSiblings(p, keyboard) {
        var g = groups.get(p);
        if (!g) return;
        var expanding = !g.expanded;
        setSiblingsExpanded(p, expanding);
        await mm.renderData(p);
        var target = expanding ? g.hidden[0] : g.more;
        if (keyboard) await focusNode(target);
        else {
            S.focus = target;
            decorate();
        }
        announce(textOf(expanding ? g.less : g.more));
    }

    async function selectNode(n, opts) {
        opts = opts || {};
        if (isSentinel(n)) {
            await toggleSiblings(parentOf.get(n), opts.keyboard);
            return;
        }
        await reveal(n);
        S.selected = n;
        S.focus = n;
        // The panel shows the details now; a lingering hover card would repeat them.
        clearTimeout(cardTimer);
        hideCard();
        renderPanel(n);
        panelEl.classList.add("mme-open");
        doc.body.classList.add("mme-panel-open");
        await mm.setHighlight(n);
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
        if (opts.keyboard) panelEl.focus({ preventScroll: true });
        announce(T.panelLabel + ": " + textOf(n));
    }

    function deselect(refocus) {
        var had = S.selected;
        S.selected = null;
        panelEl.classList.remove("mme-open");
        doc.body.classList.remove("mme-panel-open");
        mm.setHighlight(null);
        if (refocus && had) focusNode(had);
    }

    /* ------------------------------------------------------------------ */
    /* Lightbox                                                            */
    /* ------------------------------------------------------------------ */

    function openLightbox(img) {
        var cap = "";
        var fig = img.closest && img.closest("figure");
        if (fig && fig.querySelector("figcaption"))
            cap = fig.querySelector("figcaption").textContent;
        else cap = img.getAttribute("alt") || "";
        lightbox.textContent = "";
        lightbox.appendChild(
            h("img", { src: img.currentSrc || img.src, alt: cap })
        );
        if (cap) lightbox.appendChild(h("p", { text: cap }));
        lightbox.classList.add("mme-open");
        lightbox.setAttribute("tabindex", "-1");
        lightbox.focus();
    }
    function closeLightbox() {
        lightbox.classList.remove("mme-open");
    }
    lightbox.addEventListener("click", closeLightbox);
    doc.addEventListener("click", function (e) {
        var img = e.target;
        if (img && img.tagName === "IMG" && panelEl.contains(img))
            openLightbox(img);
    });

    /* ------------------------------------------------------------------ */
    /* Pointer interaction on the map                                      */
    /* ------------------------------------------------------------------ */

    var downPos = null;
    svgEl.addEventListener("pointerdown", function (e) {
        downPos = { x: e.clientX, y: e.clientY };
    });
    var coarse =
        window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

    function nearestCircle(x, y, radius) {
        var best = null;
        var bestD = radius;
        svgEl.querySelectorAll("g.markmap-node > circle").forEach(function (c) {
            var r = c.getBoundingClientRect();
            var dx = r.left + r.width / 2 - x;
            var dy = r.top + r.height / 2 - y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d <= bestD) {
                best = c;
                bestD = d;
            }
        });
        return best;
    }

    svgEl.addEventListener("click", function (e) {
        var t = e.target;
        if (
            downPos &&
            Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5
        )
            return;
        if (t.closest && t.closest("a")) return;
        if (t.tagName === "IMG") {
            openLightbox(t);
            return;
        }
        if (t.tagName === "circle") return; // markmap toggles on its own handler
        var c = nearestCircle(e.clientX, e.clientY, coarse ? 22 : 10);
        if (c && c.__data__) {
            mm.toggleNode(c.__data__, e.ctrlKey || e.metaKey);
            return;
        }
        var g = t.closest && t.closest("g.markmap-node");
        if (g && g.__data__ && t.closest("foreignObject")) {
            selectNode(g.__data__, {}); // sibling-group buttons toggle instead
        } else if (!g && S.selected) {
            deselect(false);
        }
    });

    /* ------------------------------------------------------------------ */
    /* Keyboard tree navigation                                            */
    /* ------------------------------------------------------------------ */

    function visibleList() {
        var out = [];
        (function rec(n) {
            out.push(n);
            if (!isFolded(n)) (n.children || []).forEach(rec);
        })(root);
        return out;
    }

    async function focusNode(n) {
        if (!n) return;
        if (!isShown(n)) await reveal(n);
        S.focus = n;
        decorate();
        var g = gMap.get(n);
        if (g) g.focus({ preventScroll: true });
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
    }

    svgEl.addEventListener("keydown", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (!n || !n.state || e.altKey || e.ctrlKey || e.metaKey) return;
        var list = visibleList();
        var i = list.indexOf(n);
        var handled = true;
        switch (e.key) {
            case "ArrowDown":
                focusNode(list[Math.min(list.length - 1, i + 1)]);
                break;
            case "ArrowUp":
                focusNode(list[Math.max(0, i - 1)]);
                break;
            case "Home":
                focusNode(list[0]);
                break;
            case "End":
                focusNode(list[list.length - 1]);
                break;
            case "ArrowRight":
                if (hasKids(n) && isFolded(n)) mm.toggleNode(n, false);
                else if (hasKids(n)) focusNode(n.children[0]);
                break;
            case "ArrowLeft":
                if (hasKids(n) && !isFolded(n)) mm.toggleNode(n, false);
                else if (parentOf.get(n)) focusNode(parentOf.get(n));
                break;
            case "Enter":
                selectNode(n, { keyboard: true });
                break;
            case " ":
                if (isSentinel(n)) toggleSiblings(parentOf.get(n), true);
                else if (hasKids(n)) mm.toggleNode(n, e.shiftKey);
                break;
            default:
                handled = false;
        }
        if (handled) e.preventDefault();
    });

    /* ------------------------------------------------------------------ */
    /* Global shortcuts                                                    */
    /* ------------------------------------------------------------------ */

    function typing(el) {
        return (
            el &&
            (el.tagName === "INPUT" ||
                el.tagName === "TEXTAREA" ||
                el.isContentEditable)
        );
    }
    doc.addEventListener("keydown", function (e) {
        if (
            (e.key === "/" && !typing(e.target) && !e.ctrlKey && !e.metaKey) ||
            ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")
        ) {
            e.preventDefault();
            searchWrap.classList.add("mme-open");
            input.focus();
            input.select();
            return;
        }
        if (e.key !== "Escape") return;
        if (lightbox.classList.contains("mme-open")) {
            closeLightbox();
        } else if (
            openMenus.some(function (m) {
                return m.menu.classList.contains("mme-open");
            })
        ) {
            closeMenus();
        } else if (S.searchActive || input.value) {
            clearSearchUi();
        } else if (S.selected) {
            deselect(true);
        } else {
            endHover();
        }
    });

    /* ------------------------------------------------------------------ */
    /* Toolbar localisation (markmap-toolbar)                              */
    /* ------------------------------------------------------------------ */

    function enhanceZoomBar() {
        var bar = doc.querySelector(".mm-toolbar");
        if (!bar) return false;
        bar.classList.add("mme-ui", "mme-zoombar");
        bar.querySelectorAll(".mm-toolbar-item").forEach(function (item) {
            var title = item.getAttribute("title") || "";
            var local = T.zoomTitles[title] || title;
            item.setAttribute("title", local);
            item.setAttribute("role", "button");
            item.setAttribute("aria-label", local);
            item.setAttribute("tabindex", "0");
            item.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    item.click();
                }
            });
        });
        return true;
    }
    var zoomTries = 0;
    (function waitZoomBar() {
        if (enhanceZoomBar() || ++zoomTries > 40) return;
        setTimeout(waitZoomBar, 100);
    })();

    /* ------------------------------------------------------------------ */
    /* Boot                                                                */
    /* ------------------------------------------------------------------ */

    // Small screens: start with the first levels only so text stays readable.
    if (window.innerWidth <= 640 && cfg.mobileLevel) {
        walk(root, function (n) {
            if (!hasKids(n)) return;
            setFold(n, n.state.depth >= cfg.mobileLevel + 1 ? 1 : 0);
        });
    }

    updateCount();
    mm.renderData();
})();
</script>
  
</body>
</html>
