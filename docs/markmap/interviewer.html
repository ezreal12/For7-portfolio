# 서비스가 끝난 모바일 게임 서버 복원 연구


## 먼저 알아 둘 용어
- 정답지
  - 기준으로 삼는 순서
    - 1순위: 2021년 패킷 캡처
      - 캡처가 있는 응답
        &gt; - 캡처가 있는 응답은 바이트와 Content-Type까지 같게 돌려준다
        &gt; - 2021년 캡처 본문을 바이트 단위로 돌려주도록 바꾼 것이 출발점이다
        &gt; - 길이와 SHA-256을 테스트로 고정했다
      - 캡처와 다른 응답
        &gt; - 10월 12일 기준 8종이 남았다
        &gt; - 공지와 약관 텍스트가 스텁이라 빈 성공 응답과 HTML 원문이 화면에 그대로 보인다
        &gt; - 8종 전체가 후속 과제 목록에 올라 있다
    - 2순위: 복원한 클라이언트 소스와 데이터 표
      &gt; - 게이트 구간에는 2021 캡처가 없어 이 자료가 근거가 된다
      &gt; - 서버 규칙 다섯 개를 클라이언트 동작에서 거꾸로 세웠다
      &gt; - 많은 순서 결정이 추론 표시 [추론]으로 남아 있다
    - 3순위: 추론으로 표시한 값
      &gt; - 둘로 확인되지 않은 값은 코드 주석에 [추론]으로 표시한다
      &gt; - 추정으로 채운 칸은 [미확인]으로 따로 표시한다
  - 디버깅 정답지: 엔진 로그
    &gt; - 클라이언트 쪽 동작을 확인하는 기준으로 NeoX 게임 로그의 스크립트 트레이스백을 쓴다
    &gt; - 로그는 엔진 로그 설정 한 줄로 켠다
    &gt; - 배포, 로그 확인, 수정을 짧게 되풀이하고 한 번에 하나씩 고쳐 검증했다
- 시험 수단
  - 검증용 조정
    &gt; - 영웅 육성이 복원되기 전 던전류 승리 흐름을 보려고 기본 능력치와 레벨당 성장치에 같은 검증용 조정을 걸었다
    &gt; - 원본에 없던 규칙이라 이 값으로 얻은 결과는 원본 규칙으로 취급하지 않는다
    &gt; - 이벤트 검증 실행의 전투는 모두 검증용 조정을 건 상태로 이겼다
  - 서버 시계

## 출발점: 남은 자료와 없는 자료
- 남아 있던 것
  - 클라이언트 앱과 리소스
    - 서버 호출 형식의 원천
      &gt; - 서버가 받는 호출은 1,334개이고, 이 목록은 호출 목록 기록에 정리돼 있다
      &gt; - 서버가 기대하는 응답 모양은 클라이언트 코드에서 역산할 수 있다
    - 데이터 표와 계산 코드
      &gt; - 능력치 계산 코드를 옛 파이썬 환경에서 실행한 값이 서버 계산의 비교 기준이다
      &gt; - 무작위 계정 40개(영웅 160명)와 보구 492개에서 차이 0이었다
      &gt; - 서버 계산이 이 코드를 옮긴 것이라 독립 검증은 아니다
    - 게임 데이터 규모
      &gt; - 게임 데이터는 데이터 묶음 두 개 3.87GB와 패치 콘텐츠 2.2GB다
      &gt; - 앱 파일 한 개는 4GB 한계가 있고 압축해도 82~99%로만 줄어 한 파일에 담을 수 없었다
      &gt; - 안드로이드 11 이상은 다른 앱의 데이터 폴더를 파일 앱으로 볼 수 없다
  - 2021년 HTTP 캡처와 기기 백업
    - 로그인 구간 캡처
      &gt; - 캡처는 4세트, 512건이다
      &gt; - 가이아 계정 67건, 게스트 106건, 구글 계정 141건과 198건이다
      &gt; - 호스트 30개, 요청 44묶음으로 정리했다
    - 기기 백업
      &gt; - 2021년 백업은 5.9GB 묶음이고 두 개의 데이터 묶음 폴더로 구성된다
      &gt; - 백업에는 서버 소스가 없다
      &gt; - 5월 21일 강제 패치 콘텐츠(약 2.2GB, 227개 파일)를 이 백업에서 복원해 썼다
- 없는 것
  - 서버 소스
    &gt; - 어떤 백업에도 서버 소스가 없다
    &gt; - 서버 쪽 규칙은 클라이언트 스크립트, 데이터 표, 캡처 응답에서 거꾸로 세웠다
  - 원본 DB 구조
    &gt; - 원본 서버의 DB 구조는 남아 있지 않다
    &gt; - 서버용 데이터 표는 서버가 쓰는 필드만 클라이언트 표에서 뽑아 만들었다
    &gt; - 추정으로 채운 칸은 [미확인]으로 따로 표시한다
  - 게이트와 게임 구간 캡처
    &gt; - HTTP 로그인 구간만 캡처가 있고 게이트와 게임 구간에는 정답지가 없다
    &gt; - 게이트 구간은 클라이언트 소스와 서버 로그로만 맞춘다
- 원본 서버 구조 (추정)
  &gt; - 클라이언트가 로드 밸런서를 거쳐 게이트 서버에 접속하고, 게이트가 게임 서버로 넘기며, 게임 서버가 DB를 쓴다 (추정, 확인 안 됨)
  &gt; - 문자열과 패킷에서 끌어낸 추정이며, 게이트 구간 캡처가 없어 이 구조는 검증하지 못했다
- 자료 조건이 정한 검증 방식
  - 캡처가 있는 응답
    &gt; - 바이트와 콘텐츠 형식까지 같게 돌려주고, 길이와 SHA-256을 테스트로 고정한다
    &gt; - 출발점은 5월 21일 업데이트 확인 응답이다. 호스트를 IP로 바꾸자 클라이언트가 업데이트 확인에서 멈췄다 (확인 안 됨)
  - 캡처가 없는 구간
    &gt; - 캡처가 없는 게이트 구간은 복원한 클라이언트 소스에서 값을 세운다
    &gt; - 둘로 확인되지 않은 값은 코드 주석에 [추론]으로 표시한다

## 응답 문제: 정답지 순서와 확인 수단
- 정답지 순서
  - 1순위: 2021 패킷 캡처
    &gt; - 캡처가 있는 응답은 바이트와 Content-Type까지 같게 돌려준다.
    &gt; - 정답지는 2021년 7월 13일 Burp 캡처, 패킷 로그, 2021 디바이스 백업이다.
    &gt; - 패킷에 없는 응답은 NeoX 로그로 먼저 확인하고, 안전한 기본값으로 응답하지 않는다.
    - 원칙이 생긴 사건
      &gt; - 5월 실기기에서 업데이트 확인 응답의 호스트를 IP로 바꾸자 클라이언트가 업데이트 확인에서 멈췄다.
      &gt; - 클라이언트가 CDN 호스트명으로 확인하지 못하고 폴백 경로로 빠졌다.
      &gt; - 폴백 경로에서 서버가 405 응답을 돌려줘 확인이 멈췄다.
    - 결정: 호스트명 유지
      &gt; - 호스트명은 바꾸지 않고 디바이스 DNS가 복원 서버로 응답하게 한다.
      &gt; - 이렇게 하면 다운로더가 원본 서버와 같게 동작한다.
  - 2순위: 복원한 클라이언트 소스와 데이터 표
    &gt; - 캡처가 없는 응답은 복원한 클라이언트 소스와 데이터 표가 근거가 된다.
    &gt; - HTTP 구간은 캡처와 소스를 함께 쓰고, 게이트 구간은 정답지가 없어 소스만 근거로 한다 (확인 안 됨).
    &gt; - 캡처와 소스 어느 쪽으로도 확인되지 않는 값은 코드 주석에 추론이나 복원 서버의 결정으로 적는다 (확인 안 됨).
  - 3순위: 클라이언트 변조와 추론 표시
    &gt; - 클라이언트 변조는 필요성, 대안, 검증, 복원 방법을 함께 적는다.
    &gt; - 현재까지 검증된 변조는 2건뿐이라고 기록돼 있다.
    &gt; - 순서 결정 대부분은 추론으로 표시하고 캡처가 없다.
- 캡처가 없는 게이트 구간
  &gt; - 게이트 구간은 2021 캡처가 없어 플레이 패킷 정답지가 없고, 검증은 실기기 동작에 의존한다.
  &gt; - 정답지 대신 서버 로그에 나온 증상 네 가지가 서버가 답해야 할 것을 알려 줬다.
  - 상태 전이 경고

    &gt; - 플레이어로 승격된 직후 게이트 구간 로그인 흐름에서 나왔고, 이 경고 뒤 도시 진입이 멈췄다.
  - 약 16초 뒤 재접속
    &gt; - 게임이 도시 로딩 화면까지 가지만 이벤트 조회 응답을 약 16초 기다리다 타임아웃한다.
    &gt; - 타임아웃되면 재접속 루프에 든다.

        &gt; - 2026년 10월 12일 기준으로 캡처와 다른 응답이 8종 남았다.

  - 길이와 해시 고정
    - 판정 기준
      &gt; - 캡처가 있는 정적 응답의 길이와 SHA-256을 테스트 기대값으로 박아 둔다.
      &gt; - 값이 바뀌면 해당 테스트가 실패하며, 캡처가 없는 응답에는 이 방식을 쓰지 않는다.
      &gt; - 10월 12일 응답을 캡처 원본으로 되돌린 뒤 이 방식으로 고정했다.
    - 대상 범위
      &gt; - 대표 예는 업데이트 목록 본문 856바이트와 SHA-256이다.
      &gt; - 기대값은 캡처 원본에서 온다.
    - 결과 수치
      &gt; - 기대값이 든 시험은 업데이트 서버 시험 135~148행과 307~318행이다.
      &gt; - 로그인 시험 27~28행에도 기대값이 있다.
    - 한계
      &gt; - 바이트 대조는 체크아웃의 줄바꿈 방식에 영향을 받는다.
      &gt; - 2026년 10월 25일 재실행에서 CRLF 체크아웃의 정적 응답 바이트 대조 2건이 실패했다.
  - 변환기 정합성
    - 변환 규칙
      &gt; - 요청 본문과 응답 본문의 원본 바이트를 base64로 보존하고, 기록에 없는 값은 지어내지 않는다.
      &gt; - 캡처가 시간을 기록하지 않으면 시간 값은 -1 또는 0으로, 응답이 없는 항목은 상태 0과 표시로 남긴다.
    - 안전장치
      &gt; - 출력 파일이 이미 있으면 덮어쓰기 옵션 없이는 종료 코드 2로 거부한다.
      &gt; - 변환기가 틀린 결과를 조용히 덮어쓰지 않게 하는 장치다.
    - 대상 범위
      &gt; - 구글, 페이스북, Nox 등 제3자 요청은 대조에서 뺀다.
      &gt; - Burp는 HTTP(S) 터널만 가로채므로 게이트 TCP와 게임 서버 KCP/UDP 통신은 캡처에 없다.
    - 결과 수치
      - 변환 시험
        &gt; - 변환 시험은 9개다.
        &gt; - 합성 XML 항목으로 필드 매핑과 압축, 깨진 데이터 같은 경우를 검증하고, 실제 캡처가 있으면 106건을 무손실로 비교한다.
      - 판독 정합성
        &gt; - 512건 모두 HAR 1.2 스키마 검증을 통과했고, 판독 시간은 1.7~2.2초였다.
        &gt; - 게스트 로그인 세트의 응답 본문 96건 전부에서 분석 도구가 보고한 SHA-256이 원본 직접 계산값과 같았다.
        &gt; - 이 96건 검증은 변환기 시험이 아니라 판독 단계의 별도 검증이다.
      - 묶음 대조
        &gt; - 512건이 호스트 30개, 묶음 44개로 정리됐다.
        &gt; - 게임 관련 22묶음은 모두 API 문서에 경로가 있었고, 8묶음은 서버 코드에 경로 문자열이 없다.
    - 한계
      - 캡처 의존 시험
        &gt; - 실제 캡처 시험은 캡처 파일이 없으면 건너뛴다.
        &gt; - 캡처 원본이 저장소 밖에 있어 원본 캡처가 있는 개발 머신에서만 돈다.
      - 경로 대조의 한계
        &gt; - 경로 문자열 대조일 뿐 미구현 판정이 아니다.
        &gt; - 와일드카드 경로라면 문자열이 없어도 처리될 수 있다.
  - 능력치 대조

      &gt; - 정답 파일의 케이스 40건은 Python으로 개수를 확인했다.
  - 스텁 대조
    - 판정 기준
      &gt; - 서버가 클라이언트로 보내는 모든 호출은 보내기 전에 클라이언트 스텁 선언과 대조한다.

  - 엔진 한 회차 테스트
    - 판정 기준

    - 결과 수치

## 연결 문제: 클라이언트를 복원 서버에 붙이기
- 접속 경로 1: 이름 풀이와 입구 분기
  - 이름 풀이
    &gt; - 게임 도메인 이름 풀이를 복원 서버로 돌린다.
    &gt; - 응답 속 주소는 건드리지 않는다. 주소는 이름 풀이에서 바꾸고 응답 본문은 원본 그대로 둔다.
    &gt; - 업데이트 확인 응답의 호스트를 숫자 주소로 바꾸자 클라이언트가 예비 경로로 빠졌다.
    &gt; - 예비 경로에서 서버가 405 응답을 내어 업데이트 확인이 멈췄다.
  - 응답은 캡처 원본을 따른다
    &gt; - 캡처가 있는 응답은 바이트와 Content-Type까지 원본과 같게 돌려준다.
    &gt; - 길이와 SHA-256을 시험으로 고정했다.
    &gt; - 캡처와 다른 응답은 후속 과제로 남겼다.
  - HTTPS 접속의 서버명 유무로 두 갈래
    - 서버명이 있는 연결
      &gt; - 게임 스크립트 쪽 HTTP는 요청 줄에 주소 전체를 적어 보낸다.
      &gt; - 기기에는 중계가 없으므로 복원 서버가 요청 줄의 주소 부분을 떼어 내고 경로만 본다.
    - 서버명이 없는 연결
      &gt; - 게이트 프레임은 4바이트 길이로 시작한다.
      &gt; - 게이트 연결은 TLS 없이 길이 접두 프레임을 바로 보낸다 (확인 안 됨).
      &gt; - 잘못 보내면 TLS 핸드셰이크 오류나 프레임 길이 오류로 보인다 (추정이며 재현하지 않았다).
- 접속 경로 2: 중계 뒤의 실제 기기 주소
  - 중계 뒤에서는 모든 접속이 같은 주소로 보인다
    &gt; - 접속 맨 앞에 PROXY TCP4 형식의 한 줄이 붙어 실제 클라이언트 주소를 전한다.
    &gt; - 중계 뒤에서는 모든 상대가 같은 로컬 주소로 보여, 기기와 에뮬레이터를 구분하지 못했다.
    &gt; - 한 줄의 최대 길이는 규격이 정한 107바이트다.
  - 주소 줄 해석과 오류 처리
    &gt; - 줄이 아직 다 안 왔으면 빈 바이트를 돌려주고 받은 바이트를 모아 둔다.
    &gt; - 줄이 깨졌으면 오류로 보고 그 접속을 끊는다 (확인 안 됨).
    &gt; - 주소 줄이 없는 접속, 곧 기기 안 서버에 직접 붙는 접속도 그대로 받는다.
  - 게이트에서 주소 줄을 구분하는 법
    &gt; - 게이트 프레임은 4바이트 길이로 시작해 주소 줄의 머리글자와 겹치지 않는다.
    &gt; - 주소 줄이 있는 접속과 없는 접속이 같은 포트에서 섞여도 구분할 수 있다.
  - 배포 순서가 틀리면 연결이 끊긴다
    &gt; - 중계 설정을 먼저 바꾸면 게이트가 주소 줄을 프레임 길이로 읽어 즉시 연결을 끊는다.
    &gt; - 배포 문서가 서버 코드를 먼저 올리고 중계 설정은 나중에 바꾸라고 명시한다.
- 접속 경로 3: 부팅 요청 재현
  &gt; - 실제 앱이 서버에 보내는 22단계 부팅 요청을 순서대로 재현한다
  &gt; - 22단계 요청 가운데 어느 한 곳에서도 서버 오류를 내지 않는 것을 이 시험의 회귀 방지선으로 둔다
  &gt; - 요청 순서는 설정 조회, 업데이트 목록과 패치 목록, 계정 초기화와 빠른 로그인, 결제, 텔레메트리 순이고, 이후 게이트 주소를 받아 게이트에 접속한다 (확인 안 됨)
  &gt; - 부팅 요청 22단계 가운데 일부는 자동 시험 범위 밖이다 (한계)
- 접속 경로 4: 로그인 서명
  &gt; - 서명이 맞지 않아도 결과와 무관하게 요청은 통과한다
  &gt; - 서명이 막지 못하는 요청이 있으므로, 서명은 요청을 걸러내는 장치로 기대할 수 없다 (한계)
- 게이트 서버: 프레이밍과 접속 안정화
  - 프레임과 압축
    - 길이 접두 프레임
      &gt; - 4바이트 길이, 2바이트 호출 번호, 뒤에 프로토콜 버퍼 본문이 온다 (확인 안 됨).
      &gt; - 아바타 스냅샷만 압축과 msgpack을 쓰고 나머지 엔티티는 BSON이다 (확인 안 됨).
    - 핸드셰이크 뒤 압축
      &gt; - 연결 응답을 보낸 직후 스트리밍 압축을 켠다.
      &gt; - 연결마다 압축기 한 쌍을 두고 메시지마다 동기 플러시한다.
      &gt; - 실기기에서 계정 엔티티를 압축해 보내자 BSON 크기 오류가 났다.
  - 접속 안정화
    - 예외 격리
      &gt; - 접속 단위 예외는 그 접속만 닫고 원인을 로그에 남긴다.
      &gt; - 호출 처리 중 예외는 접속을 유지하고, 결과를 기다리는 콜백은 빈 결과로 풀어 화면이 잠기지 않게 한다.
      &gt; - 처리 도중 실패해도 그 시점까지 바뀐 진행은 저장한다.
    - 중복 로그인
      &gt; - 같은 계정이 다시 붙으면 나중 로그인이 이기고 먼저 붙은 접속을 닫는다 (확인 안 됨).
      &gt; - 한 계정의 진행 상태를 두 접속이 같이 쓰면 진행이 뒤섞이므로 이렇게 한다 (확인 안 됨).
      &gt; - 원본 서버의 처리 근거는 없어 복원 서버의 결정으로 표시한다.
    - 로그인 토큰 검사
      - 검사 순서
        &gt; - 요청의 계정 식별자와 토큰 안의 식별자가 같은지, 토큰이 있는지, 계정이 있는지 차례로 본다 (확인 안 됨).
        &gt; - 마지막으로 발급한 토큰과 같은지를 마지막에 본다 (확인 안 됨).
        &gt; - 로그인마다 새 토큰이 나와 가장 최근 토큰만 유효하다.
        &gt; - 두 기기가 같은 계정으로 로그인하면 먼저 받은 토큰이 거절된다.
      - 로그 값 규칙
        &gt; - 거절 사유 문자열에는 토큰 값을 넣지 않는다 (확인 안 됨).
        &gt; - 로그를 파일로 남길 때 비밀번호와 토큰처럼 보이는 값을 가린다.
  - 종료 순서
    &gt; - 새 접속을 막고, 붙어 있는 접속을 끊고, 서버를 내린다.
    &gt; - 접속이 끝나길 기다리면 서비스 관리자가 강제 종료하던 문제를 이 순서로 고쳤다.
    &gt; - 진행 상태는 요청마다 저장되므로 접속을 끊어도 잃는 것이 없다.
- 앱 안 서버: PC 없이 기기에서 실행
  - 만든 이유
    - 한 프로세스가 입구 셋을 듣는다
      &gt; - 같은 프로세스가 HTTP, HTTPS, 게이트 세 입구를 직접 듣는다.
      &gt; - 요청 줄의 주소 형식을 서버가 직접 고친다.
      &gt; - 서버 찾기 응답은 같은 기기의 게임만 상대하므로 끈다 (확인 안 됨).
    - 네이티브 확장을 쓰는 의존성은 기기에 올라가지 않는다
      &gt; - 데이터 검증 라이브러리가 네이티브 확장이라 기기용 배포본이 없다.
      &gt; - 같은 인터페이스를 흉내 내는 순수 파이썬 대체 패키지를 쓴다.
  - 구성
    - 기기용 인터프리터
      &gt; - 공식 Python 기기 배포본을 네이티브 접착 코드로 별도 프로세스에서 실행한다.
      &gt; - 배포본은 고정한 SHA-256으로 받고, 해시가 다르면 중단한다.
    - 패키지 묶음
      &gt; - 순수 파이썬 패키지만 담고, 네이티브 확장이 있으면 묶음 만들기를 중단한다 (확인 안 됨).
      &gt; - 계정 DB, 진행 상태, 로그는 데이터 폴더 아래에 둔다 (확인 안 됨).
  - 두 구성 검증
    - 같은 시험을 두 환경에서 돌린다
      &gt; - 응답 119건을 PC의 진짜 웹 프레임워크 구성과 비교했다 (확인 안 됨).
      &gt; - 같음 113, 알려진 차이 6, 문제 0이다 (확인 안 됨).
      &gt; - 알려진 차이는 요청 목록 관리에서 따로 다룬다.
    - 기기 구성 가드
      &gt; - 진짜 웹 프레임워크와 네이티브 확장이 로드되지 않았음을 확인한다 (확인 안 됨).
      &gt; - 기기에 없는 C 모듈은 가져오기를 막고 돈다. 안드로이드 접두 경로가 없으면 막지 않고 경고만 낸다 (확인 안 됨).

## 규칙 문제: 클라이언트 스크립트에서 서버 규칙 세우기
- 호출 목록: 스크립트에서 뽑는다
  - 스크립트 복원
    - 복원 범위와 수
      &gt; - Python 소스 13,462개를 복원했다.
      &gt; - 부분 실패는 5개다.
      &gt; - 전투 스크립트를 포함한 최종 값이다.
    - 복원 검증
      &gt; - 명령 대응 113개는 표준 라이브러리를 같은 방식으로 컴파일해 나란히 놓고 얻었다 (확인 안 됨).
      &gt; - 대응이 하나라도 틀리면 대부분의 파일이 깨지므로 표를 먼저 검증했다 (확인 안 됨).
      &gt; - 번호를 되돌려 쓴 바이트코드가 원본과 바이트 단위로 같은지 시험한다 (확인 안 됨).
  - 호출 이름과 인자 키
    - 뽑는 대상
      &gt; - 클라이언트에서 서버로 가는 호출은 1,334개다.
      &gt; - 서버에서 클라이언트로 가는 호출은 1,493개다.
      &gt; - 호출 이름과 인자 키를 스크립트에서 뽑아 목록을 만든다.
    - 놓치는 호출
      &gt; - 이름이나 인자를 변수로 넘기는 호출은 추출이 놓칠 수 있다.
      &gt; - 그래서 호출 목록이 누락 없이 만들어졌다고 말할 수 없다.
  - 처리 현황
    - 핸들러
      &gt; - 핸들러는 584개이고 최상위 303개, 하위 281개다.
      &gt; - 핸들러가 있는 호출은 584개다.
    - 의도적 무응답
      &gt; - 의도적 무응답 선언은 63개다.
      &gt; - 핸들러와 무응답을 합하면 647개로 약 48.5%다.
      &gt; - 나머지 687개는 핸들러가 없다.
  - 핸들러가 없는 호출의 처리
    - 로그 후 빈 결과
      &gt; - 핸들러가 없으면 로그만 남기고 빈 결과로 풀어 화면이 잠기지 않게 한다.
      &gt; - 핸들러가 없는 내부 메서드도 콜백이 달려 있으면 빈 결과로 푼다.
    - 결과를 읽는 콜백
      &gt; - 결과를 읽는 콜백은 18개이고, 그중 17개에 핸들러가 있다 (확인 안 됨).
      &gt; - 빈 결과로 풀면 클라이언트가 결과를 읽다가 깨지므로 풀지 않고 경고만 남긴다 (확인 안 됨).
- 필드와 타입: 서버 기준은 클라이언트가 읽는 형태
  - 데이터 표를 실행하지 않고 읽는다
    &gt; - 표는 실행하지 않고 구문 트리로만 읽는다 (확인 안 됨).
    &gt; - 표에 리터럴과 공유 참조 말고 다른 코드가 있으면 추출을 멈춘다 (확인 안 됨).
    &gt; - 서버가 쓰는 열만 뽑은 JSON 표가 63개다 (확인 안 됨: 기록의 63은 클래스 수다).
    &gt; - 추정으로 채운 구간은 따로 표시한다 (확인 안 됨).
  - 클라이언트가 읽는 형태가 기준
    - 필수 키
      &gt; - 필수 키는 아바타 쪽 st, weeknum, inv, heromgr, city이고, 나머지 하위시스템 키는 빈 값으로 채운다.
      &gt; - 필수 키를 직접 읽는데 값이 없으면 게임이 멈춘다.
    - 모양이 틀린 행
      &gt; - 표의 이상한 행이 시계 구간 안에 있으면 그 탭이 멈춘다 (확인 안 됨).
      &gt; - 화면을 여는 순간 빈 칸을 읽다가 오류로 멈춘다 (확인 안 됨).
  - 순서
    - 이벤트 지급 순서
      &gt; - 지급 후 완료 시작 결과, 완료 끝 순서로 보내는 것이 필수다 (확인 안 됨).
      &gt; - 획득 연출이 지급 결과를 None 검사 없이 읽어 순서가 바뀌면 깨진다.
    - 회차 넘김
      &gt; - 이야기 선택 요청, 응답, 회차 처리, 스냅샷 갱신 순서로 이어진다 (확인 안 됨).
      &gt; - 서버가 언제 무엇을 보내는지는 대부분 추론이다.
- 게임 규칙: 모듈 구성과 한 칸의 골격
  - 모듈 구성
    - 기능 모듈
      &gt; - 최상위 모듈은 85개이고 합계 17,113줄이다.
      &gt; - 모듈마다 같은 모양을 지켜서 읽는 순서가 같다 (확인 안 됨).
    - 이벤트 규칙 모듈
      &gt; - 이벤트 규칙 모듈은 38종류다.
      &gt; - 나머지 16개 가운데 수집기가 있다.
      &gt; - 나머지는 여러 모듈이 쓰는 도우미와 큰 이벤트를 쪼갠 조각이다 (확인 안 됨).
  - 규칙 한 칸의 골격
    &gt; - 표(JSON), 상태 한 칸, 거절 판정, 와이어 형식 변환, 스냅샷 조각 순서로 같은 모양을 따른다.
    &gt; - 재화 지불과 클라이언트 알림은 짝이 되는 아바타 쪽 멤버가 맡는다.
    &gt; - 새 이벤트 추가 비용은 파일 하나이며 자동 수집이 받쳐 준다.
  - 전투
    - 계산 위치
      &gt; - 전투는 클라이언트가 계산하고 서버는 요청과 보상만 주고받는다.
      &gt; - 오프라인 전투 응답은 요청 값을 그대로 돌려줘야 정산 화면이 뜬다 (확인 안 됨).
    - 던전류
      &gt; - 던전류는 정산과 보상 지급까지 구현했다 (확인 안 됨).
      &gt; - 행동·구역 전투 보상, 회차 끝 보상, 사건 보상은 비어 있다 (확인 안 됨).
  - 서버만 아는 값
    &gt; - 밸런스 값과 전투 정산은 클라이언트에 없어 확인되지 않는다.
    &gt; - 던전류 정산은 구현했지만 서버만 아는 밸런스 값은 클라이언트에서 확인되지 않는다.
- 서버 시계: 되풀이 구간과 시간 제한
  - 시계 방식의 변화
    - 연도만 접는 방식
      &gt; - 기본 소환 풀의 종료 시각이 지나면 소환 요청이 나가지 않는다.
      &gt; - 서버 달력의 연도만 그 풀이 열려 있던 마지막 1년으로 되돌렸다.
      &gt; - 실제 서비스 달력과 어긋남을 감수한 복원 서버의 결정이다 (확인 안 됨).
    - 벽시계를 UTC처럼 쓰는 방식
      &gt; - 실제 UTC를 주자 화면의 다음 07:00 시각이 9시간 어긋났다.
      &gt; - 한국 벽시계를 UTC처럼 줘서 화면의 시각을 맞췄다.
    - 현재 방식
      &gt; - 주와 날을 세는 값은 벽시계 함수로 센다.
      &gt; - 연도를 접은 서버 시각을 쓰지 않는다.
      &gt; - 게임이 이미 받은 시각은 다시 로그인해야 바뀐다 (확인 안 됨).
  - 되풀이 구간
    - 구간과 길이
      &gt; - 서비스 말기 구간 2020-11-26 ~ 2021-05-27을 되풀이한다.
      &gt; - 되풀이 길이는 26주(182일)이며, 처음 설계의 30주(210일)에서 줄었다.
    - 계정 시각 보정
      &gt; - 계정에 적힌 시각이 미래가 되지 않도록 바퀴 수만큼 뺀다 (확인 안 됨).
      &gt; - 시계 기록이 없는 옛 계정은 옛 시계 기준의 차이만큼 옮긴다 (확인 안 됨).
  - 주기 이벤트
    - 수요일 07:00 주기
      &gt; - 관문과 속성은 수요일 07:00마다 표의 다음 행으로 바뀐다.
      &gt; - 표가 끝나면 처음부터 되풀이한다 (확인 안 됨).
    - 활동 창
      &gt; - 기간 값이 없는 행은 늘 열려 있다 (확인 안 됨).
      &gt; - 서버 시계가 기간 안에 있으면 그 활동이 열린다 (확인 안 됨).
  - 일일 초기화 시각 불일치
    &gt; - 월정액은 UTC 07:00, 한국 16:00이다.
    &gt; - 정신력은 한국 07:00으로 추정되어 월정액과 서로 다르게 남았다.
    &gt; - 문서가 불일치를 스스로 인정한 미해결 항목이다.
  - 클라이언트 쪽 재요청 제한
    &gt; - 이야기 열기 요청을 한 번 보낸 뒤 60초 안에는 다시 보내지 못한다 (확인 안 됨).
    &gt; - 이 제한은 클라이언트 쪽 규칙이라 서버가 고칠 수 없다 (확인 안 됨).
- 계정과 상태 저장
  - 가입과 로그인 입력
    - 비밀번호 저장
      &gt; - 비밀번호는 scrypt 해시로만 저장하고, 비교는 시간이 같은 비교 함수로 한다.
      &gt; - 평문을 두지 않아 데이터 파일이 새어도 비밀번호 원문은 나가지 않는다.
    - 입력 규칙
      &gt; - 계정 ID는 공백 없이 64자 이하다 (확인 안 됨).
      &gt; - 비밀번호는 6~20자의 출력 가능 문자다 (확인 안 됨).
      &gt; - 클라이언트가 형식을 막지 않아 서버가 길이와 공백을 본다 (복원 서버의 결정).
  - 계정 잠금
    - 실패 횟수 세기
      &gt; - 같은 계정 식별자가 연속 8번 틀리면 60초 동안 잠근다.
      &gt; - 실패 기록은 메모리에만 있어서 서버를 다시 띄우면 풀린다.
      &gt; - 없는 계정 이름을 넣어 메모리가 늘지 않도록 기록이 4096개를 넘으면 비운다.
    - 잠금 응답
      &gt; - 가입과 로그인 오류 코드는 1001~1005로, 복원 서버가 정했고 원본 값은 모른다.
      &gt; - 클라이언트는 성공 여부만 보고 서버가 준 문구를 그대로 띄운다 (확인 안 됨).
  - 계정당 상태 파일
    - 파일 구성
      &gt; - 계정마다 파일 하나를 두고, 내용이 바뀐 때만 다시 쓴다.
      &gt; - 임시 파일에 쓴 뒤 제자리에 바꿔 놓으므로, 쓰다 죽어도 반쯤 쓴 파일이 남지 않는다.
    - 읽기 실패
      &gt; - 깨진 파일은 격리한다.
      &gt; - 읽지 못한 파일은 덮어쓰지 않는다 (확인 안 됨).
      &gt; - 외부에서 바뀐 파일은 변경 감지로 다시 읽는다.
    - 저장 이름 방어
      &gt; - 계정 키가 허용 형식 밖이면 저장 이름을 해시로 바꿔, 클라이언트가 보낸 값을 경로로 쓰지 않는다 (확인 안 됨).
      &gt; - 진행 상태는 서버를 재시작해도 남는다.

## 알아낸 것: 서버 규칙의 위치와 시간 제한
- 서버 약속이 있는 곳: 클라이언트 스크립트
  - 서버 기준은 클라이언트가 읽는 형태
    &gt; - 서버 코드의 기준은 문서가 아니라 클라이언트가 읽는 필드, 타입, 순서다.
    &gt; - 문서에 경로가 있는 게임 관련 캡처 22묶음을 서버 코드와 대조했다.
    &gt; - 그중 8묶음은 서버 코드에 경로 문자열이 없다. 와일드카드 라우트일 수 있어 미구현으로 단정하지 않는다.
  - 스크립트에서 뽑은 호출 이름과 인자 키
    &gt; - 서버 호출 1,334개를 이름과 인자 키로 뽑았다.
    &gt; - 핸들러와 무응답 선언 647개의 이름이 모두 이 목록에 있고 불일치는 0이다.
    &gt; - 이름이나 인자를 변수로 넘기는 호출은 이 방식으로 놓친다.
  - 구문 트리로만 읽은 데이터 표
    &gt; - 클라이언트 데이터 표를 실행하지 않고 구문 트리로만 읽는다.
    &gt; - 서버가 읽는 데이터 파일 63개가 클라이언트 표에서 나왔다.
    &gt; - 추정으로 채운 칸은 따로 표시한다 (확인 안 됨).
- 결과를 읽는 콜백의 처리 방식
  &gt; - 결과를 읽는 콜백은 18개이고 그중 17개에 핸들러가 있다.
  &gt; - 빈 결과로 풀면 클라이언트가 결과를 읽다가 깨진다.
  &gt; - 핸들러가 없는 1개는 빈 결과로 풀지 않고 경고만 남긴다.
- 서버 시계로 시간 제한을 다루는 방식
  - 서버 시각으로 소환과 이벤트를 여는 방식
    &gt; - 소환과 이벤트가 열리는지는 클라이언트 표의 기간과 서버 시각을 비교해 정해진다.
    &gt; - 클라이언트 표는 바꾸지 않고 서버 시계만 바꾼다. 클라이언트 변조는 없다.
    &gt; - 표에 자료 오류가 있으면 시계 구간 안에서 그 탭 하나가 열리지 않는다.
  - 되풀이 구간 26주
    &gt; - 구간은 2020년 11월 26일 10시부터 2021년 5월 27일 10시까지이고, 끝에 닿으면 처음으로 돌아간다.
    &gt; - 26주로 잡은 이유는 실제 한국 시각의 시, 분, 초와 요일이 그대로 보이게 하려는 것이다.
    &gt; - 처음 설명한 30주 구간은 이후 커밋에서 26주로 줄었다.
  - 2026년 10월 14일 전후의 시각 표시 방식
    &gt; - 그 전에는 실제 UTC 시각을 줘서 화면의 07시가 한국 16시로 보였다.
    &gt; - 그 뒤에는 한국 벽시계 시각을 UTC인 것처럼 준다. 이 결정은 추론으로 표시돼 있다.

## 막혔던 일: 증상, 원인, 고침
- 도시 진입 전후의 막힘
  - 입장 직후 상태 전이 경고로 멈춘 증상
    - 증상
      &gt; - 접속 직후 상태 전이 경고가 찍히고, 로그에 전이 경로를 찾지 못했다는 문구가 남았다.
      &gt; - 경고 뒤에는 진행 신호가 오지 않았다.
    - 원인과 반증
      &gt; - 접속 응답이 연결에서 로그인으로 가는 전이를 일으킨다는 가설은 반증됐다. 릴리스 빌드의 접속 함수는 로그인 전이를 부르지 않고 연결만 시작한다.
      &gt; - 로그인 전이는 계정 엔티티를 받을 때만 일어난다.
      &gt; - 복원 서버가 계정 엔티티를 빼고 아바타 엔티티를 바로 보냈다.
    - 고침과 검증
      &gt; - 엔티티를 계정, 아바타, 도시 진입 순서로 보내도록 바꿨다.
      &gt; - 같은 경고가 사라졌는지는 서버 로그와 클라이언트 로그의 상태 전이로 판정했다.
      &gt; - 이 수정 뒤 도시 메인 화면까지 도달했다.
  - 로딩 잠금이 풀리지 않은 재접속 루프
    - 증상
      &gt; - 로딩 화면에서 움직이지 않다가 약 16초 뒤 로그아웃되고, 재접속을 반복했다.
      &gt; - 같은 화면을 되풀이하는 재접속 루프였다.
    - 원인과 가설
      &gt; - 서버가 확인 응답만 보내고 결과 응답을 보내지 않아 로딩 잠금이 풀리지 않았다.
      &gt; - 콜백이 불리면 잠금이 풀린다는 가정은 틀렸다. 잠금을 푸는 것은 결과 목록을 담은 응답이다.
    - 고침과 정정
      &gt; - 결과 응답은 두 목록을 모두 빈 값으로 보낸다.
      &gt; - 콜백 응답은 보내지 않는다는 판단은 실기기 확인 대상으로 남겼다.
      &gt; - 나중에 콜백 응답이 빠진 탓에 긴급 장면이 검은 화면으로 멈춰 콜백 응답을 추가했다.
  - 하트비트 카운터 누적에 따른 30초 강제 로그아웃
    - 증상
      &gt; - 접속 뒤 약 30초마다 화면 오류 없이 강제 로그아웃이 났다.
      &gt; - 실측으로 연결 뒤 약 30초 만에 로그아웃이 찍혔다.
    - 원인과 반증
      &gt; - 클라이언트는 하트비트 호출마다 카운터를 1씩 줄이고, 임계에 닿으면 자동 로그아웃한다.
      &gt; - 서버가 회신하지 않아 카운터가 다시 맞춰지지 않았다.
      &gt; - 같은 시기 긴급 장면이 멈춘 다른 막힘을 하트비트 무응답 탓으로 봤다가 빗나갔다.
      &gt; - 하트비트 수신과 회신 로그가 상세 수준이어서 보이지 않아 기본 수준으로 올렸다.
    - 고침과 검증
      &gt; - 하트비트 수신에 회신을 보내 카운터를 맞췄다.
      &gt; - 접속 1회 뒤 재접속 없이 하트비트가 5초 간격으로 이어졌다.
  - 전환 응답 누락에 따른 15초 접속 끊김
    - 증상
      &gt; - &quot;응답 대기 중&quot; 표시가 뜬 뒤 약 15초 뒤 접속이 끊겼다.
      &gt; - 회차 넘김 직후에도 같은 15초 끊김이 다시 났다.
    - 원인
      &gt; - 상태 전환 요청에 응답하지 않으면 잠금이 남고, 약 15초 뒤 연결이 끊긴다.
      &gt; - 재발은 스냅샷에 상태 값이 없어 전환 요청이 다시 나갔기 때문이다.
    - 고침
      &gt; - 전환 응답에 요청한 상태 값을 담아 보냈다.
      &gt; - 스냅샷에 상태를 실어 전환 요청 자체를 없앴다. 그 뒤 잠금이 같은 순간에 풀리며 접속이 유지됐다.
- 로그인과 접속의 막힘
  - 게이트 서버 부재 가설의 반증과 13바이트 스텁
    - 가설과 반증
      &gt; - 가설은 게이트 서버가 구현되지 않아 로그인이 실패한다는 것이었다.
      &gt; - 부팅부터 로그인까지 약 3분간 전 포트 패킷을 캡처했다.
      &gt; - 연결 28개가 모두 보안 연결 시작이었고 게이트 접속은 0건이었다.
    - 확정 원인과 고침
      &gt; - 서버 목록 응답이 결과 코드 하나만 담은 13바이트 스텁이었다.
      &gt; - 목록 응답은 요청한 기기가 서버에 닿은 주소를 게이트 주소로 준다.
      &gt; - 두 번째 막힘은 이름 없는 TCP 연결이 웹 서버로 가던 중계 설정이었고, 게이트용 TCP 경로로 고쳤다 (커밋 제목 기준, 2026년 5월 22일).
  - 게임 프로세스 종료 뒤 재접속 실패
    - 증상
      &gt; - 게임 프로세스만 끝낸 뒤 다시 켜면 서버에 붙지 못하고 오류 화면이 매번 떴다.
      &gt; - 로그에서 서버 자체는 살아 있었고, 수락 오류가 초당 약 4천 번 찍혔다.
    - 원인
      &gt; - 게임 프로세스가 끝나면 앱 안 VPN 장치가 사라지고, 안드로이드가 그 주소의 듣는 소켓을 닫는다.
      &gt; - 서버는 닫힌 소켓을 붙든 채 수락 오류를 되풀이했고, 새로 켠 게임이 쓸 주소에는 듣는 소켓이 없었다.
    - 고침과 검증
      &gt; - 서버가 닫힌 듣는 소켓을 스스로 다시 연다 (커밋 제목 기준, 2026년 10월 14일).
      &gt; - 접속 화면은 VPN을 켜고 6초 확인, 장치를 새로 만들고 확인, 서버를 다시 띄우고 확인, 끝까지 안 되면 오류를 보여 준다.
      &gt; - 서비스가 프로세스만 다시 띄워 VPN을 켜 두던 것을 막아, 게임을 닫으면 VPN도 같이 꺼지게 했다.
      &gt; - 고친 뒤 게임 프로세스만 끝내면 4~7초 뒤 게임 화면으로 돌아왔다.
      &gt; - 태블릿에서 네 번 모두 서버 프로세스가 같은 상태로 살아 있었고, 닫힐 때마다 다시 여는 기록이 찍혔다.
- 업데이트 때 계정 데이터 덮어쓰기
  - 증상과 원인
    &gt; - 데이터 묶음의 해시가 바뀌면 플레이 여부와 관계없이 기기의 계정 데이터가 새 묶음으로 덮어씌워졌다.
    &gt; - 교체 조건이 해시 비교뿐이어서 플레이 여부를 보지 않았다.
    &gt; - 플레이 진행이 있는 기기에서도 교체가 일어났다.
  - 고침
    &gt; - 묶음 해시가 새것이고 기기 파일 해시가 마지막으로 쓴 값과 같을 때, 즉 기기에서 건드리지 않았을 때만 새 묶음으로 바꾼다.
    &gt; - 바꾸기 전 파일은 옆에 남긴다.
    &gt; - 백업, 불러오기, 삭제 화면을 추가했고 세 작업 모두 서버 프로세스를 먼저 멈춘다.
    &gt; - 불러오기는 임시 폴더에서 허용된 파일만 풀고 계정 DB의 머리글을 확인한 뒤에야 바꾼다.
    &gt; - 검사에 실패하면 현재 데이터를 그대로 두고, 바꾸기 전 데이터는 한 벌 남긴다.
  - 검증
    &gt; - 설치 구조상 계정 DB와 계정별 진행 파일이 든 데이터 폴더는 재설치 때 건드리지 않는다.
    &gt; - 에뮬레이터에서 재설치 뒤 플레이한 계정 DB의 해시가 그대로였고, 백업, 삭제, 불러오기 뒤 해시가 맞았다.
    &gt; - 휴대폰에서는 삭제 뒤 재로그인이 한 번 필요했다 (확인 안 됨).

## 분석 도구 활용: 쓰임과 한계
- 대상 바이너리 분석
  - 대상과 규모
    &gt; - 분석 대상은 39MB 규모의 ARM64 게임 라이브러리이고 심볼이 없다.
    &gt; - 분석 결과 프로시저 77,279개와 문자열 52,708개를 찾았다.
  - 첫 분석 비용
    &gt; - 첫 분석은 13분 58초가 걸렸고, 호스트 RAM 13GB와 분석 프로세스 최대 메모리 3.0GB 조건에서였다.
    &gt; - 새로 분석하면 약 14분이 든다.
  - 역어셈블러 환경
    &gt; - 기본 역어셈블러 하나와 데모판 하나를 썼다.
    &gt; - 상용 역어셈블러 두 종은 설치하지 않았다.
- 캡처 판독
  - 변환과 정리
    &gt; - 2021 캡처 4세트를 표준 형식으로 바꾸는 변환기를 만들었고, 변환기에 테스트 9개를 두었다.
    &gt; - 512건을 호스트 30개, 요청 44묶음으로 정리했다.
  - 응답 본문 대조
    &gt; - 캡처의 게임 도메인 요청을 서버에 재생해 상태와 본문 해시를 비교하는 대조 도구를 만들었다.
    &gt; - 변환한 응답 본문의 SHA-256 96건이 원본과 모두 일치했다.
  - 경로 대조
    &gt; - 제3자를 뺀 게임 관련 22묶음은 모두 초기 API 문서에 경로가 있었다.
    &gt; - 그중 8묶음은 서버 코드에 경로 문자열이 없다. 와일드카드 라우트일 수 있어 미구현 판정은 아니다.
- 분석 도구가 다루지 못한 것
  &gt; - 게임 스크립트는 분석 도구 범위 밖이어서 스크립트 복원 도구를 따로 만들었다.
  &gt; - 게이트 구간 패킷 캡처는 범위 밖이어서 공개 도구와 자체 도구로 채웠다.
  &gt; - ARM64 섹션 레이아웃 분석은 x86-64 전용이라 이 대상에서 쓸 수 없다.

## 한계와 아직 모르는 것
- 서버만 알던 값
  - 밸런스와 정산
    &gt; - 서버 전용 밸런스 수치와 전투 정산은 클라이언트 코드에 없어 클라이언트에서 확인되지 않는다.
    &gt; - 던전류 정산은 구현했지만 밸런스 값은 검증 범위 밖이다 (확인 안 됨).
  - 보상과 여러 플레이어 기능
    &gt; - 돈과 아이템 보상 지급이 아직 없다.
    &gt; - 행동 보상과 회차 끝 보상도 아직 없고, 구역 전투 보상과 사건 보상도 비어 있다.
    &gt; - 동료, 방, 랭킹, 친구가 단일 플레이어 가정이고 팀 매칭이 없다.
- 게이트 구간의 정답지
  - 범위와 근거
    &gt; - 게이트 구간의 패킷 캡처는 분석 범위 밖이어서 캡처가 없다.
    &gt; - 응답 순서와 값 대부분은 클라이언트 소스에서 거꾸로 세운 추론이다.
  - 검증 수단
    &gt; - 실기기 동작과 서버 로그, 클라이언트 동작에 기댄다.
    &gt; - 플레이 패킷 정답지가 없다.
- 구현하지 못한 범위
  - 처리하는 호출 범위
    &gt; - 서버 호출 1,334개 가운데 647개(약 48.5%)에 핸들러나 의도적 무응답 선언이 있다.
    &gt; - 호출을 처리한다는 뜻이지 기능이 절반 동작한다는 뜻은 아니다.
    &gt; - 핸들러가 없는 호출은 687개다.
  - 온라인 전투
    &gt; - 원본에서 랭킹은 전투 서버가 매기던 값이라 복원 서버는 빈 목록으로 둔다.
    &gt; - 전투 서버가 없어 온라인 전투가 필요한 콘텐츠는 부분 지원이다 (확인 안 됨).
- 화면으로 확인하지 못한 것
  - 정식 결말
    &gt; - 정식 결말은 이야기 선택 구간에 있고 화면으로 본 적이 없다.
    &gt; - 본 엔딩은 두 개이고 둘 다 쉬기만 해서 닿는 실패 쪽 결말이다.
  - 이벤트 활동
    &gt; - 서버 규칙이 필요한 이벤트 활동은 40개다.
    &gt; - 화면 확인은 종류마다 한 바퀴였고 모든 분기를 누르지는 않았다.
    &gt; - 화면으로 보지 못한 활동이 남아 있다.
    &gt; - 이벤트 규칙 모듈 38종은 규칙 종류를 센 수라서 활동 수와 단위가 다르다 (확인 안 됨).
- 빌드와 근거 자료
  - 클라이언트 빌드
    &gt; - 클라이언트는 수정한 빌드로 실행했고, 수정 내용은 이 지도에서 다루지 않는다 (확인 안 됨).
    &gt; - 기기에 올린 빌드는 최근 서버 수정을 항상 담지 않는다 (확인 안 됨).
  - 근거 자료
    &gt; - 영상과 스크린샷은 저장소에 없을 수 있다.
    &gt; - 분석 출력은 본문을 빼고 해시, 길이, 판정만 남긴다.
- 서버 시험 재실행 결과
  &gt; - 2026년 10월 25일 Windows에서 다시 돌리니 4,003개 통과, 5개 실패, 2개 오류, 3개 건너뜀이었고 90.28초가 걸렸다.
  &gt; - 실패 5개는 기기 구성 소켓 테스트 3개와 CRLF로 저장된 정적 응답의 바이트 대조 2개다. 이 수치는 줄바꿈이 CRLF인 체크아웃 기준이다.
  &gt; - 오류 2개는 Windows 환경변수 길이 한도(32,767자)를 넘는 매개변수 때문이다.
  &gt; - 운영 환경(Ubuntu)에서는 다시 돌리지 않았다.
</textarea>

    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

.mme-progress {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--mme-ok);
    vertical-align: 1px;
    white-space: nowrap;
}
.mme-progress i {
    display: inline-block;
    width: 38px;
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(
        to right,
        var(--mme-ok) var(--p, 0%),
        var(--mme-border) var(--p, 0%)
    );
}
.mme-progress b {
    font-weight: 600;
}

.mme-count {
    display: none;
    margin-left: 8px;
    padding: 0 7px;
    border-radius: 999px;
    background: #eaeef2;
    color: var(--mme-muted);
    font-size: 11px;
    font-weight: 600;
    vertical-align: 1px;
    white-space: nowrap;
}
.markmap-fold .mme-count {
    display: inline-block;
}

.mme-info {
    display: inline-block;
    box-sizing: border-box;
    width: 15px;
    height: 15px;
    margin-left: 7px;
    border: 1.5px solid var(--mme-accent);
    border-radius: 50%;
    color: var(--mme-accent);
    font-size: 10px;
    font-weight: 700;
    line-height: 12px;
    text-align: center;
    vertical-align: 1px;
}
.mme-info::before {
    content: "i";
}

/* "+N more" / "N fewer" buttons: leaf siblings, drawn as dashed pills so they
   cannot be mistaken for a parent node. */
.mme-more,
.mme-less {
    display: inline-block;
    padding: 1px 10px;
    border: 1px dashed var(--mme-accent);
    border-radius: 999px;
    color: var(--mme-accent);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
    white-space: nowrap;
    cursor: pointer;
}
.mme-more::before {
    content: "+" attr(data-n) " more \25BE";
}
.mme-less::before {
    content: "Show " attr(data-n) " fewer \25B4";
}
html[lang^="ko"] .mme-more::before {
    content: "외 " attr(data-n) "개 더 보기 \25BE";
}
html[lang^="ko"] .mme-less::before {
    content: "외 " attr(data-n) "개 접기 \25B4";
}
#mindmap g.markmap-node:hover .mme-more,
#mindmap g.markmap-node:hover .mme-less {
    background: var(--mme-accent-soft);
}
#mindmap g.mme-sentinel > line {
    stroke-dasharray: 3 3;
}
#mindmap path.markmap-link.mme-sentinel-link {
    stroke-dasharray: 3 4;
    opacity: 0.85;
}

.mme-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
}

/* code, tables, images */

#mindmap .markmap-foreign pre {
    margin: 4px 0;
}
#mindmap .markmap-foreign pre > code {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--mme-code-bg);
    color: #24292f;
    font: 12.5px/1.55 var(--mme-mono);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: normal;
}
#mindmap .markmap-foreign table {
    width: 100%;
    margin: 4px 0;
    border: 1px solid var(--mme-border);
    border-collapse: separate;
    border-spacing: 0;
    border-radius: 6px;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.4;
}
#mindmap .markmap-foreign th,
#mindmap .markmap-foreign td {
    padding: 5px 10px;
    border: 0;
    border-bottom: 1px solid var(--mme-border);
    text-align: left;
    color: var(--mme-fg-2);
    font-weight: 400;
}
#mindmap .markmap-foreign th {
    background: var(--mme-surface-2);
    font-weight: 600;
}
#mindmap .markmap-foreign tr:last-child td {
    border-bottom: 0;
}
#mindmap .markmap-foreign tbody tr:nth-child(even) td {
    background: #fafbfc;
}
/* Nodes holding code or tables get a wider text column than prose. */
#mindmap .markmap-foreign > div > div:has(pre, table) {
    width: min(560px, 80vw);
}

#mindmap .markmap-foreign img {
    display: block;
    max-width: 240px;
    max-height: 180px;
    width: auto;
    height: auto;
    margin: 2px 0;
    border-radius: 6px;
    object-fit: contain;
    cursor: zoom-in;
}
#mindmap .markmap-foreign figure {
    display: block;
    margin: 2px 0;
}
#mindmap .markmap-foreign figcaption {
    max-width: 240px;
    margin-top: 2px;
    color: var(--mme-muted);
    font-size: 12px;
    font-weight: 400;
}

/* ---------- Chrome: shared ---------- */

.mme-ui {
    font-family: var(--mme-font);
    color: var(--mme-fg);
    box-sizing: border-box;
}
.mme-ui *,
.mme-ui *::before,
.mme-ui *::after {
    box-sizing: border-box;
}

.mme-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--mme-border);
    border-radius: var(--mme-radius);
    background: var(--mme-surface);
    color: var(--mme-fg);
    font: 500 13px/1 var(--mme-font);
    cursor: pointer;
}
.mme-btn:hover {
    background: var(--mme-surface-2);
}
.mme-btn:focus-visible,
.mme-menu button:focus-visible,
.mme-panel button:focus-visible,
.mme-search input:focus-visible {
    outline: 2px solid var(--mme-accent);
    outline-offset: 1px;
}
.mme-btn svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.mme-btn[aria-expanded="true"],
.mme-btn.mme-on {
    background: var(--mme-accent-soft);
    border-color: var(--mme-accent);
    color: var(--mme-accent);
}

/* ---------- Chrome: header + toolbar ---------- */

.mme-head {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 900;
    max-width: min(46vw, 520px);
    padding: 8px 12px;
    border: 1px solid var(--mme-border);
    border-radius: var(--mme-radius);
    background: color-mix(in srgb, var(--mme-surface) 92%, transparent);
    backdrop-filter: blur(6px);
}
.mme-head h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.mme-head p {
    margin: 2px 0 0;
    color: var(--mme-muted);
    font-size: 12px;
    line-height: 1.4;
}
.mme-head .mme-meta {
    margin-top: 4px;
    font-size: 11px;
}

.mme-bar {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 950;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: right 0.2s;
}
body.mme-panel-open .mme-bar {
    right: calc(var(--mme-panel-width) + 12px);
}
/* With the panel open the bar and header compete for the same row. */
body.mme-panel-open .mme-head {
    max-width: 240px;
}
body.mme-panel-open .mme-head p {
    display: none;
}
body.mme-panel-open .mme-search input {
    width: 130px;
}

.mme-search {
    display: flex;
    align-items: center;
    gap: 6px;
}
.mme-search-field {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 36px;
    padding: 0 4px 0 10px;
    border: 1px solid var(--mme-border);
    border-radius: var(--mme-radius);
    background: var(--mme-surface);
}
.mme-search-field:focus-within {
    border-color: var(--mme-accent);
}
.mme-search input {
    width: 190px;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--mme-fg);
    font: 400 14px/1 var(--mme-font);
}
.mme-search input:focus-visible {
    outline: none;
}
.mme-search input::-webkit-search-cancel-button,
.mme-search input::-webkit-search-decoration {
    display: none;
    -webkit-appearance: none;
}
.mme-search-count {
    min-width: 40px;
    color: var(--mme-muted);
    font-size: 12px;
    text-align: right;
    white-space: nowrap;
}
.mme-search-field .mme-btn {
    min-width: 28px;
    height: 28px;
    padding: 0 6px;
    border: 0;
    background: transparent;
}
.mme-search-field .mme-btn:hover {
    background: var(--mme-surface-2);
}
.mme-search-toggle {
    display: none;
}
.mme-search-field:not(.mme-has-results) .mme-search-count,
.mme-search-field:not(.mme-has-results) .mme-step {
    display: none;
}

.mme-dropdown {
    position: relative;
}
.mme-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 1200;
    display: none;
    min-width: 190px;
    padding: 4px;
    border: 1px solid var(--mme-border);
    border-radius: 10px;
    background: var(--mme-surface);
    box-shadow: var(--mme-shadow);
}
.mme-menu.mme-open {
    display: block;
}
.mme-menu button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--mme-fg);
    font: 400 13px/1.2 var(--mme-font);
    text-align: left;
    cursor: pointer;
}
.mme-menu button:hover {
    background: var(--mme-surface-2);
}
.mme-menu button[aria-checked="true"]::after {
    content: "✓";
    color: var(--mme-accent);
    font-weight: 700;
}
.mme-menu hr {
    margin: 4px 0;
    border: 0;
    border-top: 1px solid var(--mme-border);
}

.mme-zoombar {
    position: fixed !important;
    right: 16px !important;
    bottom: 16px !important;
    left: auto !important;
    transition: right 0.2s;
}
body.mme-panel-open .mme-zoombar {
    right: calc(var(--mme-panel-width) + 16px) !important;
}

/* ---------- Chrome: hover card ---------- */

.mme-card {
    position: fixed;
    z-index: 1100;
    max-width: 320px;
    padding: 10px 12px;
    border: 1px solid var(--mme-border);
    border-radius: 10px;
    background: var(--mme-surface);
    box-shadow: var(--mme-shadow);
    font-size: 13px;
    line-height: 1.5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
}
.mme-card.mme-show {
    opacity: 1;
}
.mme-card-title {
    margin: 0 0 4px;
    font-weight: 650;
    font-size: 14px;
}
.mme-card-detail {
    position: relative;
    max-height: 11em;
    overflow: hidden;
    color: var(--mme-fg-2);
    word-break: keep-all;
    overflow-wrap: anywhere;
}
.mme-card-detail.mme-clipped::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 2.4em;
    background: linear-gradient(transparent, var(--mme-surface));
}
.mme-card-meta {
    margin-top: 6px;
    color: var(--mme-muted);
    font-size: 12px;
}
.mme-card a {
    color: var(--mme-accent);
}
.mme-card ul {
    margin: 4px 0 0;
    padding-left: 18px;
    color: var(--mme-fg-2);
}
.mme-card hint,
.mme-card .mme-hint {
    display: block;
    margin-top: 6px;
    color: var(--mme-muted);
    font-size: 11px;
}

/* ---------- Chrome: detail panel ---------- */

.mme-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    width: var(--mme-panel-width);
    border-left: 1px solid var(--mme-border);
    background: var(--mme-surface);
    box-shadow: var(--mme-shadow);
    transform: translateX(105%);
    transition: transform 0.2s;
    visibility: hidden;
}
.mme-panel.mme-open {
    transform: none;
    visibility: visible;
}
.mme-panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 12px 8px 16px;
}
.mme-crumbs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px 4px;
    margin: 6px 0 0;
    padding: 0;
    list-style: none;
    color: var(--mme-muted);
    font-size: 12px;
}
.mme-crumbs li:not(:last-child)::after {
    content: "›";
    margin-left: 4px;
}
.mme-crumbs button {
    max-width: 14em;
    padding: 2px 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--mme-accent);
    font: inherit;
    cursor: pointer;
}
.mme-crumbs button:hover {
    background: var(--mme-surface-2);
}
.mme-panel-body {
    flex: 1;
    padding: 0 16px 16px;
    overflow: auto;
    overscroll-behavior: contain;
}
.mme-panel-title {
    margin: 4px 0 10px;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
    word-break: keep-all;
    overflow-wrap: anywhere;
}
.mme-panel h3 {
    margin: 16px 0 6px;
    color: var(--mme-muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
}
.mme-detail {
    font-size: 14px;
    line-height: 1.6;
    color: var(--mme-fg-2);
    word-break: keep-all;
    overflow-wrap: anywhere;
}

/* Detail content is written by agents in whatever structure fits it, so every
   block type must read well in both the card preview and the side panel. */
.mme-detail p,
.mme-card-detail p {
    margin: 0 0 8px;
}
.mme-detail > :last-child,
.mme-card-detail > :last-child {
    margin-bottom: 0;
}
.mme-detail a,
.mme-card-detail a {
    color: var(--mme-accent);
}
.mme-detail strong,
.mme-card-detail strong {
    color: var(--mme-fg);
    font-weight: 650;
}
.mme-detail ul,
.mme-detail ol,
.mme-card-detail ul,
.mme-card-detail ol {
    margin: 0 0 8px;
    padding-left: 20px;
}
.mme-detail li,
.mme-card-detail li {
    margin: 2px 0;
}
.mme-detail li > ul,
.mme-detail li > ol,
.mme-card-detail li > ul,
.mme-card-detail li > ol {
    margin: 2px 0 0;
}
.mme-detail code,
.mme-card-detail code {
    padding: 1px 4px;
    border-radius: 4px;
    background: var(--mme-code-bg);
    font: 0.92em/1.4 var(--mme-mono);
    word-break: break-all;
}
.mme-detail blockquote,
.mme-card-detail blockquote {
    margin: 0 0 8px;
    padding-left: 10px;
    border-left: 3px solid var(--mme-border);
    color: var(--mme-muted);
}
.mme-detail h1,
.mme-detail h2,
.mme-detail h3,
.mme-detail h4,
.mme-card-detail h1,
.mme-card-detail h2,
.mme-card-detail h3,
.mme-card-detail h4 {
    margin: 10px 0 4px;
    font-size: 1em;
    font-weight: 650;
    color: var(--mme-fg);
}
.mme-detail hr {
    margin: 10px 0;
    border: 0;
    border-top: 1px solid var(--mme-border);
}
.mme-detail img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    cursor: zoom-in;
}
.mme-detail pre,
.mme-card-detail pre,
.mme-panel-title pre {
    overflow: auto;
    margin: 0 0 8px;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--mme-code-bg);
    font: 12.5px/1.55 var(--mme-mono);
}
.mme-detail pre code,
.mme-card-detail pre code {
    padding: 0;
    background: none;
    word-break: normal;
}
.mme-detail table,
.mme-card-detail table {
    display: block;
    max-width: 100%;
    margin: 0 0 8px;
    overflow-x: auto;
    border-collapse: collapse;
    font-size: 13px;
}
.mme-detail th,
.mme-detail td,
.mme-card-detail th,
.mme-card-detail td {
    padding: 4px 8px;
    border: 1px solid var(--mme-border);
    text-align: left;
    vertical-align: top;
}
.mme-detail th,
.mme-card-detail th {
    background: var(--mme-code-bg);
    color: var(--mme-fg);
    font-weight: 650;
    white-space: nowrap;
}
.mme-detail tbody tr:nth-child(even) td,
.mme-card-detail tbody tr:nth-child(even) td {
    background: color-mix(in srgb, var(--mme-code-bg) 45%, transparent);
}
.mme-panel .mme-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 0;
    padding: 0;
    list-style: none;
}
.mme-panel .mme-list button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 7px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--mme-fg);
    font: 400 13px/1.35 var(--mme-font);
    text-align: left;
    cursor: pointer;
}
.mme-panel .mme-list button:hover {
    background: var(--mme-surface-2);
}
.mme-panel .mme-list small {
    color: var(--mme-muted);
    white-space: nowrap;
}
.mme-panel .mme-list a {
    color: var(--mme-accent);
    font-size: 13px;
    word-break: break-all;
}
.mme-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
}
.mme-panel .mme-progress-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--mme-ok);
    font-weight: 600;
}
.mme-panel .mme-progress-line i {
    flex: 1;
    max-width: 160px;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(
        to right,
        var(--mme-ok) var(--p, 0%),
        var(--mme-border) var(--p, 0%)
    );
}

/* ---------- Chrome: lightbox, toast ---------- */

.mme-lightbox {
    position: fixed;
    inset: 0;
    z-index: 1300;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    background: rgba(0, 0, 0, 0.82);
    cursor: zoom-out;
}
.mme-lightbox.mme-open {
    display: flex;
}
.mme-lightbox img {
    max-width: 92vw;
    max-height: 82vh;
    border-radius: 8px;
    background: #fff;
}
.mme-lightbox p {
    margin: 0;
    color: #fff;
    font-size: 14px;
}
.mme-toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 1400;
    padding: 8px 14px;
    border-radius: 999px;
    background: #24292f;
    color: #fff;
    font-size: 13px;
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
}
.mme-toast.mme-show {
    opacity: 1;
}

/* ---------- Mobile ---------- */

@media (pointer: coarse) {
    .mme-btn {
        min-width: 44px;
        height: 44px;
    }
    .mme-search-field {
        height: 44px;
    }
    .mme-menu button {
        padding: 12px 12px;
    }
}

@media (max-width: 640px) {
    :root {
        --mme-panel-width: 100vw;
        --mme-top: 56px;
    }
    .mme-head {
        top: 10px;
        left: 10px;
        max-width: calc(100vw - 150px);
        padding: 6px 10px;
    }
    .mme-head p,
    .mme-head .mme-meta {
        display: none;
    }
    .mme-bar {
        top: 10px;
        right: 10px;
        gap: 6px;
    }
    body.mme-panel-open .mme-bar {
        right: 10px;
    }
    .mme-search-toggle {
        display: inline-flex;
    }
    .mme-search-field {
        display: none;
    }
    .mme-search.mme-open {
        position: fixed;
        top: 10px;
        right: 10px;
        left: 10px;
        z-index: 1250;
    }
    .mme-search.mme-open .mme-search-field {
        display: flex;
        flex: 1;
    }
    .mme-search.mme-open .mme-search-toggle {
        display: none;
    }
    .mme-search input {
        flex: 1;
        width: 100%;
        min-width: 0;
        font-size: 16px;
    }
    .mme-panel {
        top: auto;
        left: 0;
        width: 100%;
        max-height: 58vh;
        border-left: 0;
        border-top: 1px solid var(--mme-border);
        border-radius: 16px 16px 0 0;
        transform: translateY(105%);
    }
    .mme-panel.mme-open {
        transform: none;
    }
    .mme-zoombar {
        right: 10px !important;
        bottom: 10px !important;

                fitSoon(60);
                setTimeout(function () {
                    mm.setOptions({ duration: motionMs });
                }, 400);
            }
        });
    };

    /* ------------------------------------------------------------------ */

    var live = h("div", {
        class: "mme-ui mme-sr",
        "aria-live": "polite",

    });
    var toastEl = h("div", { class: "mme-ui mme-toast", role: "status" });

        class: "mme-ui mme-card",
        role: "tooltip",
        "aria-hidden": "true"
    });
    var lightbox = h("div", {

    });
    var panelEl = h("aside", {

    doc.body.appendChild(live);
    doc.body.appendChild(toastEl);
    doc.body.appendChild(cardEl);
    doc.body.appendChild(lightbox);

    function announce(msg) {
        live.textContent = "";
        setTimeout(function () {
            live.textContent = msg;

    var toastTimer = 0;
    window.mmeToast = function (msg) {

    /* ------------------------------------------------------------------ */
    /* Dropdown helper                                                     */
    /* ------------------------------------------------------------------ */

    var openMenus = [];
    function closeMenus(except) {
        openMenus.forEach(function (m) {
            if (m.menu !== except) m.close();
        });
    }
    function dropdown(icon, label, items) {
        var wrap = h("div", { class: "mme-dropdown" });
        var menu = h("div", {
            class: "mme-menu",
            role: "menu",
            "aria-label": label
        });
        var btn = h("button", {
            type: "button",
            class: "mme-btn",
            "aria-haspopup": "menu",
            "aria-expanded": "false",
            "aria-label": label,
            title: label,
            html:
                ICONS[icon] +
                '<span class="mme-btn-label">' +
                esc(label) +
                "</span>"
        });
        var entry = {
            menu: menu,
            close: function () {
                menu.classList.remove("mme-open");
                btn.setAttribute("aria-expanded", "false");
            }
        };
        openMenus.push(entry);
        items.forEach(function (it) {
            if (it === "-")
                return menu.appendChild(h("hr", { role: "separator" }));
            var b = h("button", {
                type: "button",
                role: it.checkbox ? "menuitemcheckbox" : "menuitem",
                text: it.label,
                "aria-checked": it.checkbox ? "false" : null,
                tabindex: "-1"
            });
            b.addEventListener("click", function () {
                entry.close();
                it.run(b);
            });
            it.el = b;
            menu.appendChild(b);
        });
        function open() {
            closeMenus(menu);
            menu.classList.add("mme-open");
            btn.setAttribute("aria-expanded", "true");
        }
        btn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (menu.classList.contains("mme-open")) entry.close();
            else open();
        });
        btn.addEventListener("keydown", function (e) {
            if (e.key === "ArrowDown") {
                e.preventDefault();
                open();
                var first = menu.querySelector("button");
                if (first) first.focus();
            }
        });
        menu.addEventListener("keydown", function (e) {
            var btns = Array.prototype.slice.call(
                menu.querySelectorAll("button")
            );
            var i = btns.indexOf(doc.activeElement);
            if (e.key === "ArrowDown") {
                e.preventDefault();
                btns[(i + 1) % btns.length].focus();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                btns[(i - 1 + btns.length) % btns.length].focus();
            } else if (e.key === "Escape") {
                e.stopPropagation();
                entry.close();
                btn.focus();
            }
        });
        wrap.appendChild(btn);
        wrap.appendChild(menu);
        return { el: wrap, items: items };
    }
    doc.addEventListener("click", function () {
        closeMenus();
    });

    /* ------------------------------------------------------------------ */
    /* Search                                                              */
    /* ------------------------------------------------------------------ */

    var input = h("input", {
        type: "search",
        id: "mme-search-input",
        name: "mme-search",
        placeholder: T.placeholder,
        "aria-label": T.search,
        autocomplete: "off",
        spellcheck: "false"
    });
    var countEl = h("span", {
        class: "mme-search-count",
        "aria-hidden": "true"
    });
    var prevBtn = iconButton("up", T.prev, "mme-step", function () {
        stepMatch(-1);
    });
    var nextBtn = iconButton("down", T.next, "mme-step", function () {
        stepMatch(1);
    });
    var clearBtn = iconButton("close", T.clear, "", function () {
        clearSearchUi();
        input.focus();
    });
    var searchField = h("div", { class: "mme-search-field" }, [
        h("span", {
            class: "mme-search-ico",
            html: ICONS.search,
            "aria-hidden": "true"
        }),
        input,
        countEl,
        prevBtn,
        nextBtn,
        clearBtn
    ]);
    var searchToggle = iconButton(
        "search",
        T.search,
        "mme-search-toggle",
        function () {
            searchWrap.classList.add("mme-open");
            input.focus();
        }
    );
    var searchWrap = h("div", { class: "mme-search", role: "search" }, [
        searchToggle,
        searchField
    ]);
    // inline icon inside the field should not look like a button
    searchField.firstChild.style.cssText =
        "display:inline-flex;width:16px;height:16px;color:#57606a";
    searchField.firstChild.firstChild.style.cssText =
        "width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round";

    function matchesNode(n, q) {
        if (isSentinel(n)) return false;
        if (S.todoOnly && !(n.payload && n.payload.task === "todo"))
            return false;
        if (!q) return true;
        return (
            norm(textOf(n)).indexOf(q) !== -1 ||
            norm(detailText(n)).indexOf(q) !== -1
        );
    }

    function snapshotFold() {
        var m = new Map();
        walk(root, function (n) {
            if (hasKids(n)) m.set(n, (n.payload && n.payload.fold) || 0);
        });
        return m;
    }
    function snapshotSiblings() {
        var m = new Map();
        groups.forEach(function (g, p) {
            m.set(p, g.expanded);
        });
        return m;
    }
    function restoreFold() {
        if (!S.savedFold) return false;
        S.savedFold.forEach(function (v, n) {
            setFold(n, v);
        });
        if (S.savedSib) {
            S.savedSib.forEach(function (expanded, p) {
                setSiblingsExpanded(p, expanded);
            });
        }
        S.savedFold = null;
        S.savedSib = null;
        return true;
    }

    var searchTimer = 0;
    function scheduleSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, 140);
    }

    function updateCount() {
        var q = S.query.trim();
        if (!S.searchActive) {
            countEl.textContent = "";
        } else if (S.matches.length) {
            countEl.textContent = S.active + 1 + "/" + S.matches.length;
        } else {
            countEl.textContent = T.noResult;
        }
        searchField.classList.toggle("mme-has-results", S.searchActive);
        prevBtn.disabled = nextBtn.disabled = S.matches.length < 2;
        clearBtn.style.visibility = q || S.todoOnly ? "visible" : "hidden";
    }

    async function runSearch() {
        var token = ++S.searchToken;
        var q = norm(S.query.trim());
        S.searchActive = !!q || S.todoOnly;
        if (!S.searchActive) {
            await clearSearchState();
            return;
        }
        if (!S.savedFold) {
            S.savedFold = snapshotFold();
            S.savedSib = snapshotSiblings();
        }
        var matches = [];
        walk(root, function (n) {
            if (matchesNode(n, q)) matches.push(n);
        });
        var anc = new Set();
        matches.forEach(function (n) {
            ancestors(n).forEach(function (a) {
                anc.add(a);
            });
        });
        S.matches = matches;
        S.matchSet = new Set(matches);
        S.ancSet = anc;
        var changed = false;
        matches.forEach(function (n) {
            if (revealSync(n)) changed = true;
        });
        S.active = matches.length ? 0 : -1;
        if (changed) await mm.renderData();
        if (token !== S.searchToken) return;
        paintClasses();
        updateCount();
        announce(
            matches.length ? T.resultsAnnounce(matches.length) : T.noResult
        );
        if (matches.length) gotoActive();
    }

    function panelPad() {
        if (!panelEl.classList.contains("mme-open")) return {};
        var r = panelEl.getBoundingClientRect();
        return window.innerWidth <= 640
            ? { bottom: r.height + 16 }
            : { right: r.width + 16 };
    }

    function gotoActive() {
        var n = S.matches[S.active];
        if (!n) return;
        S.focus = n;
        decorate();
        updateCount();
        mm.centerNode(n, panelPad());
    }
    function stepMatch(dir) {
        if (!S.matches.length) return;
        S.active = (S.active + dir + S.matches.length) % S.matches.length;
        gotoActive();
    }

    async function clearSearchState() {
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = false;
        var restored = restoreFold();
        updateCount();
        if (restored) await mm.renderData();
        else paintClasses();
    }
    function clearSearchUi() {
        input.value = "";
        S.query = "";
        S.todoOnly = false;
        todoItem.el.setAttribute("aria-checked", "false");
        S.searchToken++;
        clearSearchState();
        searchWrap.classList.remove("mme-open");
    }

    input.addEventListener("input", function () {
        S.query = input.value;
        scheduleSearch();
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            clearTimeout(searchTimer);
            if (
                S.searchToken &&
                S.matches.length &&
                norm(input.value.trim()) === norm(S.query.trim()) &&
                S.searchActive
            ) {
                stepMatch(e.shiftKey ? -1 : 1);
            } else {
                S.query = input.value;
                runSearch();
            }
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            stepMatch(1);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            stepMatch(-1);
        } else if (e.key === "Escape") {
            e.stopPropagation();
            clearSearchUi();
            input.blur();
            focusNode(nearestShown(S.focus));
        }
    });
    input.addEventListener("blur", function () {
        if (!input.value && window.innerWidth <= 640 && !S.todoOnly) {
            searchWrap.classList.remove("mme-open");
        }
    });

    /* ------------------------------------------------------------------ */
    /* Level menu                                                          */
    /* ------------------------------------------------------------------ */

    async function structuralChange() {
        S.savedFold = null;
        S.savedSib = null;
        S.searchToken++;
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = !!(S.query.trim() || S.todoOnly);
        await mm.renderData();
        await mm.fit();
        if (S.searchActive) runSearch();
        else updateCount();
    }
    function setLevel(level) {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, n.state.depth >= level + 1 ? 1 : 0);
        });
        structuralChange();
    }
    function expandAll() {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, 0);
        });
        groups.forEach(function (g, p) {
            setSiblingsExpanded(p, true);
        });
        structuralChange();
    }

    var todoItem = {
        label: T.todoOnly,
        checkbox: true,
        run: function (b) {
            S.todoOnly = !S.todoOnly;
            b.setAttribute("aria-checked", S.todoOnly ? "true" : "false");
            runSearch();
        }
    };
    var levelItems = [1, 2, 3, 4].map(function (n) {
        return {
            label: T.levelItem(n),
            run: function () {
                setLevel(n);
            }
        };
    });
    levelItems.push({ label: T.expandAll, run: expandAll });
    if (cfg.hasTasks) {
        levelItems.push("-");
        levelItems.push(todoItem);
    }
    var levelDd = dropdown("layers", T.level, levelItems);

    var exportDd = dropdown("download", T.exportLabel, [
        {
            label: T.exportPng,
            run: function () {
                exportAs("png");
            }
        },
        {
            label: T.exportJpg,
            run: function () {
                exportAs("jpg");
            }
        },
        {
            label: T.exportSvg,
            run: function () {
                exportAs("svg");
            }
        },
        "-",
        {
            label: T.copyMd,
            run: function () {
                exportAs("copy");
            }
        }
    ]);
    function exportAs(kind) {
        var api = window.mmExport;
        if (api && api[kind]) api[kind]();
    }

    barEl.appendChild(searchWrap);
    barEl.appendChild(levelDd.el);
    barEl.appendChild(exportDd.el);
    // Menu is built before todoItem exists only if tasks are absent.
    if (!cfg.hasTasks) todoItem.el = h("span");

    /* Export hooks: strip transient visual state while an image is rendered. */
    window.mmeBeforeExport = function () {
        svgEl.classList.add("mme-exporting");
        cardEl.classList.remove("mme-show");
    };
    window.mmeAfterExport = function () {
        svgEl.classList.remove("mme-exporting");
    };

    /* ------------------------------------------------------------------ */
    /* Hover                                                               */
    /* ------------------------------------------------------------------ */

    function pathOf(n) {
        var s = new Set([n]);
        ancestors(n).forEach(function (a) {
            s.add(a);
        });
        if (!isFolded(n)) {
            (n.children || []).forEach(function (c) {
                s.add(c);
            });
        }
        return s;
    }

    function cardHtml(n) {
        var p = n.payload || {};
        var parts = [];
        function list(items, extra) {
            var li = items
                .slice(0, 5)
                .map(function (c) {
                    return "<li>" + esc(textOf(c)) + "</li>";
                })
                .join("");
            var more =
                items.length > 5
                    ? "<li>…" + esc(T.moreItems(items.length - 5)) + "</li>"
                    : "";
            return "<ul>" + li + more + "</ul>" + (extra || "");
        }
        if (p.less) return "";
        if (p.more) {
            var g = groups.get(parentOf.get(n));
            return (
                '<div class="mme-card-title">' +
                esc(textOf(n)) +
                "</div>" +
                list(g ? g.hidden : [])
            );
        }
        var needTitle = !!p.detail || isFolded(n);
        if (needTitle)
            parts.push(
                '<div class="mme-card-title">' + esc(textOf(n)) + "</div>"
            );
        if (p.detail)
            parts.push('<div class="mme-card-detail">' + p.detail + "</div>");
        if (isFolded(n)) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.childCount(realKids(n).length) + " · " + T.folded) +
                    "</div>" +
                    list(realKids(n))
            );
        }
        if (p.tasks) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.done + " " + p.tasks.done + "/" + p.tasks.total) +
                    "</div>"
            );
        }
        if (!parts.length) return "";
        if (p.detail)
            parts.push('<span class="mme-hint">' + esc(T.hint) + "</span>");
        return parts.join("");
    }

    function positionCard(n) {
        var g = gMap.get(n);
        if (!g) return;
        var fo = g.querySelector("foreignObject") || g;
        var r = fo.getBoundingClientRect();
        cardEl.style.left = "0px";
        cardEl.style.top = "0px";
        var cw = cardEl.offsetWidth;
        var ch = cardEl.offsetHeight;
        var left = Math.min(Math.max(8, r.left), window.innerWidth - cw - 8);
        var top = r.bottom + 8;
        if (top + ch > window.innerHeight - 8)
            top = Math.max(8, r.top - ch - 8);
        cardEl.style.left = left + "px";
        cardEl.style.top = top + "px";
    }
    function showCard(n) {
        var html = cardHtml(n);
        if (!html) {
            hideCard();
            return;
        }
        cardEl.innerHTML = html;
        var preview = cardEl.querySelector(".mme-card-detail");
        if (preview && preview.scrollHeight > preview.clientHeight + 1) {
            preview.classList.add("mme-clipped");
        }
        positionCard(n);
        cardEl.classList.add("mme-show");
    }
    function hideCard() {
        cardEl.classList.remove("mme-show");
    }
    var cardTimer = 0;
    function startHover(n, immediate) {
        S.hover = n;
        S.pathSet = pathOf(n);
        paintClasses();
        clearTimeout(cardTimer);
        cardTimer = setTimeout(
            function () {
                // The panel already shows the selected node's details.
                if (S.hover === n && S.selected !== n) showCard(n);
            },
            immediate ? 60 : 220
        );
    }
    function endHover() {
        S.hover = null;
        S.pathSet = null;
        clearTimeout(cardTimer);
        hideCard();
        paintClasses();
    }
    var noHover =
        window.matchMedia && window.matchMedia("(hover: none)").matches;
    svgEl.addEventListener("mouseover", function (e) {
        if (noHover || e.buttons) return;
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n === S.hover) return;
        if (!n || !n.state) endHover();
        else startHover(n, false);
    });
    svgEl.addEventListener("mouseleave", endHover);
    svgEl.addEventListener("mousedown", hideCard);
    svgEl.addEventListener("focusin", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n && n.state) {
            S.focus = n;
            startHover(n, true);
        }
    });
    svgEl.addEventListener("focusout", endHover);
    mm.zoom.on("start.mme", hideCard);

    /* ------------------------------------------------------------------ */
    /* Selection panel                                                     */
    /* ------------------------------------------------------------------ */

    function collectLinks(n) {
        var out = [];
        var seen = {};
        [n.content, n.payload && n.payload.detail].forEach(function (html) {
            if (!html) return;
            parseHtml(html)
                .querySelectorAll("a[href]")
                .forEach(function (a) {
                    var href = a.getAttribute("href");
                    if (!href || seen[href]) return;
                    seen[href] = 1;
                    out.push({
                        href: href,
                        text: (a.textContent || href).trim()
                    });
                });
        });
        return out;
    }

    function labelButton(n, extraHtml) {
        var b = h("button", { type: "button" });
        b.appendChild(h("span", { text: textOf(n) }));
        if (extraHtml) b.appendChild(h("small", { text: extraHtml }));
        b.addEventListener("click", function () {
            selectNode(n, { center: true });
        });
        return b;
    }

    function renderPanel(n) {
        var p = n.payload || {};
        panelEl.textContent = "";
        var chain = ancestors(n).reverse();
        var crumbs = h("ol", { class: "mme-crumbs", "aria-label": "path" });
        chain.forEach(function (a) {
            var li = h("li");
            li.appendChild(labelButton(a));
            crumbs.appendChild(li);
        });
        var closeBtn = iconButton("close", T.close, "", function () {
            deselect(true);
        });
        panelEl.appendChild(
            h("div", { class: "mme-panel-head" }, [crumbs, closeBtn])
        );

        var body = h("div", { class: "mme-panel-body" });
        body.appendChild(
            h("div", { class: "mme-panel-title", html: titleHtml(n) })
        );

        if (p.tasks) {
            var pct = Math.round((p.tasks.done / p.tasks.total) * 100);
            body.appendChild(h("h3", { text: T.progress }));
            body.appendChild(
                h("div", { class: "mme-progress-line" }, [
                    h("i", { style: "--p:" + pct + "%" }),
                    h("span", { text: p.tasks.done + "/" + p.tasks.total })
                ])
            );
        }
        if (p.detail) {
            body.appendChild(h("h3", { text: T.detail }));
            body.appendChild(h("div", { class: "mme-detail", html: p.detail }));
        }
        if (hasKids(n)) {
            var kids = realKids(n);
            body.appendChild(
                h("h3", { text: T.children + " (" + kids.length + ")" })
            );
            var ul = h("ul", { class: "mme-list" });
            kids.forEach(function (c) {
                var li = h("li");
                var extra =
                    hasKids(c) && c.payload && c.payload.count
                        ? "+" + c.payload.count
                        : "";
                li.appendChild(labelButton(c, extra));
                ul.appendChild(li);
            });
            body.appendChild(ul);
        }
        var links = collectLinks(n);
        if (links.length) {
            body.appendChild(h("h3", { text: T.links }));
            var lul = h("ul", { class: "mme-list" });
            links.forEach(function (l) {
                lul.appendChild(
                    h("li", null, [
                        h("a", {
                            href: l.href,
                            target: "_blank",
                            rel: "noopener noreferrer",
                            text: l.text
                        })
                    ])
                );
            });
            body.appendChild(lul);
        }

        var actions = h("div", { class: "mme-actions" });
        if (hasKids(n)) {
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: isFolded(n) ? T.expand : T.collapse,
                    onclick: function () {
                        mm.toggleNode(n, false).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: T.expandBelow,
                    onclick: function () {
                        walk(n, function (x) {
                            if (hasKids(x)) setFold(x, 0);
                        });
                        mm.renderData(n).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
        }
        actions.appendChild(
            h("button", {
                type: "button",
                class: "mme-btn",
                text: T.copyText,
                onclick: function () {
                    copyText(textOf(n));
                }
            })
        );
        body.appendChild(actions);
        panelEl.appendChild(body);
        panelEl.setAttribute("aria-label", T.panelLabel + ": " + textOf(n));
    }

    function copyText(text) {
        var done = function () {
            window.mmeToast(T.copied);
        };
        var fail = function () {
            window.mmeToast(T.copyFailed);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fail);
        } else fail();
    }

    async function reveal(n) {
        if (revealSync(n)) await mm.renderData();
    }

    // Expands/collapses the hidden siblings of a long child list. The clicked
    // button is swapped for its counterpart, so focus is handed over explicitly.
    async function toggleSiblings(p, keyboard) {
        var g = groups.get(p);
        if (!g) return;
        var expanding = !g.expanded;
        setSiblingsExpanded(p, expanding);
        await mm.renderData(p);
        var target = expanding ? g.hidden[0] : g.more;
        if (keyboard) await focusNode(target);
        else {
            S.focus = target;
            decorate();
        }
        announce(textOf(expanding ? g.less : g.more));
    }

    async function selectNode(n, opts) {
        opts = opts || {};
        if (isSentinel(n)) {
            await toggleSiblings(parentOf.get(n), opts.keyboard);
            return;
        }
        await reveal(n);
        S.selected = n;
        S.focus = n;
        // The panel shows the details now; a lingering hover card would repeat them.
        clearTimeout(cardTimer);
        hideCard();
        renderPanel(n);
        panelEl.classList.add("mme-open");
        doc.body.classList.add("mme-panel-open");
        await mm.setHighlight(n);
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
        if (opts.keyboard) panelEl.focus({ preventScroll: true });
        announce(T.panelLabel + ": " + textOf(n));
    }

    function deselect(refocus) {
        var had = S.selected;
        S.selected = null;
        panelEl.classList.remove("mme-open");
        doc.body.classList.remove("mme-panel-open");
        mm.setHighlight(null);
        if (refocus && had) focusNode(had);
    }

    /* ------------------------------------------------------------------ */
    /* Lightbox                                                            */
    /* ------------------------------------------------------------------ */

    function openLightbox(img) {
        var cap = "";
        var fig = img.closest && img.closest("figure");
        if (fig && fig.querySelector("figcaption"))
            cap = fig.querySelector("figcaption").textContent;
        else cap = img.getAttribute("alt") || "";
        lightbox.textContent = "";
        lightbox.appendChild(
            h("img", { src: img.currentSrc || img.src, alt: cap })
        );
        if (cap) lightbox.appendChild(h("p", { text: cap }));
        lightbox.classList.add("mme-open");
        lightbox.setAttribute("tabindex", "-1");
        lightbox.focus();
    }
    function closeLightbox() {
        lightbox.classList.remove("mme-open");
    }
    lightbox.addEventListener("click", closeLightbox);
    doc.addEventListener("click", function (e) {
        var img = e.target;
        if (img && img.tagName === "IMG" && panelEl.contains(img))
            openLightbox(img);
    });

    /* ------------------------------------------------------------------ */
    /* Pointer interaction on the map                                      */
    /* ------------------------------------------------------------------ */

    var downPos = null;
    svgEl.addEventListener("pointerdown", function (e) {
        downPos = { x: e.clientX, y: e.clientY };
    });
    var coarse =
        window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

    function nearestCircle(x, y, radius) {
        var best = null;
        var bestD = radius;
        svgEl.querySelectorAll("g.markmap-node > circle").forEach(function (c) {
            var r = c.getBoundingClientRect();
            var dx = r.left + r.width / 2 - x;
            var dy = r.top + r.height / 2 - y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d <= bestD) {
                best = c;
                bestD = d;
            }
        });
        return best;
    }

    svgEl.addEventListener("click", function (e) {
        var t = e.target;
        if (
            downPos &&
            Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5
        )
            return;
        if (t.closest && t.closest("a")) return;
        if (t.tagName === "IMG") {
            openLightbox(t);
            return;
        }
        if (t.tagName === "circle") return; // markmap toggles on its own handler
        var c = nearestCircle(e.clientX, e.clientY, coarse ? 22 : 10);
        if (c && c.__data__) {
            mm.toggleNode(c.__data__, e.ctrlKey || e.metaKey);
            return;
        }
        var g = t.closest && t.closest("g.markmap-node");
        if (g && g.__data__ && t.closest("foreignObject")) {
            selectNode(g.__data__, {}); // sibling-group buttons toggle instead
        } else if (!g && S.selected) {
            deselect(false);
        }
    });

    /* ------------------------------------------------------------------ */
    /* Keyboard tree navigation                                            */
    /* ------------------------------------------------------------------ */

    function visibleList() {
        var out = [];
        (function rec(n) {
            out.push(n);
            if (!isFolded(n)) (n.children || []).forEach(rec);
        })(root);
        return out;
    }

    async function focusNode(n) {
        if (!n) return;
        if (!isShown(n)) await reveal(n);
        S.focus = n;
        decorate();
        var g = gMap.get(n);
        if (g) g.focus({ preventScroll: true });
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
    }

    svgEl.addEventListener("keydown", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (!n || !n.state || e.altKey || e.ctrlKey || e.metaKey) return;
        var list = visibleList();
        var i = list.indexOf(n);
        var handled = true;
        switch (e.key) {
            case "ArrowDown":
                focusNode(list[Math.min(list.length - 1, i + 1)]);
                break;
            case "ArrowUp":
                focusNode(list[Math.max(0, i - 1)]);
                break;
            case "Home":
                focusNode(list[0]);
                break;
            case "End":
                focusNode(list[list.length - 1]);
                break;
            case "ArrowRight":
                if (hasKids(n) && isFolded(n)) mm.toggleNode(n, false);
                else if (hasKids(n)) focusNode(n.children[0]);
                break;
            case "ArrowLeft":
                if (hasKids(n) && !isFolded(n)) mm.toggleNode(n, false);
                else if (parentOf.get(n)) focusNode(parentOf.get(n));
                break;
            case "Enter":
                selectNode(n, { keyboard: true });
                break;
            case " ":
                if (isSentinel(n)) toggleSiblings(parentOf.get(n), true);
                else if (hasKids(n)) mm.toggleNode(n, e.shiftKey);
                break;
            default:
                handled = false;
        }
        if (handled) e.preventDefault();
    });

    /* ------------------------------------------------------------------ */
    /* Global shortcuts                                                    */
    /* ------------------------------------------------------------------ */

    function typing(el) {
        return (
            el &&
            (el.tagName === "INPUT" ||
                el.tagName === "TEXTAREA" ||
                el.isContentEditable)
        );
    }
    doc.addEventListener("keydown", function (e) {
        if (
            (e.key === "/" && !typing(e.target) && !e.ctrlKey && !e.metaKey) ||
            ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")
        ) {
            e.preventDefault();
            searchWrap.classList.add("mme-open");
            input.focus();
            input.select();
            return;
        }
        if (e.key !== "Escape") return;
        if (lightbox.classList.contains("mme-open")) {
            closeLightbox();
        } else if (
            openMenus.some(function (m) {
                return m.menu.classList.contains("mme-open");
            })
        ) {
            closeMenus();
        } else if (S.searchActive || input.value) {
            clearSearchUi();
        } else if (S.selected) {
            deselect(true);
        } else {
            endHover();
        }
    });

    /* ------------------------------------------------------------------ */
    /* Toolbar localisation (markmap-toolbar)                              */
    /* ------------------------------------------------------------------ */

    function enhanceZoomBar() {
        var bar = doc.querySelector(".mm-toolbar");
        if (!bar) return false;
        bar.classList.add("mme-ui", "mme-zoombar");
        bar.querySelectorAll(".mm-toolbar-item").forEach(function (item) {
            var title = item.getAttribute("title") || "";
            var local = T.zoomTitles[title] || title;
            item.setAttribute("title", local);
            item.setAttribute("role", "button");
            item.setAttribute("aria-label", local);
            item.setAttribute("tabindex", "0");
            item.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    item.click();
                }
            });
        });
        return true;
    }
    var zoomTries = 0;
    (function waitZoomBar() {
        if (enhanceZoomBar() || ++zoomTries > 40) return;
        setTimeout(waitZoomBar, 100);
    })();

    /* ------------------------------------------------------------------ */
    /* Boot                                                                */
    /* ------------------------------------------------------------------ */

    // Small screens: start with the first levels only so text stays readable.
    if (window.innerWidth <= 640 && cfg.mobileLevel) {
        walk(root, function (n) {
            if (!hasKids(n)) return;
            setFold(n, n.state.depth >= cfg.mobileLevel + 1 ? 1 : 0);
        });
    }

    updateCount();
    mm.renderData();
})();
</script>
  
</body>
</html>
