        var btn = h("button", {
            type: "button",
            class: "mme-btn",
            "aria-haspopup": "menu",
            "aria-expanded": "false",
            "aria-label": label,
            title: label,
            html:
                ICONS[icon] +
                '<span class="mme-btn-label">' +
                esc(label) +
                "</span>"
        });
        var entry = {
            menu: menu,
            close: function () {
                menu.classList.remove("mme-open");
                btn.setAttribute("aria-expanded", "false");
            }
        };
        openMenus.push(entry);
        items.forEach(function (it) {
            if (it === "-")
                return menu.appendChild(h("hr", { role: "separator" }));
            var b = h("button", {
                type: "button",
                role: it.checkbox ? "menuitemcheckbox" : "menuitem",
                text: it.label,
                "aria-checked": it.checkbox ? "false" : null,
                tabindex: "-1"
            });
            b.addEventListener("click", function () {
                entry.close();
                it.run(b);
            });
            it.el = b;
            menu.appendChild(b);
        });
        function open() {
            closeMenus(menu);
            menu.classList.add("mme-open");
            btn.setAttribute("aria-expanded", "true");
        }
        btn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (menu.classList.contains("mme-open")) entry.close();
            else open();
        });
        btn.addEventListener("keydown", function (e) {
            if (e.key === "ArrowDown") {
                e.preventDefault();
                open();
                var first = menu.querySelector("button");
                if (first) first.focus();
            }
        });
        menu.addEventListener("keydown", function (e) {
            var btns = Array.prototype.slice.call(
                menu.querySelectorAll("button")
            );
            var i = btns.indexOf(doc.activeElement);
            if (e.key === "ArrowDown") {
                e.preventDefault();
                btns[(i + 1) % btns.length].focus();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                btns[(i - 1 + btns.length) % btns.length].focus();
            } else if (e.key === "Escape") {
                e.stopPropagation();
                entry.close();
                btn.focus();
            }
        });
        wrap.appendChild(btn);
        wrap.appendChild(menu);
        return { el: wrap, items: items };
    }
    doc.addEventListener("click", function () {
        closeMenus();
    });

    /* ------------------------------------------------------------------ */
    /* Search                                                              */
    /* ------------------------------------------------------------------ */

    var input = h("input", {
        type: "search",
        id: "mme-search-input",
        name: "mme-search",
        placeholder: T.placeholder,
        "aria-label": T.search,
        autocomplete: "off",
        spellcheck: "false"
    });
    var countEl = h("span", {
        class: "mme-search-count",
        "aria-hidden": "true"
    });
    var prevBtn = iconButton("up", T.prev, "mme-step", function () {
        stepMatch(-1);
    });
    var nextBtn = iconButton("down", T.next, "mme-step", function () {
        stepMatch(1);
    });
    var clearBtn = iconButton("close", T.clear, "", function () {
        clearSearchUi();
        input.focus();
    });
    var searchField = h("div", { class: "mme-search-field" }, [
        h("span", {
            class: "mme-search-ico",
            html: ICONS.search,
            "aria-hidden": "true"
        }),
        input,
        countEl,
        prevBtn,
        nextBtn,
        clearBtn
    ]);
    var searchToggle = iconButton(
        "search",
        T.search,
        "mme-search-toggle",
        function () {
            searchWrap.classList.add("mme-open");
            input.focus();
        }
    );
    var searchWrap = h("div", { class: "mme-search", role: "search" }, [
        searchToggle,
        searchField
    ]);
    // inline icon inside the field should not look like a button
    searchField.firstChild.style.cssText =
        "display:inline-flex;width:16px;height:16px;color:#57606a";
    searchField.firstChild.firstChild.style.cssText =
        "width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round";

    function matchesNode(n, q) {
        if (isSentinel(n)) return false;
        if (S.todoOnly && !(n.payload && n.payload.task === "todo"))
            return false;
        if (!q) return true;
        return (
            norm(textOf(n)).indexOf(q) !== -1 ||
            norm(detailText(n)).indexOf(q) !== -1
        );
    }

    function snapshotFold() {
        var m = new Map();
        walk(root, function (n) {
            if (hasKids(n)) m.set(n, (n.payload && n.payload.fold) || 0);
        });
        return m;
    }
    function snapshotSiblings() {
        var m = new Map();
        groups.forEach(function (g, p) {
            m.set(p, g.expanded);
        });
        return m;
    }
    function restoreFold() {
        if (!S.savedFold) return false;
        S.savedFold.forEach(function (v, n) {
            setFold(n, v);
        });
        if (S.savedSib) {
            S.savedSib.forEach(function (expanded, p) {
                setSiblingsExpanded(p, expanded);
            });
        }
        S.savedFold = null;
        S.savedSib = null;
        return true;
    }

    var searchTimer = 0;
    function scheduleSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, 140);
    }

    function updateCount() {
        var q = S.query.trim();
        if (!S.searchActive) {
            countEl.textContent = "";
        } else if (S.matches.length) {
            countEl.textContent = S.active + 1 + "/" + S.matches.length;
        } else {
            countEl.textContent = T.noResult;
        }
        searchField.classList.toggle("mme-has-results", S.searchActive);
        prevBtn.disabled = nextBtn.disabled = S.matches.length < 2;
        clearBtn.style.visibility = q || S.todoOnly ? "visible" : "hidden";
    }

    async function runSearch() {
        var token = ++S.searchToken;
        var q = norm(S.query.trim());
        S.searchActive = !!q || S.todoOnly;
        if (!S.searchActive) {
            await clearSearchState();
            return;
        }
        if (!S.savedFold) {
            S.savedFold = snapshotFold();
            S.savedSib = snapshotSiblings();
        }
        var matches = [];
        walk(root, function (n) {
            if (matchesNode(n, q)) matches.push(n);
        });
        var anc = new Set();
        matches.forEach(function (n) {
            ancestors(n).forEach(function (a) {
                anc.add(a);
            });
        });
        S.matches = matches;
        S.matchSet = new Set(matches);
        S.ancSet = anc;
        var changed = false;
        matches.forEach(function (n) {
            if (revealSync(n)) changed = true;
        });
        S.active = matches.length ? 0 : -1;
        if (changed) await mm.renderData();
        if (token !== S.searchToken) return;
        paintClasses();
        updateCount();
        announce(
            matches.length ? T.resultsAnnounce(matches.length) : T.noResult
        );
        if (matches.length) gotoActive();
    }

    function panelPad() {
        if (!panelEl.classList.contains("mme-open")) return {};
        var r = panelEl.getBoundingClientRect();
        return window.innerWidth <= 640
            ? { bottom: r.height + 16 }
            : { right: r.width + 16 };
    }

    function gotoActive() {
        var n = S.matches[S.active];
        if (!n) return;
        S.focus = n;
        decorate();
        updateCount();
        mm.centerNode(n, panelPad());
    }
    function stepMatch(dir) {
        if (!S.matches.length) return;
        S.active = (S.active + dir + S.matches.length) % S.matches.length;
        gotoActive();
    }

    async function clearSearchState() {
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = false;
        var restored = restoreFold();
        updateCount();
        if (restored) await mm.renderData();
        else paintClasses();
    }
    function clearSearchUi() {
        input.value = "";
        S.query = "";
        S.todoOnly = false;
        todoItem.el.setAttribute("aria-checked", "false");
        S.searchToken++;
        clearSearchState();
        searchWrap.classList.remove("mme-open");
    }

    input.addEventListener("input", function () {
        S.query = input.value;
        scheduleSearch();
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            clearTimeout(searchTimer);
            if (
                S.searchToken &&
                S.matches.length &&
                norm(input.value.trim()) === norm(S.query.trim()) &&
                S.searchActive
            ) {
                stepMatch(e.shiftKey ? -1 : 1);
            } else {
                S.query = input.value;
                runSearch();
            }
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            stepMatch(1);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            stepMatch(-1);
        } else if (e.key === "Escape") {
            e.stopPropagation();
            clearSearchUi();
            input.blur();
            focusNode(nearestShown(S.focus));
        }
    });
    input.addEventListener("blur", function () {
        if (!input.value && window.innerWidth <= 640 && !S.todoOnly) {
            searchWrap.classList.remove("mme-open");
        }
    });

    /* ------------------------------------------------------------------ */
    /* Level menu                                                          */
    /* ------------------------------------------------------------------ */

    async function structuralChange() {
        S.savedFold = null;
        S.savedSib = null;
        S.searchToken++;
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = !!(S.query.trim() || S.todoOnly);
        await mm.renderData();
        await mm.fit();
        if (S.searchActive) runSearch();
        else updateCount();
    }
    function setLevel(level) {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, n.state.depth >= level + 1 ? 1 : 0);
        });
        structuralChange();
    }
    function expandAll() {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, 0);
        });
        groups.forEach(function (g, p) {
            setSiblingsExpanded(p, true);
        });
        structuralChange();
    }

    var todoItem = {
        label: T.todoOnly,
        checkbox: true,
        run: function (b) {
            S.todoOnly = !S.todoOnly;
            b.setAttribute("aria-checked", S.todoOnly ? "true" : "false");
            runSearch();
        }
    };
    var levelItems = [1, 2, 3, 4].map(function (n) {
        return {
            label: T.levelItem(n),
            run: function () {
                setLevel(n);
            }
        };
    });
    levelItems.push({ label: T.expandAll, run: expandAll });
    if (cfg.hasTasks) {
        levelItems.push("-");
        levelItems.push(todoItem);
    }
    var levelDd = dropdown("layers", T.level, levelItems);

    var exportDd = dropdown("download", T.exportLabel, [
        {
            label: T.exportPng,
            run: function () {
                exportAs("png");
            }
        },
        {
            label: T.exportJpg,
            run: function () {
                exportAs("jpg");
            }
        },
        {
            label: T.exportSvg,
            run: function () {
                exportAs("svg");
            }
        },
        "-",
        {
            label: T.copyMd,
            run: function () {
                exportAs("copy");
            }
        }
    ]);
    function exportAs(kind) {
        var api = window.mmExport;
        if (api && api[kind]) api[kind]();
    }

    barEl.appendChild(searchWrap);
    barEl.appendChild(levelDd.el);
    barEl.appendChild(exportDd.el);
    // Menu is built before todoItem exists only if tasks are absent.
    if (!cfg.hasTasks) todoItem.el = h("span");

    /* Export hooks: strip transient visual state while an image is rendered. */
    window.mmeBeforeExport = function () {
        svgEl.classList.add("mme-exporting");
        cardEl.classList.remove("mme-show");
    };
    window.mmeAfterExport = function () {
        svgEl.classList.remove("mme-exporting");
    };

    /* ------------------------------------------------------------------ */
    /* Hover                                                               */
    /* ------------------------------------------------------------------ */

    function pathOf(n) {
        var s = new Set([n]);
        ancestors(n).forEach(function (a) {
            s.add(a);
        });
        if (!isFolded(n)) {
            (n.children || []).forEach(function (c) {
                s.add(c);
            });
        }
        return s;
    }

    function cardHtml(n) {
        var p = n.payload || {};
        var parts = [];
        function list(items, extra) {
            var li = items
                .slice(0, 5)
                .map(function (c) {
                    return "<li>" + esc(textOf(c)) + "</li>";
                })
                .join("");
            var more =
                items.length > 5
                    ? "<li>…" + esc(T.moreItems(items.length - 5)) + "</li>"
                    : "";
            return "<ul>" + li + more + "</ul>" + (extra || "");
        }
        if (p.less) return "";
        if (p.more) {
            var g = groups.get(parentOf.get(n));
            return (
                '<div class="mme-card-title">' +
                esc(textOf(n)) +
                "</div>" +
                list(g ? g.hidden : [])
            );
        }
        var needTitle = !!p.detail || isFolded(n);
        if (needTitle)
            parts.push(
                '<div class="mme-card-title">' + esc(textOf(n)) + "</div>"
            );
        if (p.detail)
            parts.push('<div class="mme-card-detail">' + p.detail + "</div>");
        if (isFolded(n)) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.childCount(realKids(n).length) + " · " + T.folded) +
                    "</div>" +
                    list(realKids(n))
            );
        }
        if (p.tasks) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.done + " " + p.tasks.done + "/" + p.tasks.total) +
                    "</div>"
            );
        }
        if (!parts.length) return "";
        if (p.detail)
            parts.push('<span class="mme-hint">' + esc(T.hint) + "</span>");
        return parts.join("");
    }

    function positionCard(n) {
        var g = gMap.get(n);
        if (!g) return;
        var fo = g.querySelector("foreignObject") || g;
        var r = fo.getBoundingClientRect();
        cardEl.style.left = "0px";
        cardEl.style.top = "0px";
        var cw = cardEl.offsetWidth;
        var ch = cardEl.offsetHeight;
        var left = Math.min(Math.max(8, r.left), window.innerWidth - cw - 8);
        var top = r.bottom + 8;
        if (top + ch > window.innerHeight - 8)
            top = Math.max(8, r.top - ch - 8);
        cardEl.style.left = left + "px";
        cardEl.style.top = top + "px";
    }
    function showCard(n) {
        var html = cardHtml(n);
        if (!html) {
            hideCard();
            return;
        }
        cardEl.innerHTML = html;
        var preview = cardEl.querySelector(".mme-card-detail");
        if (preview && preview.scrollHeight > preview.clientHeight + 1) {
            preview.classList.add("mme-clipped");
        }
        positionCard(n);
        cardEl.classList.add("mme-show");
    }
    function hideCard() {
        cardEl.classList.remove("mme-show");
    }
    var cardTimer = 0;
    function startHover(n, immediate) {
        S.hover = n;
        S.pathSet = pathOf(n);
        paintClasses();
        clearTimeout(cardTimer);
        cardTimer = setTimeout(
            function () {
                // The panel already shows the selected node's details.
                if (S.hover === n && S.selected !== n) showCard(n);
            },
            immediate ? 60 : 220
        );
    }
    function endHover() {
        S.hover = null;
        S.pathSet = null;
        clearTimeout(cardTimer);
        hideCard();
        paintClasses();
    }
    var noHover =
        window.matchMedia && window.matchMedia("(hover: none)").matches;
    svgEl.addEventListener("mouseover", function (e) {
        if (noHover || e.buttons) return;
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n === S.hover) return;
        if (!n || !n.state) endHover();
        else startHover(n, false);
    });
    svgEl.addEventListener("mouseleave", endHover);
    svgEl.addEventListener("mousedown", hideCard);
    svgEl.addEventListener("focusin", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n && n.state) {
            S.focus = n;
            startHover(n, true);
        }
    });
    svgEl.addEventListener("focusout", endHover);
    mm.zoom.on("start.mme", hideCard);

    /* ------------------------------------------------------------------ */
    /* Selection panel                                                     */
    /* ------------------------------------------------------------------ */

    function collectLinks(n) {
        var out = [];
        var seen = {};
        [n.content, n.payload && n.payload.detail].forEach(function (html) {
            if (!html) return;
            parseHtml(html)
                .querySelectorAll("a[href]")
                .forEach(function (a) {
                    var href = a.getAttribute("href");
                    if (!href || seen[href]) return;
                    seen[href] = 1;
                    out.push({
                        href: href,
                        text: (a.textContent || href).trim()
                    });
                });
        });
        return out;
    }

    function labelButton(n, extraHtml) {
        var b = h("button", { type: "button" });
        b.appendChild(h("span", { text: textOf(n) }));
        if (extraHtml) b.appendChild(h("small", { text: extraHtml }));
        b.addEventListener("click", function () {
            selectNode(n, { center: true });
        });
        return b;
    }

    function renderPanel(n) {
        var p = n.payload || {};
        panelEl.textContent = "";
        var chain = ancestors(n).reverse();
        var crumbs = h("ol", { class: "mme-crumbs", "aria-label": "path" });
        chain.forEach(function (a) {
            var li = h("li");
            li.appendChild(labelButton(a));
            crumbs.appendChild(li);
        });
        var closeBtn = iconButton("close", T.close, "", function () {
            deselect(true);
        });
        panelEl.appendChild(
            h("div", { class: "mme-panel-head" }, [crumbs, closeBtn])
        );

        var body = h("div", { class: "mme-panel-body" });
        body.appendChild(
            h("div", { class: "mme-panel-title", html: titleHtml(n) })
        );

        if (p.tasks) {
            var pct = Math.round((p.tasks.done / p.tasks.total) * 100);
            body.appendChild(h("h3", { text: T.progress }));
            body.appendChild(
                h("div", { class: "mme-progress-line" }, [
                    h("i", { style: "--p:" + pct + "%" }),
                    h("span", { text: p.tasks.done + "/" + p.tasks.total })
                ])
            );
        }
        if (p.detail) {
            body.appendChild(h("h3", { text: T.detail }));
            body.appendChild(h("div", { class: "mme-detail", html: p.detail }));
        }
        if (hasKids(n)) {
            var kids = realKids(n);
            body.appendChild(
                h("h3", { text: T.children + " (" + kids.length + ")" })
            );
            var ul = h("ul", { class: "mme-list" });
            kids.forEach(function (c) {
                var li = h("li");
                var extra =
                    hasKids(c) && c.payload && c.payload.count
                        ? "+" + c.payload.count
                        : "";
                li.appendChild(labelButton(c, extra));
                ul.appendChild(li);
            });
            body.appendChild(ul);
        }
        var links = collectLinks(n);
        if (links.length) {
            body.appendChild(h("h3", { text: T.links }));
            var lul = h("ul", { class: "mme-list" });
            links.forEach(function (l) {
                lul.appendChild(
                    h("li", null, [
                        h("a", {
                            href: l.href,
                            target: "_blank",
                            rel: "noopener noreferrer",
                            text: l.text
                        })
                    ])
                );
            });
            body.appendChild(lul);
        }

        var actions = h("div", { class: "mme-actions" });
        if (hasKids(n)) {
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: isFolded(n) ? T.expand : T.collapse,
                    onclick: function () {
                        mm.toggleNode(n, false).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: T.expandBelow,
                    onclick: function () {
                        walk(n, function (x) {
                            if (hasKids(x)) setFold(x, 0);
                        });
                        mm.renderData(n).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
        }
        actions.appendChild(
            h("button", {
                type: "button",
                class: "mme-btn",
                text: T.copyText,
                onclick: function () {
                    copyText(textOf(n));
                }
            })
        );
        body.appendChild(actions);
        panelEl.appendChild(body);
        panelEl.setAttribute("aria-label", T.panelLabel + ": " + textOf(n));
    }

    function copyText(text) {
        var done = function () {
            window.mmeToast(T.copied);
        };
        var fail = function () {
            window.mmeToast(T.copyFailed);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fail);
        } else fail();
    }

    async function reveal(n) {
        if (revealSync(n)) await mm.renderData();
    }

    // Expands/collapses the hidden siblings of a long child list. The clicked
    // button is swapped for its counterpart, so focus is handed over explicitly.
    async function toggleSiblings(p, keyboard) {
        var g = groups.get(p);
        if (!g) return;
        var expanding = !g.expanded;
        setSiblingsExpanded(p, expanding);
        await mm.renderData(p);
        var target = expanding ? g.hidden[0] : g.more;
        if (keyboard) await focusNode(target);
        else {
            S.focus = target;
            decorate();
        }
        announce(textOf(expanding ? g.less : g.more));
    }

    async function selectNode(n, opts) {
        opts = opts || {};
        if (isSentinel(n)) {
            await toggleSiblings(parentOf.get(n), opts.keyboard);
            return;
        }
        await reveal(n);
        S.selected = n;
        S.focus = n;
        // The panel shows the details now; a lingering hover card would repeat them.
        clearTimeout(cardTimer);
        hideCard();
        renderPanel(n);
        panelEl.classList.add("mme-open");
        doc.body.classList.add("mme-panel-open");
        await mm.setHighlight(n);
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
        if (opts.keyboard) panelEl.focus({ preventScroll: true });
        announce(T.panelLabel + ": " + textOf(n));
    }

    function deselect(refocus) {
        var had = S.selected;
        S.selected = null;
        panelEl.classList.remove("mme-open");
        doc.body.classList.remove("mme-panel-open");
        mm.setHighlight(null);
        if (refocus && had) focusNode(had);
    }

    /* ------------------------------------------------------------------ */
    /* Lightbox                                                            */
    /* ------------------------------------------------------------------ */

    function openLightbox(img) {
        var cap = "";
        var fig = img.closest && img.closest("figure");
        if (fig && fig.querySelector("figcaption"))
            cap = fig.querySelector("figcaption").textContent;
        else cap = img.getAttribute("alt") || "";
        lightbox.textContent = "";
        lightbox.appendChild(
            h("img", { src: img.currentSrc || img.src, alt: cap })
        );
        if (cap) lightbox.appendChild(h("p", { text: cap }));
        lightbox.classList.add("mme-open");
        lightbox.setAttribute("tabindex", "-1");
        lightbox.focus();
    }
    function closeLightbox() {
        lightbox.classList.remove("mme-open");
    }
    lightbox.addEventListener("click", closeLightbox);
    doc.addEventListener("click", function (e) {
        var img = e.target;
        if (img && img.tagName === "IMG" && panelEl.contains(img))
            openLightbox(img);
    });

    /* ------------------------------------------------------------------ */
    /* Pointer interaction on the map                                      */
    /* ------------------------------------------------------------------ */

    var downPos = null;
    svgEl.addEventListener("pointerdown", function (e) {
        downPos = { x: e.clientX, y: e.clientY };
    });
    var coarse =
        window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

    function nearestCircle(x, y, radius) {
        var best = null;
        var bestD = radius;
        svgEl.querySelectorAll("g.markmap-node > circle").forEach(function (c) {
            var r = c.getBoundingClientRect();
            var dx = r.left + r.width / 2 - x;
            var dy = r.top + r.height / 2 - y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d <= bestD) {
                best = c;
                bestD = d;
            }
        });
        return best;
    }

    svgEl.addEventListener("click", function (e) {
        var t = e.target;
        if (
            downPos &&
            Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5
        )
            return;
        if (t.closest && t.closest("a")) return;
        if (t.tagName === "IMG") {
            openLightbox(t);
            return;
        }
        if (t.tagName === "circle") return; // markmap toggles on its own handler
        var c = nearestCircle(e.clientX, e.clientY, coarse ? 22 : 10);
        if (c && c.__data__) {
            mm.toggleNode(c.__data__, e.ctrlKey || e.metaKey);
            return;
        }
        var g = t.closest && t.closest("g.markmap-node");
        if (g && g.__data__ && t.closest("foreignObject")) {
            selectNode(g.__data__, {}); // sibling-group buttons toggle instead
        } else if (!g && S.selected) {
            deselect(false);
        }
    });

    /* ------------------------------------------------------------------ */
    /* Keyboard tree navigation                                            */
    /* ------------------------------------------------------------------ */

    function visibleList() {
        var out = [];
        (function rec(n) {
            out.push(n);
            if (!isFolded(n)) (n.children || []).forEach(rec);
        })(root);
        return out;
    }

    async function focusNode(n) {
        if (!n) return;
        if (!isShown(n)) await reveal(n);
        S.focus = n;
        decorate();
        var g = gMap.get(n);
        if (g) g.focus({ preventScroll: true });
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
    }

    svgEl.addEventListener("keydown", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (!n || !n.state || e.altKey || e.ctrlKey || e.metaKey) return;
        var list = visibleList();
        var i = list.indexOf(n);
        var handled = true;
        switch (e.key) {
            case "ArrowDown":
                focusNode(list[Math.min(list.length - 1, i + 1)]);
                break;
            case "ArrowUp":
                focusNode(list[Math.max(0, i - 1)]);
                break;
            case "Home":
                focusNode(list[0]);
                break;
            case "End":
                focusNode(list[list.length - 1]);
                break;
            case "ArrowRight":
                if (hasKids(n) && isFolded(n)) mm.toggleNode(n, false);
                else if (hasKids(n)) focusNode(n.children[0]);
                break;
            case "ArrowLeft":
                if (hasKids(n) && !isFolded(n)) mm.toggleNode(n, false);
                else if (parentOf.get(n)) focusNode(parentOf.get(n));
                break;
            case "Enter":
                selectNode(n, { keyboard: true });
                break;
            case " ":
                if (isSentinel(n)) toggleSiblings(parentOf.get(n), true);
                else if (hasKids(n)) mm.toggleNode(n, e.shiftKey);
                break;
            default:
                handled = false;
        }
        if (handled) e.preventDefault();
    });

    /* ------------------------------------------------------------------ */
    /* Global shortcuts                                                    */
    /* ------------------------------------------------------------------ */

    function typing(el) {
        return (
            el &&
            (el.tagName === "INPUT" ||
                el.tagName === "TEXTAREA" ||
                el.isContentEditable)
        );
    }
    doc.addEventListener("keydown", function (e) {
        if (
            (e.key === "/" && !typing(e.target) && !e.ctrlKey && !e.metaKey) ||
            ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")
        ) {
            e.preventDefault();
            searchWrap.classList.add("mme-open");
            input.focus();
            input.select();
            return;
        }
        if (e.key !== "Escape") return;
        if (lightbox.classList.contains("mme-open")) {
            closeLightbox();
        } else if (
            openMenus.some(function (m) {
                return m.menu.classList.contains("mme-open");
            })
        ) {
            closeMenus();
        } else if (S.searchActive || input.value) {
            clearSearchUi();
        } else if (S.selected) {
            deselect(true);
        } else {
            endHover();
        }
    });

    /* ------------------------------------------------------------------ */
    /* Toolbar localisation (markmap-toolbar)                              */
    /* ------------------------------------------------------------------ */

    function enhanceZoomBar() {
        var bar = doc.querySelector(".mm-toolbar");
        if (!bar) return false;
        bar.classList.add("mme-ui", "mme-zoombar");
        bar.querySelectorAll(".mm-toolbar-item").forEach(function (item) {
            var title = item.getAttribute("title") || "";
            var local = T.zoomTitles[title] || title;
            item.setAttribute("title", local);
            item.setAttribute("role", "button");
            item.setAttribute("aria-label", local);
            item.setAttribute("tabindex", "0");
            item.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    item.click();
                }
            });
        });
        return true;
    }
    var zoomTries = 0;
    (function waitZoomBar() {
        if (enhanceZoomBar() || ++zoomTries > 40) return;
        setTimeout(waitZoomBar, 100);
    })();

    /* ------------------------------------------------------------------ */
    /* Boot                                                                */
    /* ------------------------------------------------------------------ */

    // Small screens: start with the first levels only so text stays readable.
    if (window.innerWidth <= 640 && cfg.mobileLevel) {
        walk(root, function (n) {
            if (!hasKids(n)) return;
            setFold(n, n.state.depth >= cfg.mobileLevel + 1 ? 1 : 0);
        });
    }

    updateCount();
    mm.renderData();
})();
</script>
  
</body>
</html>
