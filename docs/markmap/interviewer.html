# 서비스가 끝난 모바일 게임 서버 복원 연구

## 먼저 알아 둘 용어
- 정답지
  &gt; - 원본이 실제로 보낸 응답이다.
  &gt; - 2021년 캡처가 가장 앞서고, 캡처가 없으면 클라이언트 소스와 데이터 표가 근거가 된다.
  &gt; - 둘로 확인되지 않은 값은 코드 주석에 추론으로 표시한다.
- 시험 수단
  &gt; - 능력치 배율, 시계 조정, 호감도 설정처럼 검증을 쉽게 하려고 바꾼 값이다.
  &gt; - 이 값으로 얻은 결과는 원본 규칙으로 취급하지 않고 일지에 따로 적는다.
- 스텁
  &gt; - 실제 내용 없이 형식만 맞춘 최소 응답이다.
  &gt; - 서버 목록 응답이 스텁이었던 것이 로그인 막힘의 원인이었다.
- 기준선
  - 측정으로 잡은 출발 상태
    - 10월 12일 측정
      &gt; - 문서가 완료라고 적은 상태를 실제 환경에서 다시 잰 결과다.
      &gt; - 10월 12일에 잰 기준선은 응답과 호스트 설정이 2021 캡처 원본과 어긋나 있었다.

## 결과와 한계 한눈에
- 대상과 범위
  &gt; - 대상은 서비스가 끝난 모바일 게임 「영원한 7일의 도시」(NeoX 엔진)다.
  &gt; - 서버 소스와 서버 쪽 데이터는 없고, 남은 것은 클라이언트 앱, 2021년 HTTP 캡처, 당시 기기 백업이다.
  &gt;
  &gt; - 결과물은 부팅부터 도시 진입과 그 뒤 콘텐츠까지 진행시키는 복원 서버다.
  &gt; - 소스 코드와 게임 데이터는 저장소에 포함하지 않았다.
- 확인한 것
  - 로그인과 도시 진입
    &gt; - 업데이트 확인, 로그인, 게이트 접속, 도시 진입을 에뮬레이터, 휴대폰, 태블릿에서 확인했다.
    &gt; - 성공 여부는 서버 로그와 클라이언트 로그의 상태 전이로 판정했다.
  - 반복 구간과 육성
    - 3회차와 엔딩
      &gt; - 프롤로그, 7일 반복, 3회차 진입은 에뮬레이터에서 확인했다.
      &gt; - 본 엔딩 두 개는 모두 실패 쪽 결말이다.
      &gt; - 영웅 육성과 던전류는 능력치 배율을 올려 전투까지 확인했다.
      &gt; - 배율로 얻은 결과는 원본 규칙으로 보지 않는다.
- 확인하지 못한 것
  - 정식 결말과 이벤트
    &gt; - 정식 결말은 화면으로 본 적이 없다.
    &gt; - 서버 규칙이 없던 이벤트 활동 40개를 약 33묶음으로 셌고, 그중 약 28묶음은 아직 화면으로 보지 못했다.
    &gt; - 묶음은 이벤트 검증 메모가 쓰는 단위다.
  - 서버 호출 범위
    &gt; - 서버 호출 1,334개 가운데 647개(약 48.5%)에 핸들러나 의도적 무응답이 있다.
    &gt; - 호출을 처리한다는 뜻이지 기능이 절반 동작한다는 뜻은 아니다.
- 규모
  &gt; - 작업일 13일, 커밋 230개다.
  &gt; - 230은 작업 브랜치 기준이고 공개된 main 기준으로는 101개다.

## 출발점: 남은 자료와 없는 자료
- 남아 있던 것
  - 클라이언트 앱과 리소스
    - 호출 형식의 원천
      &gt; - 서버가 어떤 호출을 어떤 모양으로 기대하는지 읽어 낼 가장 큰 원천이다.
      &gt; - 데이터 표와 계산 코드도 들어 있다.
  - 2021년 HTTP 캡처와 기기 백업
    &gt; - 캡처는 Burp 캡처 4세트, 512건이고 로그인 구간 응답의 정답지로 쓴다.
    &gt; - 기기 백업은 보존된 게임 파일 묶음이며 서버 소스는 들어 있지 않다.
- 없는 것
  - 서버 소스
    &gt; - 어떤 백업에도 없다.
    &gt; - 그래서 서버 쪽 규칙은 모두 클라이언트에서 거꾸로 알아내야 했고, 이 사정이 아래의 검증 방식을 정했다.
  - 게임 플레이 구간 캡처
    &gt; - 캡처는 HTTP 로그인 구간뿐이다.
    &gt; - 게이트와 게임 구간의 서버 응답에는 정답지가 없어서, 그 구간은 소스와 로그로만 맞춘다.
- 원본 서버 구조 (추정)
  &gt; - 클라이언트가 로드 밸런서를 거쳐 게이트 서버에 접속하고, 게이트가 게임 서버로 넘기며, 게임 서버가 DB를 쓴다.
  &gt; - 문자열과 패킷에서 끌어낸 추정이고 직접 관찰한 것은 아니다.

## 응답 문제: 정답지 순서와 확인 수단
- 원칙과 정답지 순서
  - 정답지 세 단계
    - 캡처, 소스, 추론의 순서
      &gt; - 2021 패킷 캡처가 가장 앞선다.
      &gt; - 다음은 복원한 클라이언트 소스와 데이터 표다.
      &gt; - 둘로 확인되지 않은 값은 코드 주석에 추론이나 복원 서버의 결정으로 구분한다.
      &gt; - HTTP 구간은 캡처와 소스를 함께 쓰고, 게이트 구간은 정답지가 없어 소스만 근거로 한다.
  - 캡처가 있는 응답
    &gt; - 바이트와 Content-Type까지 같게 돌려준다.
    &gt; - 5월 실기기에서 업데이트 확인 응답의 호스트를 IP로 바꿨더니 클라이언트가 업데이트 확인에서 멈춘 일이 이 원칙의 출발점이다.
    &gt; - 길이와 SHA-256을 테스트로 고정했다.
    &gt; - 변환기로 옮긴 게스트 로그인 세트 106건 중 본문이 있는 96건의 해시가 원본과 같았다(REA가 계산한 해시, 증거 번호와 함께 기록).
    &gt;
    &gt; - 다만 10월 12일 기준으로 캡처와 다른 응답 7종이 후속 과제로 남았고, 10월 25일 재실행에서 그중 한 건이 실패했다.
  - 캡처가 없는 게이트 구간
    &gt; - 서버 로그의 네 증상이 서버가 답해야 할 것을 알려 줬다.
    &gt; - 상태 전이 경고, 약 16초 뒤 재접속, 약 30초 뒤 로그아웃, 약 15초 뒤 접속 끊김이다.
    &gt; - 증상과 원인은 막혔던 일 항목에 있다.
- 확인 수단과 한계
  - 캡처 재생 대조
    - 판정 분포와 한계
      &gt; - 2021 캡처의 요청을 서버에 재생해 같음, 일부 일치, 다름, 상태 차이로 판정한다.
      &gt; - 세트마다 엔드포인트 17~21묶음을 재생해 같음 12~16, 일부 일치 1, 다름 3~4, 상태 차이 1이었다.
      &gt; - 다름은 요청마다 달라지는 토큰과 접수 번호, 캡처 안에서 순서가 흔들리는 응답이다.
      &gt; - 서버가 캡처 응답을 그대로 돌려주도록 만들었으므로 이 일치는 독립 검증이 아니다.
  - 능력치 대조
    &gt; - 복원한 클라이언트의 계산 코드를 옛 파이썬 2.7 환경에서 따로 실행한 값과 서버 계산을 비교했다.
    &gt; - 무작위 계정 상태 40개(영웅 160명)와 장비 492개에서 오차 1e-9 이내로 맞았다.
    &gt; - 서버 계산이 이 코드를 옮긴 것이라 독립 검증은 아니고, 옮기는 과정의 실수를 잡는 용도다.
  - 기기 확인 방식
    &gt; - PC에서 기기를 조작하는 도구로 화면을 다루고, 서버 로그와 클라이언트 엔진 로그의 상태 전이로 성공을 판정한다.
    &gt; - 화면 증거 번호는 남기고 스크린샷 파일은 저장소에 올리지 않았다.
- 테스트 규모와 재실행
  - 2026-10-25 재실행
    &gt; - Windows 체크아웃(줄바꿈 CRLF)에서 4,003개 통과, 5개 실패, 2개 오류, 3개 건너뜀, 90.28초였다.
    &gt; - 실패 5개는 기기 구성 소켓 테스트 3개와 CRLF로 저장된 정적 응답의 바이트 대조 2개다.
    &gt; - 오류 2개는 Windows 환경변수 길이 한도(32,767자)를 넘는 매개변수 때문이다.
    &gt; - 운영 환경인 Ubuntu에서는 다시 돌리지 않았다.
    &gt; - 테스트 함수는 정적 집계로 195개이고, 통과 수가 함수 수보다 큰 것은 매개변수화한 테스트가 사례마다 한 건으로 세어지기 때문으로 보인다.

## 연결 문제: 클라이언트를 복원 서버에 붙이기
- 게임 도메인 연결과 중계
  &gt; - 게임 도메인을 복원 서버로 돌린다.
  &gt; - HTTPS 접속이 서버명을 담으면 HTTP 서비스로, 담지 않으면 게이트 서버로 보낸다.
  &gt; - 서버명 없는 TCP가 HTTPS 서버로 가던 설정은 5월에 고쳤다.
- HTTP 서비스
  - 요청 처리
    - 부팅 흐름 재현
      &gt; - 설정, 업데이트 확인, 로그인, 결제, 텔레메트리에 답한다.
      &gt; - 앱이 보내는 부팅 요청 22단계를 순서대로 재현하며, 테스트에서는 패치 파일 다운로드 한 단계와 게이트 한 단계를 건너뛴다.
  - 로그인 서명
    &gt; - 서명을 계산해 비교하지만 결과와 무관하게 요청을 통과시킨다.
    &gt; - 검증 결과는 로그에만 남는다.
    &gt; - 서명 결과를 무시하는 호출이 네 곳이어서 서명은 실효성 한계로 남긴다.
- 게이트 서버
  - 프레이밍, 접속 안정화, 기기 주소
    &gt; - 길이 접두 프레임 안에 protobuf 메시지가 들어 있고, 핸드셰이크 뒤에 스트리밍 압축이 걸린다.
    &gt; - 예외는 접속 단위로 가두고, 중복 로그인을 정리하며, 토큰 대조는 엄격, 기록만, 끔의 세 모드를 둔다.
    &gt; - 종료 때 접속을 먼저 닫아 종료 지연을 줄였고, 전후 시간은 커밋 메시지에 적힌 값이다.
    &gt; - 중계 뒤에서는 모든 접속이 같은 주소로 보이므로, 중계가 붙이는 프록시 헤더를 해석해 실제 기기 주소를 본다.
- 앱 안 서버: PC 없이 기기에서 실행
  - 만든 이유와 구성
    &gt; - 기기에는 nginx가 없고 일부 의존성은 빌드할 수 없어 PC 구성과 달라졌다.
    &gt; - 기기용 CPython 배포본을 JNI로 게임과 다른 프로세스에서 실행하고, 웹 프레임워크는 FastAPI를 대체하는 패키지를 쓴다.
    &gt; - 진짜 FastAPI를 올리지 못한 이유는 기기에 데이터 검증 라이브러리의 네이티브 휠이 없었기 때문이다.
  - 두 구성 검증
    &gt; - PC에서 진짜 FastAPI와 기기 구성 두 가지로 전체 테스트를 돌려 응답 119건을 비교했다.
    &gt; - 같음 113, 알려진 차이 6, 문제 0이었다.
    &gt; - 알려진 차이 6은 자동 문서 화면 주소 계열이며 게임 기능과 무관하다.

## 규칙 문제: 클라이언트 스크립트에서 서버 규칙 세우기
- 스크립트 복원
  - 복원 수치와 검증
    &gt; - 게임 스크립트 13,462개(전투 스크립트 포함)를 소스로 복원했고 부분 실패는 5개다.
    &gt; - 복원이 틀리면 그 위의 서버 규칙이 모두 어긋나므로 복원 결과를 따로 검증하는 도구를 붙였다.
    &gt; - 같은 스크립트에서 서버 호출 1,334개를 이름과 인자 키로 뽑았고, 이름이나 인자를 변수로 넘기는 호출은 놓친다.
    &gt; - 데이터 표는 실행하지 않고 구문 트리로만 읽어 서버용 JSON 63개로 냈고, 추정으로 채운 구간은 따로 표시한다.
- 아바타 계층과 핸들러
  - 핸들러와 무응답
    &gt; - 핸들러 584개(최상위 303, 하위 281)가 있고, 의도적 무응답으로 선언한 호출은 63개다.
    &gt; - 핸들러가 없는 호출은 로그만 남기고 빈 결과로 풀어 클라이언트가 잠기지 않게 한다.
    &gt; - 결과를 읽는 콜백은 빈 결과로 풀면 클라이언트가 깨지므로 풀지 않고 경고만 남긴다.
- 게임 규칙
  - 모듈 구성과 전투
    &gt; - 기능 모듈은 약 85개, 이벤트 규칙 모듈은 38종이다.
    &gt; - 규칙은 표, 계정 상태, 거절 판정, 클라이언트용 변환, 스냅샷 조각의 순서로 같은 모양을 따른다.
    &gt; - 전투는 클라이언트가 계산하고 서버는 요청과 보상만 주고받는다.
    &gt; - 던전류는 정산과 보상 지급까지 구현했고, 행동과 구역 전투 보상, 회차 끝 보상, 사건 보상은 비어 있다.
  - 서버 시계
    - 되풀이 구간
      &gt; - 서비스 말기 구간 26주를 182일 되풀이해 한정 이벤트를 다시 연다.
      &gt; - 시계는 연도만 접은 방식, 한국 벽시계를 UTC처럼 쓰는 방식을 거쳐 지금의 방식이 됐다.
  - 계정과 상태 저장
    &gt; - 가입은 scrypt 해시를 쓰고, 8회 실패하면 60초 동안 잠근다.
    &gt; - 상태는 계정당 JSON 하나로 두고, 임시 파일에 쓴 뒤 교체하며, 깨진 파일은 따로 옮겨 둔다.

## 알아낸 것: 서버 규칙의 위치와 시간 제한
- 서버 약속은 클라이언트에 있었다
  - 기준은 클라이언트가 읽는 형태
    - 필드, 타입, 순서
      &gt; - 호출 이름 1,334개와 인자 키가 스크립트에 있고, 서버용 데이터 표 63개가 클라이언트 표에서 나온다.
      &gt; - 서버 코드의 기준은 문서가 아니라 클라이언트가 읽는 필드, 타입, 순서다.
- 결과를 읽는 콜백
  &gt; - 결과 값을 읽는 콜백은 18개이고 그중 17개에 핸들러가 있다.
  &gt; - 빈 결과로 풀면 클라이언트가 결과를 읽다가 깨진다.
  &gt; - 남은 1개는 아직 핸들러가 없다.
- 이벤트 날짜
  - 서버가 여는 날짜
    &gt; - 이벤트는 서버가 알려 주는 날짜로 열리고 닫힌다.
    &gt; - 표의 이상한 행이 시계 구간 안에 있으면 그 탭이 죽는다.

## 막혔던 일: 증상, 원인, 고침
- 도시 진입 한 건
  - 증상과 원인
    - 네 가지 증상과 고침
      &gt; - 5월 말에 가장 마지막으로 푼 문제다.
      &gt; - 계정 정보를 먼저 보내지 않아 생긴 상태 전이 경고는 계정 정보를 먼저 보내서 고쳤다.
      &gt; - 이벤트 조회에 답하지 않아 생긴 재접속은 확인 응답과 빈 결과로 고쳤다.
      &gt; - 생존 신호에 답하지 않아 생긴 로그아웃은 받는 즉시 응답해서 고쳤다.
      &gt; - 상태 전환 요청에 요청값을 되돌리지 않아 생긴 끊김은 응답에 요청값을 되돌려 고쳤다.
      &gt;
      &gt; - 접속 응답이 상태 전이를 일으킨다는 가설은 로그에 적힌 전이 경로의 정의를 보고 반증했다.
- 로그인 원인의 오진
  - 가설과 확인
    &gt; - 처음 가설은 게이트 서버가 없어서 로그인이 안 된다는 것이었다.
    &gt; - 전 포트 캡처에서 연결 28개가 모두 TLS였고 게이트 접속은 0건이었다.
    &gt; - 확정 원인은 서버 목록 응답이 13바이트 스텁이었던 것이다.
    &gt; - 그 뒤 서버명 없는 TCP가 HTTPS 서버로 가던 중계 설정이 두 번째 막힘으로 드러났다.
- 게임만 종료하면 접속이 안 됨
  - 원인과 고침
    &gt; - 게임 프로세스만 끝나면 VPN 장치가 사라지며 안드로이드가 서버의 듣는 소켓을 닫았고, 수락 호출이 초당 약 4천 번 실패했다.
    &gt; - 서버가 소켓을 다시 열고, 접속 화면이 단계적으로 재시도하도록 고쳤다.
    &gt; - 이전 테스트는 항상 두 프로세스를 함께 끝내서 이 경우를 놓쳤다.
- 업데이트 때 계정 데이터가 덮어써짐
  - 원인과 해법
    &gt; - 데이터 묶음의 해시가 바뀌면 플레이 여부와 관계없이 덮어썼다.
    &gt; - 백업, 불러오기, 삭제 화면을 추가했고, 건드리지 않았을 때만 새 묶음으로 교체하며 이전 파일은 따로 남긴다.
    &gt; - 확인은 시험 계정과 계정 DB의 해시가 재설치 뒤에도 유지되는지 보는 방식이었다.

## REA 활용: 쓰임과 한계
- 도구 쓰임
  - 구성과 증거 번호
    - 결과마다 증거 번호
      &gt; - 역공학 도구 모음으로 게임 네이티브 라이브러리 분석, HTTP 캡처 판독, 기기 조작을 맡는다.
      &gt; - 결과마다 증거 번호가 붙는다.
      &gt; - 92번째 커밋에 넣었고, 첫 도시 진입은 REA 없이 이뤄졌다.
  - 응답 변경의 근거 형식
    &gt; - 10월 12일 응답 원복의 근거는 판독 결과의 증거 번호와 건수, 해시를 인용했고 이후 변경도 같은 형식을 쓴다.
    &gt; - 게이트 구간 응답 값은 대부분 클라이언트 스크립트에서 나왔다.
    &gt; - REA 밖 근거인 스크립트와 패킷 캡처는 파일 경로와 줄 번호로 적는다.
    &gt; - 캡처에 로그인 토큰이 있어 REA 결과 파일은 저장소에 올리지 않았다.
- 네이티브 라이브러리 분석
  &gt; - 39MB ARM64 라이브러리로 심볼이 없다.
  &gt; - 프로시저 77,279개, 문자열 52,708개를 찾았다.
  &gt; - 첫 분석은 13분 58초(호스트 RAM 13GB, 분석 프로세스 최대 3.0GB, 에뮬레이터 동시 실행)였다.
  &gt; - 분석 결과를 연 뒤 첫 질의는 734.9초가 걸렸고, 이후 질의는 즉시 끝났다.
  &gt; - 매번 새로 분석하면 14분을 치르므로 결과를 이어서 쓴다.
- HTTP 캡처 판독
  &gt; - Burp 캡처를 표준 형식으로 바꾸고(변환기는 이 연구에서 만들었다), REA가 판독한 증거를 호스트, 메서드, 경로로 묶어 분석 문서와 서버 코드에 대조했다.
  &gt; - 4세트 512건이 호스트 30개, 요청 44묶음으로 정리됐다.
  &gt; - 게임 관련 22묶음은 초기 API 문서에 경로가 모두 있어 그 문서와의 어긋남을 확인하는 데 썼다.
- REA가 다루지 못한 것
  - 빈자리와 채운 도구
    &gt; - 게임 스크립트(REA의 대상이 아님), 게이트 구간 패킷 캡처(범위 밖), ARM64 섹션 레이아웃(해당 기능이 x86-64 전용)이 빈자리였다.
    &gt; - 이 빈자리는 공개 도구와 이 연구에서 만든 도구가 채웠다.

## 한계와 아직 모르는 것
- 서버만 알던 값
  - 밸런스와 정산
    &gt; - 밸런스 값과 전투 정산은 클라이언트에 없다.
    &gt; - 던전류 정산은 구현했지만, 서버만 아는 밸런스 값은 클라이언트에서 확인되지 않는다.
- 게이트 구간의 정답지
  - 추론과 검증
    - 검증이 의존하는 것
      &gt; - 캡처가 없어서 응답 순서와 값 대부분이 클라이언트 소스에서 거꾸로 세운 추론이다.
      &gt; - 이 구간의 검증은 클라이언트 동작과 로그에 의존한다.
- 구현하지 못한 범위
  &gt; - 서버 호출의 약 48.5%만 처리한다.
  &gt; - 행동과 구역 전투 보상, 회차 끝 보상, 사건 보상은 비어 있다.
  &gt; - 전투 서버가 없어 온라인 전투가 필요한 콘텐츠는 부분 지원이다.
- 화면으로 확인하지 못한 것
  - 정식 결말과 이벤트
    &gt; - 정식 결말은 본 적이 없다.
    &gt; - 이벤트는 약 33묶음 중 약 28묶음을 화면으로 보지 못했다.
    &gt; - 이벤트 규칙 모듈 38종은 규칙 종류를 센 수이고, 33묶음은 이벤트 활동을 묶은 수라 세는 단위가 다르다.
- 빌드와 근거 자료
  &gt; - 클라이언트는 수정한 빌드로 실행했고 수정 내용은 이 지도에서 다루지 않는다.
  &gt; - 기기에 올린 빌드는 최근 서버 수정을 항상 담지 않는다.
  &gt; - 영상과 스크린샷은 저장소에 없다.

        var token = ++S.searchToken;
        var q = norm(S.query.trim());
        S.searchActive = !!q || S.todoOnly;
        if (!S.searchActive) {
            await clearSearchState();
            return;
        }
        if (!S.savedFold) {
            S.savedFold = snapshotFold();
            S.savedSib = snapshotSiblings();
        }
        var matches = [];
        walk(root, function (n) {
            if (matchesNode(n, q)) matches.push(n);
        });
        var anc = new Set();
        matches.forEach(function (n) {
            ancestors(n).forEach(function (a) {
                anc.add(a);
            });
        });
        S.matches = matches;
        S.matchSet = new Set(matches);
        S.ancSet = anc;
        var changed = false;
        matches.forEach(function (n) {
            if (revealSync(n)) changed = true;
        });
        S.active = matches.length ? 0 : -1;
        if (changed) await mm.renderData();
        if (token !== S.searchToken) return;
        paintClasses();
        updateCount();
        announce(
            matches.length ? T.resultsAnnounce(matches.length) : T.noResult
        );
        if (matches.length) gotoActive();
    }

    function panelPad() {
        if (!panelEl.classList.contains("mme-open")) return {};
        var r = panelEl.getBoundingClientRect();
        return window.innerWidth <= 640
            ? { bottom: r.height + 16 }
            : { right: r.width + 16 };
    }

    function gotoActive() {
        var n = S.matches[S.active];
        if (!n) return;
        S.focus = n;
        decorate();
        updateCount();
        mm.centerNode(n, panelPad());
    }
    function stepMatch(dir) {
        if (!S.matches.length) return;
        S.active = (S.active + dir + S.matches.length) % S.matches.length;
        gotoActive();
    }

    async function clearSearchState() {
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = false;
        var restored = restoreFold();
        updateCount();
        if (restored) await mm.renderData();
        else paintClasses();
    }
    function clearSearchUi() {
        input.value = "";
        S.query = "";
        S.todoOnly = false;
        todoItem.el.setAttribute("aria-checked", "false");
        S.searchToken++;
        clearSearchState();
        searchWrap.classList.remove("mme-open");
    }

    input.addEventListener("input", function () {
        S.query = input.value;
        scheduleSearch();
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            clearTimeout(searchTimer);
            if (
                S.searchToken &&
                S.matches.length &&
                norm(input.value.trim()) === norm(S.query.trim()) &&
                S.searchActive
            ) {
                stepMatch(e.shiftKey ? -1 : 1);
            } else {
                S.query = input.value;
                runSearch();
            }
        } else if (e.key === "ArrowDown") {
            e.preventDefault();
            stepMatch(1);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            stepMatch(-1);
        } else if (e.key === "Escape") {
            e.stopPropagation();
            clearSearchUi();
            input.blur();
            focusNode(nearestShown(S.focus));
        }
    });
    input.addEventListener("blur", function () {
        if (!input.value && window.innerWidth <= 640 && !S.todoOnly) {
            searchWrap.classList.remove("mme-open");
        }
    });

    /* ------------------------------------------------------------------ */
    /* Level menu                                                          */
    /* ------------------------------------------------------------------ */

    async function structuralChange() {
        S.savedFold = null;
        S.savedSib = null;
        S.searchToken++;
        S.matches = [];
        S.matchSet = new Set();
        S.ancSet = new Set();
        S.active = -1;
        S.searchActive = !!(S.query.trim() || S.todoOnly);
        await mm.renderData();
        await mm.fit();
        if (S.searchActive) runSearch();
        else updateCount();
    }
    function setLevel(level) {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, n.state.depth >= level + 1 ? 1 : 0);
        });
        structuralChange();
    }
    function expandAll() {
        walk(root, function (n) {
            if (hasKids(n)) setFold(n, 0);
        });
        groups.forEach(function (g, p) {
            setSiblingsExpanded(p, true);
        });
        structuralChange();
    }

    var todoItem = {
        label: T.todoOnly,
        checkbox: true,
        run: function (b) {
            S.todoOnly = !S.todoOnly;
            b.setAttribute("aria-checked", S.todoOnly ? "true" : "false");
            runSearch();
        }
    };
    var levelItems = [1, 2, 3, 4].map(function (n) {
        return {
            label: T.levelItem(n),
            run: function () {
                setLevel(n);
            }
        };
    });
    levelItems.push({ label: T.expandAll, run: expandAll });
    if (cfg.hasTasks) {
        levelItems.push("-");
        levelItems.push(todoItem);
    }
    var levelDd = dropdown("layers", T.level, levelItems);

    var exportDd = dropdown("download", T.exportLabel, [
        {
            label: T.exportPng,
            run: function () {
                exportAs("png");
            }
        },
        {
            label: T.exportJpg,
            run: function () {
                exportAs("jpg");
            }
        },
        {
            label: T.exportSvg,
            run: function () {
                exportAs("svg");
            }
        },
        "-",
        {
            label: T.copyMd,
            run: function () {
                exportAs("copy");
            }
        }
    ]);
    function exportAs(kind) {
        var api = window.mmExport;
        if (api && api[kind]) api[kind]();
    }

    barEl.appendChild(searchWrap);
    barEl.appendChild(levelDd.el);
    barEl.appendChild(exportDd.el);
    // Menu is built before todoItem exists only if tasks are absent.
    if (!cfg.hasTasks) todoItem.el = h("span");

    /* Export hooks: strip transient visual state while an image is rendered. */
    window.mmeBeforeExport = function () {
        svgEl.classList.add("mme-exporting");
        cardEl.classList.remove("mme-show");
    };
    window.mmeAfterExport = function () {
        svgEl.classList.remove("mme-exporting");
    };

    /* ------------------------------------------------------------------ */
    /* Hover                                                               */
    /* ------------------------------------------------------------------ */

    function pathOf(n) {
        var s = new Set([n]);
        ancestors(n).forEach(function (a) {
            s.add(a);
        });
        if (!isFolded(n)) {
            (n.children || []).forEach(function (c) {
                s.add(c);
            });
        }
        return s;
    }

    function cardHtml(n) {
        var p = n.payload || {};
        var parts = [];
        function list(items, extra) {
            var li = items
                .slice(0, 5)
                .map(function (c) {
                    return "<li>" + esc(textOf(c)) + "</li>";
                })
                .join("");
            var more =
                items.length > 5
                    ? "<li>…" + esc(T.moreItems(items.length - 5)) + "</li>"
                    : "";
            return "<ul>" + li + more + "</ul>" + (extra || "");
        }
        if (p.less) return "";
        if (p.more) {
            var g = groups.get(parentOf.get(n));
            return (
                '<div class="mme-card-title">' +
                esc(textOf(n)) +
                "</div>" +
                list(g ? g.hidden : [])
            );
        }
        var needTitle = !!p.detail || isFolded(n);
        if (needTitle)
            parts.push(
                '<div class="mme-card-title">' + esc(textOf(n)) + "</div>"
            );
        if (p.detail)
            parts.push('<div class="mme-card-detail">' + p.detail + "</div>");
        if (isFolded(n)) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.childCount(realKids(n).length) + " · " + T.folded) +
                    "</div>" +
                    list(realKids(n))
            );
        }
        if (p.tasks) {
            parts.push(
                '<div class="mme-card-meta">' +
                    esc(T.done + " " + p.tasks.done + "/" + p.tasks.total) +
                    "</div>"
            );
        }
        if (!parts.length) return "";
        if (p.detail)
            parts.push('<span class="mme-hint">' + esc(T.hint) + "</span>");
        return parts.join("");
    }

    function positionCard(n) {
        var g = gMap.get(n);
        if (!g) return;
        var fo = g.querySelector("foreignObject") || g;
        var r = fo.getBoundingClientRect();
        cardEl.style.left = "0px";
        cardEl.style.top = "0px";
        var cw = cardEl.offsetWidth;
        var ch = cardEl.offsetHeight;
        var left = Math.min(Math.max(8, r.left), window.innerWidth - cw - 8);
        var top = r.bottom + 8;
        if (top + ch > window.innerHeight - 8)
            top = Math.max(8, r.top - ch - 8);
        cardEl.style.left = left + "px";
        cardEl.style.top = top + "px";
    }
    function showCard(n) {
        var html = cardHtml(n);
        if (!html) {
            hideCard();
            return;
        }
        cardEl.innerHTML = html;
        var preview = cardEl.querySelector(".mme-card-detail");
        if (preview && preview.scrollHeight > preview.clientHeight + 1) {
            preview.classList.add("mme-clipped");
        }
        positionCard(n);
        cardEl.classList.add("mme-show");
    }
    function hideCard() {
        cardEl.classList.remove("mme-show");
    }
    var cardTimer = 0;
    function startHover(n, immediate) {
        S.hover = n;
        S.pathSet = pathOf(n);
        paintClasses();
        clearTimeout(cardTimer);
        cardTimer = setTimeout(
            function () {
                // The panel already shows the selected node's details.
                if (S.hover === n && S.selected !== n) showCard(n);
            },
            immediate ? 60 : 220
        );
    }
    function endHover() {
        S.hover = null;
        S.pathSet = null;
        clearTimeout(cardTimer);
        hideCard();
        paintClasses();
    }
    var noHover =
        window.matchMedia && window.matchMedia("(hover: none)").matches;
    svgEl.addEventListener("mouseover", function (e) {
        if (noHover || e.buttons) return;
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n === S.hover) return;
        if (!n || !n.state) endHover();
        else startHover(n, false);
    });
    svgEl.addEventListener("mouseleave", endHover);
    svgEl.addEventListener("mousedown", hideCard);
    svgEl.addEventListener("focusin", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (n && n.state) {
            S.focus = n;
            startHover(n, true);
        }
    });
    svgEl.addEventListener("focusout", endHover);
    mm.zoom.on("start.mme", hideCard);

    /* ------------------------------------------------------------------ */
    /* Selection panel                                                     */
    /* ------------------------------------------------------------------ */

    function collectLinks(n) {
        var out = [];
        var seen = {};
        [n.content, n.payload && n.payload.detail].forEach(function (html) {
            if (!html) return;
            parseHtml(html)
                .querySelectorAll("a[href]")
                .forEach(function (a) {
                    var href = a.getAttribute("href");
                    if (!href || seen[href]) return;
                    seen[href] = 1;
                    out.push({
                        href: href,
                        text: (a.textContent || href).trim()
                    });
                });
        });
        return out;
    }

    function labelButton(n, extraHtml) {
        var b = h("button", { type: "button" });
        b.appendChild(h("span", { text: textOf(n) }));
        if (extraHtml) b.appendChild(h("small", { text: extraHtml }));
        b.addEventListener("click", function () {
            selectNode(n, { center: true });
        });
        return b;
    }

    function renderPanel(n) {
        var p = n.payload || {};
        panelEl.textContent = "";
        var chain = ancestors(n).reverse();
        var crumbs = h("ol", { class: "mme-crumbs", "aria-label": "path" });
        chain.forEach(function (a) {
            var li = h("li");
            li.appendChild(labelButton(a));
            crumbs.appendChild(li);
        });
        var closeBtn = iconButton("close", T.close, "", function () {
            deselect(true);
        });
        panelEl.appendChild(
            h("div", { class: "mme-panel-head" }, [crumbs, closeBtn])
        );

        var body = h("div", { class: "mme-panel-body" });
        body.appendChild(
            h("div", { class: "mme-panel-title", html: titleHtml(n) })
        );

        if (p.tasks) {
            var pct = Math.round((p.tasks.done / p.tasks.total) * 100);
            body.appendChild(h("h3", { text: T.progress }));
            body.appendChild(
                h("div", { class: "mme-progress-line" }, [
                    h("i", { style: "--p:" + pct + "%" }),
                    h("span", { text: p.tasks.done + "/" + p.tasks.total })
                ])
            );
        }
        if (p.detail) {
            body.appendChild(h("h3", { text: T.detail }));
            body.appendChild(h("div", { class: "mme-detail", html: p.detail }));
        }
        if (hasKids(n)) {
            var kids = realKids(n);
            body.appendChild(
                h("h3", { text: T.children + " (" + kids.length + ")" })
            );
            var ul = h("ul", { class: "mme-list" });
            kids.forEach(function (c) {
                var li = h("li");
                var extra =
                    hasKids(c) && c.payload && c.payload.count
                        ? "+" + c.payload.count
                        : "";
                li.appendChild(labelButton(c, extra));
                ul.appendChild(li);
            });
            body.appendChild(ul);
        }
        var links = collectLinks(n);
        if (links.length) {
            body.appendChild(h("h3", { text: T.links }));
            var lul = h("ul", { class: "mme-list" });
            links.forEach(function (l) {
                lul.appendChild(
                    h("li", null, [
                        h("a", {
                            href: l.href,
                            target: "_blank",
                            rel: "noopener noreferrer",
                            text: l.text
                        })
                    ])
                );
            });
            body.appendChild(lul);
        }

        var actions = h("div", { class: "mme-actions" });
        if (hasKids(n)) {
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: isFolded(n) ? T.expand : T.collapse,
                    onclick: function () {
                        mm.toggleNode(n, false).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
            actions.appendChild(
                h("button", {
                    type: "button",
                    class: "mme-btn",
                    text: T.expandBelow,
                    onclick: function () {
                        walk(n, function (x) {
                            if (hasKids(x)) setFold(x, 0);
                        });
                        mm.renderData(n).then(function () {
                            renderPanel(n);
                        });
                    }
                })
            );
        }
        actions.appendChild(
            h("button", {
                type: "button",
                class: "mme-btn",
                text: T.copyText,
                onclick: function () {
                    copyText(textOf(n));
                }
            })
        );
        body.appendChild(actions);
        panelEl.appendChild(body);
        panelEl.setAttribute("aria-label", T.panelLabel + ": " + textOf(n));
    }

    function copyText(text) {
        var done = function () {
            window.mmeToast(T.copied);
        };
        var fail = function () {
            window.mmeToast(T.copyFailed);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, fail);
        } else fail();
    }

    async function reveal(n) {
        if (revealSync(n)) await mm.renderData();
    }

    // Expands/collapses the hidden siblings of a long child list. The clicked
    // button is swapped for its counterpart, so focus is handed over explicitly.
    async function toggleSiblings(p, keyboard) {
        var g = groups.get(p);
        if (!g) return;
        var expanding = !g.expanded;
        setSiblingsExpanded(p, expanding);
        await mm.renderData(p);
        var target = expanding ? g.hidden[0] : g.more;
        if (keyboard) await focusNode(target);
        else {
            S.focus = target;
            decorate();
        }
        announce(textOf(expanding ? g.less : g.more));
    }

    async function selectNode(n, opts) {
        opts = opts || {};
        if (isSentinel(n)) {
            await toggleSiblings(parentOf.get(n), opts.keyboard);
            return;
        }
        await reveal(n);
        S.selected = n;
        S.focus = n;
        // The panel shows the details now; a lingering hover card would repeat them.
        clearTimeout(cardTimer);
        hideCard();
        renderPanel(n);
        panelEl.classList.add("mme-open");
        doc.body.classList.add("mme-panel-open");
        await mm.setHighlight(n);
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
        if (opts.keyboard) panelEl.focus({ preventScroll: true });
        announce(T.panelLabel + ": " + textOf(n));
    }

    function deselect(refocus) {
        var had = S.selected;
        S.selected = null;
        panelEl.classList.remove("mme-open");
        doc.body.classList.remove("mme-panel-open");
        mm.setHighlight(null);
        if (refocus && had) focusNode(had);
    }

    /* ------------------------------------------------------------------ */
    /* Lightbox                                                            */
    /* ------------------------------------------------------------------ */

    function openLightbox(img) {
        var cap = "";
        var fig = img.closest && img.closest("figure");
        if (fig && fig.querySelector("figcaption"))
            cap = fig.querySelector("figcaption").textContent;
        else cap = img.getAttribute("alt") || "";
        lightbox.textContent = "";
        lightbox.appendChild(
            h("img", { src: img.currentSrc || img.src, alt: cap })
        );
        if (cap) lightbox.appendChild(h("p", { text: cap }));
        lightbox.classList.add("mme-open");
        lightbox.setAttribute("tabindex", "-1");
        lightbox.focus();
    }
    function closeLightbox() {
        lightbox.classList.remove("mme-open");
    }
    lightbox.addEventListener("click", closeLightbox);
    doc.addEventListener("click", function (e) {
        var img = e.target;
        if (img && img.tagName === "IMG" && panelEl.contains(img))
            openLightbox(img);
    });

    /* ------------------------------------------------------------------ */
    /* Pointer interaction on the map                                      */
    /* ------------------------------------------------------------------ */

    var downPos = null;
    svgEl.addEventListener("pointerdown", function (e) {
        downPos = { x: e.clientX, y: e.clientY };
    });
    var coarse =
        window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

    function nearestCircle(x, y, radius) {
        var best = null;
        var bestD = radius;
        svgEl.querySelectorAll("g.markmap-node > circle").forEach(function (c) {
            var r = c.getBoundingClientRect();
            var dx = r.left + r.width / 2 - x;
            var dy = r.top + r.height / 2 - y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d <= bestD) {
                best = c;
                bestD = d;
            }
        });
        return best;
    }

    svgEl.addEventListener("click", function (e) {
        var t = e.target;
        if (
            downPos &&
            Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5
        )
            return;
        if (t.closest && t.closest("a")) return;
        if (t.tagName === "IMG") {
            openLightbox(t);
            return;
        }
        if (t.tagName === "circle") return; // markmap toggles on its own handler
        var c = nearestCircle(e.clientX, e.clientY, coarse ? 22 : 10);
        if (c && c.__data__) {
            mm.toggleNode(c.__data__, e.ctrlKey || e.metaKey);
            return;
        }
        var g = t.closest && t.closest("g.markmap-node");
        if (g && g.__data__ && t.closest("foreignObject")) {
            selectNode(g.__data__, {}); // sibling-group buttons toggle instead
        } else if (!g && S.selected) {
            deselect(false);
        }
    });

    /* ------------------------------------------------------------------ */
    /* Keyboard tree navigation                                            */
    /* ------------------------------------------------------------------ */

    function visibleList() {
        var out = [];
        (function rec(n) {
            out.push(n);
            if (!isFolded(n)) (n.children || []).forEach(rec);
        })(root);
        return out;
    }

    async function focusNode(n) {
        if (!n) return;
        if (!isShown(n)) await reveal(n);
        S.focus = n;
        decorate();
        var g = gMap.get(n);
        if (g) g.focus({ preventScroll: true });
        mm.ensureVisible(n, Object.assign({ left: 24, top: 64 }, panelPad()));
    }

    svgEl.addEventListener("keydown", function (e) {
        var g = e.target.closest && e.target.closest("g.markmap-node");
        var n = g && g.__data__;
        if (!n || !n.state || e.altKey || e.ctrlKey || e.metaKey) return;
        var list = visibleList();
        var i = list.indexOf(n);
        var handled = true;
        switch (e.key) {
            case "ArrowDown":
                focusNode(list[Math.min(list.length - 1, i + 1)]);
                break;
            case "ArrowUp":
                focusNode(list[Math.max(0, i - 1)]);
                break;
            case "Home":
                focusNode(list[0]);
                break;
            case "End":
                focusNode(list[list.length - 1]);
                break;
            case "ArrowRight":
                if (hasKids(n) && isFolded(n)) mm.toggleNode(n, false);
                else if (hasKids(n)) focusNode(n.children[0]);
                break;
            case "ArrowLeft":
                if (hasKids(n) && !isFolded(n)) mm.toggleNode(n, false);
                else if (parentOf.get(n)) focusNode(parentOf.get(n));
                break;
            case "Enter":
                selectNode(n, { keyboard: true });
                break;
            case " ":
                if (isSentinel(n)) toggleSiblings(parentOf.get(n), true);
                else if (hasKids(n)) mm.toggleNode(n, e.shiftKey);
                break;
            default:
                handled = false;
        }
        if (handled) e.preventDefault();
    });

    /* ------------------------------------------------------------------ */
    /* Global shortcuts                                                    */
    /* ------------------------------------------------------------------ */

    function typing(el) {
        return (
            el &&
            (el.tagName === "INPUT" ||
                el.tagName === "TEXTAREA" ||
                el.isContentEditable)
        );
    }
    doc.addEventListener("keydown", function (e) {
        if (
            (e.key === "/" && !typing(e.target) && !e.ctrlKey && !e.metaKey) ||
            ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")
        ) {
            e.preventDefault();
            searchWrap.classList.add("mme-open");
            input.focus();
            input.select();
            return;
        }
        if (e.key !== "Escape") return;
        if (lightbox.classList.contains("mme-open")) {
            closeLightbox();
        } else if (
            openMenus.some(function (m) {
                return m.menu.classList.contains("mme-open");
            })
        ) {
            closeMenus();
        } else if (S.searchActive || input.value) {
            clearSearchUi();
        } else if (S.selected) {
            deselect(true);
        } else {
            endHover();
        }
    });

    /* ------------------------------------------------------------------ */
    /* Toolbar localisation (markmap-toolbar)                              */
    /* ------------------------------------------------------------------ */

    function enhanceZoomBar() {
        var bar = doc.querySelector(".mm-toolbar");
        if (!bar) return false;
        bar.classList.add("mme-ui", "mme-zoombar");
        bar.querySelectorAll(".mm-toolbar-item").forEach(function (item) {
            var title = item.getAttribute("title") || "";
            var local = T.zoomTitles[title] || title;
            item.setAttribute("title", local);
            item.setAttribute("role", "button");
            item.setAttribute("aria-label", local);
            item.setAttribute("tabindex", "0");
            item.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    item.click();
                }
            });
        });
        return true;
    }
    var zoomTries = 0;
    (function waitZoomBar() {
        if (enhanceZoomBar() || ++zoomTries > 40) return;
        setTimeout(waitZoomBar, 100);
    })();

    /* ------------------------------------------------------------------ */
    /* Boot                                                                */
    /* ------------------------------------------------------------------ */

    // Small screens: start with the first levels only so text stays readable.
    if (window.innerWidth <= 640 && cfg.mobileLevel) {
        walk(root, function (n) {
            if (!hasKids(n)) return;
            setFold(n, n.state.depth >= cfg.mobileLevel + 1 ? 1 : 0);
        });
    }

    updateCount();
    mm.renderData();
})();
</script>
  
</body>
