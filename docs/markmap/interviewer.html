# 서비스가 끝난 모바일 게임 서버 복원 연구

## 먼저 알아 둘 용어
- 정답지
  - 기준으로 삼는 순서
    - 1순위는 2021년 패킷 캡처
      - 캡처가 있는 응답은 원본 그대로 돌려준다
        - 바이트와 Content-Type까지 같게 맞춘다
          - 응답 본문을 캡처에서 그대로 가져온다
            &gt; - 2021년 캡처 본문을 바이트 단위로 돌려주도록 바꾼 것이 출발점이다 (분석 기록 E1a 30행)
            &gt; - 길이와 SHA-256을 테스트로 고정했다 (분석 기록 A 374행)
      - 캡처와 다른 응답은 따로 센다
        - 10월 12일 기준 8종이 남았다
          - 화면에 원문이 그대로 보이는 응답이 섞여 있다
            &gt; - 공지와 약관 텍스트가 스텁이라 빈 성공 응답과 HTML 원문이 화면에 보인다 (분석 기록 A 1094행)
            &gt; - 8종 전체가 후속 과제 목록에 올라 있다 (분석 기록 C 718행)
    - 2순위는 복원한 클라이언트 소스와 데이터 표
      - 캡처가 없는 구간의 근거가 된다
        - 게이트 구간에는 2021 캡처가 없다
          - 서버 규칙을 클라이언트 동작에서 거꾸로 세운다
            &gt; - 서버 규칙 다섯 개를 이 방식으로 세웠다 (분석 기록 E5 42행)
            &gt; - 많은 순서 결정이 추론 표시로 남아 있다 (분석 기록 E1c 741행)
    - 3순위는 추론으로 표시한 값
      - 둘로 확인되지 않은 값은 표시로 구분한다
        - 근거 태그가 출처를 나눈다
          - 태그는 네 가지다
            &gt; - 표, 소스, 추론, 복원 서버의 결정 네 가지를 쓴다 (분석 기록 E1b 10행)
  - 디버깅 정답지: 엔진 로그
    - 클라이언트 쪽 동작을 확인하는 기준이다
      - 배포, 로그, 수정을 짧게 되풀이한다
        - 한 번에 하나씩 고쳐 검증한다
          - 로그는 엔진 설정 한 줄로 켠다
            &gt; - 엔진의 스크립트 트레이스백을 보고 원인을 좁혔다 (분석 기록 C 76행)
            &gt; - 실기기 검증을 한 번에 하나씩 고치는 방식으로 진행했다 (분석 기록 D1 1030행)
- 시험 수단
  - 검증을 쉽게 하려고 바꾼 입력
    - 능력치 배율
      - 전투 승리 흐름을 빨리 보는 데 쓴다
        - 영웅 육성이 없을 때 던전류 흐름을 확인한다
          - 기본 능력치와 성장치에 같은 배율을 곱한다
            &gt; - 영웅 육성이 복원되기 전에 던전류의 승리 흐름을 보려고 둔 수단이다 (분석 기록 E1a 456행)
            &gt; - 원본에 있던 규칙이 아니므로 이 값으로 얻은 결과는 원본 규칙으로 취급하지 않는다 (분석 기록 E1a 456행)
      - 이벤트 전투도 같은 배율로 통과시켰다
        - 두 번째 이벤트 검증의 전투가 모두 여기에 해당한다
          - 배율 2000으로 전투를 이긴 기록을 남겼다
            &gt; - 두 번째 이벤트 검증에서 전투는 모두 배율 2000으로 이겼다 (분석 기록 E5 197행)
    - 서버 시계
      - 기간 한정 콘텐츠를 다시 연다
        - 서비스 말기 구간을 되풀이하는 시계를 쓴다
          - 열림과 닫힘을 서버 시각으로 정한다
            &gt; - 소환과 이벤트가 열리는지는 클라이언트 표와 서버 시각의 조합으로 정해진다 (분석 기록 E5 188행)
            &gt; - 클라이언트 표는 바꾸지 않고 서버 시계만 바꿨다 (분석 기록 E5 188행)
    - 운영자 도구
      - 계정과 상태를 명령으로 바꾼다
        - 영웅 지급, 레벨, 호감도를 다룬다
          - 자질시험은 통과 처리만 한다
            &gt; - 영웅 지급, 지휘사 레벨, 호감도, 계정 명령이 나뉘어 있다 (분석 기록 E1a 442행)
            &gt; - 자질시험 규칙이 남아 있지 않아 실전훈련용으로 통과 처리만 한다 (분석 기록 E1a 456행)
- 스텁
  - 실제 내용 없이 형식만 맞춘 응답
    - 결과 코드만 있는 빈 성공 응답
      - 로그인 막힘의 원인이 된 목록 응답
        - 서버 목록 응답 하나가 13바이트 스텁이었다
          - 형식만 맞춘 응답이 서버 선택에서 막았다
            &gt; - 서버 목록 응답이 스텁이어서 로그인이 막혔다 (분석 기록 D1 1614행)
            &gt; - 같은 빈 응답이 분석과 통계 도메인의 요청에도 쓰였다 (분석 기록 B 836행)
    - 나머지 요청을 받는 응답
      - 캡처에 없는 경로는 성공을 주고 경고를 남긴다
        - 게임이 멈추지 않게 응답은 한다
          - 근거 없는 응답이라는 사실은 로그로 드러낸다
            &gt; - 나머지 전부를 받는 경로가 성공 응답과 함께 &quot;캡처에 없는 경로&quot; 경고를 남긴다 (분석 기록 E1a 266행)
            &gt; - 오타나 새 경로도 성공처럼 보이므로 스텁 처리 로그를 봐야 한다 (분석 기록 B 844행)
    - 방향 전환
      - 지어낸 스텁을 캡처 본문으로 바꿨다
        - 지어내지 않는 것을 원칙으로 삼았다
          - 게임 도메인 응답을 캡처와 대조해 고쳤다
            &gt; - 게임 도메인 엔드포인트 22종을 서버 응답과 대조해 스텁과 봉투 차이를 없앴다 (분석 기록 E1a 146행)
- 기준선
  - 측정으로 잡은 출발 상태
    - 10월 12일 측정
      - 문서가 완료라고 적은 상태를 실제 환경에서 다시 쟀다
        - 완료 표시는 그 시점과 그 기기에서만 사실이다
          - 에뮬레이터에서 처음부터 다시 재현했다
            &gt; - 완료 표시는 그 시점과 그 기기에서만 사실이라는 교훈을 남겼다 (분석 기록 C 35행)
            &gt; - 업데이트 확인부터 도시 메인까지 에뮬레이터에서 재현했다 (분석 기록 C 31행)
      - 어긋나 있던 것은 응답과 설정이었다
        - 응답과 설정을 캡처 원본 기준으로 맞췄다
          - 고친 곳은 네 군데다
            &gt; - 업데이트 목록 응답을 캡처 바이트로 되돌렸다 (분석 기록 A 1092행)
            &gt; - 게이트 주소를 환경 변수로 바꿨다 (분석 기록 A 1092행)
            &gt; - 서비스 설정을 정리했다 (분석 기록 A 1092행)
            &gt; - 강제 업데이트 테스트의 기대값을 바로잡았다 (분석 기록 A 1092행)
      - 같은 복구 과정에서 실수가 기록됐다
        - 실수 세 건이 같은 날짜로 남았다
          - 기준선 복구의 실수도 같이 적는다
            &gt; - 10월 12일 기준선 복구 과정의 실수 세 건이 따로 기록됐다 (분석 기록 C 589행)
- 증거 번호
  - REA가 판독한 결과마다 붙는 번호
    - 응답을 바꿀 때 근거로 인용한다
      - 인용은 증거 번호와 해시로 한다
        - 원복과 변경 기록에 같은 형식을 쓴다
          - 10월 12일 이후 변경도 같은 형식이다
            &gt; - 10월 12일 원복의 근거는 증거 번호 전체와 본문 SHA-256이었다 (분석 기록 A 1092행)
            &gt; - 10월 12일 이후 보고서는 추정 중심에서 증거 번호와 해시 중심으로 바뀌었다 (분석 기록 D2 1549행)
            &gt; - 화면 증거도 번호를 붙이고, 스크린샷 파일은 git이 무시하도록 적혀 있다 (분석 기록 E4b 1204행)
- 무응답 선언
  - 핸들러 없이 응답하지 않도록 선언한 호출
    - 선언한 호출 수를 센다
      - 핸들러와 합쳐 서버 호출을 나눈다
        - 두 가지를 합쳐야 처리 범위가 나온다
          - 고유 무응답 선언은 63개다
            &gt; - 핸들러 584개와 무응답 63개를 합하면 647개다 (분석 기록 E1c 58행)
            &gt; - 647개는 서버 호출 1,334개 가운데 있는 수다 (분석 기록 E1c 58행)

## 결과와 한계 한눈에
- 대상과 범위
  - 대상 게임
    - 서비스가 끝난 모바일 게임이다
      - 엔진은 NeoX다
        - 게임 이름은 「영원한 7일의 도시」다
          &gt; - 서버 쪽 규칙이 원본에 남아 있지 않은 게임이다 (분석 기록 E1b 575행)
  - 남은 자료
    - 서버 쪽 자료는 없다
      - 서버 소스와 서버 데이터가 없다
        - 원본 서버 규칙을 클라이언트에서 다시 세웠다
          &gt; - 원본 서버 규칙은 남아 있지 않아 클라이언트 표와 소스에서 다시 세웠다 (분석 기록 E1b 575행)
      - 남은 자료는 세 가지다
        - 클라이언트 앱과 리소스가 가장 크다
          - 호출 형식과 데이터 표, 계산 코드가 들어 있다
            &gt; - 클라이언트 코드에서 프로토콜, 직렬화 구조, 일부 데이터 표를 복원할 수 있었다 (분석 기록 D1 1282행)
        - 2021년 HTTP 캡처가 있다
          - Burp 캡처 4세트가 응답의 정답지다
            &gt; - 캡처 4세트 512건을 호스트 30개, 요청 44묶음으로 정리했다 (분석 기록 A 1046행)
        - 2021년 기기 백업이 있다
          - 백업에는 게임 파일 묶음이 있고 서버 소스는 없다
            &gt; - 패킷 로그와 2021 디바이스 백업이 가장 앞선 정답지다 (분석 기록 A 366행)
  - 결과물
    - 복원 서버가 결과물이다
      - 부팅부터 도시 진입까지 진행시킨다
        - 도시 진입 뒤에는 콘텐츠가 일부 붙어 있다
          - 스토리 회차, 던전류, 이벤트가 진행된다
            &gt; - 설정, 업데이트 확인, 로그인, 결제, 텔레메트리 도메인에 답한다 (분석 기록 E1a 146행)
            &gt; - 스토리 회차, 던전류, 이벤트는 각각 진행을 검증한 기록이 있다 (분석 기록 E5 58행, 66행, 195행)
          - 소스 코드와 게임 데이터는 저장소에 포함하지 않았다
            &gt; - 분석 대상 원문은 읽기만 했고 수정하지 않았다 (분석 기록 A 8행)
- 확인한 것
  - 로그인과 도시 진입
    - 확인한 기기는 세 가지다
      - 에뮬레이터 재현이 기준선이다
        - 10월 12일 에뮬레이터에서 재현했다
          &gt; - 업데이트 확인, 게스트 로그인, 게이트 접속, 도시 메인 화면까지 재현했다 (분석 기록 C 31행)
      - 휴대폰은 5월 실기기 검증에 쓰였다
        - 로그인 실패의 원인을 실기기 캡처로 확정했다
          &gt; - 전 포트 캡처에서 게임은 복원 서버 TLS 연결만 있었고 게이트 연결은 0건이었다 (분석 기록 D1 1004행)
      - 태블릿은 로그 확인에 쓰였다
        - 앱 안 서버가 멈춘 원인을 태블릿 로그에서 찾았다
          - 게임 프로세스가 죽으면 듣는 소켓이 닫혀 오류가 반복됐다
            &gt; - 소켓이 닫힌 뒤에도 수락 오류가 초당 수천 번 되풀이되던 증상을 고쳤다 (분석 기록 E1a 561행)
    - 성공 판정은 로그로 한다
      - 상태 전이를 로그에서 본다
        - 서버 로그와 클라이언트 로그를 함께 본다
          - 두 로그의 상태 전이가 맞아야 성공이다
            &gt; - 서버 로그와 클라이언트 엔진 로그의 상태 전이로 성공을 판정했다 (분석 기록 C 76행)
  - 반복 구간과 육성
    - 프롤로그와 7일 반복
      - 튜토리얼부터 도시 메인까지 진행했다
        - 새 계정으로 프롤로그를 끝까지 진행했다
          - 튜토리얼 전투와 이름 입력을 거쳐 도시 메인에 도달했다
            &gt; - 새 게스트 계정으로 프롤로그, 튜토리얼 전투, 이름 입력, 도시 메인 화면까지 확인했다 (분석 기록 E5 41행)
      - 7일 반복은 서버 시계로 돌렸다
        - 0일차 행동이 엔딩을 맞이하고 7일차로 돌아온다
          - 이 흐름으로 3회차 도시에 들어갔다
            &gt; - 7일 반복과 3회차 도시 진입을 에뮬레이터에서 확인했다 (분석 기록 E5 58행)
    - 엔딩
      - 엔딩은 두 개를 확인했다
        - 1회차와 2회차에서 엔딩을 하나씩 맞았다
          - 두 엔딩 모두 쉬기만 해서 닿는 결말이다
            &gt; - 두 엔딩 모두 쉬기만 해서 닿는 실패 쪽 결말이다 (분석 기록 E5 59행)
    - 영웅과 던전류
      - 영웅은 목록과 상세 화면을 확인했다
        - 운영자 도구로 117명을 지급해 확인했다
          - 역할 탭과 등급별 상세 화면을 화면으로 봤다
            &gt; - 목록 스크롤, 역할 탭 여섯 개, 등급별 상세 화면을 확인했다 (분석 기록 E5 50행)
            &gt; - 성급업, 선물, 보구, 염색 버튼은 서버가 없어 눌리면 잠길 수 있다 (분석 기록 E5 51행)
      - 던전류는 전투 흐름까지 확인했다
        - 정신력과 보상 지급이 구현됐다
          - 정신력은 최대 240이고 6분에 1씩 찬다
            &gt; - 정신력은 최대 240, 6분에 1, 하루 12번 충전이다 (분석 기록 E5 68행)
        - 전투는 능력치 배율로 승리 흐름을 봤다
          - 배율은 검증 수단으로만 쓴다
            &gt; - 던전류 승리 흐름을 보려고 능력치 배율을 올렸다 (분석 기록 E1a 456행)
  - 이벤트
    - 이벤트는 종류마다 한 바퀴 확인했다
      - 한 바퀴는 모든 분기를 누른 것이 아니다
        - 분기 전체 검증은 아직 하지 않았다
          &gt; - 화면 확인은 종류마다 한 바퀴이고 모든 분기를 누른 것은 아니다 (분석 기록 E5 190행)
      - 서버 규칙이 필요한 활동을 줄였다
        - 규칙이 필요한 활동 40개를 0으로 줄였다
          &gt; - 감사 결과 규칙이 필요한 활동이 40에서 0으로 줄었다 (분석 기록 E5 189행)
- 확인하지 못한 것
  - 정식 결말과 이벤트
    - 정식 결말
      - 정식 결말 화면은 본 적이 없다
        - 결말로 가는 이야기 선택 구간을 아직 밟지 못했다
          &gt; - 정식 결말은 이야기 선택 구간에 있고 아직 화면으로 본 적이 없다 (분석 기록 E5 59행)
    - 이벤트 활동
      - 이벤트 활동 일부는 화면으로 보지 못했다
        - 활동 40개를 대상으로 했다
          - 화면으로 못 본 활동이 남았다
            &gt; - 이벤트 활동 40개를 대상으로 했고 일부는 화면으로 보지 못했다 (분석 기록 E5 195행, 198행)
        - 수정 뒤 시험을 다시 돌리지 않았다
          - 서버 전체 시험과 기기 구성 시험이 해당한다
            &gt; - 수정 뒤 서버 전체 시험과 기기 구성 시험을 다시 돌리지 않았다 (분석 기록 E5 198행)
  - 서버 호출 범위
    - 호출 1,334개 중 647개가 처리 대상이다
      - 핸들러 584개와 무응답 63개로 나뉜다
        - 두 집계는 정적으로 센 값이다
          - 호출을 처리한다는 뜻이지 기능 동작률이 아니다
            &gt; - 정적 집계이므로 기능이 48.5% 동작한다는 뜻은 아니다 (분석 기록 E1c 58행)
      - 687개는 핸들러가 없다
        - 핸들러 없는 호출이 절반 가까이 남아 있다
          &gt; - 687개 호출은 핸들러가 없는 상태다 (분석 기록 E1c 58행)
  - 빠진 기능
    - 보상 지급과 여러 플레이어 기능이 비어 있다
      - 보상 지급이 아직 없다
        - 돈과 아이템 보상 지급이 빠져 있다
          &gt; - 돈과 아이템 보상 지급이 아직 없다 (분석 기록 E1c 741행)
      - 여러 플레이어 기능은 단일 플레이어 가정이다
        - 동료, 방, 친구가 단일 플레이어 가정이다
          &gt; - 동료, 방, 랭킹, 친구가 단일 플레이어 가정이다 (분석 기록 E1c 741행)
          &gt; - 팀 매칭이 없다 (분석 기록 E1c 741행)
  - 전투 서버
    - 전투 서버가 없다
      - 온라인 전투가 필요한 콘텐츠는 부분 지원이다
        - 랭킹은 전투 서버가 매기던 값이다
          &gt; - 랭킹은 전투 서버가 매겼던 값이라 빈 목록으로 둔다 (분석 기록 E1c 741행)
  - 서버만 알던 값
    - 밸런스와 정산
      - 밸런스 값은 클라이언트에 없다
        - 전투 정산도 클라이언트에 없다
          &gt; - 소실된 밸런스 수치와 전투 정산은 클라이언트에서 확인되지 않는다 (분석 기록 D1 1282행)
          &gt; - 던전류 정산은 구현했지만 서버만 아는 밸런스 값은 확인되지 않는다 (분석 기록 D1 1282행)
  - 게이트 구간의 정답지
    - 캡처가 없다
      - 응답 순서와 값 대부분이 추론이다
        - 순서 결정은 추론 표시가 붙는다
          - 추론 표시가 붙은 결정이 많다
            &gt; - 많은 순서 결정이 추론 표시로 남고 캡처는 없다 (분석 기록 E1c 741행)
      - 검증은 실기기 동작에 기댄다
        - 플레이 패킷 정답지가 없다
          - 로그와 클라이언트 동작으로만 확인한다
            &gt; - 검증은 실기기 동작에 의존하고 플레이 패킷 정답지가 없다 (분석 기록 D2 651행)
- 빌드와 근거 자료
  - 빌드
    - 클라이언트는 수정한 빌드로 실행했다
      - 수정 내용은 이 지도에서 다루지 않는다
        - 빌드 차이가 검증 결과에 섞일 수 있다
          &gt; - 기기에 올린 빌드는 최근 서버 수정을 항상 담지 않는다
  - 근거 자료
    - 영상과 스크린샷은 저장소에 없다
      - 화면 증거는 번호로만 남긴다
        - 스크린샷 파일은 git이 무시하도록 적혀 있다
          &gt; - 증거 파일은 git이 무시하도록 적혀 있어 저장소에 없을 수 있다 (분석 기록 E4b 1204행)
      - 캡처에는 로그인 토큰이 들어 있다
        - 판독 결과는 본문 없이 해시와 판정만 남긴다
          &gt; - 판독 도구 출력은 본문 없이 해시, 길이, 판정만 낸다 (분석 기록 C 1017행)
- 규모
  - 기간과 커밋
    - 작업 기간은 13일이다
      - 작업일은 커밋 날짜로 센다
        - 커밋이 있던 날짜가 13일이다
          &gt; - 작업 브랜치 커밋의 날짜를 세면 13일이다 (원본 저장소 이력을 직접 집계)
    - 커밋은 230개다
      - 230은 작업 브랜치 기준이다
        - 공개된 main 기준은 101개다
          &gt; - 230은 작업 브랜치 기준이고 공개된 main 기준으로는 101개다 (분석 기록 커밋 이력 사실 12행과 facts 12행)
  - 분석 기록
    - 최상위 분석 문서는 17편이다
      - 보고서 15편과 부속 2편으로 나뉜다
        - 부분 파일까지 합하면 md 파일이 56개다
          &gt; - 최상위 md 17개 가운데 보고서는 15편이고 나머지 2편은 안내와 메모다 (분석 기록 폴더 목록 집계)
          &gt; - 부분 파일 39개를 더하면 md 파일이 56개다 (분석 기록 폴더 목록 집계)
  - 작성 방식
    - 1인 프로젝트다
      - 커밋 작성자가 한 사람이다
        - 본인 커밋이 230개 전부다
          &gt; - 작업 브랜치 230개 커밋이 전부 본인 커밋이다 (분석 기록 커밋 이력 사실 26행)

## 출발점: 남은 자료와 없는 자료
- 남아 있던 것
  - 클라이언트 앱과 리소스
    - 서버 호출 형식의 원천
      - 호출 이름과 인자 키
        - 호출 형식이 클라이언트 스크립트에 있음
          &gt; - 서버가 어떤 호출을 어떤 모양으로 기대하는지 읽어 낼 가장 큰 원천이다.
          &gt; - 호출 이름 1,334개와 인자 키가 스크립트에 있고, 서버용 데이터 표 63개가 클라이언트 표에서 나온다.
    - 데이터 표와 계산 코드
      - 능력치 계산 코드
        - 옛 환경에서 따로 실행한 값이 비교 기준
          &gt; - 클라이언트의 능력치 계산 코드를 옛 파이썬 환경에서 따로 실행해, 서버 계산과 맞춰 보는 기준으로 썼다.
          &gt; - 무작위 계정 40개(영웅 160명)와 장비 492개에서 오차 1e-9 이내로 맞았다. 서버 계산이 이 코드를 옮긴 것이라 독립 검증은 아니다.
    - 게임 데이터 규모
      - 설치 방식을 바꾼 데이터 규모
        - 앱 파일 하나에는 담기지 않음
          &gt; - 게임 데이터는 묶음 두 개 3.87GB와 패치 콘텐츠 2.2GB이고, 앱 파일 한 개의 4GB 한계와 압축 한계 때문에 이것을 한 파일로 담을 수 없었다.
          &gt; - 안드로이드 11 이후에는 다른 앱의 데이터 폴더에 쓸 수 없어, 설치는 게임 앱 자신이 맡아야 했다.
  - 2021년 HTTP 캡처와 기기 백업
    - 로그인 구간 캡처
      - 캡처 4세트
        - 로그인 구간 응답의 정답지
          &gt; - 캡처는 4세트, 512건이고 로그인 구간 응답의 정답지로 쓴다. 가이아 계정 67건, 게스트 106건, 구글 계정 141건과 198건이다.
          &gt; - 게스트 로그인 세트에서 본문이 있는 96건의 해시가 원본과 같았다. 캡처를 표준 형식으로 바꾼 뒤 판독 도구가 계산한 값을, 원본에서 직접 계산한 값과 맞춰 봤다.
    - 기기 백업
      - 백업에 든 것
        - 게임 파일 묶음
          &gt; - 보존된 게임 파일 묶음이며 서버 소스는 들어 있지 않다. 백업을 조사한 결과 서버 코드가 없었다.
          &gt; - 5월 21일에 강제 패치 콘텐츠를 이 백업에서 복원해 썼다.
- 없는 것
  - 서버 소스
    - 어떤 백업에도 없음
      - 서버 규칙을 클라이언트에서 거꾸로 세움
        - 서버 쪽 규칙은 클라이언트에서 역추적
          &gt; - 어떤 백업에도 서버 소스가 없어서 서버 쪽 규칙은 클라이언트 스크립트, 데이터 표, 캡처 응답에서 거꾸로 세웠다.
          &gt; - 이 사정이 아래 응답 문제 절의 검증 방식을 정했다.
  - 원본 DB 구조
    - 남아 있지 않음
      - 서버용 표는 클라이언트 표에서 뽑음
        - 서버가 쓰는 필드만 내보낸 표
          &gt; - 원본 서버의 DB 구조는 남아 있지 않아, 서버용 데이터 표는 서버가 쓰는 필드만 클라이언트 표에서 뽑아 만들었다.
          &gt; - 추정으로 채운 칸은 따로 표시한다.
  - 게이트와 게임 구간 캡처
    - HTTP 로그인 구간만 캡처가 있음
      - 게이트 구간에는 정답지가 없음
        - 소스와 로그로만 맞춤
          &gt; - 캡처는 HTTP 로그인 구간뿐이고, 게이트와 게임 구간의 서버 응답에는 정답지가 없다.
          &gt; - 이 구간은 클라이언트 소스와 서버 로그로만 맞추며, 로그에 나온 증상 네 가지가 서버가 답해야 할 것을 알려 줬다.
  - 서버에만 있던 밸런스 값
    - 클라이언트에 없는 값
      - 밸런스 수치와 전투 정산
        - 확인할 방법이 없음
          &gt; - 서버 전용 밸런스 수치와 전투 정산은 클라이언트 코드에 없어 클라이언트에서 확인되지 않는다.
          &gt; - 던전류 정산은 구현했지만 밸런스 값 자체는 검증 범위 밖이다.
- 원본 서버 구조 (추정)
  - 접속 흐름 추정
    - 세 단계 흐름
      - 로드 밸런서, 게이트, 게임 서버, 데이터베이스
        - 문자열과 패킷에서 끌어낸 추정
          &gt; - 클라이언트가 로드 밸런서를 거쳐 게이트 서버에 접속하고, 게이트가 게임 서버로 넘기며, 게임 서버가 DB를 쓴다.
          &gt; - 문자열과 패킷에서 끌어낸 추정이고 직접 관찰한 것은 아니다. 게이트 구간 캡처가 없어 이 구조는 검증하지 못했다.
- 자료 조건이 정한 검증 방식
  - 캡처가 있는 응답
    - 바이트 단위 대조
      - 바이트와 콘텐츠 형식까지 같게
        - 길이와 해시를 테스트로 고정
          &gt; - 캡처가 있는 응답은 바이트와 콘텐츠 형식까지 같게 돌려주고, 길이와 SHA-256을 테스트로 고정한다.
          &gt; - 출발점은 5월 21일 업데이트 확인 응답이다. 호스트를 IP로 바꿨더니 클라이언트가 업데이트 확인에서 멈췄다.
  - 캡처가 없는 구간
    - 소스에서 세운 추론
      - 둘로 확인되지 않은 값
        - 코드 주석에 추론으로 표시
          &gt; - 캡처가 없는 게이트 구간은 복원한 클라이언트 소스에서 값을 세우고, 둘로 확인되지 않은 값은 코드 주석에 추론으로 표시한다.
          &gt; - 추론 표시는 응답을 바꿀 때 근거 형식과 함께 쓴다.
## 작업 흐름: 날짜별 결과
- 커밋이 있는 날
  - 날짜 분포
    - 10월 12일부터 14일
      - 세 날에 몰림
        - 전체의 절반 이상
          &gt; - 작업 브랜치 커밋 230개 중 10월 12~14일에 127개가 쌓였다(55%).
          &gt; - 커밋이 있는 날은 13일이다.
- 5월 21~23일
  &gt; - REA 없이 이뤄진 구간이다. 로그인 화면 도달, 서버 골격, 서버 목록, 핸드셰이크, 도시 진입, 로그 기반을 세웠다.
  - 5월 21일
    - 실기기 첫 도달
      - 로그인 화면과 게스트 인증
        - 게스트 인증까지 실기기에서 통과
          &gt; - 실기기에서 로그인 화면에 도달하고, 게스트 인증이 응답 코드 0으로 끝까지 통과했다. 확인은 실기기 화면과 서버 로그로 했다.
          &gt; - 같은 날 도메인 응답 경로를 바꿔 네이티브 쪽 도메인까지 덮었다.
    - 막힘: 업데이트 확인에서 멈춤
      - 호스트를 IP로 바꾼 것이 원인
        - 원본 호스트로 되돌려 해결
          &gt; - 업데이트 확인 응답의 호스트를 IP로 바꿨더니 실기기 클라이언트가 업데이트 확인에서 멈췄다. 이 일이 캡처 원본 우선 원칙의 출발점이다.
          &gt; - 같은 날 강제 패치 콘텐츠를 2021 백업에서 복원했다.
  - 5월 22일
    - 게이트 골격과 핸드셰이크
      - 실기기 게이트 통합 검증
        - 로그인 실패의 진짜 원인
          &gt; - 로그인 실패의 원인은 서버 목록 응답이 13바이트 스텁이었던 것이다. 게이트 미구현 가설은 전 포트 캡처에서 모든 연결이 TLS였고 게이트 접속이 없어 반증됐다.
          &gt; - 핸드셰이크 구현은 로컬 TCP 통합 테스트와 함께 들어갔다.
    - 서버 목록과 라우팅
      - 서버 목록 라우터를 테스트로 먼저 만듦
        - 실기기에서 서버 선택 화면 도달
          &gt; - 서버 목록 라우터를 테스트 9개와 함께 만들어 전체 136 통과를 확인했다.
          &gt; - 실기기에서 서버 선택 화면에 도달했고, 같은 날 중계 설정을 raw TCP 경로로 고쳤다.
    - 스크립트 묶음 해석
      - 스크립트 묶음 전량을 읽을 수 있게 됨
        - 해석 범위 확인
          &gt; - 스크립트 파일 40,317개를 전량 읽을 수 있게 됐다.
          &gt; - 같은 날 서버 목록 라우터 작업과 나란히 진행했다.
    - 도시 진입까지 블로커
      - 게이트 접속의 블로커 다섯 개
        - 배포, 로그 확인, 수정을 반복
          &gt; - 배포, 실기기 로그 확인, 수정을 반복해 게이트 접속의 블로커 다섯 개를 차례로 풀었다. 압축 방식, 식별자 길이, 데이터 파일 크기 변화에 대한 다운로더 반응이 포함된다.
          &gt; - 도시 메인 화면 도달은 스크린샷의 검은색이 아닌 비율 96%로 판정했고, 같은 시점 테스트는 188 통과와 2 건너뜀이었다.
          &gt; - 첫 도시 진입은 REA 없이 이뤄졌다. REA는 10월 12일에 들어왔다.
    - 도시 진입 뒤 미등록 호출
      - 이름 없는 호출 다섯 개
        - 해시 값으로 등록
          &gt; - 도시 진입 뒤 이름이 없는 호출 다섯 개가 해시 값으로 찍혀 등록했다.
          &gt; - 가구 데이터의 필드 누락도 같은 날 고쳤다.
  - 5월 23일
    - 해시 이름 역산
      - 스크립트 이름표에서 정식 이름
        - 정식 이름을 찾아 등록
          &gt; - 스크립트의 이름표를 거꾸로 읽어, 해시로만 적혀 있던 호출들의 정식 이름을 찾았다.
          &gt; - 5월 22일 해시 등록의 후속 작업이다.
- 10월 12일
  &gt; - 커밋이 24개 쌓인 날이다. REA 도입과 기준선 복구가 이 날 일어났다.
  - 기준선 측정
    - 문서와 실제의 어긋남
      - 응답과 호스트 설정이 원본과 다름
        - 측정한 상태를 복구의 출발점으로 씀
          &gt; - 문서가 완료라고 적은 상태를 실제 환경에서 다시 쟀더니, 응답 원본과 호스트 설정이 2021 캡처와 달라 여러 항목이 어긋나 있었다.
          &gt; - 이 측정 결과가 같은 날 응답 복구 작업의 출발 상태가 됐다.
  - REA 도입
    - 도입 위치
      - 전체 기록의 92번째 커밋
        - 도입 이후가 REA 사용 구간
          &gt; - REA 도입 커밋은 전체 92번째 커밋이다. 그 앞 91개 커밋과 5월 구간에는 REA가 없었다.
          &gt; - 사용자가 실제 설치와 연동을 지시해 드라이런 대신 설정 적용을 실제로 했다.
    - 막힘: REA 반영 부족
      - 사용자 지적
        - 계획을 고쳐 다시 씀
          &gt; - 사용자가 REA 반영이 부족했다고 지적했고, 작업 일지는 그 지적과 계획 보정을 정정 기록으로 남겼다.
          &gt; - 계획은 에뮬레이터 기준으로 다시 썼다.
  - 응답 원본화
    - 정적 응답 맞춤
      - 2차 원본화
        - 캡처와 바이트 단위로 일치
          &gt; - 정적 HTTP 응답 18개 파일을 2021 캡처와 바이트 단위로 맞췄다.
          &gt; - 서버 응답을 2021 캡처 원본으로 되돌리면서 게이트 주소를 설정 값으로 뺐다.
    - 확인 방법
      - 응답 바이트 대조 도구
        - 근거에 증거 번호를 붙임
          &gt; - 캡처와 응답의 SHA-256을 비교하는 대조 도구로 확인했다.
          &gt; - 이날부터 응답을 바꾸는 근거에는 REA 증거 번호와 해시를 함께 적는다.
  - 막힘: 공지 창과 자동 진입
    - 공지 창이 빔
      - 기호 하나가 빈 창을 만듦
        - 대체 안내문으로 해결
          &gt; - 공지 문구의 대괄호 문자가 공지 창을 비웠다. 같은 날 게임 서식의 대체 안내문을 쓰도록 고쳤다 (근거: 커밋 기록).
    - 자동 진입 스크립트가 멈춤
      - 로딩 화면에서 끝남
        - 같은 날 수정
          &gt; - 에뮬레이터 자동 도시 진입 스크립트가 로딩 화면에서 끝나던 문제를 같은 날 고쳤다. 변경은 파일 한 개였다 (근거: 커밋 기록).
  - 스크립트 소스 복원
    - 복원 결과
      - 복원 개수와 부분 실패
        - 복원 수치와 부분 실패 수치
          &gt; - 게임 스크립트 13,462개를 소스로 복원했고, 부분 실패는 5개다.
          &gt; - 복원이 틀리면 그 위 서버 규칙이 모두 어긋나므로, 복원 결과를 따로 검증하는 도구를 붙였다.
- 10월 13일
  &gt; - 커밋이 52개 쌓여 이 지도에서 가장 많은 날이다.
  - 프롤로그
    - 처음부터 끝까지
      - 새 계정으로 도시까지
        - 도시 메인 화면 도달
          &gt; - 새 게스트 계정으로 로그인해 프롤로그, 튜토리얼 전투, 이름 입력을 거쳐 도시 메인 화면에 이르렀다.
          &gt; - 확인은 증거 스크린샷 14장과 서버 테스트 288 통과, 2 건너뜀이다. 같은 계정으로 재접속하면 이어진다.
  - 계정 기준 로그인
    - 로그인 방식 변경
      - 로그인 키를 계정 기준으로
        - 원본 로그인 동작에 맞춤
          &gt; - 로그인 방식을 계정 기준으로 고치고 원본 로그인 동작에 맞췄다 (근거: 프롤로그 기록).
          &gt; - 프롤로그 커밋 바로 뒤에 들어간 변경이다 (근거: 커밋 기록 순서).
  - 신기사 메뉴
    - 계정별 진행 상태
      - 상태를 계정 단위로 저장
        - 목록과 상세가 스냅샷만 읽음
          &gt; - 목록과 상세 화면은 서버를 부르지 않고 스냅샷만 읽는다는 클라이언트 계약을 조사로 먼저 확정했다.
          &gt; - 운영자 도구로 캐릭터 117명을 지급해 목록 스크롤과 상세 화면을 확인했고, 스크린샷 52장을 남겼다.
    - 열린 것
      - 서버가 없는 버튼
        - 누르면 잠길 수 있음
          &gt; - 상세 화면의 일부 버튼은 서버가 없어 누르면 잠길 수 있다.
          &gt; - 초기 등급과 성급은 표의 초기값을 쓴 추론이다.
  - 도시 7일 반복과 엔딩
    - 회차 진행

      - 클라이언트 표와 서버 시각의 조합
        - 서버 시계만 바꿔 복원
          &gt; - 소환과 이벤트가 열리는지는 클라이언트 표와 서버 시각의 조합이어서, 서버 시계를 서비스 말기 구간의 되풀이로 바꾸는 것만으로 복원했고 클라이언트는 건드리지 않았다.
          &gt; - 한정 소환 배너 88개와 이벤트 활동 40개(36종)를 열었다.

          &gt; - 이벤트 활동 전부의 기능 검증을 목표로 했으나, 사용자가 시간이 많이 지났다며 멈춰 목표는 끝나지 않았다.
          &gt; - 화면 확인은 종류마다 한 바퀴였고 모든 분기를 누르지 않았다. 활동 40개를 묶은 약 33묶음 가운데 약 28묶음은 화면으로 보지 못했다.

        - 신청 순서대로 싣도록 수정
          &gt; - 전투 장면이 프레임마다 오류를 내던 것은 원본 전투 서버가 싣던 순서 값을 우리가 빠뜨렸기 때문이었다.

          &gt; - 이벤트 조건 값을 서버가 몰라 소식과 쪽지가 오지 않던 것도 사실이었다.

## 응답 문제: 정답지 순서와 확인 수단
- 원칙과 정답지 순서
  - 정답지 세 단계
    - 1순위: 2021 패킷 캡처
      - 바이트 단위로 맞추는 응답
        - 캡처가 있는 응답
          &gt; - **기준**: 바이트와 Content-Type까지 같게 돌려준다. 캡처가 없는 응답에는 이 기준을 적용하지 않는다.
          &gt; - **출처**: 2021년 7월 13일 기록의 Burp 캡처이며 로그인 구간 응답의 정답지다 (분석 기록 A, 366행).
        - 원칙이 생긴 사건
          &gt; - **사건**: 5월 실기기에서 업데이트 확인 응답의 호스트를 IP로 바꾸자 클라이언트가 업데이트 확인에서 멈췄다 (분석 기록 A, 1387행).
          &gt; - **원인**: 클라이언트가 CDN 호스트명으로 확인 요청을 보내지 못하고 폴백 경로로 빠졌으며, 그 경로에 서버가 405를 돌려줬다 (분석 기록 A, 1496행).
        - 결정: 호스트명 유지
          &gt; - **결정**: 호스트명은 바꾸지 않고 디바이스 DNS가 복원 서버로 응답하게 한다 (분석 기록 A, 801행).
    - 2순위: 복원한 클라이언트 소스와 데이터 표
      - 캡처가 없는 응답의 근거
        - 소스가 쓰이는 곳
          &gt; - **범위**: 캡처가 없는 응답은 복원한 클라이언트 소스와 데이터 표가 근거가 된다.
      - 확인되지 않은 값의 표시
        - 코드 주석 구분
          &gt; - **구분**: 캡처와 소스 어느 쪽으로도 확인되지 않은 값은 코드 주석에 추론이나 복원 서버의 결정으로 구분해 적는다.
    - 3순위: 추론과 서버의 결정
      - 추론 값의 위치
        - 근거가 없는 값
          &gt; - **범위**: 두 근거로 확인되지 않는 값은 추론이거나 복원 서버가 정한 값이다. 어느 쪽인지 주석에 적는다.
      - HTTP 구간과 게이트 구간
        - 근거 조합
          &gt; - **규칙**: HTTP 구간은 캡처와 소스를 함께 쓰고, 게이트 구간은 정답지가 없어 소스만 근거로 한다.
  - 캡처가 없는 게이트 구간
    - 정답지 대신 쓰는 것: 서버 로그의 증상
      - 네 가지 증상
        - 상태 전이 경고
          &gt; - **증상**: 게이트 구간에서 상태 전이 경고가 로그에 남았다. 원인과 고침은 막혔던 일 항목에 있다.
        - 약 16초 뒤 재접속
          &gt; - **증상**: 접속 뒤 약 16초가 지나면 클라이언트가 다시 접속한다. 증상과 원인은 막혔던 일 항목에 있다.
        - 약 30초 뒤 로그아웃
          &gt; - **증상**: 접속 뒤 약 30초가 지나면 로그아웃이 일어난다. 증상과 원인은 막혔던 일 항목에 있다.
        - 약 15초 뒤 접속 끊김
          &gt; - **증상**: 상태 전환 뒤 약 15초가 지나면 접속이 끊긴다. 증상과 원인은 막혔던 일 항목에 있다.
- 확인 수단과 한계
  - 캡처 재생 대조
    - 판정 기준
      - 판정 세 가지
        - 같음
          &gt; - **정의**: 상태 코드와 본문 바이트가 모두 캡처와 같다 (분석 기록 A, 1502행).
        - 다름
          &gt; - **정의**: 상태 코드는 같고 본문이 다르다. 요청마다 달라지는 토큰이나 시각 때문에 정상일 수 있어 사람이 판단한다 (분석 기록 A, 1502행).
        - 상태 차이
          &gt; - **정의**: 상태 코드가 캡처와 다르다 (분석 기록 A, 1502행).
      - 묶음 규칙
        - 묶음 단위
          &gt; - **단위**: 호스트, 메서드, 경로가 같은 요청을 한 묶음으로 센다. 판정 수는 요청 건수가 아니라 묶음 수다 (분석 기록 E4a, 207행; 도구 로직은 분석 기록 A, 1502행).
        - 묶음 판정
          &gt; - **규칙**: 묶음 안 요청 하나라도 다르면 묶음 판정은 다름이나 상태 차이가 된다. 판정 로직은 첫 비일치 판정을 대표로 고른다 (도구 로직, 분석 기록 A, 1502행).
    - 대상 범위
      - 캡처 4세트
        - 세트별 건수
          &gt; - **세트**: 가이아 계정 67건, 게스트 로그인 106건, 구글 계정 141건과 198건, 합계 512건이다 (분석 기록 A, 1044행).
      - 재생 방식
        - 서버 재생
          &gt; - **방식**: 캡처의 게임 도메인 요청을 복원 서버에 재생하고 상태 코드와 본문 해시를 캡처 원본과 비교한다. 본문은 출력하지 않는다 (분석 기록 A, 1502행).
    - 결과 수치
      - 세트별 분포
        - 게스트 로그인 세트
          &gt; - **분포**: 17묶음 중 같음 12, 일부 일치 1, 다름 3, 상태 차이 1이다 (분석 기록 E4a, 207행).
        - 가이아 로그인 세트
          &gt; - **분포**: 21묶음 중 같음 16, 일부 일치 1, 다름 3, 상태 차이 1이다 (분석 기록 E4a, 207행).
        - 구글 계정 세트 두 개
          &gt; - **분포**: 각 21묶음 중 같음 15, 일부 일치 1, 다름 4, 상태 차이 1이다 (분석 기록 E4a, 207행).
      - 합계 검산
        - 세트별 합계
          &gt; - **검산**: 세트별 합계가 17, 21, 21, 21로 묶음 수와 맞는다 (분석 기록 E4a, 207행).
    - 한계
      - 독립 검증이 아님
        - 구현 확인의 성격
          &gt; - **이유**: 서버가 캡처 응답을 그대로 돌려주도록 만들었으므로 같음은 독립 검증이 아니라 구현이 의도대로 됐는지의 확인이다.
      - 남은 다름의 원인
        - 요청마다 달라지는 응답
          &gt; - **원인**: 로그인 토큰, 접수 번호, 호출자 주소처럼 요청마다 달라지는 응답이다 (분석 기록 E4a, 207행).
        - 순서가 흔들리는 응답
          &gt; - **원인**: 캡처 안에서도 순서가 흔들리는 응답 두 개가 있고, 기록에는 각각 6건과 2건으로 적혀 있다 (분석 기록 E4a, 207행).
      - 판정 정의의 미확인
        - 일부 일치
          &gt; - **미확인**: 일부 일치의 정의는 기록에 없다. 대조 도구가 내는 판정은 같음, 다름, 상태 차이 세 가지다 (분석 기록 A, 1502행).
      - 상태 차이 한 묶음
        - 이름에 공백이 있는 요청
          &gt; - **사례**: 이름에 공백이 있는 요청이 캡처에서 잘려 서버가 없는 파일로 보고 404를 돌려준다 (분석 기록 E4a, 197행).
      - 캡처와 다른 응답의 후속 과제
        - 남은 응답 종류
          &gt; - **후속 과제**: 2026년 10월 12일 기준으로 캡처와 다른 응답이 8종 남았고, 진행에는 지장이 없었다 (분석 기록 A, 1094행).
  - 길이와 해시 고정
    - 판정 기준
      - 고정 방식
        - 기대값 고정
          &gt; - **방식**: 정적 응답의 길이와 SHA-256을 테스트 기대값으로 박아 두고, 값이 바뀌면 테스트가 실패한다 (분석 기록 A, 1501행).
        - 되돌림 뒤 고정
          &gt; - **계기**: 10월 12일 응답을 캡처 원본으로 되돌린 뒤 길이와 SHA-256 테스트로 고정했다 (분석 기록 메모 모음, 128행).
    - 대상 범위
      - 정적 응답
        - 대표 예
          &gt; - **예**: 업데이트 목록 본문 856바이트와 SHA-256이 테스트 기대값이다 (분석 기록 A, 1501행).
      - 기대값의 출처
        - 캡처 값
          &gt; - **출처**: 기대값은 캡처 원본에서 온다. 캡처가 없는 응답에는 이 고정 방식을 쓰지 않는다 (분석 기록 A, 1501행).
    - 결과 수치
      - 테스트 위치
        - 기대값이 든 시험
          &gt; - **위치**: 업데이트 서버 시험의 135~148행과 307~318행, 로그인 시험의 27~28행에 기대값이 있다 (분석 기록 A, 1501행).
      - 재실행 결과
        - 바이트 대조 실패
          &gt; - **결과**: 2026년 10월 25일 재실행에서 CRLF로 저장된 정적 응답의 바이트 대조 2건이 실패했다 (재실행 로그의 FAILED 줄).
    - 한계
      - 줄바꿈 의존
        - CRLF 체크아웃
          &gt; - **한계**: 바이트 대조는 체크아웃의 줄바꿈 방식에 영향을 받는다. Windows의 CRLF 체크아웃에서 이 2건이 깨졌다 (재실행 로그의 FAILED 줄).
  - 변환기 정합성
    - 판정 기준
      - 변환 규칙
        - 바이트 보존
          &gt; - **규칙**: 요청 본문과 응답 본문의 원본 바이트를 base64로 보존하고, 기록에 없는 값은 지어내지 않는다 (분석 기록 A, 610행).
        - 없는 값의 표기
          &gt; - **규칙**: 캡처가 시간을 기록하지 않으면 시간 값은 -1 또는 0으로, 응답이 없는 항목은 상태 0과 표시로 남긴다 (분석 기록 A, 610행).
      - 안전장치
        - 덮어쓰기 거부
          &gt; - **동작**: 출력 파일이 이미 있으면 덮어쓰기 옵션 없이는 종료 코드 2로 거부한다 (분석 기록 A, 628행).
    - 대상 범위
      - 캡처 4세트
        - 제외 대상
          &gt; - **제외**: 구글, 페이스북, Nox 등 제3자 요청은 대조에서 뺀다 (분석 기록 A, 1046행).
      - 와이어 범위
        - 캡처 불가 구간
          &gt; - **범위**: Burp는 HTTP(S) 터널만 가로채므로 게이트 TCP와 게임 서버 KCP/UDP 통신은 캡처에 없다 (분석 기록 D1, 756행).
    - 결과 수치
      - 변환 시험
        - 시험 9개
          &gt; - **수치**: 시험 9개이며 합성 케이스 8개와 실제 캡처 106건의 무손실 비교로 구성된다 (분석 기록 A, 646행).
      - 판독 정합성
        - 스키마 검증
          &gt; - **수치**: 512건 모두 HAR 1.2 스키마 검증을 통과했고, 판독은 세션당 1.7~2.2초였다 (분석 기록 D2, 1366행).
        - 본문 해시
          &gt; - **수치**: 게스트 세트의 응답 본문 96건 전부에서 판독 도구가 보고한 SHA-256이 원본에서 직접 계산한 값과 같았다 (분석 기록 A, 1044행).
      - 묶음 대조
        - 묶음 수
          &gt; - **수치**: 512건이 호스트 30개, 묶음 44개로 정리됐다 (분석 기록 A, 1046행).
        - 경로 대조
          &gt; - **수치**: 게임 관련 22묶음은 모두 초기 API 문서에 경로가 있었고, 8묶음은 서버 코드에 경로 문자열이 없다 (분석 기록 A, 1046행).
    - 한계
      - 캡처 의존 시험
        - 건너뛰는 조건
          &gt; - **한계**: 실제 캡처 시험은 캡처 파일이 없으면 건너뛰고, 캡처 파일은 저장소 밖이라 다른 클론에서는 돌지 않는다 (분석 기록 A, 662행).
      - 판독 검증의 성격
        - 시험과 구분
          &gt; - **구분**: 본문 해시 96건은 변환기 시험이 아니라 판독 단계의 별도 검증이다 (분석 기록 A, 662행).
      - 경로 대조의 한계
        - 미구현 판정 아님
          &gt; - **한계**: 경로 문자열 대조일 뿐 미구현 판정이 아니다. 와일드카드 경로라면 문자열이 없어도 처리될 수 있다 (분석 기록 A, 1046행).
  - 능력치 대조
    - 판정 기준
      - 정답 생성
        - 실행 환경
          &gt; - **방식**: 복원한 클라이언트의 계산 코드를 Python 2.7 환경에서 실행해 정답 값을 만들고, 서버 계산과 비교한다 (분석 기록 E3, 253행).
      - 허용 오차
        - 상대 오차
          &gt; - **기준**: 케이스마다 전투 능력치, 점수, 스킬, 특기, 전용 정보가 상대 오차 1e-9 안에서 맞아야 통과한다 (분석 기록 E3, 253행).
    - 대상 범위
      - 케이스 구성
        - 계정과 영웅
          &gt; - **규모**: 무작위 계정 상태 40개에 영웅 4명씩, 160건이다 (분석 기록 E1b, 1491행).
        - 장비
          &gt; - **규모**: 장착 보구 492개다 (분석 기록 E1b, 1491행).
    - 결과 수치
      - 보고된 차이
        - 차이 0
          &gt; - **결과**: 보고된 차이는 0이다. 이 기록은 보고값을 인용한 것이고 이 분석에서 다시 돌리지 않았다 (분석 기록 E1b, 2959행).
    - 한계
      - 독립 검증이 아님
        - 같은 코드를 옮긴 결과
          &gt; - **한계**: 서버 계산이 같은 코드를 옮긴 것이라 독립 검증이 아니고, 옮기는 과정의 실수를 잡는 용도다.
  - 스텁 대조
    - 판정 기준
      - 서버에서 클라이언트로 보내는 호출
        - 송신 전 검사
          &gt; - **규칙**: 서버가 클라이언트로 보내는 모든 호출은 보내기 전에 클라이언트 스텁 선언과 대조하고, 키 누락, 타입 불일치, 스텁에 없는 키를 기록한다 (분석 기록 E1c, 46행).
      - 시험에서 강제
        - 가짜 클라이언트
          &gt; - **강제**: 시험용 가짜 클라이언트는 송신마다 검사 결과가 비어 있어야 한다고 단언한다 (분석 기록 E3, 88행).
    - 대상 범위
      - 가짜 클라이언트 사용처
        - 시험 파일 수
          &gt; - **범위**: 105개 시험 파일이 이 가짜 클라이언트를 가져다 쓴다 (분석 기록 E3, 80행).
      - 호출 목록
        - 클라이언트 호출 이름
          &gt; - **규모**: 클라이언트 스크립트에서 서버 호출 1,334개를 이름과 인자 키로 뽑았다 (분석 기록 E1c, 741행).
    - 결과 수치
      - 실제 사례
        - 서버 목록 응답
          &gt; - **사례**: 로그인이 막힌 원인은 서버 목록 응답이 13바이트 스텁이었던 것이다 (분석 기록 A, 1422행).
      - 스텁 응답의 기록
        - 캡처에 없는 경로
          &gt; - **규칙**: 캡처에 없는 경로는 스텁으로 답하고 경고를 남겨 다음 원본화 대상을 로그에서 찾는다 (분석 기록 E4a, 201행).
    - 한계
      - 스텁 원문 노출
        - 약관과 공지
          &gt; - **한계**: 약관과 공지는 스텁이어서 응답 원문이 화면에 그대로 보인다 (분석 기록 A, 1094행).
      - 스텁으로 진행
        - 금칙어 규칙
          &gt; - **한계**: 금칙어 규칙 파일은 원본이 없고 스텁으로도 도시까지 진행했다. 진행했다는 사실이 원본과 같다는 뜻은 아니다 (분석 기록 E4a, 201행).
  - 엔진 한 회차 테스트
    - 판정 기준
      - 시험 방식
        - 요청 계층 우회
          &gt; - **방식**: 요청 전달 계층을 거치지 않고 이벤트 엔진과 세계 모듈만으로 클라이언트의 조작 순서를 흉내 낸다 (분석 기록 E3, 139행).
      - 통과 조건
        - 7일 완주와 엔딩
          &gt; - **조건**: 7일이 끝까지 이어지고, 마지막 날 버튼이 엔딩 이벤트로 이어지며, 고른 이야기에 따라 다음 회차 엔딩이 달라진다 (분석 기록 E3, 139행).
    - 대상 범위
      - 이벤트 조건
        - 조건과 선택지 해석
          &gt; - **대상**: 이벤트 7,603개의 조건과 선택지 해석이 맞는지 본다 (학습 기록 LRN-20261013-015).
    - 결과 수치
      - 실행 시간
        - 한 회차
          &gt; - **수치**: 한 회차가 1초 안에 끝난다 (분석 기록 E5, 1849행).
      - 발견 사례
        - 배타 규칙 오류
          &gt; - **발견**: 배타 규칙 오류를 이 봇으로 찾았다. 엔딩에 닿지 못하면 어느 조건이 막았는지 그 자리에서 보인다 (학습 기록 LRN-20261013-015).
    - 한계
      - 화면 검증과 분리
        - 에뮬레이터 역할
          &gt; - **한계**: 봇은 화면과 요청 형식을 보지 않는다. 화면은 에뮬레이터에서 따로 확인한다 (분석 기록 E5, 328행).
      - 반복 한도
        - 무한 반복 방지
          &gt; - **주의**: 선택 규칙이 단순하면 같은 선택을 무한히 반복하므로 반복 한도를 둔다 (학습 기록 LRN-20261013-015).
      - 적용 조건
        - 루트 추가
          &gt; - **적용**: 다른 이야기 루트를 열 때마다 봇 시험을 하나씩 더한다 (학습 기록 LRN-20261013-015).
  - 기기 확인 방식
    - 판정 기준
      - 성공 판정
        - 상태 전이
          &gt; - **판정**: 서버 로그와 클라이언트 엔진 로그의 상태 전이로 성공을 판정한다.
    - 대상 범위
      - 기기 조작
        - PC에서 조작
          &gt; - **방식**: PC에서 기기를 조작하는 도구로 화면을 다루며, 에뮬레이터, 휴대폰, 태블릿에서 확인했다.
    - 결과 수치
      - 증거 번호
        - 화면 증거
          &gt; - **기록**: 화면 증거에는 번호를 남기고 스크린샷 파일은 저장소에 올리지 않았다.
        - 인용 방식
          &gt; - **기록**: 로그인 토큰이 든 REA 결과와 변환 HAR은 저장소에 두지 않고, 인용은 증거 번호와 건수로만 한다 (분석 기록 A, 1168행).
    - 한계
      - 재검증 조건
        - 원본 로그 필요
          &gt; - **한계**: 원본 증거를 공개할 수 없어 독자가 재검증하려면 원본 패킷 로그가 필요하다 (분석 기록 D1, 526행).
  - 테스트 규모와 재실행
    - 2026년 10월 25일 재실행
      - 결과
        - 집계
          &gt; - **수치**: Windows 체크아웃(줄바꿈 CRLF) 기준으로 4,003개 통과, 5개 실패, 2개 오류, 3개 건너뜀, 90.28초였다 (재실행 로그 마지막 줄).
        - 실패 5개
          &gt; - **원인**: 기기 구성 소켓 테스트 3개와 CRLF로 저장된 정적 응답의 바이트 대조 2개다 (재실행 로그의 FAILED 줄).
        - 오류 2개
          &gt; - **원인**: Windows 환경변수 길이 한도(32,767자)를 넘는 매개변수 때문이다 (재실행 로그의 ERROR 줄).
      - 범위
        - 운영 환경 미실행
          &gt; - **범위**: 운영 환경인 Ubuntu에서는 다시 돌리지 않았다.
    - 테스트 수
      - 함수 수와 통과 수
        - 정적 집계
          &gt; - **수치**: 정적 집계로 시험 함수는 195개다 (분석 기록 B, 20행). 통과 수가 함수 수보다 큰 것은 매개변수화한 시험이 사례마다 한 건으로 세어지기 때문으로 보인다.

## 연결 문제: 클라이언트를 복원 서버에 붙이기
- 접속 경로 1: 이름 풀이와 입구 분기
  - 게임 도메인을 복원 서버로 돌린다
    - 이름 풀이를 바꾼다
      - 응답 속 주소는 건드리지 않는다
        - 실기기에서 생긴 일
          &gt; - 업데이트 확인 응답의 호스트를 숫자 주소로 바꾸자 클라이언트가 예비 경로로 빠졌다.
          &gt; - 예비 경로에서 복원 서버가 허용하지 않는 방법 응답을 내어 업데이트 확인이 멈췄다.
          &gt; - 원칙: 주소는 이름 풀이에서 바꾸고, 응답 본문은 원본 그대로 둔다.
    - 응답은 캡처 원본을 따른다
      - 캡처가 있는 응답
        - 바이트 단위 일치
          &gt; - 캡처가 있는 응답은 바이트와 Content-Type까지 원본과 같게 돌려준다.
          &gt; - 길이와 해시를 시험으로 고정했고, 캡처와 다른 응답은 후속 과제로 남겼다.
  - HTTPS 접속의 서버명 유무로 두 갈래
    - 서버명이 있는 연결
      - HTTP 서비스로 보낸다
        - 요청 줄의 주소 형식
          &gt; - 게임 스크립트 쪽 HTTP는 요청 줄에 주소 전체를 적어 보낸다(HTTP가 허용하는 형식).
          &gt; - 기기에는 중계가 없어서, 복원 서버가 요청 줄의 주소 부분을 떼어 내고 경로만 본다.
    - 서버명이 없는 연결
      - 게이트 서버로 보낸다
        - 게이트는 TLS가 아닌 평문 프레임
          &gt; - 게이트 연결은 TLS 없이 길이 접두 프레임을 바로 보낸다.
          &gt; - 잘못 보내면 TLS 핸드셰이크 오류나 프레임 길이 오류로 보인다(추정이며 재현하지 않았다).
- 접속 경로 2: 중계 뒤의 실제 기기 주소
  - 중계 뒤에서는 모든 접속이 같은 주소로 보인다
    - 중계가 접속 앞줄에 기기 주소를 붙인다
      - 주소 줄의 구조
        - 접속 맨 앞의 한 줄
          &gt; - 담는 값: 클라이언트 주소, 서버 주소, 각 포트.
          &gt; - 한 줄의 최대 길이는 규격이 정한 107바이트다.
  - 주소 줄을 해석하고 오류를 처리한다
    - 줄이 다 오지 않은 경우
      - 기다렸다가 다시 본다
        - 버퍼에 모아 두는 방식
          &gt; - 줄이 아직 다 안 왔으면 빈 값을 돌려주고 받은 바이트를 모아 둔다.
          &gt; - 줄이 깨졌으면 오류로 보고 그 접속을 끊는다.
    - 게이트에서 주소 줄을 구분하는 법
      - 프레임 길이와 겹치지 않게 한다
        - 첫 바이트 규칙
          &gt; - 프레임은 4바이트 길이로 시작하므로, 주소 줄의 머리글자와 겹치지 않는다.
          &gt; - 주소 줄이 없는 접속(기기 안 서버에 직접 붙는 경우)도 그대로 받는다.
  - 배포 순서가 틀리면 연결이 끊긴다
    - 서버 코드를 먼저 올린다
      - 중계 설정은 나중에 바꾼다
        - 순서가 바뀔 때의 증상
          &gt; - 중계 설정을 먼저 바꾸면 게이트가 주소 줄을 프레임 길이로 읽어 연결을 끊는다.
          &gt; - 이 순서는 배포 문서에 명시되어 있다.
- 접속 경로 3: 부팅 요청 재현
  - 앱이 보내는 부팅 요청
    - 부팅 22단계
      - 단계 순서
        - 순서와 역할
          &gt; - 설정 조회, 업데이트 목록과 패치 목록, 계정 초기화와 빠른 로그인, 결제, 텔레메트리 순으로 요청하고, 이후 게이트 주소를 받아 게이트에 접속한다.
          &gt; - 22단계 가운데 한 곳이라도 서버 오류(5xx)를 내면 클라이언트가 들어오지 못한다.
    - 시험에서 빼는 단계
      - 건너뛰는 두 단계
        - 건너뛰는 이유
          &gt; - 개별 패치 파일 내려받기 단계는 패치 바이너리를 보관하지 않아 뺐고, 동일 버전이면 요청하지 않는다.
          &gt; - 게이트 단계는 실기기가 필요해 표시로 뺐고, 게이트는 별도 시험 파일이 맡는다.
    - 알 수 없는 경로의 응답
      - 마지막 라우터의 역할
        - 성공 응답으로 받는다
          &gt; - 텔레메트리 라우터를 마지막에 등록해 어떤 경로도 성공 응답으로 받게 했다.
          &gt; - 대가: 오타나 새 경로도 성공으로 숨으므로, 스텁 로그를 봐야 무엇이 비어 있는지 안다.
- 접속 경로 4: 로그인 서명
  - 서명 계산과 비교
    - 검사 방식
      - 계산 방법
        - 정렬과 해시
          &gt; - 키를 정렬해 값을 이어 붙인 뒤 해시한 값을 요청의 서명과 비교한다.
          &gt; - 빈 값과 서명 키 자체는 계산에서 뺀다.
    - 결과의 쓰임
      - 결과와 무관하게 통과
        - 로그에만 남김
          &gt; - 서명을 계산해 비교하지만 결과와 무관하게 요청을 통과시킨다.
          &gt; - 검증 결과는 로그에만 남는다.
  - 서명 결과를 무시하는 호출
    - 네 호출
      - 무시하는 자리
        - 호출 목록
          &gt; - 설정 조회, 앱 초기화, 빠른 로그인, 계정 로그인 네 호출이 검증 반환값을 쓰지 않는다.
  - 실효성 한계
    - 서명이 걸러내지 못한다
      - 한계의 내용
        - 실효성
          &gt; - 서명은 실효성 한계로 남긴다. 서명이 맞지 않아도 요청이 통과하므로 서명으로 요청을 걸러내지 못한다.
          &gt; - 서명 동작 시험은 맞는 서명을 참으로, 틀린 서명과 누락을 거짓으로 돌려주는지 확인한다.
- 게이트 서버: 프레이밍과 접속 안정화
  - 프레임과 압축
    - 길이 접두 프레임
      - 프레임 구조
        - 머리와 본문
          &gt; - 4바이트 길이, 2바이트 호출 번호, 뒤에 프로토콜 버퍼 본문이 온다.
          &gt; - 아바타 스냅샷만 압축과 msgpack을 쓰고, 나머지 엔티티는 BSON이다.
    - 핸드셰이크 뒤 압축
      - 압축을 켜는 시점
        - 응답 직후
          &gt; - 연결 응답을 보낸 직후 스트리밍 압축을 켠다.
          &gt; - 연결마다 압축기 한 쌍을 두고, 메시지마다 동기 플러시한다.
          &gt; - 실기기에서 계정 엔티티를 압축해 보내자 BSON 크기 오류가 났다.
  - 접속 안정화
    - 예외 격리
      - 접속 단위로 가둔다
        - 예외가 났을 때
          &gt; - 접속 단위 예외는 그 접속만 닫고 원인을 로그에 남긴다.
          &gt; - 호출 처리 중 예외는 접속을 유지하고, 결과를 기다리는 콜백은 빈 결과로 풀어 화면이 잠기지 않게 한다.
          &gt; - 처리 도중 실패해도 그 시점까지 바뀐 진행은 저장한다.
    - 중복 로그인
      - 같은 계정이 다시 붙을 때
        - 기존 접속을 닫는다
          &gt; - 나중 로그인이 이긴다. 먼저 붙은 접속을 닫는다.
          &gt; - 이유: 한 계정의 진행 상태 객체를 두 접속이 같이 쓰면 진행이 뒤섞인다.
          &gt; - 원본 서버의 처리 근거는 없어서 복원 서버의 결정으로 표시한다.
    - 로그인 토큰 검사
      - 검사 순서
        - 네 단계 확인
          &gt; - 요청의 계정 식별자와 토큰 안의 식별자가 같은지, 토큰이 있는지, 계정이 있는지, 마지막으로 발급한 토큰과 같은지를 차례로 본다.
          &gt; - 로그인마다 새 토큰이 나오므로 가장 최근 토큰만 유효하다. 두 기기가 같은 계정으로 로그인하면 먼저 받은 토큰이 거절된다.
      - 검사 모드
        - 세 가지 모드
          &gt; - 엄격(기본), 기록만, 끔 가운데 설정으로 고른다.
          &gt; - 프로토콜 시험과 도구는 끔으로 돌리고, 엄격 검사는 전용 시험이 맡는다.
      - 로그에 값을 남기지 않는 규칙
        - 거절 사유와 가림
          &gt; - 거절 사유 문자열에는 토큰 값을 넣지 않는다.
          &gt; - 로그를 파일로 남길 때 비밀번호와 토큰처럼 보이는 값을 가린다.
  - 종료 순서
    - 접속을 먼저 닫는다
      - 종료 단계
        - 종료 순서
          &gt; - 새 접속을 막고, 붙어 있는 접속을 끊고, 서버를 내린다.
          &gt; - 접속이 끝나길 기다리면 서비스 관리자가 강제 종료하던 문제를 이 순서로 고쳤다.
          &gt; - 진행 상태는 요청마다 저장되므로 접속을 끊어도 잃는 것이 없고, 게임은 끊긴 것을 알고 다시 접속한다.
- 앱 안 서버: PC 없이 기기에서 실행
  - 만든 이유
    - 기기에는 중계 서버가 없다
      - 한 프로세스가 입구 셋을 듣는다
        - 대체 방식
          &gt; - 같은 프로세스가 HTTP, HTTPS, 게이트 세 입구를 직접 듣는다.
          &gt; - 요청 줄의 주소 형식을 서버가 직접 고친다.
          &gt; - 서버 찾기 응답은 같은 기기의 게임만 상대하므로 끈다.
    - 네이티브 확장을 쓰는 의존성은 기기에 올라가지 않는다
      - 기기에 올리지 못한 것
        - 웹 프레임워크
          &gt; - 데이터 검증 라이브러리가 네이티브 확장이라 기기용 배포본이 없다.
          &gt; - 그래서 같은 인터페이스를 흉내 내는 순수 파이썬 대체 패키지를 쓴다.
  - 구성
    - 기기용 인터프리터
      - 공식 배포본을 실행한다
        - 실행 방식
          &gt; - 공식 CPython 3.14 기기 배포본을 네이티브 접착 코드로 별도 프로세스에서 실행한다.
          &gt; - 배포본 해시를 고정해 받고, 해시가 다르면 중단한다.
    - 패키지 묶음
      - 순수 파이썬만 담는다
        - 검사
          &gt; - 의존 패키지에 네이티브 확장이 있으면 묶음 만들기를 중단한다.
          &gt; - 계정 DB, 진행 상태, 로그는 데이터 폴더 아래에 둔다.
  - 두 구성 검증
    - 같은 시험을 두 환경에서 돌린다
      - 응답 대조
        - 결과
          &gt; - 응답 119건을 PC의 진짜 웹 프레임워크 구성과 비교했다.
          &gt; - 같음 113, 알려진 차이 6, 문제 0이다.
          &gt; - 알려진 차이 6은 자동 문서 화면 주소 계열이며 게임 기능과 무관하다.
    - 기기 구성 가드
      - 로드되지 않았음을 확인
        - 가드 동작
          &gt; - 진짜 웹 프레임워크와 네이티브 확장이 로드되지 않았음을 확인한다.
          &gt; - 기기에 없는 C 모듈은 가져오기를 막고 돈다. 안드로이드 접두 경로가 없으면 막지 않고 경고만 낸다.

## 규칙 문제: 클라이언트 스크립트에서 서버 규칙 세우기
- 호출 목록: 스크립트에서 뽑는다
  - 스크립트 복원
    - 복원 범위와 수
      - 게임 스크립트 전체
        - 수치
          &gt; - 게임 스크립트 13,462개(전투 스크립트 포함)를 소스로 복원했다.
          &gt; - 부분 실패는 5개다.
    - 복원 검증
      - 명령 대응표
        - 대응표의 근거
          &gt; - 명령 대응 113개는 표준 라이브러리를 같은 방식으로 컴파일해 나란히 놓고 얻었다.
          &gt; - 대응이 하나라도 틀리면 대부분의 파일이 깨지므로 표를 먼저 검증했다.
      - 바이트 대조
        - 시험 방식
          &gt; - 번호를 되돌려 쓴 바이트코드가 원본과 바이트 단위로 같은지 시험한다.
          &gt; - 손으로 조립한 바이트코드로 융합 명령, 점프, 줄 번호 보정을 따로 확인한다.
  - 호출 이름과 인자 키
    - 정규식으로 뽑는다
      - 뽑는 대상
        - 방향별 수
          &gt; - 클라이언트에서 서버로 가는 호출은 1,334개다.
          &gt; - 서버에서 클라이언트로 가는 호출은 1,493개다.
      - 놓치는 호출
        - 변수로 넘기는 호출
          &gt; - 이름이나 인자를 변수로 넘기는 호출은 정규식이 놓친다.
          &gt; - 그래서 호출 목록은 누락 없이 만들었다고 말할 수 없다.
  - 처리 현황
    - 핸들러
      - 핸들러가 있는 호출
        - 구성
          &gt; - 핸들러는 584개이고 최상위 303개, 하위 281개다.
    - 의도적 무응답
      - 무응답으로 선언한 호출
        - 수와 합계
          &gt; - 의도적 무응답 선언은 63개다.
          &gt; - 핸들러와 무응답을 합하면 647개로 약 48.5%다.
          &gt; - 나머지 687개는 핸들러가 없다.
  - 핸들러가 없는 호출의 처리
    - 로그 후 빈 결과
      - 빈 결과로 풀기
        - 목적과 조건
          &gt; - 핸들러가 없으면 로그만 남기고 빈 결과로 풀어 화면이 잠기지 않게 한다.
          &gt; - 결과를 기다리지 않는 호출에만 이 규칙을 적용한다.
    - 결과를 읽는 콜백
      - 빈 결과로 풀지 않는다
        - 예외 규칙
          &gt; - 결과를 읽는 콜백은 18개이고, 그중 17개에 핸들러가 있다. 남은 1개는 아직 핸들러가 없다.
          &gt; - 빈 결과로 풀면 클라이언트가 결과를 읽다가 깨지므로, 풀지 않고 경고만 남긴다.
- 필드와 타입: 서버 기준은 클라이언트가 읽는 형태
  - 데이터 표를 실행하지 않고 읽는다
    - 추출 방식
      - 구문 트리로 읽는다
        - 허용 범위
          &gt; - 표는 실행하지 않고 구문 트리로만 읽는다.
          &gt; - 표에 리터럴과 공유 참조 말고 다른 코드가 있으면 추출을 멈춘다.
    - 서버용 표
      - JSON 63개
        - 채우는 방식
          &gt; - 클라이언트 표에서 서버가 쓰는 열만 JSON 63개로 냈다.
          &gt; - 추정으로 채운 구간은 따로 표시한다.
  - 클라이언트가 읽는 형태가 기준
    - 필드와 타입
      - 필수 키
        - 누락 시 결과
          &gt; - 시작 때 필수 키는 7개이고, 나머지 키는 기본값이 있다.
          &gt; - 정수로 들어가야 할 키가 없으면 포맷 단계에서 클라이언트가 멈춘다.
      - 모양이 틀린 행
        - 증상
          &gt; - 표의 이상한 행이 시계 구간 안에 있으면 그 탭이 죽는다.
          &gt; - 증상의 모양: 화면을 여는 순간 빈 칸을 읽다가 오류로 멈춘다.
  - 순서
    - 이벤트 지급 순서
      - 완료 호출 순서
        - 필수 순서
          &gt; - 지급 후 완료 시작 결과, 완료 끝 순서로 보내는 것이 필수다.
          &gt; - 획득 연출이 지급 결과를 None 검사 없이 읽기 때문에 순서가 바뀌면 깨진다.
    - 회차 넘김
      - 이야기 선택 흐름
        - 응답 순서
          &gt; - 이야기 선택 요청, 응답, 회차 처리, 스냅샷 갱신 순서로 이어진다.
          &gt; - 서버가 언제 무엇을 보내는지는 대부분 추론이다.
- 게임 규칙: 모듈 구성과 한 칸의 골격
  - 모듈 구성
    - 기능 모듈
      - 개수와 줄 수
        - 규모
          &gt; - 기능 모듈은 약 85개이고 합계 약 17,113줄이다.
          &gt; - 모듈마다 같은 모양을 지켜서 읽는 순서가 같다.
    - 이벤트 규칙 모듈
      - 파일 수
        - 구분
          &gt; - 조각 함수를 가진 이벤트 규칙 모듈은 38개다.
          &gt; - 나머지 16개는 수집기, 여러 모듈이 쓰는 도우미, 큰 이벤트를 쪼갠 조각이다.
  - 규칙 한 칸의 골격
    - 순서
      - 규칙 단계
        - 다섯 단계
          &gt; - 표(JSON), 상태 한 칸, 거절 판정, 와이어 형식 변환, 스냅샷 조각 순서로 같은 모양을 따른다.
          &gt; - 재화 지불과 클라이언트 알림은 짝이 되는 아바타 쪽 멤버가 맡는다.
          &gt; - 새 이벤트 추가 비용은 파일 하나이며, 자동 수집이 받쳐 준다.
  - 전투
    - 계산 위치
      - 클라이언트가 계산
        - 서버 역할
          &gt; - 전투는 클라이언트가 계산하고, 서버는 요청과 보상만 주고받는다.
          &gt; - 오프라인 전투 응답은 요청 값을 그대로 돌려줘야 정산 화면이 뜬다.
    - 던전류
      - 구현 범위
        - 정산과 보상
          &gt; - 던전류는 정산과 보상 지급까지 구현했다.
          &gt; - 행동·구역 전투 보상, 회차 끝 보상, 사건 보상은 비어 있다.
  - 서버만 아는 값
    - 밸런스
      - 검증 한계
        - 확인되지 않는 값
          &gt; - 밸런스 값과 전투 정산은 클라이언트에 없어 확인되지 않는다.
          &gt; - 던전류 정산은 구현했지만, 서버만 아는 밸런스 값은 클라이언트에서 확인되지 않는다.
- 서버 시계: 되풀이 구간과 시간 제한
  - 시계 방식의 변화
    - 연도만 접는 방식
      - 달력 처리
        - 되돌리는 범위
          &gt; - 기본 소환 풀의 종료 시각이 지나면 소환 요청이 나가지 않는다.
          &gt; - 서버 달력의 연도만 그 풀이 열려 있던 마지막 1년으로 되돌렸다.
          &gt; - 실제 서비스 달력과 어긋남을 감수한 복원 서버의 결정이다.
    - 벽시계를 UTC처럼 쓰는 방식
      - 화면 시각 맞춤
        - 맞춤 결과
          &gt; - 실제 UTC를 주자 화면의 다음 07:00 시각이 9시간 어긋났다.
          &gt; - 한국 벽시계를 UTC처럼 줘서 화면의 시각을 맞췄다(추론).
    - 현재 방식
      - 벽시계 함수
        - 쓰임
          &gt; - 주와 날을 세는 값은 벽시계 함수로 센다. 연도를 접은 서버 시각을 쓰지 않는다.
          &gt; - 게임이 이미 받은 시각은 다시 로그인해야 바뀐다.
  - 되풀이 구간
    - 구간
      - 서비스 말기 구간
        - 구간과 길이
          &gt; - 서비스 말기 구간 2020-10-29 ~ 2021-05-27을 되풀이한다.
          &gt; - 되풀이 길이는 26주(182일)이며, 처음 설계의 210일에서 줄었다.
    - 계정 시각 보정
      - 바퀴마다 옮긴다
        - 보정 규칙
          &gt; - 계정에 적힌 시각이 미래가 되지 않도록 바퀴 수만큼 뺀다.
          &gt; - 시계 기록이 없는 옛 계정은 옛 시계 기준의 차이만큼 옮긴다.
  - 주기 이벤트
    - 수요일 07:00 주기
      - 주마다 교체
        - 되풀이
          &gt; - 관문과 속성은 수요일 07:00마다 표의 다음 행으로 바뀐다.
          &gt; - 표가 끝나면 처음부터 되풀이한다.
    - 활동 창
      - 기간 표
        - 열림 규칙
          &gt; - 기간 값이 없는 행은 늘 열려 있다.
          &gt; - 서버 시계가 기간 안에 있으면 그 활동이 열린다.
  - 일일 초기화 시각 불일치
    - 두 시각
      - 월정액과 정신력
        - 차이
          &gt; - 월정액은 UTC 07:00(한국 16:00), 정신력은 한국 07:00으로 서로 다르게 남았다.
          &gt; - 문서가 불일치를 스스로 인정한 미해결 항목이다.
  - 클라이언트 쪽 재요청 제한
    - 스토리 재요청
      - 60초 제한
        - 제한 내용
          &gt; - 이야기 열기 요청을 한 번 보낸 뒤 60초 안에는 다시 보내지 못한다.
          &gt; - 이 제한은 클라이언트 쪽 규칙이라 서버가 고칠 수 없다.
- 계정과 상태 저장
  - 가입과 로그인 입력
    - 비밀번호 저장
      - 해시만 저장
        - 방식
          &gt; - 비밀번호는 scrypt 해시로만 저장하고, 비교는 시간이 같은 비교 함수로 한다.
          &gt; - 평문을 두지 않아 데이터 파일이 새어도 비밀번호 원문은 나가지 않는다.
    - 입력 규칙
      - 길이와 공백
        - 기준
          &gt; - 계정 ID는 공백 없이 64자 이하, 비밀번호는 6~20자의 출력 가능 문자다.
          &gt; - 클라이언트가 형식을 막지 않아 서버가 길이와 공백을 본다(복원 서버의 결정).
  - 계정 잠금
    - 실패 횟수 세기
      - 연속 8회 실패
        - 잠금 조건과 시간
          &gt; - 같은 계정 식별자가 연속 8회 틀리면 60초 동안 잠근다.
          &gt; - 실패 기록은 메모리에만 있어서 서버를 다시 띄우면 풀린다.
          &gt; - 없는 계정 이름을 마구 넣어 메모리가 늘지 않도록 기록이 4096개를 넘으면 비운다.
    - 잠금 응답
      - 오류 코드
        - 원본 값을 모름
          &gt; - 가입과 로그인 오류 코드는 1001~1005로, 복원 서버가 정했고 원본 값은 모른다.
          &gt; - 클라이언트는 성공 여부만 보고 서버가 준 문구를 그대로 띄운다.
  - 계정당 상태 파일
    - 파일 구성
      - 계정마다 한 파일
        - 저장 규칙
          &gt; - 계정마다 JSON 파일 하나를 두고, 내용이 바뀐 때만 다시 쓴다.
          &gt; - 임시 파일에 쓴 뒤 제자리에 바꿔 놓으므로, 쓰다 죽어도 반쯤 쓴 파일이 남지 않는다.
    - 읽기 실패
      - 깨진 파일
        - 처리
          &gt; - 깨진 파일은 옆으로 옮기고 새 계정으로 시작한다.
          &gt; - 읽지 못한 파일은 덮어쓰지 않는다.
          &gt; - 파일이 바뀌었으면(운영자 도구가 밖에서 고친 경우) 다시 읽는다.
    - 파일 이름 방어
      - 계정 키 형식
        - 허용 형식 밖
          &gt; - 계정 키가 허용 형식이 아니면 파일 이름을 해시로 바꿔, 클라이언트가 보낸 값을 경로로 쓰지 않는다.
          &gt; - 진행 상태는 서버를 재시작해도 남는다. 앞선 기록의 &quot;재시작하면 사라진다&quot;는 설명은 이 방식으로 바뀌었다.

## 알아낸 것: 서버 규칙의 위치와 시간 제한

- 서버 약속은 클라이언트에 있었다
  - 기준은 클라이언트가 읽는 형태
    - 필드, 타입, 순서
      - 문서보다 클라이언트를 따른다
        - 문서와 클라이언트가 어긋날 때
          &gt; - **기준**: 서버 코드의 기준은 문서가 아니라 클라이언트가 읽는 필드, 타입, 순서다.
          &gt; - **근거**: 초기 API 문서에 경로가 있는 캡처 22묶음으로 문서와 실제 요청의 어긋남을 확인했다 (분석 기록 A, 1046행).
    - 호출 이름과 인자 키
      - 스크립트에서 뽑는 방식
        - 호출 목록을 스크립트에서 뽑음
          &gt; - **수치**: 서버 호출 1,334개를 이름과 인자 키로 뽑았다 (분석 기록 E1c, 58행).
          &gt; - **한계**: 이름이나 인자를 변수로 넘기는 호출은 이 방식으로 놓친다.
          &gt; - **검증**: 핸들러가 있는 호출 이름이 모두 이 목록에 있는지 시험으로 확인했고 불일치는 0이었다 (분석 기록 E1c, 60행).
    - 데이터 표
      - 실행하지 않고 읽는 방식
        - 구문 트리로만 읽음
          &gt; - **방법**: 클라이언트 데이터 표를 실행하지 않고 구문 트리로만 읽는다 (분석 기록 E2, 24행).
          &gt; - **결과**: 서버가 읽는 데이터 파일 63개가 클라이언트 표에서 나왔다 (분석 기록 E2, 869행).
          &gt; - **표시**: 추정으로 채운 구간은 따로 표시한다.
- 결과를 읽는 콜백
  - 개수와 처리 상태
    - 콜백 대부분에 핸들러가 있음
      - 빈 결과로 풀면 안 되는 이유
        - 클라이언트가 결과를 읽다 깨짐
          &gt; - **이유**: 결과 값을 읽는 콜백은 빈 결과로 풀면 클라이언트가 결과를 읽다가 깨진다.
          &gt; - **대응**: 풀지 않고 경고만 남긴다.
    - 핸들러가 없는 콜백 하나
      - 남은 한 개의 상태
        - 아직 구현하지 않은 콜백
          &gt; - **상태**: 결과를 읽는 콜백 18개 중 1개에는 핸들러가 없다 (분석 기록 E1c, 58행).
- 시간 제한: 서버 시계
  - 서버가 여는 날짜
    - 서버가 알려 주는 날짜로 연다
      - 서버 시계와 비교해 연다
        - 소환과 이벤트의 기간 판정
          &gt; - **방식**: 서버가 &quot;지금&quot;을 서비스 때 시각으로 주면 그때의 소환과 이벤트가 열린다 (분석 기록 E1b, 224행).
          &gt; - **위험**: 표의 이상한 행이 시계 구간 안에 있으면 그 탭 하나가 열리지 않는다 (분석 기록 E1b, 226행).
  - 되풀이 구간
    - 서비스 말기 구간을 되풀이
      - 구간 길이와 시작 시각
        - 되풀이되는 구간의 값
          &gt; - **구간**: 2020년 11월 26일 10시부터 2021년 5월 27일 10시까지 26주이고, 끝에 닿으면 처음으로 돌아간다 (분석 기록 E1b, 224행).
          &gt; - **이유**: 실제 한국 시각의 시, 분, 초와 요일이 그대로 보이게 하려고 (분석 기록 E1b, 224행).
          &gt; - **조정**: 구간은 처음 30주 설명에서 26주로 줄었다 (분석 기록 E1a, 511행).
  - 시계 방식의 변화
    - 벽시계를 UTC처럼 쓰던 방식
      - 지금의 방식으로 바뀜
        - 시각을 읽는 쪽과 맞추는 방식
          &gt; - **이전**: 클라이언트가 서버 시각을 UTC로 읽어서 한국 벽시계를 UTC인 것처럼 줬다 (분석 기록 E1b, 222행, 추론 표시).
          &gt; - **현재**: 2026년 10월 14일 커밋 이후 한국 벽시계 기준이다 (분석 기록 E1b, 24행).

## 막혔던 일: 증상, 원인, 고침

- 도시 진입 한 건
  - 상태 전이 경고로 멈춘 증상
    - 증상
      - 입장 직후 경고가 찍힘
        - 경고 한 줄에서 진행이 멈춤
          &gt; - **경고**: 접속 직후 상태 전이 경고가 찍히고, 로그에는 전이 경로가 없다는 문구가 남는다 (분석 기록 D2, 663행).
          &gt; - **모양**: 경고 뒤에는 진행 신호가 오지 않는다.
    - 가설
      - 접속 응답이 전이를 일으킨다고 봄
        - 연결에서 로그인으로 가는 전이의 트리거
          &gt; - **가설**: 접속 응답을 받으면 연결 상태에서 로그인 상태로 전이가 일어난다 (분석 기록 D2, 678행).
    - 반증 방법
      - 전이 정의를 코드에서 직접 읽음
        - 릴리스 빌드의 분기를 따라감
          &gt; - **방법**: 전이 테이블과 호출 경로를 로그에 적힌 정의와 대조했다 (분석 기록 D2, 112~117행).
          &gt; - **결과**: 접속 함수는 릴리스 빌드에서 로그인 전이를 부르지 않고 연결만 시작한다 (분석 기록 D2, 162~183행).
    - 확정 원인
      - 계정 엔티티가 먼저 와야 함
        - 서버가 계정 단계를 건너뜀
          &gt; - **전이 트리거**: 로그인 전이는 계정 엔티티를 받을 때만 일어난다 (분석 기록 D2, 188~203행).
          &gt; - **서버 잘못**: 복원 서버가 계정 엔티티를 보내지 않고 곧바로 아바타 엔티티를 보냈다 (분석 기록 D2, 217~219행).
    - 고침
      - 엔티티 전송 순서를 바꿈
        - 계정 엔티티를 먼저 보냄
          &gt; - **순서**: 계정 엔티티, 아바타 엔티티, 도시 진입 순서로 보낸다 (분석 기록 D2, 693행 이후 결론).
          &gt; - **판정**: 같은 경고가 사라졌는지를 서버 로그와 클라이언트 로그의 상태 전이로 확인한다 (분석 기록 C, 1482행).
    - 검증 결과
      - 한 번의 접속으로 도시 화면까지 도달
        - 하트비트가 이어짐
          &gt; - **결과**: 접속 1회에서 도시 메인 화면까지 갔고 하트비트가 5초 간격으로 이어졌다 (분석 기록 C, 712행).
  - 지연 뒤 재접속 루프
    - 증상
      - 로딩이 끝나지 않음
        - 지연 뒤 로그아웃
          &gt; - **증상**: 로딩 화면에서 움직이지 않다가 약 16초 뒤 로그아웃되고, 재접속을 반복한다 (분석 기록 D2, 742행).
          &gt; - **모양**: 같은 화면을 반복해서 돌아가는 재접속 루프다.
    - 가설
      - 응답 콜백만 불러 주면 끝난다고 봄
        - 로딩 해제와 콜백의 관계
          &gt; - **가설**: 콜백이 호출되면 로딩 잠금이 풀린다고 가정했다 (분석 기록 D2, 748~752행).
    - 반증 방법
      - 잠금을 푸는 메서드를 확인
        - 콜백 람다는 인자를 쓰지 않음
          &gt; - **방법**: 로딩 잠금을 푸는 것은 결과 목록을 담은 응답 메서드이고 콜백 람다는 로딩과 무관하다는 것을 확인했다 (분석 기록 D2, 46~52행, 65~68행).
    - 확정 원인
      - 확인 응답만 보내고 결과를 빠뜨림
        - 로딩 잠금이 남음
          &gt; - **원인**: 서버가 확인 응답만 회신하고 결과 응답을 보내지 않아 로딩 잠금이 풀리지 않았다 (분석 기록 D2, 742행).
    - 고침
      - 빈 목록의 결과 응답을 보냄
        - 결과 목록을 비워서 보냄
          &gt; - **고침**: 결과 응답을 두 목록 모두 빈 값으로 보낸다 (분석 기록 D2, 771~773행).
          &gt; - **보류**: 콜백 응답은 보내지 않는다는 판단은 실기기 확인 대상으로 남겼다 (분석 기록 D2, 773행).
    - 검증 결과
      - 콜백 응답 누락이 뒤에 다시 드러남
        - 긴급 장면이 검은 화면으로 멈춤
          &gt; - **정정**: 나중에 콜백 응답이 빠진 탓에 긴급 장면이 검은 화면으로 멈춰 콜백 응답을 추가했다 (분석 기록 C, 685행, 1467행).
          &gt; - **결과**: 로딩과 하트비트, 콜백 응답의 세 막힘을 차례로 풀고 도시 메인 화면까지 갔다 (분석 기록 C, 685행).
  - 주기적 강제 로그아웃
    - 증상
      - 접속 뒤 주기적으로 끊김
        - 주기적인 강제 로그아웃
          &gt; - **증상**: 접속 후 약 30초마다 강제 로그아웃이 났다 (분석 기록 C, 685행).
          &gt; - **모양**: 화면 오류 없이 연결만 주기적으로 끊기는 모양이다.
    - 가설
      - 하트비트 무응답이 원인이라고 봄
        - 같은 시기 빗나간 추정
          &gt; - **가설**: 하트비트에 응답하지 않아 강제 로그아웃이 된다고 봤다.
          &gt; - **주의**: 같은 시기 다른 막힘을 하트비트 무응답 탓으로 추정했다가 빗나갔다 (분석 기록 C, 935행).
    - 반증 방법
      - 수신과 회신 로그를 올려서 확인
        - 기본 로그 수준이 가려 보이지 않았음
          &gt; - **방법**: 하트비트 수신과 회신 로그가 상세 수준이어서 보이지 않던 것을 기본 수준으로 올려 확인했다 (분석 기록 C, 890~894행).
    - 확정 원인
      - 카운터가 리셋되지 않음
        - 응답이 없으면 카운터가 누적
          &gt; - **원인**: 하트비트 카운터가 다시 세어지지 않아 주기마다 강제 로그아웃이 났다 (분석 기록 C, 685행).
    - 고침
      - 하트비트에 회신을 보냄
        - 회신으로 카운터를 맞춤
          &gt; - **고침**: 하트비트 수신에 회신을 보내 카운터를 맞췄다 (분석 기록 C, 685행).
    - 검증 결과
      - 하트비트가 일정 간격으로 유지됨
        - 연결 한 번에서 확인
          &gt; - **결과**: 접속 1회에서 하트비트가 5초 간격으로 지속됐다 (분석 기록 C, 712행).
  - 지연 뒤 접속 끊김
    - 증상
      - 전환 요청 뒤 응답 대기 문구
        - 지연 뒤 연결이 끊김
          &gt; - **증상**: &quot;응답 대기 중&quot; 표시가 뜬 뒤 약 15초 뒤 접속이 끊긴다 (분석 기록 D2, 33행; 분석 기록 E4a, 434행).
    - 가설
      - 전환 요청에 응답하면 끊김이 멈춘다고 봄
        - 잠금을 풀 응답의 필요성
          &gt; - **가설**: 상태 전환 요청에 응답해 잠금을 풀면 끊김이 멈춘다.
    - 확정 원인
      - 응답이 없어 잠금이 남음
        - 무응답이 종료로 이어짐
          &gt; - **원인**: 상태 전환 요청에 응답하지 않으면 잠금이 남고, 약 15초 뒤 연결이 끊긴다 (분석 기록 D2, 33행).
    - 고침
      - 전환 응답에 요청한 상태를 담음
        - 응답 형식을 요청과 맞춤
          &gt; - **고침**: 전환 응답에 요청한 상태 값을 담아 보낸다 (분석 기록 E1c, 171행).
    - 검증 결과
      - 회차 넘김 뒤 같은 끊김이 재발
        - 다른 원인이 드러남
          &gt; - **재발**: 회차 넘김 직후 같은 15초 끊김이 났다 (분석 기록 E4a, 434행).
          &gt; - **다른 원인**: 스냅샷에 상태 값이 없어 전환 요청이 다시 나갔다 (분석 기록 E4a, 434행).
          &gt; - **고침과 결과**: 스냅샷에 상태를 실어 요청 자체를 없앴고, 고친 뒤 잠금 풀림이 같은 순간에 찍히며 접속이 유지됐다 (분석 기록 E4a, 434행).
- 로그인 원인의 오진
  - 게이트 서버 부재 가설
    - 가설
      - 게이트 서버가 없어서 실패한다고 봄
        - 기존 문서의 단정
          &gt; - **가설**: 게이트 서버가 구현되지 않아 로그인이 실패한다 (분석 기록 C, 614행, 기존 문서의 단정).
    - 반증 방법
      - 전 포트 패킷 캡처로 연결을 셈
        - 연결 형식을 파싱해 확인
          &gt; - **방법**: 부팅부터 로그인까지 약 3분간 전 포트 패킷을 캡처하고 연결 형식을 파싱했다 (분석 기록 C, 614행).
          &gt; - **결과**: 연결 28개가 모두 보안 연결 시작 메시지였고, 게이트 접속은 0건이었다 (분석 기록 C, 614행).
          &gt; - **결과 2**: 게이트 도메인은 이름 풀이만 되고 연결은 없었다 (분석 기록 C, 614행).
  - 확정 원인
    - 서버 목록 응답이 빈 스텁
      - 실제 내용 없는 응답
        - 결과 코드만 있는 짧은 응답
          &gt; - **확정**: 서버 목록 응답이 결과 코드 하나만 담은 13바이트 스텁이었다 (분석 기록 C, 614행).
  - 고침
    - 목록 응답이 실제 게이트 주소를 줌
      - 요청한 쪽이 닿은 주소를 따름
        - 목록 응답의 주소 결정 방식
          &gt; - **고침**: 목록 응답은 요청한 기기가 서버에 닿은 주소를 게이트 주소로 준다 (분석 기록 E1a, 221행).
  - 두 번째 막힘
    - 이름 없는 연결이 웹 서버로 가던 중계
      - 중계 라우팅 수정
        - 중계 라우팅 수정 커밋
          &gt; - **원인**: 서버명 없는 TCP 연결이 HTTPS 서버로 가던 중계 설정이 두 번째 막힘이었다 (커밋 제목 기준).
          &gt; - **고침**: 중계 라우팅을 게이트용 TCP 경로로 고쳤다 (커밋 제목 기준, 2026년 5월 22일).
- 게임만 끝내면 접속이 안 됨
  - 증상
    - 게임 종료 뒤 재실행이 안 붙음
      - 다시 켠 게임이 서버에 붙지 못함
        - 오류 화면이 매번 뜸
          &gt; - **증상**: 게임 프로세스만 끝낸 뒤 다시 켜면 서버에 붙지 못한다 (분석 기록 E5, 120행).
          &gt; - **고치기 전 화면**: 매번 오류 화면이 뜬다 (분석 기록 E4a, 2646행).
  - 가설
    - 서버 프로세스가 죽었다고 봄
      - 서버 쪽 장애 가능성
        - 로그로 살아 있음을 확인
          &gt; - **가설**: 서버 프로세스가 죽어서 접속이 안 된다.
          &gt; - **반증**: 서버 로그에 수락 오류가 초당 약 4천 번 찍혀 서버는 살아 있었다 (분석 기록 E5, 120행; 분석 기록 E4a, 2624행).
  - 확정 원인
    - 장치가 사라져 듣는 소켓이 닫힘
      - 닫힌 소켓을 붙든 채 수락만 반복
        - 새 게임이 쓸 주소에 소켓이 없음
          &gt; - **연쇄**: 게임 프로세스가 끝나면 앱 안 VPN 장치가 사라지고, 안드로이드가 그 주소의 듣는 소켓을 닫는다 (분석 기록 E4a, 2624행).
          &gt; - **결과**: 서버는 닫힌 소켓에 수락 오류를 되풀이했고, 새로 켠 게임이 쓸 주소에는 듣는 소켓이 없었다 (분석 기록 E4a, 2624행).
  - 고침
    - 서버가 소켓을 다시 연다
      - 닫히면 직접 다시 엶
        - 서버 쪽 소켓 복구
          &gt; - **서버**: 듣는 소켓이 닫히면 서버가 스스로 다시 연다 (커밋 제목 기준, 2026년 10월 14일).
    - 접속 화면이 장치와 서버를 다시 만든다
      - 단계적으로 재시도
        - 단계적 재시도 사다리
          &gt; - **순서**: VPN을 켜고 6초 동안 다시 확인, VPN 장치를 새로 만들고 확인, 서버를 다시 띄우고 장치를 새로 만들어 확인, 끝까지 안 되면 오류를 보여 준다 (분석 기록 E4a, 2640행).
          &gt; - **보조**: 게임을 닫으면 앱 안 VPN도 같이 꺼지게 했다 (분석 기록 E2, 43행, 게이트 부분).
  - 검증 결과
    - 자동 시험에서 고치기 전 코드가 실패함
      - 기기 시험 여러 번
        - 태블릿 기기 시험
          &gt; - **자동 시험**: 듣는 소켓을 두 번 닫히게 만든 새 시험이 고치기 전 코드에서 같은 실패로 떨어졌다 (분석 기록 E4a, 2646행).
          &gt; - **기기 시험**: 게임만 끝낸 경우 고친 뒤에는 4~7초 뒤 게임 화면으로 돌아왔다 (분석 기록 E4a, 2646행).
          &gt; - **태블릿**: 네 번 모두 서버 프로세스가 같은 상태로 살아 있었고, 닫힐 때마다 다시 여는 기록이 찍혔다 (분석 기록 E4a, 2646행).
- 업데이트 때 계정 데이터가 덮어써짐
  - 증상
    - 업데이트 뒤 진행이 사라짐
      - 묶음 내용이 바뀌면 교체됨
        - 플레이 여부와 무관하게 덮어씀
          &gt; - **증상**: 데이터 묶음의 해시가 바뀌면 플레이 여부와 관계없이 기기의 계정 데이터가 새 묶음으로 덮어씌워졌다 (분석 기록 E1a, 부분 7의 항목 5).
  - 가설
    - 묶음이 바뀌면 교체해도 된다고 봄
      - 교체가 안전하다는 전제
        - 전제가 깨진 사례
          &gt; - **전제**: 데이터 묶음이 바뀌었으면 기기 데이터를 새 묶음으로 바꿔도 된다.
          &gt; - **반증**: 플레이 진행이 있는 기기에서도 교체가 일어났다 (커밋 메시지 기록, 2026년 10월 14일).
  - 확정 원인
    - 해시 비교만으로 교체
      - 교체 조건에 플레이 여부가 없음
        - 해시만 보고 덮어씀
          &gt; - **원인**: 교체 조건이 해시 비교뿐이어서 플레이 여부를 보지 않았다 (분석 기록 E1a, 부분 7의 항목 5).
  - 고침
    - 건드리지 않았을 때만 교체
      - 교체 전 파일을 옆에 보관
        - 해시 이력 기준의 교체
          &gt; - **교체 조건**: 묶음 해시와 기기 파일 해시 이력이 함께 맞을 때만 새 묶음으로 바꾼다 (분석 기록 E1a, 부분 7의 항목 5).
          &gt; - **보관**: 교체 전 파일은 옆에 남긴다 (분석 기록 E1a, 부분 7의 항목 5).
    - 백업, 불러오기, 삭제 화면을 추가
      - 불러오기는 검사 뒤에만 바꿈
        - 실패하면 현재 데이터를 그대로 둠
          &gt; - **불러오기 검사**: 임시 폴더에서 허용된 파일만 풀고 계정 DB의 머리글을 확인한 뒤에야 바꾼다 (분석 기록 E4b, 684행).
          &gt; - **실패 처리**: 검사에 실패하면 현재 데이터는 그대로 두고, 바꾸기 전 데이터는 한 벌 남긴다 (분석 기록 E4b, 684행).
  - 검증 결과
    - 설치 구조를 확인
      - 데이터 폴더를 재설치에서 건드리지 않음
        - 계정 데이터는 설치와 분리됨
          &gt; - **구조**: 계정 DB와 계정별 진행 파일이 든 데이터 폴더는 앱을 새로 깔 때도 건드리지 않는 것으로 기록돼 있다 (분석 기록 E2, 367행).
          &gt; - **시험**: 커밋 메시지 기준 서버 시험 2121건이 통과했다고 적혀 있고, 이 분석에서는 재실행하지 않았다 (분석 기록 E3, 1169행).

## REA 활용: 쓰임과 한계

- 도입 시점
  - 도입 커밋의 위치
    - 공개 main의 중간 커밋에서 도입
      - 첫 도시 진입은 도입 전
        - 도입 전후의 경계
          &gt; - **위치**: 공개 main의 비병합 커밋 101개 가운데 92번째에서 도구를 넣었다 (git 순서 기준).
          &gt; - **앞선 구간**: 첫 도시 진입은 REA 없이 이뤄졌다.
- 도구 쓰임: 네이티브 라이브러리 분석
  - 쓰임
    - 심볼 없는 라이브러리 분석
      - 바이너리 규모 파악
        - 대상 라이브러리와 찾은 것
          &gt; - **대상**: 39MB ARM64 라이브러리이고 심볼이 없다 (분석 기록 A, 349행; 분석 기록 D1, 379행).
          &gt; - **규모**: 프로시저 77,279개와 문자열 52,708개를 찾았다 (분석 기록 A, 1052행).
    - 분석 비용을 한 번 치르고 결과를 이어 씀
      - 첫 분석은 무거움
        - 첫 분석의 조건과 시간
          &gt; - **첫 분석**: 13분 58초, 호스트 RAM 13GB, 분석 프로세스 최대 3.0GB, 에뮬레이터 동시 실행 조건이었다 (분석 기록 A, 1052행).
      - 결과를 열어 둔 뒤 질의
        - 질의 응답 속도
          &gt; - **질의**: 결과를 연 뒤 나머지 질의는 대부분 1초 안에 끝났다 (분석 기록 D2, 1383행).
          &gt; - **정책**: 매번 새로 분석하면 14분을 치르므로 결과를 이어서 쓴다 (원 지도 기록).
  - 한계
    - ARM64 섹션 레이아웃 미지원
      - 도구가 다른 구조 전용
        - 해당 도구 호출 결과
          &gt; - **한계**: 섹션 레이아웃 도구는 ARM64 대상에서 지원되지 않는다 (분석 기록 A, 1518행).
    - IDA와 JEB 미설치
      - 대체 디스어셈블러
        - 데모판 사용
          &gt; - **도구 상태**: IDA와 JEB는 설치하지 않았고, Hopper는 데모판을 썼다 (분석 기록 A, 241행; 분석 기록 A, 1518행).
- 도구 쓰임: HTTP 캡처 판독
  - 쓰임
    - 캡처 형식 변환
      - 표준 형식으로 바꿔 판독
        - 변환기 검증
          &gt; - **변환기**: 캡처를 표준 형식으로 바꾸는 변환기를 이 연구에서 만들었고, 테스트 9개를 먼저 쓰고(TDD) 만들었다 (분석 기록 C, 710행).
          &gt; - **규모**: 4세트 512건을 호스트 30개와 요청 44묶음으로 정리했다 (분석 기록 A, 1046행).
    - 응답 본문 대조
      - 해시 대조
        - 원본과 같은 응답
          &gt; - **결과**: 변환기로 옮긴 응답 본문의 SHA-256 96건이 원본과 모두 일치했다 (분석 기록 C, 710행).
    - 경로 대조
      - 문서와 서버 코드 대조
        - 문서에 없는 경로와 서버에 없는 경로
          &gt; - **범위**: 제3자를 뺀 게임 관련 22묶음은 모두 초기 API 문서에 경로가 있다 (분석 기록 A, 1046행).
          &gt; - **어긋남**: 그중 8묶음은 서버 코드에 경로 문자열이 없다 (분석 기록 A, 1046행).
  - 한계
    - 캡처 범위의 한계
      - 게이트 구간은 범위 밖
        - 판독 대상이 아닌 것
          &gt; - **한계**: 게이트 구간의 패킷 캡처는 REA 범위 밖이다 (분석 기록 A, 214행).
    - 민감 정보 보관
      - 로그인 토큰이 든 결과
        - 저장소 제외 경로
          &gt; - **보관**: 캡처에 로그인 토큰이 있어 REA 결과 파일은 저장소에 올리지 않고 git 제외 경로에만 쓴다 (분석 기록 C, 968행).
- 도구 쓰임: 응답 변경의 근거
  - 쓰임
    - 증거 번호 인용
      - 원복 근거의 형식
        - 판독 결과의 번호와 해시
          &gt; - **원복 근거**: 2026년 10월 12일 응답 원복은 판독 결과의 증거 식별자와 SHA-256을 인용했다 (분석 기록 D2, 1422행).
          &gt; - **이후 형식**: 이후 응답 변경도 같은 형식을 쓴다.
    - 증거 게이트
      - 패킷과 원본 근거를 강제
        - 근거 없는 변경을 막음
          &gt; - **게이트**: 패킷과 원본 근거를 함께 요구하는 게이트를 커밋으로 넣었다 (메모 모음, 134행).
  - 한계
    - 화면 증거는 목록만 남김
      - 스크린샷은 저장소 밖
        - 번호 묶음만 추적
          &gt; - **화면 증거**: 일지마다 증거 번호 묶음을 두고 스크린샷 파일은 저장소에 올리지 않았다 (메모 모음, 1122행).
    - 클라이언트 스크립트 근거
      - 게이트 구간 값의 출처
        - REA 밖 근거의 표기
          &gt; - **근거 표기**: 게이트 구간 응답 값은 대부분 클라이언트 스크립트에서 나오므로, REA 밖 근거는 분석 기록의 이름과 줄 번호로 적는다.
- 도구 쓰임: 기기 조작
  - 쓰임
    - 에뮬레이터 설치와 파일 전송
      - 덮어쓰기 거부 설계
        - 도구 검증 결과
          &gt; - **검증**: 에뮬레이터에서 파일 보내기, 가져오기, 패키지 설치를 확인했다 (분석 기록 D2, 1377행).
          &gt; - **설계**: 덮어쓰기는 설계대로 거부된다 (분석 기록 D2, 1377행).
    - 기기 목록 확인
      - 여러 경로에서 같은 결과
        - 같은 기기 식별자
          &gt; - **결과**: 명령행, 에이전트 연결, 다른 에이전트 설정 세 경로에서 같은 기기 식별자가 나왔다 (분석 기록 D2, 1483행).
  - 한계
    - 화면 조작은 범위 밖
      - 별도 도구가 맡음
        - 화면은 상태 전이 로그로 판정
          &gt; - **범위**: 화면 조작은 REA 범위 밖이어서 별도 도구로 화면을 다뤘고, 성공은 서버 로그와 클라이언트 엔진 로그의 상태 전이로 판정했다 (분석 기록 A, 1518행; 원 지도 기록).
- 도구의 빈자리
  - REA가 다루지 못한 것
    - 게임 스크립트
      - REA 대상이 아님
        - 스크립트 복원 도구를 따로 만듦
          &gt; - **이유**: 스크립트 묶음은 REA 대상이 아니어서 스크립트 복원 도구로 따로 채웠다 (분석 기록 A, 214행).
    - 게이트 구간 패킷
      - REA 범위 밖
        - 공개 도구와 자체 도구로 채움
          &gt; - **이유**: 게이트 구간 패킷 캡처는 REA 범위 밖이어서 공개 도구와 이 연구의 도구가 채웠다 (분석 기록 A, 214행).
    - ARM64 섹션 레이아웃
      - 도구가 다른 구조 전용
        - 자체 변환기로 대신
          &gt; - **이유**: 섹션 레이아웃 도구가 x86-64 전용이라 ARM64에서는 쓸 수 없다 (분석 기록 A, 214행).
          &gt; - **대신**: 캡처 변환기를 이 연구에서 따로 만들었다 (분석 기록 C, 710행).

## 한계와 아직 모르는 것

- 서버만 알던 값
  - 밸런스와 정산
    - 클라이언트에 없는 값
      - 밸런스 값과 전투 정산
        - 서버 쪽에만 있는 수치
          &gt; - **없음**: 밸런스 값과 전투 정산은 클라이언트에 없다.
          &gt; - **범위**: 던전류 정산은 구현했지만, 서버만 아는 밸런스 값은 클라이언트에서 확인되지 않는다.
  - 보상의 미구현
    - 돈과 아이템 보상
      - 보상 지급 쪽 미구현
        - 지급 로직이 아직 없음
          &gt; - **미구현**: 보상 모듈의 돈과 아이템 지급은 아직 구현하지 않았다 (분석 기록 E1c, 741행).
    - 나머지 보상 칸
      - 빈 칸으로 남은 보상
        - 전투와 사건 보상
          &gt; - **비어 있음**: 행동과 구역 전투 보상, 회차 끝 보상, 사건 보상이 비어 있다.
- 게이트 구간의 정답지
  - 정답지 없음
    - 캡처가 없음
      - 게이트 구간은 소스와 로그만 근거
        - 응답 값의 출처
          &gt; - **범위**: 게이트 구간에는 패킷 캡처가 없어 소스와 로그가 근거다 (분석 기록 A, 214행).
          &gt; - **추론**: 응답 순서와 값 대부분이 클라이언트 소스에서 거꾸로 세운 추론이다.
  - 검증 방식의 의존
    - 로그 의존
      - 클라이언트 동작과 서버 로그
        - 검증 수단의 한계
          &gt; - **의존**: 이 구간의 검증은 클라이언트 동작과 로그에 의존한다.
- 구현하지 못한 범위
  - 처리하는 호출 범위
    - 호출 처리 비율
      - 절반 가까이를 처리
        - 호출 단위의 수치
          &gt; - **수치**: 서버 호출 1,334개 가운데 647개(약 48.5%)에 핸들러나 의도적 무응답이 있다 (분석 기록 E1c, 58행).
          &gt; - **의미**: 호출을 처리한다는 뜻이지 기능의 절반이 동작한다는 뜻은 아니다.
    - 처리하지 않는 호출
      - 핸들러가 없는 호출
        - 나머지 호출의 수
          &gt; - **수치**: 핸들러가 없는 호출은 687개다 (분석 기록 E1c, 58행).
  - 온라인 전투
    - 전투 서버 없음
      - 온라인 전투가 필요한 콘텐츠
        - 부분 지원만 가능
          &gt; - **한계**: 전투 서버가 없어 온라인 전투가 필요한 콘텐츠는 부분 지원이다.
- 화면으로 확인하지 못한 것
  - 정식 결말
    - 화면으로 본 적 없음
      - 정식 결말의 확인 상태
        - 결말 확인 범위
          &gt; - **상태**: 정식 결말은 화면으로 본 적이 없다.
  - 이벤트
    - 규칙이 필요한 활동
      - 활동 묶음의 수
        - 확인 범위의 한계
          &gt; - **수치**: 서버 규칙이 필요한 이벤트 활동은 40개로 분류됐다 (분석 기록 E4b, 909행).
          &gt; - **상태**: 화면으로 확인한 이벤트는 일부이고 나머지는 아직 보지 못했다.
    - 세는 단위의 차이
      - 규칙 모듈 수와 활동 수는 다름
        - 셈의 기준
          &gt; - **주의**: 이벤트 규칙 모듈 38종은 규칙 종류를 센 수이고, 활동 묶음 수와 세는 단위가 다르다.
- 빌드와 근거 자료
  - 클라이언트 빌드
    - 수정한 빌드로 실행
      - 수정 내용은 이 지도에서 다루지 않음
        - 빌드 차이
          &gt; - **상태**: 클라이언트는 수정한 빌드로 실행했고, 수정 내용은 이 지도에서 다루지 않는다.
    - 기기에 올린 빌드의 반영 지연
      - 최근 서버 수정이 빠질 수 있음
        - 빌드와 서버 버전의 차이
          &gt; - **상태**: 기기에 올린 빌드는 최근 서버 수정을 항상 담지 않는다.
  - 근거 자료
    - 영상과 스크린샷
      - 저장소에 없음
        - 기록의 보관 위치
          &gt; - **상태**: 영상과 스크린샷은 저장소에 없고, 번호 목록만 추적된다 (메모 모음, 1122행).
    - 캡처와 결과 파일
      - 로그인 토큰이 든 파일
        - 공개하지 않은 파일
          &gt; - **상태**: 캡처 원본과 REA 결과 파일은 로그인 토큰 때문에 올리지 않았다 (분석 기록 C, 968행).
</textarea>
